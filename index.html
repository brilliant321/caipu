初学版（目标：能做熟、不难吃）<\/h2>\n<p><strong>食材（约 30 个 / 2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>鹌鹑蛋<\/td>\n<td>30 个（约 300g）<\/td>\n<td>洗净<\/td>\n<\/tr>\n<tr>\n<td>生抽<\/td>\n<td>3 汤匙<\/td>\n<td>咸味主来源<\/td>\n<\/tr>\n<tr>\n<td>老抽<\/td>\n<td>1 汤匙<\/td>\n<td>上色<\/td>\n<\/tr>\n<tr>\n<td>冰糖<\/td>\n<td>2 小勺（约 10g）<\/td>\n<td>回甘<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>1 小勺（约 5g）<\/td>\n<td>调味<\/td>\n<\/tr>\n<tr>\n<td>八角<\/td>\n<td>2 个<\/td>\n<td>增香<\/td>\n<\/tr>\n<tr>\n<td>桂皮<\/td>\n<td>1 小段<\/td>\n<td>增香<\/td>\n<\/tr>\n<tr>\n<td>香叶<\/td>\n<td>2 片<\/td>\n<td>增香<\/td>\n<\/tr>\n<tr>\n<td>花椒<\/td>\n<td>1 小勺<\/td>\n<td>增香（可选）<\/td>\n<\/tr>\n<tr>\n<td>姜<\/td>\n<td>3 片<\/td>\n<td>去腥<\/td>\n<\/tr>\n<tr>\n<td>清水<\/td>\n<td>约 500ml<\/td>\n<td>没过鹌鹑蛋<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 煮蛋<\/strong><\/p>\n<ol>\n<li>鹌鹑蛋洗净后冷水下锅，水要没过蛋。<\/li>\n<li>开中火煮，水开后转小火再煮 4~5 分钟。看到蛋白全熟、蛋黄刚凝固 → 煮好了。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 过凉处理<\/strong><\/p>\n<ol start=\"3\">\n<li>捞出立刻放进冷水里泡 2 分钟降温。<\/li>\n<li>想更入味就剥壳；不想剥壳就用勺子背把每颗蛋壳轻轻敲出裂纹（裂纹多入味快，别敲碎）。看到壳上布满细裂纹、或已剥净 → 处理好了。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 调卤汁<\/strong><\/p>\n<ol start=\"5\">\n<li>另起锅倒入清水，加八角、桂皮、香叶、花椒、姜片、生抽、老抽、冰糖、盐。<\/li>\n<li>大火烧开后转小火煮 5 分钟出香味。闻到香料味、汤汁呈深褐色 → 卤汁好了。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 卤制<\/strong><\/p>\n<ol start=\"7\">\n<li>放入处理好的鹌鹑蛋，保持小火煮 15~20 分钟。<\/li>\n<li>中途轻轻翻动让上色均匀。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 浸泡入味<\/strong><\/p>\n<ol start=\"9\">\n<li>关火后别急着捞出，让鹌鹑蛋在卤汁里泡至少 1 小时（过夜更入味）。<\/li>\n<li>吃之前捞出即可。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>蛋煮裂或爆开<\/strong>：开水下锅或火太大。一定冷水下锅、水开后转小火，避免蛋壳骤然受热爆裂。<\/li>\n<li><strong>不入味<\/strong>：没敲裂纹、没浸泡或卤的时间太短。敲裂 + 关火浸泡是入味的关键。<\/li>\n<li><strong>太咸 / 太淡<\/strong>：卤汁调味没尝。卤汁要比直接吃略咸一点，成品才刚好；先尝卤汁再下蛋。<\/li>\n<li><strong>剥壳困难<\/strong>：煮好没立刻过冷水。过冷水的一瞬间蛋会收缩，壳就好剥。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"http://mwx.douguo.com/cookbook/1345825.html\">豆果美食 · 卤鹌鹑蛋（Freesiaa 视频菜谱）<\/a> —— 敲壳 + 香料卤制，适合对照「初学版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1td4y1R7mW/\">想吃卤蛋不用买，这样做 Q 弹入味（哔哩哔哩）<\/a> —— 搜索命中的卤蛋教程，相关推荐含五香卤鹌鹑蛋，需点开确认具体蛋类，适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：煮蛋 / 入味 / 卤汁 / 浸泡）<\/h2>\n<p>在初学版基础上，掌握下面四条，成品味道会更足。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 冷水下锅、小火煮<\/strong><\/p>\n<ol>\n<li>鹌鹑蛋比鸡蛋壳更薄、更易裂，务必冷水下锅。<\/li>\n<li>水开后转小火煮 4~5 分钟（喜欢溏心可缩短）。<\/li>\n<li>捞出立刻进冷水，看到蛋白收缩、蛋壳好剥 → 煮好了。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 入味三件套<\/strong><\/p>\n<ol start=\"4\">\n<li>新手推荐「敲裂纹」：不剥壳，用勺背敲出裂纹，保留蛋壳让卤汁慢慢渗进去，蛋白更完整。<\/li>\n<li>或<strong>剥壳<\/strong>（入味最快，但蛋白直接泡卤汁会稍硬）。<\/li>\n<li>或剥壳后在表面浅划 2~3 刀。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 卤汁配比<\/strong><\/p>\n<ol start=\"7\">\n<li>生抽 3 : 老抽 1 的比例上色，冰糖给回甘。<\/li>\n<li>香料用八角 + 桂皮 + 香叶 + 花椒打底；想要茶叶蛋风味，可加 1 小撮红茶或乌龙。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 浸泡比煮更关键<\/strong><\/p>\n<ol start=\"9\">\n<li>卤 15~20 分钟只是「煮熟入味」。<\/li>\n<li>真正入味靠关火后浸泡：室温泡 1 小时起步，冷藏泡过夜味道最好。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiaochushuo.com/caipu/263496759\">小厨说 · 香卤鹌鹑蛋<\/a> —— 啤酒卤 + 收汁，适合对照「进阶版」<\/li>\n<li><a href=\"https://www.lezuocai.com/recipe/1877476/\">乐做菜 · 秘制香卤鹌鹑蛋<\/a> —— 卤汁配比详细，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「蛋白紧实 Q 弹、酱色红亮、越嚼越香」。每一步都是细节。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 留老卤水<\/strong><\/p>\n<ol>\n<li>卤汁用完后别倒，滤掉香料渣、撇去浮沫。<\/li>\n<li>烧开晾凉装进密封盒冷藏，就是「老卤」。下次卤时补一点盐和香料，越用越香。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 啤酒卤 / 糖色卤<\/strong><\/p>\n<ol start=\"3\">\n<li>追求红亮色泽：先用少量油把冰糖炒成枣红色糖色，再加水调卤汁。<\/li>\n<li>或用啤酒代替一半清水（麦香 + 微甜），成色红亮、回甘明显。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 低温慢卤 + 浸泡一夜<\/strong><\/p>\n<ol start=\"5\">\n<li>煮蛋后用最小火慢卤 20~30 分钟，让蛋白慢慢收紧。<\/li>\n<li>再关火浸泡过夜，蛋白会变得紧实 Q 弹、越嚼越香，接近「铁蛋」的紧实感。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 出品细节<\/strong><\/p>\n<ol start=\"7\">\n<li>上桌前把卤蛋捞起沥干，表面刷一层卤汁或点几滴香油。<\/li>\n<li>撒白芝麻或葱花增香；冷吃更有嚼劲，热吃更软糯。<\/li>\n<\/ol>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "69", "name": "奶酪焗饭", "title": "奶酪焗饭", "category": "奶制品", "ingredient": "奶酪", "ings": [["米饭"], ["马苏里拉奶酪"], ["洋葱"], ["火腿肠", "培根"], ["玉米粒"], ["青豆"], ["番茄酱"], ["盐"], ["黑胡椒"], ["黄油", "食用油"]], "opt": [false, false, false, false, false, false, false, false, false, false], "tags": [], "html": "<h1>奶酪焗饭<\/h1>\n<blockquote>\n<p>归属食材：奶酪 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>剩饭华丽变身的主食焗菜，马苏里拉融化拉丝、奶香浓郁，烤箱微波都能做。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、不难吃）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>米饭<\/td>\n<td>2 碗（约 300g）<\/td>\n<td>隔夜饭更干爽<\/td>\n<\/tr>\n<tr>\n<td>马苏里拉奶酪<\/td>\n<td>100g（碎）<\/td>\n<td>拉丝靠它<\/td>\n<\/tr>\n<tr>\n<td>洋葱<\/td>\n<td>1/4 个<\/td>\n<td>切丁<\/td>\n<\/tr>\n<tr>\n<td>火腿肠/培根<\/td>\n<td>1 根 / 2 片<\/td>\n<td>切丁<\/td>\n<\/tr>\n<tr>\n<td>玉米粒、青豆<\/td>\n<td>各 2 汤匙<\/td>\n<td>冷冻的即可<\/td>\n<\/tr>\n<tr>\n<td>番茄酱<\/td>\n<td>2 汤匙<\/td>\n<td>调味<\/td>\n<\/tr>\n<tr>\n<td>盐、黑胡椒<\/td>\n<td>各少许<\/td>\n<td>少放，奶酪本身有咸味<\/td>\n<\/tr>\n<tr>\n<td>黄油/食用油<\/td>\n<td>1 汤匙<\/td>\n<td>炒饭底用<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 炒饭底<\/strong><\/p>\n<ol>\n<li>锅烧热放油（黄油/食用油 1 汤匙）。<\/li>\n<li>下洋葱丁，炒香（约 1 分钟），闻到洋葱甜香 → 下下一步的料。<\/li>\n<li>下火腿肠丁、玉米、青豆，翻炒约 1 分钟。<\/li>\n<li>倒入米饭，炒散。<\/li>\n<li>加番茄酱、盐、黑胡椒，翻匀。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 装碗<\/strong><\/p>\n<ol start=\"6\">\n<li>炒饭盛进耐高温的烤碗/焗饭碗，铺平，别压实。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 铺奶酪<\/strong><\/p>\n<ol start=\"7\">\n<li>表面均匀撒满马苏里拉奶酪碎，盖住米饭。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 焗烤<\/strong><\/p>\n<ol start=\"8\">\n<li>烤箱预热 200℃，放中层。<\/li>\n<li>烤 10~15 分钟，看到奶酪完全融化、表面金黄微焦、能拉丝 → 出炉；没烤箱用微波炉高火叮 2~3 分钟，到奶酪融化为止。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 出炉<\/strong><\/p>\n<ol start=\"10\">\n<li>趁热吃，拉丝效果最好；小心烤碗烫手。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>奶酪不拉丝<\/strong>：用了不是马苏里拉的奶酪（如车打会化但不易拉丝），或铺得太少。马苏里拉要铺满。<\/li>\n<li><strong>烤焦<\/strong>：温度太高或烤太久，奶酪变硬焦黑。200℃ 10~15 分钟，看到上色就停。<\/li>\n<li><strong>米饭太湿<\/strong>：现煮米饭水汽大，焗出来一滩水。用隔夜饭或把饭煮干一点。<\/li>\n<li><strong>太咸<\/strong>：火腿、番茄酱、奶酪都带咸味，盐要少放或不放。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/18075/\">下厨房 · 奶酪焗饭<\/a> —— 基础做法，适合对照「初学版」<\/li>\n<li><a href=\"https://www.xiachufang.com/recipe/100317593/\">下厨房 · 奶酪焗饭<\/a> —— 配料灵活，适合对照「初学版」<\/li>\n<li><a href=\"https://www.xiachufang.com/recipe/107209665/\">下厨房 · 芝士焗饭（布理安娜）<\/a> —— 带步骤图，适合对照「初学/进阶版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1xe4y1C7bX/\">不需要烤箱也能做芝士焗饭，满满的拉丝（哔哩哔哩）<\/a> —— 平底锅/无烤箱版，适合初学<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1v44y1C7Bm/\">芝士焗饭这样做太好吃啦！家中平底锅就能轻松搞定（哔哩哔哩）<\/a> —— 平底锅版，适合初学<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：饭底 / 拉丝 / 白酱 / 火候）<\/h2>\n<p>在初学版基础上，掌握下面四条，成品质感会上一个台阶。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 炒饭底要香<\/strong><\/p>\n<ol>\n<li>用黄油代替食用油下锅。<\/li>\n<li>先炒洋葱出甜味，闻到甜香 → 再加料。<\/li>\n<li>加肉和蔬菜翻炒。<\/li>\n<li>最后下饭，大火炒散，炒到锅气足。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 拉丝关键<\/strong><\/p>\n<ol start=\"5\">\n<li>马苏里拉用「碎」的，铺厚一点，融化后才有拉丝。<\/li>\n<li>可混一点点车打芝士，增加奶香层次。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 白酱焗饭（更浓郁）<\/strong><\/p>\n<ol start=\"7\">\n<li>黄油 + 面粉下锅，炒成油面糊。<\/li>\n<li>分次加牛奶，煮成白酱。<\/li>\n<li>拌进米饭，再铺奶酪焗，奶香翻倍、口感更润。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 火候<\/strong><\/p>\n<ol start=\"10\">\n<li>烤箱中层 180~200℃，烤 10~15 分钟，看到奶酪边缘起泡、表面金黄 → 出炉。<\/li>\n<li>微波炉高火 2~3 分钟，别超过，以免奶酪变橡胶。<\/li>\n<\/ol>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「米饭粒粒分明、白酱浓滑、奶酪拉丝不断」。每一步都是细节。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 米饭处理<\/strong><\/p>\n<ol>\n<li>用隔夜饭，炒前把结块打散。<\/li>\n<li>炒饭底炒到粒粒分明、有锅气。<\/li>\n<li>盐在炒饭阶段一次调味到位。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 白酱（基础奶油酱）<\/strong><\/p>\n<ol start=\"4\">\n<li>20g 黄油下锅融化，加 20g 面粉，小火炒 1 分钟成油面糊。<\/li>\n<li>分次倒入 300ml 牛奶，边倒边搅匀。<\/li>\n<li>煮到浓稠挂勺，加盐和黑胡椒，这是西餐焗饭的灵魂。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 配料分层<\/strong><\/p>\n<ol start=\"7\">\n<li>炒饭打底。<\/li>\n<li>铺一层白酱/番茄酱。<\/li>\n<li>撒奶酪——这样奶酪化后与酱融合，拉丝且不干。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 焗烤细节<\/strong><\/p>\n<ol start=\"10\">\n<li>奶酪表面可撒一点帕玛森芝士粉或黑胡椒增香。<\/li>\n<li>烤箱上色靠中层，或最后开上火 1~2 分钟，别烤过头。<\/li>\n<\/ol>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "70", "name": "奶油蘑菇汤", "title": "奶油蘑菇汤", "category": "奶制品", "ingredient": "淡奶油", "ings": [["口蘑", "白蘑菇"], ["洋葱"], ["黄油"], ["面粉"], ["牛奶"], ["淡奶油"], ["清水", "高汤"], ["盐"], ["黑胡椒"]], "opt": [false, false, false, false, false, false, false, false, false], "tags": [], "html": "<h1>奶油蘑菇汤<\/h1>\n<blockquote>\n<p>归属食材：淡奶油 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>西式浓汤经典，蘑菇鲜香融合奶香，口感细腻顺滑。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、不难吃）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>口蘑（白蘑菇）<\/td>\n<td>8~10 个（约 250g）<\/td>\n<td>切片<\/td>\n<\/tr>\n<tr>\n<td>洋葱<\/td>\n<td>1/4 个<\/td>\n<td>切碎<\/td>\n<\/tr>\n<tr>\n<td>黄油<\/td>\n<td>25g<\/td>\n<td>分炒菜和炒面粉用<\/td>\n<\/tr>\n<tr>\n<td>面粉<\/td>\n<td>25g（约 2 汤匙）<\/td>\n<td>普通面粉即可<\/td>\n<\/tr>\n<tr>\n<td>牛奶<\/td>\n<td>300ml<\/td>\n<td>全脂更香<\/td>\n<\/tr>\n<tr>\n<td>淡奶油<\/td>\n<td>100ml<\/td>\n<td>动物性淡奶油<\/td>\n<\/tr>\n<tr>\n<td>清水/高汤<\/td>\n<td>200ml<\/td>\n<td>或鸡高汤<\/td>\n<\/tr>\n<tr>\n<td>盐、黑胡椒<\/td>\n<td>各适量<\/td>\n<td>调味<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 备料<\/strong><\/p>\n<ol>\n<li>口蘑去蒂，擦净（别泡水），切成薄片。<\/li>\n<li>洋葱切碎。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 炒香<\/strong><\/p>\n<ol start=\"3\">\n<li>锅烧热，放 15g 黄油，融化。<\/li>\n<li>下洋葱碎，小火炒软（约 2 分钟），看到洋葱变透明、变软 → 下蘑菇。<\/li>\n<li>下蘑菇片，中火炒到出水、变软、微微焦香（约 5 分钟）。<\/li>\n<li>盛出一小部分蘑菇片，留着最后放。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 炒面粉<\/strong><\/p>\n<ol start=\"7\">\n<li>锅里补剩下的 10g 黄油，融化后倒入面粉。<\/li>\n<li>小火不停搅，炒成浅黄色的糊（约 1~2 分钟，别炒焦）。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 煮汤<\/strong><\/p>\n<ol start=\"9\">\n<li>分次慢慢倒入牛奶和高汤，边倒边搅，搅到没有面疙瘩。<\/li>\n<li>煮开，转小火煮 3~5 分钟，看到汤慢慢变浓。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 搅打调味<\/strong><\/p>\n<ol start=\"11\">\n<li>关火，用料理棒或倒入搅拌机，把汤打细腻。<\/li>\n<li>倒回锅，加淡奶油、盐、黑胡椒。<\/li>\n<li>小火加热到温热（别煮沸），放回留的蘑菇片，出锅。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>面糊结疙瘩<\/strong>：牛奶一下全倒进去没搅开。一定分次少量、边倒边搅。<\/li>\n<li><strong>面糊炒焦<\/strong>：火太大。小火炒 1~2 分钟到微黄就停。<\/li>\n<li><strong>淡奶油煮沸结块<\/strong>：最后加淡奶油别煮开，温热即可。<\/li>\n<li><strong>汤太稀/太稠<\/strong>：太稀再煮一会儿收浓，太稠加牛奶调稀。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/107236564/\">下厨房 · 奶油蘑菇汤<\/a> —— 基础做法，适合对照「初学版」<\/li>\n<li><a href=\"https://www.xiachufang.com/recipe/106024771/\">下厨房 · 家庭版奶油蘑菇汤<\/a> —— 家用比例，适合对照「初学版」<\/li>\n<li><a href=\"https://m.lezuocai.com/recipe/1020147/\">乐做菜 · 奶油蘑菇汤原来这样简单~零失败<\/a> —— 零失败版，适合对照「初学版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1pJxNzKE24/\">给老婆的饭｜奶油蘑菇汤（哔哩哔哩）<\/a> —— 油面糊步骤清晰，适合初学<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1w7411g7DU/\">奶油蘑菇汤 简单低成本的浓香（哔哩哔哩）<\/a> —— 家庭简易版，适合初学<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：油面糊 / 蘑菇 / 细腻 / 奶香）<\/h2>\n<p>在初学版基础上，掌握下面四条，成品质感会上一个台阶。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 油面糊（roux）是浓稠关键<\/strong><\/p>\n<ol>\n<li>黄油和面粉按 1 : 1 下锅。<\/li>\n<li>小火炒到微黄、带点坚果香。<\/li>\n<li>分次加液体，边加边搅，汤才顺滑不结块。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 蘑菇炒到位<\/strong><\/p>\n<ol start=\"4\">\n<li>中火把蘑菇炒到出水、水分收干、边缘微焦，闻到「蘑菇味」才算到位；只翻两下汤会淡。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 打细腻<\/strong><\/p>\n<ol start=\"5\">\n<li>用料理棒/破壁机打 1~2 分钟。<\/li>\n<li>想要有颗粒感，就留一部分蘑菇不打。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 奶香层次<\/strong><\/p>\n<ol start=\"7\">\n<li>牛奶 + 高汤打底，淡奶油最后加。<\/li>\n<li>怕腻可减淡奶油、多加高汤。<\/li>\n<\/ol>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「浓稠顺滑、蘑菇香足、奶香不腻」。每一步都是细节。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 蘑菇选择与处理<\/strong><\/p>\n<ol>\n<li>口蘑去蒂，用湿布擦净，不水洗（吸水会出汤变淡）。<\/li>\n<li>可加少量干香菇泡发（泡菇水留作高汤）增香。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 油面糊火候<\/strong><\/p>\n<ol start=\"3\">\n<li>黄油小火融化，加面粉。<\/li>\n<li>炒到「浅金棕色」、有坚果香就停；别到咖啡色，否则发苦。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 液体分次加<\/strong><\/p>\n<ol start=\"5\">\n<li>先加一点液体，搅成糊。<\/li>\n<li>再逐步冲开，全程搅动。<\/li>\n<li>煮到挂勺（汤匙背面能挂一层）→ 汤的浓度到位。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 最后调味<\/strong><\/p>\n<ol start=\"8\">\n<li>关小火（或不加热），加淡奶油、盐、现磨黑胡椒。<\/li>\n<li>搅打后过筛一次，更细腻。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 点缀<\/strong><\/p>\n<ol start=\"10\">\n<li>表面淋一圈淡奶油，撒欧芹碎/黑胡椒，配烤面包丁或法棍蘸食。<\/li>\n<\/ol>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "71", "name": "双皮奶", "title": "双皮奶", "category": "奶制品", "ingredient": "牛奶", "ings": [["全脂牛奶"], ["蛋清"], ["白砂糖"], ["清水"]], "opt": [false, false, false, false], "tags": ["甜"], "html": "<h1>双皮奶<\/h1>\n<blockquote>\n<p>归属食材：牛奶 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>广式经典甜品，奶香浓郁、入口嫩滑，灵魂在上下两层奶皮。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、不难吃）<\/h2>\n<p><strong>食材（2 碗 / 2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>全脂牛奶<\/td>\n<td>400ml（2 碗各 200ml）<\/td>\n<td>必须全脂，脂肪越多奶皮越厚<\/td>\n<\/tr>\n<tr>\n<td>蛋清<\/td>\n<td>2 个（约 60g）<\/td>\n<td>常温蛋更好分离<\/td>\n<\/tr>\n<tr>\n<td>白砂糖<\/td>\n<td>2 汤匙（约 20g）<\/td>\n<td>可按口味增减<\/td>\n<\/tr>\n<tr>\n<td>清水<\/td>\n<td>适量<\/td>\n<td>蒸锅用<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 煮奶结皮<\/strong><\/p>\n<ol>\n<li>牛奶倒进小锅，小火加热到锅边冒密集小泡（约 75℃，不要煮沸）。<\/li>\n<li>关火，趁热把牛奶倒进两个碗里。<\/li>\n<li>静置 15~20 分钟，看到表面结出一层皱皱的奶皮 → 做下一步。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 倒奶留皮<\/strong><\/p>\n<ol start=\"4\">\n<li>用筷子在奶皮边缘戳一个小口。<\/li>\n<li>把碗里的奶沿口子慢慢倒回锅里，碗底留约 1 汤匙奶和整张奶皮，别把奶皮倒出来。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 调蛋奶液<\/strong><\/p>\n<ol start=\"6\">\n<li>蛋清加糖，用筷子轻轻打散（别打出太多泡）。<\/li>\n<li>倒进牛奶里搅匀。<\/li>\n<li>过一遍细筛，撇掉表面浮沫。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 倒回蒸制<\/strong><\/p>\n<ol start=\"9\">\n<li>把蛋奶液沿碗边慢慢倒回有奶皮的碗里，让奶皮重新浮起来。<\/li>\n<li>碗口盖一层耐热保鲜膜，用牙签扎几个小孔。<\/li>\n<li>蒸锅水烧开，中火蒸 12~15 分钟。<\/li>\n<li>关火，再焖 3 分钟。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 判断凝固<\/strong><\/p>\n<ol start=\"13\">\n<li>轻轻晃碗，看到蛋奶液不再流动、像嫩豆腐一样颤巍巍 → 熟了；放凉或冷藏后再吃更定型。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>奶皮没结出来<\/strong>：用了低脂/脱脂奶，或牛奶没放凉就急着倒。一定要全脂奶、静置到表面起皱。<\/li>\n<li><strong>奶皮破了/沉底<\/strong>：倒奶动作太猛、碗底留的奶太少。沿碗边慢慢倒、碗底留一点奶。<\/li>\n<li><strong>蒸出来全是蜂窝/太老<\/strong>：火太大或蒸太久。中火蒸、盖保鲜膜防蒸汽水滴。<\/li>\n<li><strong>蛋清结块<\/strong>：牛奶太烫就冲进蛋清。等牛奶晾到不烫手（约 40℃ 以下）再混蛋清。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/100406323/\">下厨房 · 双皮奶的做法（消耗蛋清/简易版）<\/a> —— 蛋清比例讲得清，适合对照「初学版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1eKraYWEKa/\">双皮奶做法，完全 0 失败（哔哩哔哩）<\/a> —— 全流程演示，适合初学<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：奶皮 / 过滤 / 火候 / 甜度）<\/h2>\n<p>在初学版基础上，掌握下面四条，成品质感会上一个台阶。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 奶皮要厚<\/strong><\/p>\n<ol>\n<li>用全脂牛奶，可额外加 1~2 汤匙奶粉或淡奶油，提高乳脂。<\/li>\n<li>牛奶加热到「刚要滚没滚」就关火——煮过头奶皮反而难结、还容易起泡破皮。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 倒奶留皮<\/strong><\/p>\n<ol start=\"3\">\n<li>倒奶前把碗轻轻倾斜，用筷子压住奶皮口，让奶从口子慢慢流出。<\/li>\n<li>碗底留约 1 汤匙奶，防止奶皮粘在碗底浮不起来。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 蛋奶液要细腻<\/strong><\/p>\n<ol start=\"5\">\n<li>蛋清加糖，只打散、不起泡。<\/li>\n<li>混合后过筛 1~2 次、撇净浮沫，蒸出来才像镜面一样光滑。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 火候与甜度<\/strong><\/p>\n<ol start=\"7\">\n<li>中火蒸 12~15 分钟、关火焖 3 分钟，用「晃动不流动」判断熟度，别蒸过头起蜂窝。<\/li>\n<li>糖量约 5%~8%（400ml 奶约 20~30g 糖）。<\/li>\n<li>冷藏后更凝固，配蜜红豆、水果、姜汁都行。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/104391701/\">下厨房 · 广式糖水铺：做一碗能把皮挑起来的双皮奶<\/a> —— 奶皮倒回技巧，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「上层甘香、下层嫩滑、两层奶皮分明」。每一步都是细节。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 牛奶选择<\/strong><\/p>\n<ol>\n<li>顺德传统用水牛奶（乳脂 8% 以上），奶皮厚而香；家用可用全脂牛奶 + 少量淡奶油模拟，脂肪越高皮越厚。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 精准温度<\/strong><\/p>\n<ol start=\"2\">\n<li>牛奶煮到 75~80℃（锅边起密集小泡），立刻关火。<\/li>\n<li>倒碗后自然放凉约 20 分钟，看到第一层奶皮结实、有韧性 → 好操作。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 蛋清比例<\/strong><\/p>\n<ol start=\"4\">\n<li>蛋清与牛奶重量比约 1 : 6，糖约 6%。蛋清多了成品发硬，少了不成型。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 二次奶皮（双皮原理）<\/strong><\/p>\n<ol start=\"5\">\n<li>蛋奶液倒回后，第一层奶皮浮在表面。<\/li>\n<li>蒸的过程中蛋奶液表面再结第二层，两层合一就是「双皮」。<\/li>\n<li>蒸时火力稳定、加盖防冷凝水，成品表面光滑不起皱。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 成品判断<\/strong><\/p>\n<ol start=\"8\">\n<li>出锅轻晃，像布丁一样颤动 → 到位。<\/li>\n<li>彻底放凉后冷藏 1~2 小时，口感最佳，切一刀侧面能看出上下两层皮。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/106914790/\">下厨房 · 双皮奶（水牛奶版）<\/a> —— 水牛奶版本，适合对照「大厨版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV151421R7TJ/\">超厚奶皮子的双皮奶（哔哩哔哩）<\/a> —— 顺德传统做法，适合对照「大厨版」<\/li>\n<\/ul>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "72", "name": "自制酸奶", "title": "自制酸奶", "category": "奶制品", "ingredient": "酸奶", "ings": [["全脂纯牛奶"], ["酸奶菌粉"], ["白砂糖"]], "opt": [false, false, true], "tags": ["甜"], "html": "<h1>自制酸奶<\/h1>\n<blockquote>\n<p>归属食材：酸奶 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>无添加的家常发酵酸奶，浓稠顺滑、酸甜可调，冷藏后风味更佳。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能成功、不难吃）<\/h2>\n<p><strong>食材（约 4~5 杯，用 1L 牛奶）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>全脂纯牛奶<\/td>\n<td>1L<\/td>\n<td>全脂更浓稠，脱脂偏稀<\/td>\n<\/tr>\n<tr>\n<td>酸奶菌粉<\/td>\n<td>1 小包（约 1g）<\/td>\n<td>或用 100ml 原味酸奶当引子<\/td>\n<\/tr>\n<tr>\n<td>白砂糖<\/td>\n<td>可选，2~3 汤匙<\/td>\n<td>想无糖可不加<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 消毒容器<\/strong><\/p>\n<ol>\n<li>酸奶机内胆、搅拌勺、装酸奶的杯子，全部用开水烫一遍。<\/li>\n<li>再用厨房纸擦干，保证无水无油。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 温热牛奶<\/strong><\/p>\n<ol start=\"3\">\n<li>牛奶倒进内胆，小火或隔水加热到 40℃ 左右（温热不烫手，约等于体温）。<\/li>\n<li>加糖的话，这步一起搅化。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 加菌种<\/strong><\/p>\n<ol start=\"5\">\n<li>倒入菌粉（或用一小盒原味酸奶当引子）。<\/li>\n<li>用消毒过的勺子朝一个方向搅 1~2 分钟，搅到完全均匀。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 发酵<\/strong><\/p>\n<ol start=\"7\">\n<li>内胆放进酸奶机，盖好盖子。<\/li>\n<li>通电发酵 8~10 小时（约 40℃），看到牛奶凝固成豆腐状 → 发酵到位。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 冷藏定型<\/strong><\/p>\n<ol start=\"9\">\n<li>发酵好直接放进冰箱，冷藏 4 小时以上，口感更浓稠醇厚，也停止继续发酵。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>容器有油水<\/strong>：杂菌混入会让酸奶发黏、有异味甚至失败。所有工具先烫再擦干。<\/li>\n<li><strong>牛奶太烫就放菌<\/strong>：超过 45℃ 会把乳酸菌烫死。手背试温，温热不烫即可。<\/li>\n<li><strong>发酵时间不够/太久<\/strong>：时间短不凝固、时间长偏酸。8~10 小时为宜，凝固即可停。<\/li>\n<li><strong>表面渗乳清<\/strong>：正常现象，是发酵稍长，搅一下或倒掉即可，不是坏了。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/106967698/\">下厨房 · 自制健康低糖酸奶（酸奶机版）<\/a> —— 配比与口味，适合对照「初学版」<\/li>\n<li><a href=\"https://www.xiachufang.com/recipe/100518131/\">下厨房 · 自制酸奶的做法<\/a> —— 基础流程，适合对照「初学版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1yp7HzZEKc/\">小白如何自制酸奶 保姆级教程（哔哩哔哩）<\/a> —— 配比/时间/保存讲得细，适合初学<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV12G41197ob/\">周末给家里小朋友做坚果酸奶拌（哔哩哔哩）<\/a> —— 菌粉 + 牛奶发酵演示，适合初学<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：菌种 / 温度 / 浓稠 / 保存）<\/h2>\n<p>在初学版基础上，掌握下面四条，成品更稳定更好吃。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 菌种选择<\/strong><\/p>\n<ol>\n<li>市售酸奶菌粉更稳定，选含保加利亚乳杆菌 + 嗜热链球菌的基础菌粉。<\/li>\n<li>用市售原味酸奶做引子，要选「活菌型」且日期新鲜的。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 温度控制<\/strong><\/p>\n<ol start=\"3\">\n<li>40~45℃ 是乳酸菌最适温度。<\/li>\n<li>没酸奶机，可用电饭煲保温档、烤箱发酵档，或保温桶 + 热水，保持恒温即可。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 浓稠度<\/strong><\/p>\n<ol start=\"5\">\n<li>全脂奶更稠；可加 1~2 汤匙奶粉或淡奶油，增加固形物。<\/li>\n<li>想要希腊酸奶，就用纱布过滤乳清几小时。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 口味与保存<\/strong><\/p>\n<ol start=\"7\">\n<li>冷藏 2~6 小时「钝化」后更醇厚。<\/li>\n<li>3~5 天内吃完。<\/li>\n<li>留一小勺当引子可循环续做（重复次数别太多，风味会变）。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/106665231/\">下厨房 · 在家轻松自制希腊酸奶<\/a> —— 过滤乳清，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「浓稠顺滑、酸香纯正、无杂菌」。每一步都是细节。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 杀菌更彻底<\/strong><\/p>\n<ol>\n<li>牛奶先加热到 85℃，保持 10 分钟（家庭巴氏杀菌思路）。<\/li>\n<li>再降温到 42℃，既杀杂菌又让乳蛋白变性、成品更稠。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 接种比例<\/strong><\/p>\n<ol start=\"3\">\n<li>菌粉按 1 小包 / 1L 奶下。<\/li>\n<li>用引子约 10%（100ml 酸奶 : 900ml 牛奶）。<\/li>\n<li>搅匀到无颗粒、表面无浮粉。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 发酵终点判断<\/strong><\/p>\n<ol start=\"6\">\n<li>8~12 小时之间检查，倾斜内胆，看到牛奶不流动、表面有光泽、像嫩豆腐 → 发酵好；发酵越久越酸，可按口味微调。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 冷藏与后熟<\/strong><\/p>\n<ol start=\"7\">\n<li>冷藏 4~8 小时，让乳清稳定、口感醇厚。<\/li>\n<li>想吃希腊酸奶/奶酪，过滤乳清后得到浓稠质地。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 风味变化<\/strong><\/p>\n<ol start=\"9\">\n<li>可加蜂蜜、果酱、坚果、燕麦；无糖酸奶配水果更健康。<\/li>\n<\/ol>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "73", "name": "黄油曲奇", "title": "黄油曲奇", "category": "奶制品", "ingredient": "黄油", "ings": [["无盐黄油"], ["糖粉"], ["蛋黄"], ["低筋面粉"], ["盐"]], "opt": [false, false, false, false, false], "tags": ["甜"], "html": "<h1>黄油曲奇<\/h1>\n<blockquote>\n<p>归属食材：黄油 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>经典烘焙入门饼干，黄油香气足、酥松掉渣、花纹清晰。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、不难吃）<\/h2>\n<p><strong>食材（约 30 块）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>无盐黄油<\/td>\n<td>100g<\/td>\n<td>室温软化到能轻按出坑<\/td>\n<\/tr>\n<tr>\n<td>糖粉<\/td>\n<td>40g<\/td>\n<td>糖粉更细腻、花纹清晰<\/td>\n<\/tr>\n<tr>\n<td>蛋黄<\/td>\n<td>1 个<\/td>\n<td>只加蛋黄更酥<\/td>\n<\/tr>\n<tr>\n<td>低筋面粉<\/td>\n<td>130g<\/td>\n<td>过筛<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>1 小撮（约 1g）<\/td>\n<td>提味<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 软化黄油<\/strong><\/p>\n<ol>\n<li>黄油提前从冰箱拿出，室温放 30~60 分钟。<\/li>\n<li>到手指能轻松按出一个坑 → 软化到位（还是固体，别化成水）。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 打发<\/strong><\/p>\n<ol start=\"3\">\n<li>黄油 + 糖粉 + 盐放进盆里，用电动打蛋器打到颜色发白、体积蓬松（约 2~3 分钟）。<\/li>\n<li>加蛋黄，继续打到完全融合。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 拌粉<\/strong><\/p>\n<ol start=\"5\">\n<li>低筋面粉过筛加入，用刮刀从底部往上翻拌。<\/li>\n<li>拌到没有干粉就停，不要画圈搅。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 挤花<\/strong><\/p>\n<ol start=\"7\">\n<li>面糊装进裱花袋（配 8 齿裱花嘴）。<\/li>\n<li>在铺了油纸的烤盘上挤出花型，每块之间留一点空隙。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 烘烤<\/strong><\/p>\n<ol start=\"9\">\n<li>烤箱提前预热 170℃，中层烤 18~20 分钟，看到边缘微微上色 → 出炉。<\/li>\n<li>先别动，在烤盘上放凉 5 分钟，再移到晾网彻底放凉，就变酥。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>花纹消失<\/strong>：黄油软化过头（化成液体）或面糊太稀。黄油要软膏状，别隔水化成油。<\/li>\n<li><strong>挤不动/挤破裱花袋<\/strong>：黄油软化不够、面糊太硬。多放一会儿软化，或用手温搓揉一会儿。<\/li>\n<li><strong>烤完还软<\/strong>：没烤透或没放凉就急着装。边缘上色、放凉后才变酥脆。<\/li>\n<li><strong>上色不均/烤焦<\/strong>：烤箱温度偏高或烤太久。170℃ 18~20 分钟，勤看边缘颜色。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/1071969/\">下厨房 · 黄油曲奇<\/a> —— 经典配方，适合对照「初学版」<\/li>\n<li><a href=\"https://www.xiachufang.com/recipe/102335606/\">下厨房 · 黄油曲奇<\/a> —— 基础比例，适合对照「初学版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1x44y1z7F7/\">烘焙基础：香酥黄油曲奇（曲奇超详细教程）（哔哩哔哩）<\/a> —— 新手友好，含失败总结，适合初学<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV16NqVYqEFP/\">不会挤破裱花袋又可爱的圣诞黄油曲奇（哔哩哔哩）<\/a> —— 挤花技巧，适合初学<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：黄油 / 糖 / 粉类 / 烘烤）<\/h2>\n<p>在初学版基础上，掌握下面四条，成品质感会上一个台阶。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 黄油状态是灵魂<\/strong><\/p>\n<ol>\n<li>室温 22~25℃ 软化到「软膏状」，能按坑、不塌、不渗油。<\/li>\n<li>软化不足挤不动，过头花纹塌。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 糖粉 vs 砂糖<\/strong><\/p>\n<ol start=\"3\">\n<li>糖粉吸水性好、花纹更立体；想更酥可糖粉 + 少量细砂糖混合。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 粉类与酥脆<\/strong><\/p>\n<ol start=\"4\">\n<li>低筋面粉让饼干酥；可把 10~15g 低粉换成玉米淀粉或杏仁粉，口感更酥松、入口即化。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 烘烤与冷却<\/strong><\/p>\n<ol start=\"5\">\n<li>烤完先在烤盘上定型几分钟再移动。<\/li>\n<li>彻底放凉再密封。<\/li>\n<li>回潮就回烤箱，低温烘 5 分钟复酥。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/103358638/\">下厨房 · 黄油曲奇<\/a> —— 花纹技巧，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「花纹立体、入口即化、黄油香浓」。每一步都是细节。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 打发程度<\/strong><\/p>\n<ol>\n<li>黄油打到颜色发白、呈羽毛状，体积约膨胀 1 倍。<\/li>\n<li>打发不足口感紧实，过度会塌纹。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 蛋液温度<\/strong><\/p>\n<ol start=\"3\">\n<li>蛋黄/蛋液要常温，太冷会导致水油分离。<\/li>\n<li>分次加入、每次打匀。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 挤花手法<\/strong><\/p>\n<ol start=\"5\">\n<li>裱花嘴离烤盘约 1cm，匀速挤、收口时转一圈断开。<\/li>\n<li>手温高会把面糊焐软，挤一袋休息下或分批装。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 烘烤温度曲线<\/strong><\/p>\n<ol start=\"7\">\n<li>先 170℃ 烤到定型，最后 2 分钟看边缘上色。<\/li>\n<li>出炉后余温继续上色，别等颜色太深才拿。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 保存<\/strong><\/p>\n<ol start=\"9\">\n<li>彻底凉透再装密封罐，可放干燥剂。<\/li>\n<li>冷冻生坯可保存 1 个月，随时取烤。<\/li>\n<\/ol>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "74", "name": "红烧带鱼", "title": "红烧带鱼", "category": "水产海鲜", "ingredient": "带鱼", "ings": [["带鱼"], ["姜"], ["葱"], ["蒜"], ["料酒"], ["生抽"], ["老抽"], ["白糖"], ["香醋"], ["干辣椒"], ["花椒"], ["面粉", "淀粉"], ["食用油"], ["开水"]], "opt": [false, false, false, false, false, false, false, false, false, true, true, false, false, false], "tags": [], "html": "<h1>红烧带鱼<\/h1>\n<blockquote>\n<p>归属食材：带鱼 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>经典家常菜，咸香微甜、酱汁浓郁，带鱼段外酥里嫩、下饭一流。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：入味、不腥、不散）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>带鱼<\/td>\n<td>1 条（约 500g）<\/td>\n<td>去头尾、内脏，切约 5cm 段<\/td>\n<\/tr>\n<tr>\n<td>姜<\/td>\n<td>5 片<\/td>\n<td>去腥<\/td>\n<\/tr>\n<tr>\n<td>葱<\/td>\n<td>2 段<\/td>\n<td>爆香<\/td>\n<\/tr>\n<tr>\n<td>蒜<\/td>\n<td>3 瓣<\/td>\n<td>拍散<\/td>\n<\/tr>\n<tr>\n<td>料酒<\/td>\n<td>1 汤匙<\/td>\n<td>腌制去腥<\/td>\n<\/tr>\n<tr>\n<td>生抽<\/td>\n<td>1.5 汤匙<\/td>\n<td>咸味底味<\/td>\n<\/tr>\n<tr>\n<td>老抽<\/td>\n<td>1/2 汤匙<\/td>\n<td>上色<\/td>\n<\/tr>\n<tr>\n<td>白糖<\/td>\n<td>1 小勺（约 5g）<\/td>\n<td>提鲜、平衡咸味<\/td>\n<\/tr>\n<tr>\n<td>香醋<\/td>\n<td>1/2 汤匙<\/td>\n<td>去腥提香，量少不酸<\/td>\n<\/tr>\n<tr>\n<td>干辣椒<\/td>\n<td>2 个（可选）<\/td>\n<td>提香<\/td>\n<\/tr>\n<tr>\n<td>花椒<\/td>\n<td>1 小撮（可选）<\/td>\n<td>去腥增香<\/td>\n<\/tr>\n<tr>\n<td>面粉 / 淀粉<\/td>\n<td>约 3 汤匙<\/td>\n<td>裹鱼段防散<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>约 4 汤匙<\/td>\n<td>煎鱼<\/td>\n<\/tr>\n<tr>\n<td>开水<\/td>\n<td>约 200ml<\/td>\n<td>红烧用<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点，全程约 25 分钟）<\/strong><\/p>\n<p><strong>第 1 步 · 处理带鱼<\/strong><\/p>\n<ol>\n<li>带鱼段冲洗干净，剪掉鱼鳍。<\/li>\n<li>刮掉<strong>鱼腹内的黑膜和血块<\/strong>（腥味来源）；<strong>鱼身银白色的银脂不用刮<\/strong>，它有营养、也有香味。<\/li>\n<li>用厨房纸擦干水分。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 腌制去腥<\/strong><\/p>\n<ol start=\"4\">\n<li>带鱼段放碗里，加料酒、姜 2 片、1 小撮盐（约 1g）。<\/li>\n<li>抓匀腌 15 分钟。<\/li>\n<li>倒掉腌出的水。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 裹粉煎鱼<\/strong><\/p>\n<ol start=\"7\">\n<li>带鱼段两面薄薄裹一层面粉或淀粉，抖掉多余的粉。<\/li>\n<li>锅烧热倒油（约 3 汤匙），油热后把带鱼段一块块下锅。<\/li>\n<li>中小火煎到<strong>两面金黄定型<\/strong>（每面约 2 分钟），夹出备用（裹粉能锁住鱼肉不散、银脂不流失）。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 红烧焖煮<\/strong><\/p>\n<ol start=\"10\">\n<li>锅里留底油，下姜片、葱段、蒜瓣、干辣椒、花椒，爆香（约 30 秒）。<\/li>\n<li>放回带鱼段，加生抽、老抽、白糖、香醋。<\/li>\n<li>倒开水约 200ml（与带鱼齐平），大火烧开，转中小火焖 8 分钟，中途可轻轻翻一次面。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 收汁出锅<\/strong><\/p>\n<ol start=\"13\">\n<li>开大火收汁，把汤汁收到浓稠、能挂在鱼段上（约 2 分钟）。<\/li>\n<li>用筷子扎鱼段最厚处，<strong>能轻松扎透<\/strong> → 熟透，关火出锅。汤汁可以多留一点拌饭。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>鱼肉散<\/strong>：没裹粉就煎、翻得太勤。裹一层薄粉、煎到定型再翻，就不散。<\/li>\n<li><strong>腥<\/strong>：黑膜和血块没刮净，或腌制时间太短。这两处一定弄净，腌 15 分钟。<\/li>\n<li><strong>咸了<\/strong>：腌制时放了盐，红烧又放很多酱油。腌鱼盐要少，酱油用量看自己口味，焖煮后先尝再补。<\/li>\n<li><strong>煎糊 / 粘锅<\/strong>：锅没烧热就下鱼、火太大。锅烧热、中小火慢煎，别着急翻。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/106104708/\">下厨房 · 妈妈教的巨简单好吃的红烧带鱼（各种鱼都适用）<\/a> —— 腌制 + 料汁做法，适合对照「初学版」<\/li>\n<li><a href=\"http://mwx.douguo.com/cookbook/3300034.html\">豆果美食 · 红烧带鱼<\/a> —— 裹粉煎 + 焖烧步骤，需点开确认<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV18v411j7C8/\">红烧带鱼！鱼之隐逸者也，海中蛟龙，银色传说！（哔哩哔哩）<\/a> —— 家常全流程，适合对照「初学版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1SV411r7vh/\">红烧带鱼 Braised Ribbonfish（哔哩哔哩）<\/a> —— 视频链接由美食博客页提及，需点开确认<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：银脂处理 / 裹粉煎 / 料汁配比 / 香醋提香）<\/h2>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 银脂别乱刮<\/strong><\/p>\n<ol>\n<li>带鱼表面那层银白色不用刮——它不是脏东西，是带鱼的脂肪和营养，煎出来有独特香味。<\/li>\n<li>只刮腹内黑膜和血块，鱼身银脂保留。<\/li>\n<li>实在嫌腥，用清水轻轻冲一下，别用刀刮。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 裹粉还是裹蛋液<\/strong><\/p>\n<ol start=\"4\">\n<li>两种都行：裹<strong>干面粉/淀粉<\/strong>煎出来更脆、鱼肉更完整；裹<strong>蛋液 + 面粉<\/strong>口感更厚实。<\/li>\n<li>新手推荐先裹蛋液再裹面粉，更不易散。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 红烧汁配比<\/strong><\/p>\n<ol start=\"6\">\n<li>生抽 : 老抽 : 糖 : 香醋 约 <strong>3 : 1 : 1 : 1<\/strong>。<\/li>\n<li>糖和醋只起提鲜去腥作用，量要少，不要吃出明显的酸甜。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 出锅前沿锅边淋香醋<\/strong><\/p>\n<ol start=\"8\">\n<li>收汁时沿锅边淋几滴香醋（约 1/2 小勺），醋香被热锅一激就挥发，只留香、不留酸，是去腥点睛之笔。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/104138623/printable/\">下厨房 · 零失误的红烧带鱼<\/a> —— 啤酒红烧版，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「外皮微焦、鱼肉细嫩、酱汁红亮挂壁」。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 两面打花刀<\/strong><\/p>\n<ol>\n<li>带鱼段在两面各斜划 2~3 刀（约 1/3 深），更容易入味、也更容易煎透。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 复煎增香（可选）<\/strong><\/p>\n<ol start=\"2\">\n<li>第一次煎定型捞出。<\/li>\n<li>把油温升高到七成，快速复煎 20 秒，外皮更酥、更香。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 爆香料头<\/strong><\/p>\n<ol start=\"4\">\n<li>葱姜蒜、八角、干辣椒、花椒一起下锅。<\/li>\n<li>中火慢慢煸出香味 → 再下鱼，料头的香是整道菜的底。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 收汁挂壁 + 锅气<\/strong><\/p>\n<ol start=\"6\">\n<li>大火收汁时，不断把汤汁往鱼段上浇（或轻晃锅），让每块都裹上亮酱汁。<\/li>\n<li>汁不要收得太干，留一点浓汁拌饭。全程动作快，趁热吃。<\/li>\n<\/ol>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "75", "name": "水煮鱼", "title": "水煮鱼", "category": "水产海鲜", "ingredient": "草鱼", "ings": [["草鱼"], ["黄豆芽"], ["葱"], ["姜"], ["蒜"], ["郫县豆瓣酱"], ["干辣椒"], ["花椒"], ["料酒"], ["盐"], ["白胡椒粉"], ["蛋清"], ["淀粉"], ["食用油"]], "opt": [false, false, false, false, false, false, false, false, false, false, false, false, false, false], "tags": [], "html": "<h1>水煮鱼<\/h1>\n<blockquote>\n<p>归属食材：草鱼 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>川菜经典重口味菜，鱼片嫩滑、麻辣鲜香，最后浇热油的瞬间香气四溢。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、麻辣味对）<\/h2>\n<p><strong>食材（2~3 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>草鱼<\/td>\n<td>1 条（约 1000g）<\/td>\n<td>请摊主宰杀、片成鱼片 + 鱼骨<\/td>\n<\/tr>\n<tr>\n<td>黄豆芽<\/td>\n<td>约 200g<\/td>\n<td>垫底配菜，可换莴笋、千张<\/td>\n<\/tr>\n<tr>\n<td>葱<\/td>\n<td>2 段 + 葱花 1 小把<\/td>\n<td>葱段熬汤、葱花最后撒<\/td>\n<\/tr>\n<tr>\n<td>姜<\/td>\n<td>5 片<\/td>\n<td>去腥<\/td>\n<\/tr>\n<tr>\n<td>蒜<\/td>\n<td>4 瓣<\/td>\n<td>拍散<\/td>\n<\/tr>\n<tr>\n<td>郫县豆瓣酱<\/td>\n<td>1.5 汤匙<\/td>\n<td>麻辣底味来源<\/td>\n<\/tr>\n<tr>\n<td>干辣椒<\/td>\n<td>8~10 个<\/td>\n<td>剪成段<\/td>\n<\/tr>\n<tr>\n<td>花椒<\/td>\n<td>1 小勺<\/td>\n<td>麻味来源<\/td>\n<\/tr>\n<tr>\n<td>料酒<\/td>\n<td>1 汤匙<\/td>\n<td>腌鱼去腥<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>约 1 小勺（5g）<\/td>\n<td>分次放<\/td>\n<\/tr>\n<tr>\n<td>白胡椒粉<\/td>\n<td>1/2 小勺<\/td>\n<td>腌鱼去腥<\/td>\n<\/tr>\n<tr>\n<td>蛋清<\/td>\n<td>1 个<\/td>\n<td>上浆让鱼片嫩<\/td>\n<\/tr>\n<tr>\n<td>淀粉<\/td>\n<td>2 小勺<\/td>\n<td>上浆锁水<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>4 汤匙<\/td>\n<td>炒料 + 最后浇热油<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点，煮鱼全程中火）<\/strong><\/p>\n<p><strong>第 1 步 · 处理鱼<\/strong><\/p>\n<ol>\n<li>把摊主片好的鱼片、鱼骨分开冲洗，重点把<strong>鱼腹的黑膜刮净<\/strong>（这是腥味重灾区）。<\/li>\n<li>鱼片用清水轻轻抓洗两遍，洗到水不发浑。<\/li>\n<li>捞出挤干水分备用。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 腌鱼片上浆<\/strong><\/p>\n<ol start=\"4\">\n<li>鱼片放碗里，加料酒、1/2 小勺盐、白胡椒粉、蛋清。<\/li>\n<li>用手朝一个方向抓拌约 1 分钟，抓到鱼片发粘。<\/li>\n<li>再撒淀粉抓匀，让每片都裹上薄浆，静置 10 分钟（浆会把水分锁在肉里，煮出来才嫩）。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 焯配菜<\/strong><\/p>\n<ol start=\"7\">\n<li>锅里烧开水，下黄豆芽焯约 1 分钟。<\/li>\n<li>断生捞出，沥干铺在大碗（或深盆）底部。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 炒料熬汤<\/strong><\/p>\n<ol start=\"9\">\n<li>锅烧热倒 2 汤匙油，中小火下豆瓣酱，炒出红油（约 1 分钟）。<\/li>\n<li>放葱段、姜片、蒜瓣、一半的干辣椒和花椒，炒出香味（约 30 秒）。<\/li>\n<li>倒入约 700ml 开水，大火煮开。<\/li>\n<li>先下鱼骨煮 3 分钟，把鱼骨捞出铺在豆芽上。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 煮鱼片<\/strong><\/p>\n<ol start=\"13\">\n<li>汤保持微沸（水面刚冒小泡，不要大滚），用筷子把鱼片<strong>一片片<\/strong>下进锅里，别一次全倒。<\/li>\n<li>下完别急着搅动，等约 30 秒，看到鱼片<strong>变白、微微打卷<\/strong> → 用漏勺捞出，铺在鱼骨上。鱼片约 1~2 分钟就熟，久煮会散、会老。<\/li>\n<\/ol>\n<p><strong>第 6 步 · 淋热油<\/strong><\/p>\n<ol start=\"15\">\n<li>把煮鱼片的汤倒进碗里（没过大半即可），鱼片上铺剩下的干辣椒段、花椒、蒜末和葱花。<\/li>\n<li>另起锅烧剩下的 2 汤匙油，烧到冒青烟（约 1 分钟）。<\/li>\n<li>趁热「呲啦」浇在辣椒花椒上，激出香味，上桌。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>鱼片散架 / 老<\/strong>：鱼片一下锅就搅、煮太久。记住「变白打卷就捞」，用漏勺轻捞。<\/li>\n<li><strong>腥<\/strong>：黑膜没刮、鱼片没洗到水清。鱼腹黑膜一定刮净，鱼片多抓洗两遍。<\/li>\n<li><strong>不辣不香<\/strong>：豆瓣酱没炒出红油就加水，或最后热油没烧到冒烟。红油炒出来、油要烧热，麻辣香才出得来。<\/li>\n<li><strong>咸了<\/strong>：豆瓣酱本身很咸，盐要少放，汤煮好后先尝一口再决定补不补盐。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://mip.xiachufang.com/recipe/107007525/\">下厨房 · 麻辣鲜香超过瘾 傻瓜版家庭少油水煮鱼<\/a> —— 少油家常版，适合对照「初学版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1Q7h2zLEGd/\">回归?!下饭爆香的水煮鱼到底怎么做!（哔哩哔哩）<\/a> —— 家常全流程，适合对照「初学版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV11C4y1a7B9/\">【留学食光】水煮鱼（哔哩哔哩）<\/a> —— 视频链接由下厨房菜谱页提及，需点开确认<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：上浆顺序 / 刀口辣椒 / 鱼骨吊汤 / 油温）<\/h2>\n<p>在初学版基础上掌握下面四条，成品的香和嫩会上一个台阶。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 鱼片上浆三件套（盐—蛋清—淀粉，顺序不能乱）<\/strong><\/p>\n<ol>\n<li>先用盐 + 料酒 + 白胡椒抓出粘性：盐让鱼片蛋白析出、表面变滑，这是「嫩」的基础。<\/li>\n<li>再下蛋清抓匀，让鱼片裹一层蛋白衣。<\/li>\n<li>最后下淀粉锁水。顺序反了（先淀粉后蛋清）容易脱浆。<\/li>\n<li>淀粉用土豆淀粉或玉米淀粉；上浆后冷藏 10 分钟，煮时更不易脱浆、汤更清。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 刀口辣椒（香气的核心）<\/strong><\/p>\n<ol start=\"5\">\n<li>干辣椒剪成段，与花椒一起放干锅里，小火慢炒约 2 分钟，炒到颜色变深、香气出来（别炒糊）。<\/li>\n<li>盛出晾凉后，用刀剁成粗末。<\/li>\n<li>这就是「刀口辣椒」，比直接撒干辣椒香得多，最后铺在鱼片上再浇油，香味翻倍。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 鱼骨先煎再熬汤<\/strong><\/p>\n<ol start=\"8\">\n<li>鱼骨用油煎到两面微黄，再加热水熬，汤底更浓白、腥味更少；鱼头鱼骨熬出的鲜味是清水比不了的。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 油温判断<\/strong><\/p>\n<ol start=\"9\">\n<li>最后淋油要烧到「冒青烟、油面微微滚动」（约八成热），浇下去能立刻激香；油温不够，香出不来，只剩油腻。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://mbdbj.xiachufang.com/recipe/103014197/\">下厨房 · 水煮鱼（步骤图）<\/a> —— 鱼片上浆与煮鱼片步骤清晰，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「鱼片滑嫩如豆腐、红油亮、麻辣香有层次」。每一步都是细节。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 鱼片厚薄<\/strong><\/p>\n<ol>\n<li>鱼柳斜刀片成约 2~3mm 的「蝴蝶片」（两片连刀，摊开像蝴蝶）。太薄易碎、太厚不熟，这个厚度最能挂浆又易熟。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 微沸养熟，不翻滚<\/strong><\/p>\n<ol start=\"2\">\n<li>下鱼片后汤保持「菊花心」微沸（水面只冒小泡）。<\/li>\n<li>不搅不翻，靠水温把鱼片「养」熟。大火翻滚会把浆冲掉、鱼片冲散，口感差一个档次。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 热油分两次淋<\/strong><\/p>\n<ol start=\"4\">\n<li>第一次先淋在刀口辣椒上，把辣椒的焦香激出来。<\/li>\n<li>第二次沿碗边淋一圈，让麻香味更均匀、红油更亮、颜色更红。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 麻香有层次<\/strong><\/p>\n<ol start=\"6\">\n<li>花椒一半炒香后剁进刀口辣椒，一半最后直接撒。<\/li>\n<li>起锅前可点几滴藤椒油（可选），麻味更持久、更有层次。全程动作快，趁热上桌，凉了锅气就散了。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/91652/\">下厨房 · 水煮鱼<\/a> —— 热油淋香环节，适合对照「大厨版」<\/li>\n<\/ul>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "76", "name": "白灼虾", "title": "白灼虾", "category": "水产海鲜", "ingredient": "虾", "ings": [["活虾", "基围虾", "明虾"], ["姜"], ["小葱"], ["料酒"], ["盐"], ["生抽"], ["香醋"], ["白糖"], ["蒜末"], ["香油"]], "opt": [false, false, false, false, false, false, false, false, false, false], "tags": [], "html": "<h1>白灼虾<\/h1>\n<blockquote>\n<p>归属食材：虾 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>粤菜经典海鲜做法，用最短时间把活虾烫熟，最大程度保留虾的鲜甜和弹嫩，蘸姜葱或豉油吃。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、不难吃）<\/h2>\n<p><strong>食材（2~3 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>活虾（基围虾 / 明虾）<\/td>\n<td>约 500g<\/td>\n<td>一定要活的，冻虾白灼肉质会散<\/td>\n<\/tr>\n<tr>\n<td>姜<\/td>\n<td>1 小块（约 15g）<\/td>\n<td>一半煮虾水用，一半蘸料<\/td>\n<\/tr>\n<tr>\n<td>小葱<\/td>\n<td>2 根<\/td>\n<td>打结煮虾水用<\/td>\n<\/tr>\n<tr>\n<td>料酒<\/td>\n<td>1 汤匙<\/td>\n<td>去腥<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>1 小撮（煮虾水用）<\/td>\n<td>少放，盐多会让虾肉变老<\/td>\n<\/tr>\n<tr>\n<td>生抽<\/td>\n<td>2 汤匙<\/td>\n<td>蘸料<\/td>\n<\/tr>\n<tr>\n<td>香醋<\/td>\n<td>1 小勺<\/td>\n<td>蘸料<\/td>\n<\/tr>\n<tr>\n<td>白糖<\/td>\n<td>1/2 小勺<\/td>\n<td>蘸料提鲜<\/td>\n<\/tr>\n<tr>\n<td>蒜末<\/td>\n<td>1 小勺<\/td>\n<td>蘸料<\/td>\n<\/tr>\n<tr>\n<td>香油<\/td>\n<td>几滴<\/td>\n<td>蘸料<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点，全程约 10 分钟）<\/strong><\/p>\n<p><strong>第 1 步 · 处理虾<\/strong><\/p>\n<ol>\n<li>活虾放清水里冲净，剪去虾须（可省略）。<\/li>\n<li>想更讲究，就用牙签从虾背第二节挑出虾线。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 烧水<\/strong><\/p>\n<ol start=\"3\">\n<li>锅里加足量水（能没过虾），放姜片、葱结、料酒和 1 小撮盐。<\/li>\n<li>大火烧到「大滚」、水面剧烈翻滚。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 灼虾<\/strong><\/p>\n<ol start=\"5\">\n<li>把虾倒进去，用锅铲拨开。<\/li>\n<li>大火煮到虾身完全变红、虾尾弯成「U 形」（中小虾约 40~60 秒，大虾约 1 分钟）→ 立刻捞出。煮太久虾尾会卷成「O 形」，就老了。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 调蘸料<\/strong><\/p>\n<ol start=\"7\">\n<li>小碗放生抽、香醋、白糖、蒜末和香油，搅匀。<\/li>\n<li>虾摆盘，蘸着吃。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>虾肉老、发硬<\/strong>：煮过头。记住「虾身变红、虾尾弯成 U 形」就马上捞，多煮 10 秒口感就掉一档。<\/li>\n<li><strong>虾肉有腥味<\/strong>：用了冻虾，或水里没放姜葱料酒。白灼虾最好用活虾。<\/li>\n<li><strong>肉质发柴<\/strong>：煮虾水里盐放多了。盐会让虾肉收缩变老，水里少放盐或不放。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/103868167/\">下厨房 · 白灼虾的做法<\/a> —— 经典做法，适合对照「初学版」火候<\/li>\n<li><a href=\"https://www.xiachufang.com/recipe/101846327/\">下厨房 · 懒人粤式白灼虾<\/a> —— 家庭快手版，适合对照「初学版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1zL411d71h/\">白灼虾试试这样做，酱汁都舔啦（哔哩哔哩）<\/a> —— 简单易学，适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：水开下锅 / 虾身弯曲即熟 / 火候极短）<\/h2>\n<p>在初学版基础上，掌握下面三条，成品质感会上一个台阶。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 水开下锅——瞬时锁鲜<\/strong><\/p>\n<ol>\n<li>一定要等水「大滚」再下虾。虾一入沸水，表面蛋白质瞬间凝固，把鲜味和水分锁在虾肉里。<\/li>\n<li>冷水或温水下锅，虾肉会慢慢泡熟、鲜味流失。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 虾身弯曲即熟——最直观的火候标尺<\/strong><\/p>\n<ol start=\"3\">\n<li>虾尾弯成「U 形」= 刚好，虾肉紧实弹牙；虾尾卷成「O 形」= 煮过头，肉会老。<\/li>\n<li>中小号虾约 40~60 秒，大号虾不超过 1 分 10 秒。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 捞出后冰镇——更弹牙<\/strong><\/p>\n<ol start=\"5\">\n<li>捞出后立刻投入冰水，泡 3~5 分钟，虾肉遇冷收缩，口感更 Q 弹、虾壳也更好剥。<\/li>\n<li>不冰镇的话，余温会继续把虾肉「烘」老。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/104040356/\">下厨房 · 白灼虾的做法（另一菜谱）<\/a> —— 讲冰镇弹牙，适合对照「进阶版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1Kc411g7C1/\">白灼虾别再用热水煮啦，教你一招，嫩滑有弹性（哔哩哔哩）<\/a> —— 讲水温和蘸料，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「虾肉鲜甜弹牙、虾壳易剥、蘸料提鲜」。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 选虾与处理<\/strong><\/p>\n<ol>\n<li>首选鲜活的基围虾 / 明虾，虾身透明、虾壳有光泽。<\/li>\n<li>剪去虾枪和虾须。<\/li>\n<li>从虾背第二节挑出虾线（虾线是虾的肠，有沙腥味）。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 白灼水的讲究<\/strong><\/p>\n<ol start=\"4\">\n<li>水中放姜、葱、少许盐（或几粒花椒），烧到大滚。<\/li>\n<li>盐只放一点点，用于提底味而非调味；虾肉本身够鲜，主要靠蘸料。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 精准火候<\/strong><\/p>\n<ol start=\"6\">\n<li>水大滚后下虾，大火煮到虾身变红、虾尾弯成 U 形（中小虾约 40 秒，大虾约 1 分钟），立刻捞出。<\/li>\n<li>判断标准：虾头与虾身连接处不松、虾肉紧实，就是刚好。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 蘸料两式<\/strong><\/p>\n<ol start=\"8\">\n<li>姜葱蓉蘸料：姜蓉 + 葱花 + 盐，淋滚油，蘸虾特别鲜。<\/li>\n<li>豉油蘸料：生抽 + 白糖 + 几滴香醋 + 蒜末 / 小米辣 + 香油，冷吃更清爽。<\/li>\n<\/ol>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "77", "name": "辣炒花蛤", "title": "辣炒花蛤", "category": "水产海鲜", "ingredient": "蛤蜊", "ings": [["花蛤"], ["姜"], ["蒜"], ["葱"], ["干辣椒"], ["花椒"], ["郫县豆瓣酱"], ["料酒"], ["生抽"], ["白糖"], ["食用油"]], "opt": [false, false, false, false, false, false, false, false, false, false, false], "tags": [], "html": "<h1>辣炒花蛤<\/h1>\n<blockquote>\n<p>归属食材：蛤蜊 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>夜市下酒招牌菜，麻辣鲜香、肉质滑嫩，一口一个嗦得停不下来。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：吐净沙、肉不柴、味够香）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>花蛤<\/td>\n<td>约 750g（1.5 斤）<\/td>\n<td>挑壳紧闭、吐水的鲜活货<\/td>\n<\/tr>\n<tr>\n<td>姜<\/td>\n<td>4 片<\/td>\n<td>去腥<\/td>\n<\/tr>\n<tr>\n<td>蒜<\/td>\n<td>4 瓣<\/td>\n<td>切末<\/td>\n<\/tr>\n<tr>\n<td>葱<\/td>\n<td>2 段 + 葱花 1 小把<\/td>\n<td>爆香 + 出锅撒<\/td>\n<\/tr>\n<tr>\n<td>干辣椒<\/td>\n<td>6~8 个<\/td>\n<td>剪段<\/td>\n<\/tr>\n<tr>\n<td>花椒<\/td>\n<td>1 小撮<\/td>\n<td>麻味<\/td>\n<\/tr>\n<tr>\n<td>郫县豆瓣酱<\/td>\n<td>1 汤匙<\/td>\n<td>底味<\/td>\n<\/tr>\n<tr>\n<td>料酒<\/td>\n<td>1 汤匙<\/td>\n<td>去腥<\/td>\n<\/tr>\n<tr>\n<td>生抽<\/td>\n<td>1 汤匙<\/td>\n<td>提味<\/td>\n<\/tr>\n<tr>\n<td>白糖<\/td>\n<td>1/2 小勺<\/td>\n<td>提鲜、平衡咸辣<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>2 汤匙<\/td>\n<td>爆炒<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点，全程约 20 分钟，不含吐沙时间）<\/strong><\/p>\n<p><strong>第 1 步 · 吐沙（提前做）<\/strong><\/p>\n<ol>\n<li>花蛤放清水里，加 1 小勺盐、滴几滴香油，放阴凉处静置 <strong>2~3 小时<\/strong>，让它吐沙。<\/li>\n<li>之后用清水反复搓洗、换水 2~3 遍，洗到水清为止。这一步不做，吃进满口沙。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 焯水（可选但推荐）<\/strong><\/p>\n<ol start=\"3\">\n<li>锅里烧开水，下花蛤。<\/li>\n<li>看到<strong>壳一张开<\/strong> → 马上捞出（约 1 分钟），不要久煮。<\/li>\n<li>捞出用清水冲掉残留的沙。张不开壳的、有异味的要挑出丢掉（死蛤蜊不能吃）。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 炒香底料<\/strong><\/p>\n<ol start=\"6\">\n<li>锅烧热倒油，下姜片、蒜末、葱段、干辣椒、花椒，中火炒出香味（约 30 秒）。<\/li>\n<li>下郫县豆瓣酱，炒出红油（约 1 分钟）。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 大火爆炒<\/strong><\/p>\n<ol start=\"8\">\n<li>倒入花蛤，转大火快速翻炒。<\/li>\n<li>加料酒、生抽、白糖，翻匀约 1 分钟，让每只蛤蜊都裹上料汁、全部开口。<\/li>\n<li>撒葱花，立刻关火出锅。<strong>炒久肉就老<\/strong>，开口即可。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>满口沙<\/strong>：没吐沙、没焯水。盐水 + 香油泡 2~3 小时是必须的，再焯水冲一遍更保险。<\/li>\n<li><strong>肉老<\/strong>：焯水太久、爆炒太久。焯水「开口即捞」，爆炒「开口即出锅」。<\/li>\n<li><strong>吃到死蛤蜊<\/strong>：焯水前张不开壳、壳破、有异味的要挑掉；焯水后仍不开口的也丢掉。<\/li>\n<li><strong>太咸<\/strong>：豆瓣酱和生抽都咸，这道菜基本不用再加盐，出锅前尝一口再决定。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://hanwuji.xiachufang.com/recipe/107528826/\">下厨房 · 🌶️鲜香入味，一口爱上的辣炒花蛤🌶️<\/a> —— 步骤图详细，适合对照「初学版」<\/li>\n<li><a href=\"https://www.xiachufang.com/recipe/106416742/printable/\">下厨房 · 辣炒花蛤<\/a> —— 料汁与火候，需点开确认<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1zwjQ6DEuv/\">炒花甲（辣炒花甲！比外边还好吃，自己做巨简单）（哔哩哔哩）<\/a> —— 家常全流程，适合对照「初学版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1uEKHzGECs/\">夏天的快乐 辣炒花蛤 麻辣鲜香嗦到停不下来（哔哩哔哩）<\/a> —— 视频链接来自搜索镜像页，需点开确认<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：吐沙 / 焯水取舍 / 料汁 / 火候）<\/h2>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 吐沙更彻底<\/strong><\/p>\n<ol>\n<li>淡盐水 + 几滴香油能让花蛤边吐边吸；水温接近室温（别用冰水或热水），放阴凉处 2~3 小时。<\/li>\n<li>时间紧就用「温盐水（约 30℃）+ 快速摇晃」催吐，但效果不如静置稳。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 焯水还是不焯水<\/strong><\/p>\n<ol start=\"3\">\n<li><strong>焯水<\/strong>更保险、少沙，适合新手；缺点是会流失一点鲜味。<\/li>\n<li><strong>不焯水<\/strong>直接炒，鲜味更足，但要吐沙彻底、火候更快。建议新手先焯水，熟练后再尝试直接炒。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 料汁提前调好<\/strong><\/p>\n<ol start=\"5\">\n<li>生抽 + 料酒 + 白糖 + 1 小勺清水（可加 1/2 小勺淀粉勾薄芡），先调成碗汁。<\/li>\n<li>爆炒时间短，提前调好才不手忙脚乱，火候才准。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 大火快炒<\/strong><\/p>\n<ol start=\"7\">\n<li>花蛤是快熟食材，全程大火，从下锅到出锅不超过 2~3 分钟，这是嫩度的关键。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"http://www.xiachufang.com/recipe/106389748/printable/\">下厨房 · 辣炒花甲（花蛤）家常版，味道可以媲美饭店<\/a> —— 吐沙 + 爆炒，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「壳壳开口、肉嫩多汁、麻辣香裹满每一只」。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 选鲜活的判断<\/strong><\/p>\n<ol>\n<li>壳紧闭、轻轻一碰会缩、有吐水柱的才是活的。<\/li>\n<li>半开壳不动的，用手轻按不闭合，就是死的，别买。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 干煸辣椒花椒<\/strong><\/p>\n<ol start=\"3\">\n<li>干辣椒、花椒先干锅小火焙一下（约 30 秒）。<\/li>\n<li>焙出焦香，再加油爆，麻辣味更浓、更立体。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 勾薄芡挂汁<\/strong><\/p>\n<ol start=\"5\">\n<li>料汁里加 1/2 小勺淀粉，调成碗汁。<\/li>\n<li>倒入后快速翻锅，让薄芡把麻辣汁均匀挂在每只蛤蜊上，嗦起来更有味。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 出锅前点香油<\/strong><\/p>\n<ol start=\"7\">\n<li>起锅前沿锅边淋几滴香油、撒一大把葱花，颠两下立刻装盘。<\/li>\n<li>全程大火、动作快，锅气才足。<\/li>\n<\/ol>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "78", "name": "清蒸大闸蟹", "title": "清蒸大闸蟹", "category": "水产海鲜", "ingredient": "螃蟹", "ings": [["大闸蟹"], ["姜"], ["葱"], ["料酒"], ["香醋"], ["白糖"], ["生抽"]], "opt": [false, false, false, false, false, false, true], "tags": [], "html": "<h1>清蒸大闸蟹<\/h1>\n<blockquote>\n<p>归属食材：螃蟹 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>秋日时令菜，蟹肉鲜甜、蟹黄丰腴，清蒸最能保留原汁原味，配一碟姜醋汁最地道。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：蒸熟透、不掉脚、蘸料对味）<\/h2>\n<p><strong>食材（2~3 只）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>大闸蟹<\/td>\n<td>2~3 只<\/td>\n<td>一定要鲜活的，死蟹不能吃<\/td>\n<\/tr>\n<tr>\n<td>姜<\/td>\n<td>5 片 + 姜末 1 小碟<\/td>\n<td>片去腥、末调蘸料<\/td>\n<\/tr>\n<tr>\n<td>葱<\/td>\n<td>2 段<\/td>\n<td>去腥<\/td>\n<\/tr>\n<tr>\n<td>料酒<\/td>\n<td>1 汤匙<\/td>\n<td>加进蒸锅水去腥<\/td>\n<\/tr>\n<tr>\n<td>香醋<\/td>\n<td>3 汤匙<\/td>\n<td>蘸料主角<\/td>\n<\/tr>\n<tr>\n<td>白糖<\/td>\n<td>1 小勺（约 5g）<\/td>\n<td>蘸料提鲜<\/td>\n<\/tr>\n<tr>\n<td>生抽<\/td>\n<td>1 小勺（可选）<\/td>\n<td>蘸料增味<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点，全程约 20 分钟）<\/strong><\/p>\n<p><strong>第 1 步 · 清洗<\/strong><\/p>\n<ol>\n<li>大闸蟹<strong>不要解开绑绳<\/strong>（解开会乱爬、蒸时掉脚）。<\/li>\n<li>用刷子在流水下把蟹壳、蟹腿、腹部、蟹钳缝刷干净，尤其是腹部绒毛处。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 备锅<\/strong><\/p>\n<ol start=\"3\">\n<li>蒸锅里加冷水，水里放姜片、葱段、料酒。<\/li>\n<li>大火烧开，让蒸汽先带上姜葱味。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 蒸制<\/strong><\/p>\n<ol start=\"5\">\n<li>水开上汽后，把蟹<strong>肚皮朝上<\/strong>（蟹壳朝下）摆进蒸屉，每只蟹身上再放 1 片姜。<\/li>\n<li>盖上锅盖，<strong>大火蒸 12~15 分钟<\/strong>（2~3 两的蟹 12 分钟，更大的 15 分钟，宁可多蒸不夹生）。<\/li>\n<li>蒸到蟹壳通红、凑近能闻到蟹香 → 熟透。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 调蘸料<\/strong><\/p>\n<ol start=\"8\">\n<li>蒸蟹时调姜醋汁——姜末放小碗里，加香醋、白糖、可加 1 小勺生抽，搅匀（姜末越细越好，汁微甜微酸，解蟹的寒、去腥提鲜）。<\/li>\n<li>蟹出锅，解开绳子蘸姜醋吃。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>没熟透<\/strong>：蒸的时间不够。大闸蟹一定要<strong>彻底蒸熟<\/strong>（蟹壳通红、蟹肉不透明），夹生的淡水蟹有寄生虫风险。<\/li>\n<li><strong>掉脚 / 流黄<\/strong>：蟹解开了绳子蒸、或肚皮朝下。保持绑绳、<strong>肚皮朝上<\/strong>，腿不掉、蟹黄不流失。<\/li>\n<li><strong>用了死蟹<\/strong>：死蟹会产生有害物质，坚决不能吃。买蟹时看眼睛会动、吐泡、腿有力的才鲜活；下锅前死了的要丢掉。<\/li>\n<li><strong>蘸料太酸<\/strong>：醋太多。香醋为主、白糖来平衡，先按 3 汤匙醋 + 1 小勺糖调，尝了再微调。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://m.douguo.com/recipe/amp/3215828.html\">豆果美食 · 立秋菜谱｜清蒸大闸蟹让我沉迷于秋日<\/a> —— 步骤详细，适合对照「初学版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1Sh4y1678P/\">清蒸大闸蟹原汁原味蟹肥肉美（哔哩哔哩）<\/a> —— 绑绳蒸防掉脚、配姜茶食用，适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：肚皮朝上 / 紫苏去腥 / 蒸制时间 / 吃蟹顺序）<\/h2>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 肚皮朝上的原理<\/strong><\/p>\n<ol>\n<li>肚皮朝上蒸，蟹黄、蟹汁被蟹壳兜住不会流到水里，蟹黄更完整饱满。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 紫苏叶去腥驱寒<\/strong><\/p>\n<ol start=\"2\">\n<li>蟹性寒凉，蒸时每只蟹肚上放 1 片<strong>紫苏叶<\/strong>（药店或菜场有卖），去腥又驱寒。<\/li>\n<li>没有紫苏，就多放姜片。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 蒸制时间按重量定<\/strong><\/p>\n<ol start=\"4\">\n<li>2 两左右：大火 10~12 分钟；2.5~3 两：12~15 分钟；3.5 两以上：15~18 分钟。<\/li>\n<li>从<strong>水开上汽后<\/strong>开始计时，不是从点火算。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 姜醋汁升级<\/strong><\/p>\n<ol start=\"6\">\n<li>姜末 + 香醋 + 白糖 + 少量生抽是基础。<\/li>\n<li>喜欢更香可加几滴黄酒、几滴香油，或加一点点蒜末。糖量以「微微回甘」为准。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://mbdbj.xiachufang.com/recipe/105951663/\">下厨房 · 随性清蒸大闸蟹<\/a> —— 蒸制时间与蘸料，适合对照「进阶版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1p6nA6NEQp/\">清蒸大闸蟹全流程，误区一次讲清（哔哩哔哩）<\/a> —— 水开上汽、肚皮朝上等要点，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「蟹肉细嫩不柴、蟹黄凝固不散、蘸料酸香平衡」。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 冷水下锅 vs 开水下锅<\/strong><\/p>\n<ol>\n<li>家庭做法一般<strong>水开上汽后再放蟹<\/strong>，受热快、肉更嫩；但有些师傅主张<strong>冷水下锅慢慢升温<\/strong>，蟹不易掉腿。<\/li>\n<li>两种都行，关键是蟹肚皮朝上、全程大火、盖严锅盖。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 关火即取，不焖<\/strong><\/p>\n<ol start=\"3\">\n<li>蒸到点就开盖取出，<strong>不要关火焖<\/strong>，焖久了蟹肉会老、会出水。<\/li>\n<li>取出后趁热吃最鲜。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 吃蟹顺序<\/strong><\/p>\n<ol start=\"5\">\n<li>先吃蟹腿蟹钳，再揭盖吃蟹黄，最后吃蟹身肉。<\/li>\n<li><strong>蟹胃、蟹鳃、蟹心、蟹肠四样一定要去掉<\/strong>（蟹心在蟹身中央白色六角形片状物，性最寒），不能吃。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 姜醋汁现调现用<\/strong><\/p>\n<ol start=\"7\">\n<li>姜要现剁成细末，越细越出味。<\/li>\n<li>醋用香醋（或镇江香醋），酸香比陈醋柔和。<\/li>\n<li>调好静置几分钟，姜味渗进醋里再用，风味更足。<\/li>\n<\/ol>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "79", "name": "爆炒鱿鱼", "title": "爆炒鱿鱼", "category": "水产海鲜", "ingredient": "鱿鱼", "ings": [["鲜鱿鱼"], ["青椒"], ["红椒"], ["洋葱"], ["姜"], ["蒜"], ["干辣椒"], ["料酒"], ["生抽"], ["蚝油"], ["白糖"], ["食用油"]], "opt": [false, false, false, false, false, false, true, false, false, false, false, false], "tags": [], "html": "<h1>爆炒鱿鱼<\/h1>\n<blockquote>\n<p>归属食材：鱿鱼 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>下饭快炒菜，鱿鱼爽脆弹牙、咸香微辣，配青红椒洋葱一锅出。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：不腥、不硬、入味）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>鲜鱿鱼<\/td>\n<td>2 条（约 400g）<\/td>\n<td>也可用鱿鱼须、鱿鱼圈<\/td>\n<\/tr>\n<tr>\n<td>青椒、红椒<\/td>\n<td>各 1 个<\/td>\n<td>配色增香<\/td>\n<\/tr>\n<tr>\n<td>洋葱<\/td>\n<td>1/2 个<\/td>\n<td>提甜味<\/td>\n<\/tr>\n<tr>\n<td>姜<\/td>\n<td>4 片<\/td>\n<td>去腥<\/td>\n<\/tr>\n<tr>\n<td>蒜<\/td>\n<td>3 瓣<\/td>\n<td>切片<\/td>\n<\/tr>\n<tr>\n<td>干辣椒<\/td>\n<td>3~4 个（可选）<\/td>\n<td>提辣<\/td>\n<\/tr>\n<tr>\n<td>料酒<\/td>\n<td>1 汤匙<\/td>\n<td>焯水 + 炒时去腥<\/td>\n<\/tr>\n<tr>\n<td>生抽<\/td>\n<td>1 汤匙<\/td>\n<td>咸味<\/td>\n<\/tr>\n<tr>\n<td>蚝油<\/td>\n<td>1 汤匙<\/td>\n<td>提鲜<\/td>\n<\/tr>\n<tr>\n<td>白糖<\/td>\n<td>1/2 小勺<\/td>\n<td>提鲜平衡<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>2 汤匙<\/td>\n<td>爆炒<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点，全程约 15 分钟）<\/strong><\/p>\n<p><strong>第 1 步 · 处理鱿鱼<\/strong><\/p>\n<ol>\n<li>鱿鱼去掉内脏、眼睛和中间透明的<strong>软骨<\/strong>。<\/li>\n<li>把表面那层<strong>紫黑色外膜撕掉<\/strong>（这层膜腥味重、炒出来发黑），冲洗干净。<\/li>\n<li>鱿鱼身切成圈或条，鱿鱼须切成段。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 焯水去腥<\/strong><\/p>\n<ol start=\"4\">\n<li>锅里烧开水，加姜 2 片、1/2 汤匙料酒。<\/li>\n<li>下鱿鱼焯约 30 秒，看到鱿鱼<strong>卷起、变白<\/strong> → 马上捞出，用凉水冲一下沥干。<strong>千万别久焯<\/strong>，一久就硬。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 爆香配菜<\/strong><\/p>\n<ol start=\"6\">\n<li>锅烧热倒油，下姜片、蒜片、干辣椒爆香（约 30 秒）。<\/li>\n<li>下洋葱、青红椒，大火翻炒约 1 分钟，炒到配菜半熟、颜色发亮。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 大火爆炒<\/strong><\/p>\n<ol start=\"8\">\n<li>倒回焯好的鱿鱼，转最大火。<\/li>\n<li>加料酒、生抽、蚝油、白糖，快速翻炒约 1 分钟，让调料裹匀、香气出来 → 关火出锅。全程火大、手快，炒久鱿鱼就老。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>又硬又腥<\/strong>：外膜没撕、焯水太久、炒太久。膜撕掉、焯 30 秒、爆炒 1 分钟，是嫩的三个关键。<\/li>\n<li><strong>出很多水<\/strong>：鱿鱼没沥干、火不够大。焯水后沥干水，全程大火，配菜别炒太久。<\/li>\n<li><strong>没味<\/strong>：没提前切好料、炒得慌乱。生抽、蚝油有咸味，一般不用再放盐，出锅前尝一口。<\/li>\n<li><strong>粘锅<\/strong>：锅没烧热就下料。先热锅再放油、油热再下料。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/100585926/printable/\">下厨房 · 爆炒鱿鱼（做法一）<\/a> —— 基础家常版，适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：撕膜 / 焯水时机 / 花刀 / 大火快炒）<\/h2>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 撕膜要趁生<\/strong><\/p>\n<ol>\n<li>鱿鱼表面的紫黑色外膜，生的时侯从边缘一揭就整片撕下；焯过水就难撕了。<\/li>\n<li>膜撕得越干净，颜色越白、腥味越少。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 焯水「卷起即捞」<\/strong><\/p>\n<ol start=\"3\">\n<li>水大开再下锅，加姜片料酒去腥。<\/li>\n<li>下锅约 30 秒、看到鱿鱼一卷 → 就捞，过一遍凉水能让口感更脆。焯水目的只是断生去腥，不是煮熟。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 打花刀（麦穗刀）<\/strong><\/p>\n<ol start=\"5\">\n<li>鱿鱼身内侧朝上，斜刀划出交叉纹路（不切断，深度约 2/3），再切成块，焯水后会卷成漂亮的「麦穗卷」，更好看也更挂味。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 全程大火、先炒配菜后下鱿鱼<\/strong><\/p>\n<ol start=\"6\">\n<li>配菜先炒到八分熟再下鱿鱼，避免配菜夹生而鱿鱼炒老。<\/li>\n<li>鱿鱼下锅后 1 分钟内必须出锅。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/107466002/printable/\">下厨房 · 爆炒鱿鱼（做法二）<\/a> —— 撕膜与焯水细节，适合对照「进阶版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV13dtG6hEyY/\">色香味俱全！大排档风味爆炒鲜鱿，超下饭！（哔哩哔哩）<\/a> —— 先焯水再煎香，爽脆弹牙，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「鱿鱼爽脆弹牙、配菜脆嫩、锅气足、酱香亮」。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 冰水过凉更脆<\/strong><\/p>\n<ol>\n<li>焯水后立刻泡进冰水（或流动冷水）激一下，鱿鱼收缩得更紧实，口感更爽脆。这一步是饭店爽脆的关键。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 铁锅烧到冒烟再下油<\/strong><\/p>\n<ol start=\"2\">\n<li>铁锅烧到微微冒青烟，再下油滑锅。<\/li>\n<li>油热后爆香——高温让鱿鱼下锅瞬间锁住水分，才有「锅气」。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 碗汁一次淋入<\/strong><\/p>\n<ol start=\"4\">\n<li>生抽 + 蚝油 + 白糖 + 1/2 小勺淀粉 + 2 汤匙水，提前调成碗汁。<\/li>\n<li>鱿鱼下锅后沿锅边一次淋入，快速颠锅，酱汁瞬间挂满、亮而不水。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 起锅前点香油<\/strong><\/p>\n<ol start=\"6\">\n<li>起锅前沿锅边淋几滴香油、撒葱花，颠两下立刻装盘。<\/li>\n<li>喜辣可加豆瓣酱或小米辣同炒；全程约 1 分钟完成，动作越快越好吃。<\/li>\n<\/ol>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "80", "name": "清蒸鲈鱼", "title": "清蒸鲈鱼", "category": "水产海鲜", "ingredient": "鲈鱼", "ings": [["鲈鱼"], ["姜"], ["小葱"], ["料酒"], ["盐"], ["蒸鱼豉油", "生抽"], ["食用油"]], "opt": [false, false, false, false, false, false, false], "tags": [], "html": "<h1>清蒸鲈鱼<\/h1>\n<blockquote>\n<p>归属食材：鲈鱼 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>清蒸鲈鱼鲜嫩清淡，最能吃到鱼的本味，也是练习「火候」的一道入门菜。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、不难吃）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>鲈鱼<\/td>\n<td>1 条（约 600g，去鳞去内脏后）<\/td>\n<td>选鲜活的，眼睛亮、鳃红、肉有弹性<\/td>\n<\/tr>\n<tr>\n<td>姜<\/td>\n<td>1 块（约 20g）<\/td>\n<td>一半切丝、一半切片<\/td>\n<\/tr>\n<tr>\n<td>小葱<\/td>\n<td>3~4 根<\/td>\n<td>一部分切段垫底，一部分切丝装饰<\/td>\n<\/tr>\n<tr>\n<td>料酒<\/td>\n<td>1 汤匙（约 15ml）<\/td>\n<td>去腥<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>约 1/2 小勺（2g）<\/td>\n<td>抹鱼身，别多<\/td>\n<\/tr>\n<tr>\n<td>蒸鱼豉油（或生抽）<\/td>\n<td>2 汤匙（约 30ml）<\/td>\n<td>出锅后淋<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>2 汤匙（约 20ml）<\/td>\n<td>最后烧热泼香<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 处理鱼<\/strong><\/p>\n<ol>\n<li>买来的鲈鱼再检查一遍，刮掉残留的鳞、去掉内脏和鱼鳃。<\/li>\n<li>鱼肚里的黑膜要刮干净（黑膜是腥味主要来源）。<\/li>\n<li>用清水冲洗后，用厨房纸把鱼身里外擦干。<\/li>\n<li>两面各斜划 2~3 刀（刀口深约 1cm），方便入味、受热均匀。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 腌制去腥<\/strong><\/p>\n<ol start=\"5\">\n<li>鱼身两面和刀口里抹一点点盐（约 2g）。<\/li>\n<li>再淋 1 汤匙料酒，鱼肚里塞几片姜和几根葱段。<\/li>\n<li>静置腌 10 分钟。盐别多、别腌太久，否则鱼肉出水会变柴。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 摆盘上锅<\/strong><\/p>\n<ol start=\"8\">\n<li>蒸盘底部垫几片姜和葱段（把鱼身架空，蒸汽能流通），再把鱼放上去。<\/li>\n<li>蒸锅里的水要先烧开，水开后把鱼放进去。<\/li>\n<li>盖盖大火蒸 8 分钟（约 600g 的鱼），到点后关火再焖 2 分钟。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 倒掉汤汁<\/strong><\/p>\n<ol start=\"11\">\n<li>出锅后，把盘子里蒸出来的汤汁倒掉（这汤腥味重），再把鱼身上已经蒸蔫的姜葱拣掉。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 淋油上桌<\/strong><\/p>\n<ol start=\"12\">\n<li>在鱼身上重新铺上新鲜的葱丝、姜丝，淋 2 汤匙蒸鱼豉油。<\/li>\n<li>另起小锅把 2 汤匙油烧到微微冒烟（手放在锅上方明显感到热）。<\/li>\n<li>趁热均匀泼在葱姜丝上，「滋啦」一声激出香味，即可上桌。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>蒸老了<\/strong>：蒸的时间太长，或鱼太大没按比例加时。记住「水开后下锅、全程大火、1 斤鱼约 8 分钟」，到点关火再焖 2 分钟就够。<\/li>\n<li><strong>腥味重<\/strong>：没倒掉蒸出来的汤汁，或鱼肚黑膜没刮干净。这两处是去腥关键。<\/li>\n<li><strong>鱼肉粘盘、受热不均<\/strong>：盘底没垫葱姜，鱼身贴着盘子。垫几片姜葱把鱼架起来。<\/li>\n<li><strong>没味道<\/strong>：豉油淋得不够或没淋在鱼身上。豉油要顺着鱼身淋一圈，热油要泼在葱姜丝上激香。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/106398609/\">下厨房 · 【馋嘴的喵】一定成功的清蒸鲈鱼<\/a> —— 强调大火蒸与摆盘，适合对照「初学版」的火候与淋油（需点开确认）<\/li>\n<li><a href=\"http://mwx.douguo.com/cookbook/1196082.html\">豆果美食 · 餐桌上必不可少的一道家常菜——清蒸鲈鱼<\/a> —— 用量清楚、步骤细，适合对照「初学版」比例（需点开确认）<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：去腥 / 火候 / 判断熟度）<\/h2>\n<p>在初学版基础上，掌握下面四条，成品的鲜嫩和卖相会上一个台阶。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 去腥（葱姜料酒之外的三件事）<\/strong><\/p>\n<ol>\n<li>鱼肚黑膜、脊骨两侧的血块要刮干净、冲干净，这是腥味最大来源，比放多少料酒都管用。<\/li>\n<li>腌鱼时盐和料酒别一起久泡：盐会逼出鱼肉水分，让肉质发紧。正确做法是「少盐、短腌」，甚至干脆不用盐腌，靠出锅后的豉油调味。<\/li>\n<li>蒸完的汤汁一定倒掉，同时把蒸过的姜葱也换掉，重新铺新的葱丝姜丝，腥味就去得干净。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 火候（蒸几分钟最嫩）<\/strong><\/p>\n<ol start=\"4\">\n<li>原则：水开后下锅、全程大火、蒸汽要足。水没开就放鱼，等于低温慢煮，肉会发柴。<\/li>\n<li>时间按鱼的大小算：约 500g 蒸 7~8 分钟，600g 蒸 8 分钟，750g 蒸 9~10 分钟，关火后再焖 2 分钟让余温把内部焐熟。宁短勿长——蒸过头肉就老了。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 判断熟度（三看一戳）<\/strong><\/p>\n<ol start=\"6\">\n<li>看眼睛：蒸熟的鱼眼会凸出、发白，生鱼眼是凹陷、透亮的。<\/li>\n<li>看鱼鳍：鱼背上的鳍能轻松拔下来，说明熟了。<\/li>\n<li>戳鱼背：用筷子戳最厚处，能顺利插进去、拔出来不带血水，就是刚好。<\/li>\n<li>看肉色：熟鱼肉由半透明变白、呈层层分明的蒜瓣状。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 提味<\/strong><\/p>\n<ol start=\"10\">\n<li>出锅后先倒掉汤汁再淋豉油；用「蒸鱼豉油」比普通生抽更鲜甜，更配清蒸。<\/li>\n<li>热油里可加几粒花椒或一片姜，炸香后把料捞出再泼油，香气更足（可选）。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.douguo.com/cookbook/3219815.html\">豆果美食 · 清蒸鲈鱼（鲜香细嫩）教你小窍门<\/a> —— 讲去腥小窍门，适合对照「进阶版」的去腥与火候（需点开确认）<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1KY41187rM/\">清蒸鲈鱼，切记不要放盐和料酒，教你正确做法（哔哩哔哩）<\/a> —— 主张不腌直接蒸，适合对照「进阶版」做对比（需点开确认）<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「肉嫩蒜瓣、豉汁鲜甜、热油激香」。每一步都是细节。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 选鱼与刀工<\/strong><\/p>\n<ol>\n<li>选 500~750g 的鲜活鲈鱼，现杀现做最佳；杀好的鱼从鱼鳃处和鱼尾各开一刀放血冲净，肉更白净不腥。<\/li>\n<li>鱼身两面各剞一字花刀，刀距约 2cm、深到见骨，蒸的时候鱼肉沿刀口「开花」，受热更快更均匀。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 豉油汁（清蒸鱼的点睛之笔）<\/strong><\/p>\n<ol start=\"3\">\n<li>不直接淋瓶装豉油，而是调一锅「蒸鱼豉油汁」：小锅放 2 汤匙蒸鱼豉油 + 1 汤匙清水 + 1 小勺白糖 + 几片姜、几段葱白，小火煮到微开、糖化，滤掉渣。这锅汁鲜甜回甘、不齁咸，是酒店清蒸鱼「鲜」的来源。<\/li>\n<li>汁要从盘子侧面倒，不直接浇在鱼身上，避免把葱丝冲乱、影响卖相。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 泼油（锅气）<\/strong><\/p>\n<ol start=\"5\">\n<li>最后一步用花生油或色拉油烧到七八成热（油面明显冒青烟、微微波动），趁热泼在葱丝姜丝上，瞬间把葱姜香气「炸」出来，这就是清蒸鱼的锅气。<\/li>\n<li>油温不够，葱姜不香；油温过高，葱丝焦苦。判断方法：油里丢一粒干花椒，能快速炸香且不焦就是合适温度。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 摆盘<\/strong><\/p>\n<ol start=\"7\">\n<li>葱丝、姜丝、红椒丝切得极细，提前泡进凉水会自然卷曲，铺在鱼身上更有卖相。<\/li>\n<li>鱼眼处放一颗枸杞或小段红椒点缀，成品红、绿、白层次分明。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.bilibili.com/video/BV1mBXVBEExu/\">清蒸鲈鱼别再直接上锅蒸！酒店大厨教你一招，鲜到离谱（哔哩哔哩）<\/a> —— 大厨技巧，适合对照「大厨版」的火候与去腥（需点开确认）<\/li>\n<\/ul>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "81", "name": "鲫鱼豆腐汤", "title": "鲫鱼豆腐汤", "category": "水产海鲜", "ingredient": "鲫鱼", "ings": [["鲫鱼"], ["嫩豆腐"], ["姜"], ["葱"], ["料酒"], ["盐"], ["白胡椒粉"], ["食用油"], ["开水"]], "opt": [false, false, false, false, false, false, false, false, false], "tags": [], "html": "<h1>鲫鱼豆腐汤<\/h1>\n<blockquote>\n<p>归属食材：鲫鱼 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>家常滋补汤，汤色奶白、味道鲜甜，豆腐吸饱鱼鲜。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：汤白、不腥、鱼肉熟透）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>鲫鱼<\/td>\n<td>1 条（约 400g）<\/td>\n<td>请摊主去鳞、去鳃、去内脏<\/td>\n<\/tr>\n<tr>\n<td>嫩豆腐<\/td>\n<td>1 盒（约 300g）<\/td>\n<td>切约 2cm 方块<\/td>\n<\/tr>\n<tr>\n<td>姜<\/td>\n<td>5 片<\/td>\n<td>去腥<\/td>\n<\/tr>\n<tr>\n<td>葱<\/td>\n<td>2 段 + 葱花 1 小把<\/td>\n<td>葱段炖汤、葱花出锅撒<\/td>\n<\/tr>\n<tr>\n<td>料酒<\/td>\n<td>1 汤匙<\/td>\n<td>去腥<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>约 1 小勺（5g）<\/td>\n<td>出锅前放<\/td>\n<\/tr>\n<tr>\n<td>白胡椒粉<\/td>\n<td>1/4 小勺<\/td>\n<td>提鲜去腥<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>2 汤匙<\/td>\n<td>煎鱼<\/td>\n<\/tr>\n<tr>\n<td>开水<\/td>\n<td>约 1000ml<\/td>\n<td>必须用开水，汤才白<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点，全程约 30 分钟）<\/strong><\/p>\n<p><strong>第 1 步 · 处理鱼<\/strong><\/p>\n<ol>\n<li>鲫鱼里外冲洗干净，重点把<strong>鱼腹内的黑膜刮净<\/strong>、把<strong>鱼鳃里的血块抠净<\/strong>（这两处最腥）。<\/li>\n<li>用厨房纸把鱼身和鱼腹的水<strong>彻底擦干<\/strong>（水不擦干下锅会粘皮、爆油）。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 煎鱼<\/strong><\/p>\n<ol start=\"3\">\n<li>锅烧热，倒 2 汤匙油，转一圈让油润满锅底。<\/li>\n<li>把鱼沿锅边轻轻滑入，<strong>先别翻动<\/strong>，中小火煎约 2 分钟。<\/li>\n<li>看到鱼身边缘发黄、能轻轻晃动 → 翻面，再煎约 2 分钟，煎到两面金黄（鱼皮破了也没关系，不影响汤）。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 加开水煮白<\/strong><\/p>\n<ol start=\"6\">\n<li>鱼煎好后，趁热沿锅边倒入开水（约 1000ml），水量一次加够。<\/li>\n<li>下姜片、葱段、料酒，转大火，保持汤翻滚煮约 10 分钟，看到汤色慢慢变奶白。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 下豆腐<\/strong><\/p>\n<ol start=\"8\">\n<li>汤变白后放入豆腐块，转中小火再炖 10 分钟，让豆腐吸味、鱼肉彻底熟透（用筷子扎鱼背最厚处，<strong>能轻松扎透<\/strong> → 熟透）。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 调味出锅<\/strong><\/p>\n<ol start=\"9\">\n<li>关火前放盐、白胡椒粉，尝一口咸淡，撒葱花即可。盐一定最后放，早放会压鲜味。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>汤不白<\/strong>：煎鱼时间太短、或加的是冷水。鱼要煎到两面金黄，<strong>加开水 + 大火滚<\/strong>，汤自然白。<\/li>\n<li><strong>腥<\/strong>：黑膜、鱼鳃血块没弄干净，或煎鱼不够。这两处弄净，腥味去掉一大半。<\/li>\n<li><strong>粘锅破皮<\/strong>：鱼身没擦干、一下锅就翻。擦干水、煎够时间再翻。<\/li>\n<li><strong>鱼肉没熟<\/strong>：淡水鱼一定要做熟（防寄生虫）。用筷子扎鱼背最厚处，能轻松扎透才是熟透了，别只看汤色。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/106987988/printable/\">下厨房 · 零基础鲫鱼豆腐汤<\/a> —— 步骤简单，适合对照「初学版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1e34y1x7uo/\">清炖鱼，鲫鱼汤，鲫鱼豆腐汤（哔哩哔哩）<\/a> —— 东北风味清炖做法，需点开确认<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：去腥 / 煎鱼防粘 / 汤白原理 / 豆腐处理）<\/h2>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 去腥三件事做满<\/strong><\/p>\n<ol>\n<li>黑膜刮净、鱼鳃血块抠净、鱼身两面斜划两刀（便于入味）。<\/li>\n<li>煎鱼前可用姜片擦一遍锅底再倒油，进一步防粘；也可提前用料酒 + 姜片抹鱼身腌 10 分钟。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 煎鱼防粘（热锅冷油 + 不动）<\/strong><\/p>\n<ol start=\"3\">\n<li>「热锅冷油」：锅烧到微微冒烟再倒油，油热后下鱼。<\/li>\n<li>下锅后<strong>忍住别翻<\/strong>，等底面定型、边缘发黄再翻，就不会粘烂。<\/li>\n<li>鱼身务必擦干，一点水都不能有。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 汤白的原理<\/strong><\/p>\n<ol start=\"6\">\n<li>鱼里的蛋白质和脂肪在<strong>大火翻滚 + 开水<\/strong>下乳化，就变成奶白色。所以「开水 + 大火」缺一不可，小火慢炖反而清。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 豆腐去豆腥（可选）<\/strong><\/p>\n<ol start=\"7\">\n<li>豆腐切块后放淡盐水里泡 5 分钟，或用开水烫 1 分钟，能去豆腥、炖时不易碎。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://mbdbj.xiachufang.com/recipe/104323425/\">下厨房 · 高颜值超好喝的鲫鱼豆腐汤<\/a> —— 汤白技巧，适合对照「进阶版」<\/li>\n<li><a href=\"https://mip.xiachufang.com/recipe/103698779/\">下厨房 · 超简单鲫鱼豆腐汤<\/a> —— 煎鱼防粘细节，适合对照「进阶版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1P7VbzrECs/\">汤色洁白的鲫鱼豆腐汤，巨鲜美巨好吃（哔哩哔哩）<\/a> —— 不加牛奶炖奶白汤，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「汤色奶白如牛奶、鲜而不腥、鱼完整不散」。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 猪油煎鱼，鲜味更厚<\/strong><\/p>\n<ol>\n<li>用一半猪油 + 一半素油煎鱼，猪油的香能压腥、提鲜，汤更醇厚。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 全程大火，中途不加水<\/strong><\/p>\n<ol start=\"2\">\n<li>加开水后保持大火滚 10~15 分钟，中间不要加水、不要频繁翻动鱼（翻多了鱼会散、汤会浑）。水量一次加够。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 撇浮沫<\/strong><\/p>\n<ol start=\"3\">\n<li>大火滚的初期会浮起一层白沫，用勺轻轻撇掉，汤更清、更鲜。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 出锅调味<\/strong><\/p>\n<ol start=\"4\">\n<li>盐和白胡椒最后放；可加几粒枸杞增色（可选）。<\/li>\n<li>点几滴香油、撒葱花即上桌。趁热喝，凉了鲜味会散。<\/li>\n<\/ol>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "82", "name": "凉拌腐竹", "title": "凉拌腐竹", "category": "豆制品", "ingredient": "腐竹", "ings": [["干腐竹"], ["黄瓜"], ["蒜"], ["生抽"], ["香醋"], ["白糖"], ["香油"], ["辣椒油"], ["盐"]], "opt": [false, false, false, false, false, false, false, true, false], "tags": [], "html": "<h1>凉拌腐竹<\/h1>\n<blockquote>\n<p>归属食材：腐竹 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>腐竹吸满酸辣料汁，配黄瓜、木耳脆爽开胃，是一道零油烟、怎么拌都好吃的凉菜。关键是泡发和「攥干水」，让腐竹吃味又柔韧。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能泡软、拌入味）<\/h2>\n<p><strong>食材（2~3 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>干腐竹<\/td>\n<td>3~4 根（约 60g）<\/td>\n<td>泡发后会膨胀，别抓太多<\/td>\n<\/tr>\n<tr>\n<td>黄瓜<\/td>\n<td>1 根<\/td>\n<td>拍碎或切丝，解腻<\/td>\n<\/tr>\n<tr>\n<td>蒜<\/td>\n<td>3 瓣<\/td>\n<td>切末，凉拌的灵魂<\/td>\n<\/tr>\n<tr>\n<td>生抽<\/td>\n<td>2 汤匙<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>香醋<\/td>\n<td>1 汤匙<\/td>\n<td>或陈醋<\/td>\n<\/tr>\n<tr>\n<td>白糖<\/td>\n<td>1 小勺<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>香油<\/td>\n<td>1 小勺<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>辣椒油<\/td>\n<td>1 小勺（可选）<\/td>\n<td>不吃辣可不放<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>少许<\/td>\n<td>最后补味<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 泡发<\/strong><\/p>\n<ol>\n<li>干腐竹掰成小段，放进温水（约 40℃，不烫手）里泡 1~2 小时。<\/li>\n<li>泡到没有硬芯、捏起来里外都软 → 泡好。着急用可以换几次温水，缩短时间。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 焯水<\/strong><\/p>\n<ol start=\"3\">\n<li>锅里烧开水，下泡好的腐竹煮约 1 分钟（泡透的煮短一点）。<\/li>\n<li>捞出立刻过凉水。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 攥干水（关键）<\/strong><\/p>\n<ol start=\"5\">\n<li>把腐竹捞出来，用手轻轻攥掉多余水分——水分不攥干，料汁会被稀释、味道进不去。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 配菜<\/strong><\/p>\n<ol start=\"6\">\n<li>黄瓜拍一下再切段，蒜切末。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 调汁<\/strong><\/p>\n<ol start=\"7\">\n<li>小碗里放蒜末、生抽、香醋、白糖、香油、辣椒油，搅到糖化开。<\/li>\n<\/ol>\n<p><strong>第 6 步 · 拌匀<\/strong><\/p>\n<ol start=\"8\">\n<li>腐竹、黄瓜放进大碗，倒料汁，翻拌均匀。<\/li>\n<li>腌 5 分钟再吃，更入味。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>腐竹有硬芯<\/strong>：泡的时间不够或用冷水硬泡。用温水泡 1~2 小时，掰断看中间没有白心才算好。<\/li>\n<li><strong>味道淡 / 水汪汪<\/strong>：没攥干水。焯水后一定要攥掉多余水分再拌。<\/li>\n<li><strong>腐竹煮烂没嚼劲<\/strong>：焯太久。泡透的腐竹煮 1 分钟就够，捞出过凉水保持柔韧。<\/li>\n<li><strong>蒜味太冲<\/strong>：蒜末可先拌进去腌一会儿，或怕冲就减量、多放香油。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"http://m-pr.douguo.com/cookbook/3315038.html\">豆果美食 · 凉拌腐竹（四毛家的小窝）<\/a> —— 用量精确，强调攥干水，适合对照「初学版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1CCRZB6EnJ/\">凉拌腐竹（简单版本，一包吃三顿）（哔哩哔哩）<\/a> —— 适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：泡发 / 焯水 / 料汁 / 配菜）<\/h2>\n<p>在初学版基础上，掌握下面四条，成品质感会上一个台阶。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 泡发三法<\/strong><\/p>\n<ol>\n<li>时间充裕用冷水泡 3~4 小时（口感最柔韧）。<\/li>\n<li>赶时间用温水 40℃ 加少许盐泡 1~2 小时。<\/li>\n<li>千万别用开水，外面烂了里面还是硬的。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 焯水时间<\/strong><\/p>\n<ol start=\"4\">\n<li>冷水泡的腐竹焯 30~60 秒；温水泡的焯 10~30 秒即可。<\/li>\n<li>焯完立刻过凉水，口感更筋道。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 料汁的层次<\/strong><\/p>\n<ol start=\"6\">\n<li>生抽 2 + 香醋 1 + 糖 1 小勺是基础酸甜底。<\/li>\n<li>想香就加一勺热油泼过的蒜末（蒜末 + 白芝麻 + 辣椒面，淋热油激香），这是凉拌菜提香的核心。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 配菜<\/strong><\/p>\n<ol start=\"8\">\n<li>木耳、胡萝卜丝提前焯熟，和黄瓜一起拌，颜色和口感都更丰富。<\/li>\n<li>熟花生米最后撒，保持酥脆。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"http://mwx.douguo.com/cookbook/2303091.html\">豆果美食 · 凉拌腐竹（薄荷糖的味道818）<\/a> —— 热油泼香料汁，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节）<\/h2>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 选腐竹<\/strong><\/p>\n<ol>\n<li>挑颜色淡黄、有自然豆香、掰断时干脆的；发黑或黏手的是受潮变质的，别用。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 泡到「八成软」再焯<\/strong><\/p>\n<ol start=\"2\">\n<li>泡到八九成软（中心还有一点点硬）就下锅焯，焯完刚好全软，口感最筋道、不烂。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 料油定味<\/strong><\/p>\n<ol start=\"3\">\n<li>冷油下几粒花椒、葱段，小火炸到葱变焦黄。<\/li>\n<li>捞出料渣，趁热泼在蒜末辣椒面上——这勺「料油」是凉拌腐竹香味的来源。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 先拌后腌<\/strong><\/p>\n<ol start=\"5\">\n<li>料汁浇上去，先拌匀。<\/li>\n<li>冷藏腌 10~15 分钟，让腐竹把汁吸进去。<\/li>\n<li>上桌前再撒花生米和香菜，保持脆感和颜色。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://hanwuji.xiachufang.com/dish/182035890/\">下厨房 · 凉拌腐竹 合集<\/a> —— 多版本做法，适合对照「大厨版」选料与泡发<\/li>\n<\/ul>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "83", "name": "青椒炒豆干", "title": "青椒炒豆干", "category": "豆制品", "ingredient": "豆干", "ings": [["豆干"], ["青椒"], ["大蒜"], ["生抽"], ["蚝油"], ["白糖"], ["食用油"], ["盐"]], "opt": [false, false, false, false, true, false, false, false], "tags": [], "html": "<h1>青椒炒豆干<\/h1>\n<blockquote>\n<p>归属食材：豆干 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>豆干咸香有嚼劲，青椒清香爽脆，是十分钟就能上桌的快手下饭菜。豆干先焯水去豆腥，再和青椒大火快炒，酱香微辣、特别下饭。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、咸香下饭）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>豆干<\/td>\n<td>3 块（约 200g）<\/td>\n<td>选「五香豆干」或原味白豆干，别用老豆腐<\/td>\n<\/tr>\n<tr>\n<td>青椒<\/td>\n<td>2 个（约 150g）<\/td>\n<td>选肉厚、不辣的青椒，炒出来更香<\/td>\n<\/tr>\n<tr>\n<td>大蒜<\/td>\n<td>2 瓣<\/td>\n<td>切片，爆香用<\/td>\n<\/tr>\n<tr>\n<td>生抽<\/td>\n<td>1 汤匙（15ml）<\/td>\n<td>调味上色<\/td>\n<\/tr>\n<tr>\n<td>蚝油<\/td>\n<td>1/2 汤匙<\/td>\n<td>提鲜（可选）<\/td>\n<\/tr>\n<tr>\n<td>白糖<\/td>\n<td>1/2 小勺<\/td>\n<td>提鲜，中和咸味<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>2 汤匙<\/td>\n<td>分次用<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>少许<\/td>\n<td>最后补味，别先放多<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点，中大火为主）<\/strong><\/p>\n<p><strong>第 1 步 · 备菜<\/strong><\/p>\n<ol>\n<li>豆干冲一下，切成约 0.5cm 厚的条（或片）。<\/li>\n<li>青椒去蒂去籽，切成和豆干差不多长的丝。<\/li>\n<li>蒜切片。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 焯水去豆腥<\/strong><\/p>\n<ol start=\"4\">\n<li>烧一锅水，水开后下豆干，焯约 1 分钟。<\/li>\n<li>看到豆干表面发白、水里有浮沫 → 捞出，沥干水——这步去掉豆腥味和多余盐分，让后面更好入味。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 炒香蒜片<\/strong><\/p>\n<ol start=\"6\">\n<li>锅烧热倒油，油微热就下蒜片。<\/li>\n<li>小火炒出香味（约 15 秒），别炒糊。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 煸豆干<\/strong><\/p>\n<ol start=\"8\">\n<li>转中大火，下豆干翻炒约 1 分钟，炒到豆干边缘微微发黄、表面有点干香。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 下青椒调味<\/strong><\/p>\n<ol start=\"9\">\n<li>下青椒丝，加生抽、蚝油、白糖。<\/li>\n<li>大火快炒约 1~2 分钟，炒到青椒断生（颜色变深、微软但还脆）。<\/li>\n<\/ol>\n<p><strong>第 6 步 · 尝味出锅<\/strong><\/p>\n<ol start=\"11\">\n<li>尝一下咸淡，不够再加一点点盐；青椒还带脆劲时就关火盛出。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>豆干有豆腥味 / 咸味重<\/strong>：没焯水。豆干买回来直接炒容易带豆腥，先焯 1 分钟再去炒。<\/li>\n<li><strong>青椒炒软烂<\/strong>：炒太久。青椒要大火快炒、断生就出锅，才保留脆口和清香味。<\/li>\n<li><strong>豆干不入味<\/strong>：火太小、没炒到边缘微黄。豆干要先单独煸炒出干香，再放调料才挂味。<\/li>\n<li><strong>太咸<\/strong>：豆干本身可能带盐（尤其五香豆干），生抽蚝油也咸，最后先尝再补盐。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/107048086/\">下厨房 · 青椒炒豆干<\/a> —— 适合对照「初学版」用量与步骤<\/li>\n<li><a href=\"http://m-pr.douguo.com/cookbook/3248300.html\">豆果美食 · 青椒炒豆干（含做法视频）<\/a> —— 适合对照「初学版」先炒豆干再下青椒<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：选豆干 / 焯水 / 先煸豆干 / 下青椒时机）<\/h2>\n<p>在初学版基础上，掌握下面四条，成品质感会上一个台阶。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 选对豆干<\/strong><\/p>\n<ol>\n<li>五香豆干本身有底味，适合快炒；原味白豆干更清淡，需要靠调料入味。<\/li>\n<li>想要软嫩口感选「南豆腐干」，想要嚼劲选压得实的「北豆腐干」。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 焯水的讲究<\/strong><\/p>\n<ol start=\"3\">\n<li>水里加少许盐，焯豆干能去豆腥、也能让豆干更紧实不碎。<\/li>\n<li>焯完立刻沥干或过一下凉水，防止粘连。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 先煸豆干再下青椒<\/strong><\/p>\n<ol start=\"5\">\n<li>豆干先中火煸到表面微焦，逼出多余水分、形成干香，这是入味的关键。<\/li>\n<li>青椒后下，只炒 1 分钟以内，保持清脆。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 调味顺序<\/strong><\/p>\n<ol start=\"7\">\n<li>生抽沿锅边淋入（受热激出酱香），再放蚝油和糖；糖能中和豆干的咸、让味道更圆润。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.jianshu.com/p/07e4d8f56045\">简书 · 青椒炒豆干，第一次下厨房的你也能做<\/a> —— 适合对照「进阶版」煸豆干到焦黄<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「豆干外香里嫩、青椒脆嫩清香、出锅有锅气」。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 刀工统一<\/strong><\/p>\n<ol>\n<li>豆干和青椒都切成 4~5cm 长、0.5cm 粗的丝，形状一致受热均匀，成菜整齐。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 先滑豆干<\/strong><\/p>\n<ol start=\"2\">\n<li>宽油五成热下豆干，中火「煸」到两面金黄起虎皮（约 2 分钟），盛出控油——这是豆干外香里嫩的关键，比焯水版更有锅气。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 爆香料头<\/strong><\/p>\n<ol start=\"3\">\n<li>锅内留底油，下蒜片、几粒干辣椒段、几粒花椒。<\/li>\n<li>小火煸到辣椒微变色、香气四溢。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 合炒出锅<\/strong><\/p>\n<ol start=\"5\">\n<li>大火倒入豆干和青椒，沿锅边淋生抽和一点点香醋（去豆腥、提香），颠炒约 30 秒。<\/li>\n<li>勾一薄芡（1/2 小勺淀粉 + 2 汤匙水）让酱汁挂在豆干上。<\/li>\n<li>出锅前点几滴香油，趁热吃。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.bilibili.com/video/BV17Yt76QEzG/\">【幸福食堂】EP321 爆炒青椒豆干（哔哩哔哩）<\/a> —— 适合对照「大厨版」的锅气与煸炒手法<\/li>\n<\/ul>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "84", "name": "自制豆浆", "title": "自制豆浆", "category": "豆制品", "ingredient": "豆浆", "ings": [["干黄豆"], ["清水"], ["白糖"]], "opt": [false, false, false], "tags": ["甜"], "html": "<h1>自制豆浆<\/h1>\n<blockquote>\n<p>归属食材：豆浆 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>自己打的豆浆豆香浓、没有添加剂，比早餐店更香。核心是「豆水比例」和「彻底煮熟」两点：豆浆机一键搞定，也能进阶到现磨现煮。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：豆浆机一键，能喝、不假沸）<\/h2>\n<p><strong>食材（约 2 杯）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>干黄豆<\/td>\n<td>50g<\/td>\n<td>约一小把<\/td>\n<\/tr>\n<tr>\n<td>清水<\/td>\n<td>500ml<\/td>\n<td>豆水比约 1:10<\/td>\n<\/tr>\n<tr>\n<td>白糖<\/td>\n<td>适量<\/td>\n<td>趁热加<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 泡豆（可选）<\/strong><\/p>\n<ol>\n<li>黄豆提前一晚用冷水泡上（放冰箱冷藏）。<\/li>\n<li>第二天倒掉泡豆水、冲洗一下。豆浆机有「干豆」功能的话，这一步也可以省。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 加料<\/strong><\/p>\n<ol start=\"3\">\n<li>把黄豆放进豆浆机，加水到 500ml 刻度（别超过最高水位线）。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 选模式<\/strong><\/p>\n<ol start=\"4\">\n<li>按「豆浆」或「干豆/湿豆」键，启动；一般 20~30 分钟自动完成并煮熟。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 过滤<\/strong><\/p>\n<ol start=\"5\">\n<li>豆浆机打好后，如果带渣，用细滤网过滤一遍，口感更顺滑。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 调味<\/strong><\/p>\n<ol start=\"6\">\n<li>趁热加糖，搅匀即可；当天喝完。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>豆浆溢出 / 糊底<\/strong>：豆和水加太多。别超过最高水位线，也别低于最低水位线。<\/li>\n<li><strong>有生豆味<\/strong>：没用「煮豆浆」功能或煮的时间不够。豆浆机一般会边打边煮，选对模式很重要。<\/li>\n<li><strong>喝到豆渣<\/strong>：没过滤。想要顺滑就过一遍细滤网或纱布。<\/li>\n<li><strong>变质<\/strong>：豆浆放太久。室温下别超过 2~3 小时，喝不完冷藏、当天喝完，别用保温杯久存。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiangha.com/caipu/81781668/print\">香哈菜谱 · 自制美味豆浆<\/a> —— 干豆湿豆比例，适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：泡豆 / 比例 / 去豆腥 / 搭配）<\/h2>\n<p>在初学版基础上，掌握下面四条，成品会更香浓、少豆腥。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 泡豆时间<\/strong><\/p>\n<ol>\n<li>夏天放冰箱冷藏泡 4~6 小时，冬天常温泡 8~10 小时。<\/li>\n<li>泡到豆子胀大、能轻松捏开两半 → 泡好，泡豆水倒掉（能去掉部分豆腥）。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 豆水比例<\/strong><\/p>\n<ol start=\"3\">\n<li>干豆:水约 1:8~1:10 是常见浓度，想浓一点用 1:8（如 60g 豆 + 500ml 水），想清爽一点用 1:10。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 去豆腥<\/strong><\/p>\n<ol start=\"4\">\n<li>泡豆时换一两次水，打之前把豆皮尽量去掉或煮一下豆，能明显减轻豆腥。<\/li>\n<li>加几颗红枣或一点花生米，也能遮腥、增香。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 搭配<\/strong><\/p>\n<ol start=\"6\">\n<li>黄豆打基础款；加红枣枸杞（红枣去核）、南瓜块、核桃小米等，做出不同口味，甜度可先用食材自带甜味代替白糖。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/102118510/printable/\">下厨房 · 鲜香豆浆（咸味版）<\/a> —— 适合对照「进阶版」泡豆与调味<\/li>\n<li><a href=\"https://www.lezuocai.com/recipe/2365737\">乐做菜 · 原味豆浆（详细）<\/a> —— 适合对照「进阶版」搭配<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节：现磨现煮）<\/h2>\n<p>不用豆浆机，追求「豆香浓郁、口感顺滑、彻底煮熟」。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 现磨流程<\/strong><\/p>\n<ol>\n<li>泡好的黄豆 70g + 清水 600ml，用破壁机/料理机搅打 2~3 分钟成生浆。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 过滤<\/strong><\/p>\n<ol start=\"2\">\n<li>用 200 目滤网或纱布把豆渣滤出来，得到的生豆浆倒进锅里。<\/li>\n<li>豆渣别扔，可以煎豆渣饼、做豆渣窝头或炒豆渣。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 彻底煮熟（关键）<\/strong><\/p>\n<ol start=\"4\">\n<li>生豆浆大火烧开后会「假沸」——80℃ 左右大量起泡像开了，其实没熟，含皂苷等成分，喝了容易不舒服。<\/li>\n<li>要等真正滚开后转小火，边煮边搅再煮 3~5 分钟。<\/li>\n<li>直到泡沫变少、没有生豆味 → 关火。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 调味与口感<\/strong><\/p>\n<ol start=\"7\">\n<li>煮好后趁热加糖；想要更香浓可煮到微微收浓，喝前撇去表面浮沫，口感更干净。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.bilibili.com/video/BV1kEkRYqEE6/\">章沪川 · 传统老式豆浆教程（哔哩哔哩）<\/a> —— 现磨过滤煮开，适合对照「大厨版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1DhMJzGET2/\">古法现磨豆浆（哔哩哔哩）<\/a> —— 泡豆磨浆煮制流程，适合对照「大厨版」<\/li>\n<\/ul>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "85", "name": "凉拌豆皮", "title": "凉拌豆皮", "category": "豆制品", "ingredient": "豆皮", "ings": [["豆皮", "千张", "豆腐皮"], ["黄瓜"], ["蒜"], ["香菜"], ["生抽"], ["香醋"], ["白糖"], ["辣椒油"], ["香油"], ["熟白芝麻"]], "opt": [false, false, false, true, false, false, false, false, false, true], "tags": [], "html": "<h1>凉拌豆皮<\/h1>\n<blockquote>\n<p>归属食材：豆皮 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>豆皮柔韧爽滑、不腻口，配黄瓜丝和酸辣料汁，香辣开胃又下饭。关键是焯水去豆腥、挤干水，让料汁挂得住。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、酸辣开胃）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>豆皮（千张/豆腐皮）<\/td>\n<td>1~2 张（约 150g）<\/td>\n<td>干的用温水先泡软，鲜的直接用<\/td>\n<\/tr>\n<tr>\n<td>黄瓜<\/td>\n<td>半根<\/td>\n<td>切丝<\/td>\n<\/tr>\n<tr>\n<td>蒜<\/td>\n<td>3 瓣<\/td>\n<td>切末<\/td>\n<\/tr>\n<tr>\n<td>香菜<\/td>\n<td>1 小把（可选）<\/td>\n<td>切段<\/td>\n<\/tr>\n<tr>\n<td>生抽<\/td>\n<td>2 汤匙<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>香醋<\/td>\n<td>1 汤匙<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>白糖<\/td>\n<td>1 小勺<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>辣椒油<\/td>\n<td>1 小勺<\/td>\n<td>不吃辣减量<\/td>\n<\/tr>\n<tr>\n<td>香油<\/td>\n<td>1 小勺<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>熟白芝麻<\/td>\n<td>1 小撮（可选）<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 切豆皮<\/strong><\/p>\n<ol>\n<li>干豆皮用温水泡软（约 10 分钟），鲜豆皮直接冲一下。<\/li>\n<li>叠起来切成约 0.5cm 宽的丝。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 焯水<\/strong><\/p>\n<ol start=\"3\">\n<li>水烧开后下豆皮丝，焯约 1 分钟，去掉豆腥味、口感更柔韧。<\/li>\n<li>捞出过凉水。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 挤干水<\/strong><\/p>\n<ol start=\"5\">\n<li>把豆皮捞出来轻轻挤掉水分（别挤烂），水多会冲淡味道。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 配菜<\/strong><\/p>\n<ol start=\"6\">\n<li>黄瓜切丝，蒜切末，香菜切段。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 调汁<\/strong><\/p>\n<ol start=\"7\">\n<li>碗里放蒜末、生抽、香醋、白糖、辣椒油、香油，搅匀。<\/li>\n<\/ol>\n<p><strong>第 6 步 · 拌匀<\/strong><\/p>\n<ol start=\"8\">\n<li>豆皮丝、黄瓜丝、香菜放进大碗，倒料汁翻拌均匀。<\/li>\n<li>撒白芝麻，腌几分钟再吃。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>豆皮有豆腥 / 发硬<\/strong>：没焯水或焯太短。水开焯 1 分钟再投凉，去腥又柔韧。<\/li>\n<li><strong>味道淡<\/strong>：没挤干水。焯完的水分不挤掉，料汁会被稀释。<\/li>\n<li><strong>豆皮切成一坨<\/strong>：切之前把豆皮摊平、叠整齐再切，丝才均匀。<\/li>\n<li><strong>太辣 / 太酸<\/strong>：辣椒油和醋先少放，拌匀尝过再加。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/dish/176579842/\">下厨房 · 巨好吃的凉拌豆皮（香辣过瘾）<\/a> —— 适合对照「初学版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1c4411s7hf/\">老板娘的微食记 · 凉拌豆皮（哔哩哔哩）<\/a> —— 适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：选豆皮 / 焯水 / 热油料汁 / 配菜）<\/h2>\n<p>在初学版基础上，掌握下面四条，成品质感会上一个台阶。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 选豆皮<\/strong><\/p>\n<ol>\n<li>「豆腐皮/千张」偏韧、豆香浓；「油豆皮」更薄更滑，焯水时间要更短。<\/li>\n<li>干豆皮一定先温水泡软再切。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 焯水投凉<\/strong><\/p>\n<ol start=\"3\">\n<li>水里加一点盐和几滴油，焯出的豆皮更爽滑。<\/li>\n<li>焯完立刻投凉水，口感更筋道。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 热油激香<\/strong><\/p>\n<ol start=\"5\">\n<li>蒜末 + 辣椒面 + 白芝麻放碗里，烧一勺热油泼上去，激出香味。<\/li>\n<li>再加生抽、醋、糖、蚝油，这是凉拌豆皮香味的来源。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 配菜<\/strong><\/p>\n<ol start=\"7\">\n<li>黄瓜丝、胡萝卜丝（焯熟）、洋葱丝、炸花生米、粉丝都可以加，让口感和颜色更丰富。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/107180329/\">下厨房 · 凉拌豆皮<\/a> —— 配料齐全（花生米、洋葱、小米椒），适合对照「进阶版」<\/li>\n<li><a href=\"https://www.lezuocai.com/recipe/2023471/\">乐做菜 · 凉拌肉丝豆皮黄瓜<\/a> —— 加肉丝版本，适合对照「进阶版」配菜<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节）<\/h2>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 刀工<\/strong><\/p>\n<ol>\n<li>豆皮叠成整齐的条再切细丝，粗细均匀，拌的时候才挂料汁、吃口一致。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 焯水控时<\/strong><\/p>\n<ol start=\"2\">\n<li>千张焯 1 分钟、油豆皮焯 20~30 秒，时间长了会软烂没嚼劲。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 料油提香<\/strong><\/p>\n<ol start=\"3\">\n<li>冷油下花椒、干辣椒段，小火炸香后捞出，趁热泼在蒜末上。<\/li>\n<li>再加生抽、陈醋、糖、少许花椒油，酸辣麻香层次足。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 拌后静置<\/strong><\/p>\n<ol start=\"5\">\n<li>拌好静置 5~10 分钟，让豆皮吸味。<\/li>\n<li>上桌前再撒花生米（保持酥脆）和香菜（保持颜色）。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.bilibili.com/video/BV1n4411V7Kn/\">滇西小哥 · 手工豆皮宴（含凉拌吃法）（哔哩哔哩）<\/a> —— 适合对照「大厨版」豆皮处理<\/li>\n<\/ul>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "86", "name": "麻婆豆腐", "title": "麻婆豆腐", "category": "豆制品", "ingredient": "豆腐", "ings": [["嫩豆腐", "内酯豆腐"], ["猪肉末", "牛肉末"], ["郫县豆瓣酱"], ["蒜"], ["姜"], ["花椒粉"], ["水淀粉"], ["小葱", "蒜苗"], ["食用油"], ["清水"]], "opt": [false, false, false, false, true, false, false, false, false, false], "tags": [], "html": "<h1>麻婆豆腐<\/h1>\n<blockquote>\n<p>归属食材：豆腐 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>麻婆豆腐是川菜经典，讲究「麻、辣、烫、嫩、香、鲜」六味俱全，也是练习「焯水、炒红油、勾芡」三大基本功的好菜。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（
