<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>烹饪储备库 · 菜谱手册</title>
<style>
:root{
  --bg:#faf6f0; --card:#ffffff; --ink:#2b2320; --sub:#8a7a6f;
  --line:#efe6db; --accent:#e05c2e; --accent-soft:#fbe7dd;
  --gold:#c8922f; --green:#3a7d44;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.65;font-size:16px;
  -webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
a{color:var(--accent);text-decoration:none}

/* 顶栏 */
header{position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--line);padding:12px 16px 10px}
header .row{display:flex;align-items:center;gap:10px}
header .brand{font-weight:700;font-size:19px;white-space:nowrap}
header .brand small{display:block;font-weight:400;font-size:12px;color:var(--sub)}
.modes{display:flex;gap:8px;margin-top:10px}
.mode{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;
  padding:8px 0;font-size:14px;color:var(--sub);cursor:pointer;text-align:center;transition:.12s}
.mode.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.search{margin-top:10px;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--card);
  border-radius:12px;padding:11px 14px 11px 38px;font-size:15px;color:var(--ink);
  outline:none;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.search input:focus{border-color:var(--accent)}
.search .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);
  color:var(--sub);font-size:15px}
.ing-extra{margin-top:8px}
.ing-extra input{width:100%;border:1px solid var(--line);background:var(--card);
  border-radius:12px;padding:10px 14px;font-size:14px;color:var(--ink);outline:none}
.ing-extra input:focus{border-color:var(--accent)}
.hint{font-size:12px;color:var(--sub);margin-top:6px;padding:0 2px;line-height:1.5}

.wrap{max-width:720px;margin:0 auto;padding:14px 14px 40px}

/* 分类卡片 */
.sec-title{font-size:13px;color:var(--sub);margin:18px 2px 10px;font-weight:600;
  letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.sec-title .cnt{margin-left:auto;font-weight:400}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:13px 12px;cursor:pointer;transition:.12s;display:flex;align-items:center;gap:10px}
.cat:active{transform:scale(.97);background:var(--accent-soft)}
.cat .em{font-size:24px}
.cat .nm{font-weight:600;font-size:15px}
.cat .nm span{display:block;font-weight:400;font-size:12px;color:var(--sub)}

/* 菜品列表 */
.dish{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:12px 14px;margin-bottom:10px;cursor:pointer;transition:.12s}
.dish:active{transform:scale(.98);background:var(--accent-soft)}
.dish .t{font-weight:600;font-size:16px}
.dish .m{font-size:12px;color:var(--sub);margin-top:2px}
.tag{display:inline-block;font-size:11px;color:var(--accent);background:var(--accent-soft);
  border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.tag.ok{color:var(--green);background:#e7f2e8}
.dish .need{font-size:12px;color:var(--gold);margin-top:2px}
.dish .cut{font-size:12px;color:#1f8a70;margin-top:2px}
.dish .skip{font-size:12px;color:var(--sub);margin-top:1px}

/* 报原料结果 */
.sum{background:var(--accent-soft);border:1px solid var(--line);border-radius:12px;
  padding:10px 12px;font-size:13px;color:#7a4a30;margin-bottom:2px;line-height:1.6}

/* 详情页 */
.detail-head{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:16px;margin-bottom:12px}
.detail-head h1{margin:0 0 6px;font-size:22px;line-height:1.3}
.detail-head .m{font-size:13px;color:var(--sub)}

/* 菜谱正文（markdown 渲染） */
.recipe{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:16px 18px;overflow:hidden}
.recipe h1{font-size:20px;margin:.2em 0 .6em}
.recipe h2{font-size:17px;margin:1.4em 0 .6em;padding:8px 12px;
  background:var(--accent-soft);color:var(--accent);border-left:4px solid var(--accent);
  border-radius:0 8px 8px 0}
.recipe h2:first-of-type{margin-top:.3em}
.recipe h3{font-size:15px;margin:1.2em 0 .4em;color:#5a4638}
.recipe p{margin:.5em 0}
.recipe strong{color:#4a372a}
.recipe ul,.recipe ol{margin:.5em 0 .5em 0;padding-left:1.4em}
.recipe li{margin:.28em 0}
.recipe blockquote{margin:.7em 0;padding:8px 12px;background:#faf3ea;
  border-left:3px solid var(--gold);color:#6b5a4a;border-radius:0 8px 8px 0;font-size:14px}
.recipe table{border-collapse:collapse;width:100%;margin:.7em 0;font-size:14px;
  display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
.recipe table th,.recipe table td{border:1px solid var(--line);padding:7px 9px;
  text-align:left;vertical-align:top;white-space:normal}
.recipe table th{background:#f6efe6;font-weight:600}
.recipe hr{border:none;border-top:1px dashed var(--line);margin:1.2em 0}
.recipe a{word-break:break-all}

/* 空态 / 顶栏按钮 */
.empty{text-align:center;color:var(--sub);padding:40px 0;font-size:14px}
.back{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:6px 12px;font-size:14px;color:var(--ink);cursor:pointer;white-space:nowrap}
.back:active{background:var(--accent-soft)}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.topbar .crumb{font-weight:600;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<header>
  <div class="row">
    <div class="brand">烹饪储备库<small id="subBrand">手机菜谱手册</small></div>
  </div>
  <div class="modes" id="modes">
    <button class="mode on" data-mode="search">🔍 搜菜名</button>
    <button class="mode" data-mode="ing">🧺 报原料</button>
  </div>
  <div class="search">
    <span class="ic" id="searchIc">🔍</span>
    <input id="q" type="search" placeholder="搜菜名 / 食材 / 分类，如「鱼香」「猪肉」" autocomplete="off">
  </div>
  <div class="ing-extra" id="ingExtra" style="display:none">
    <input id="taboo" type="text" placeholder="忌口 / 口味（可选）：不吃辣、不吃甜食、海鲜" autocomplete="off">
    <div class="hint" id="ingHint">输入现有原料（含调料），顿号/逗号/空格分隔。忌口「甜/糖/辣」会自动剔除可选料（如糖、辣椒），保住菜品主体；其它忌口命中即排除；偏好口味排前。</div>
  </div>
</header>

<div class="wrap">
  <!-- 首页 -->
  <div id="view-home">
    <div class="sec-title">📚 分类<span class="cnt" id="totalCnt"></span></div>
    <div class="grid" id="catGrid"></div>
    <div class="sec-title">🍳 全部菜品<span class="cnt" id="dishCnt"></span></div>
    <div id="dishList"></div>
    <div class="sec-title">🧭 新手必读</div>
    <div class="dish" id="openGuide">刀工 · 火候 · 调味三大基本功 + 术语说明（油温、断生、锅气…）</div>
    <div class="empty" id="noResult" style="display:none">没找到匹配的菜，换个词试试？</div>
  </div>

  <!-- 分类详情 -->
  <div id="view-cat" style="display:none">
    <div class="topbar"><button class="back" onclick="goHome()">‹ 返回</button>
      <span class="crumb" id="catCrumb"></span></div>
    <div id="catBody"></div>
  </div>

  <!-- 菜品详情 -->
  <div id="view-dish" style="display:none">
    <div class="topbar"><button class="back" onclick="goBack()">‹ 返回</button>
      <span class="crumb" id="dishCrumb"></span></div>
    <div id="dishBody"></div>
  </div>

  <!-- 入门总纲 -->
  <div id="view-guide" style="display:none">
    <div class="topbar"><button class="back" onclick="goHome()">‹ 返回</button>
      <span class="crumb">🧭 新手必读</span></div>
    <div class="recipe" id="guideBody"></div>
  </div>

  <!-- 报原料推荐 -->
  <div id="view-ing" style="display:none">
    <div class="topbar"><button class="back" onclick="goHome()">‹ 返回</button>
      <span class="crumb">🧺 报原料推荐</span></div>
    <div id="ingResult"></div>
  </div>
</div>

<script>
const DATA = {"total": 124, "categories": [{"name": "蔬菜", "icon": "🥬"}, {"name": "水果", "icon": "🍎"}, {"name": "肉类", "icon": "🥩"}, {"name": "蛋类", "icon": "🥚"}, {"name": "奶制品", "icon": "🥛"}, {"name": "水产海鲜", "icon": "🦐"}, {"name": "豆制品", "icon": "🫘"}, {"name": "主食谷物", "icon": "🌾"}, {"name": "菌菇", "icon": "🍄"}, {"name": "调味香料", "icon": "🧂"}, {"name": "干货", "icon": "🥫"}, {"name": "坚果干果", "icon": "🥜"}], "dishes": [{"id": "0", "name": "丝瓜炒蛋", "title": "丝瓜炒蛋", "category": "蔬菜", "ingredient": "丝瓜", "ings": [["丝瓜"], ["鸡蛋"], ["蒜"], ["小葱"], ["盐"], ["白糖"], ["食用油"]], "opt": [false, false, false, true, false, true, false], "tags": [], "html": "<h1>丝瓜炒蛋<\/h1>\n<blockquote>\n<p>归属食材：丝瓜 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>丝瓜软嫩多汁、自带清甜，配滑嫩的鸡蛋是夏天最清爽的下饭菜。成败全看两点：丝瓜别炒黑、鸡蛋别炒老。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、不难吃）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>丝瓜<\/td>\n<td>1 根（约 400g）<\/td>\n<td>挑硬实、外皮翠绿、没有黑斑的嫩瓜<\/td>\n<\/tr>\n<tr>\n<td>鸡蛋<\/td>\n<td>3 个<\/td>\n<td>室温蛋更好打散<\/td>\n<\/tr>\n<tr>\n<td>蒜<\/td>\n<td>2 瓣<\/td>\n<td>切片<\/td>\n<\/tr>\n<tr>\n<td>小葱<\/td>\n<td>1 根<\/td>\n<td>切葱花，出锅前撒，可选<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>约 1 小勺（5g）<\/td>\n<td>分两次放，最后一次调味<\/td>\n<\/tr>\n<tr>\n<td>白糖<\/td>\n<td>1/2 小勺（约 2g）<\/td>\n<td>提鲜，可选<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>2 汤匙（约 20ml）<\/td>\n<td>分两次用，炒蛋和炒丝瓜各一半<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点，全程中大火）<\/strong><\/p>\n<p><strong>第 1 步 · 处理丝瓜<\/strong><\/p>\n<ol>\n<li>丝瓜去皮（用削皮刀削掉外皮），切掉两头，切成约 2~3cm 的滚刀块——滚刀块就是一边转丝瓜一边切、切出不规则大块。<\/li>\n<li>切好的丝瓜立刻泡进清水里，加 1 小撮盐，泡 3~5 分钟——这一步能防氧化变黑。<\/li>\n<li>捞出沥干，看到丝瓜表面没有多余水珠 → 再继续下一步。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 打鸡蛋<\/strong><\/p>\n<ol start=\"4\">\n<li>鸡蛋打进碗里，加 1 小撮盐，用筷子快速搅打约 30 秒，打到蛋液起细泡、看不出蛋白蛋黄分层。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 炒鸡蛋<\/strong><\/p>\n<ol start=\"5\">\n<li>锅烧热，倒 1 汤匙油，油微微冒烟时转中火，倒入蛋液。<\/li>\n<li>蛋液边缘一凝固就用铲子往里推、划散，炒约 40~60 秒，看到鸡蛋刚定型、还是嫩黄色 → 立刻盛出备用（别炒老）。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 炒丝瓜<\/strong><\/p>\n<ol start=\"7\">\n<li>锅里再补 1 汤匙油，下蒜片爆香约 10 秒，闻到蒜香就下丝瓜。<\/li>\n<li>转大火翻炒丝瓜约 2~3 分钟，看到丝瓜颜色变深、开始有点透明、渗出一点汤汁 → 说明快熟了。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 合炒出锅<\/strong><\/p>\n<ol start=\"9\">\n<li>把炒好的鸡蛋倒回锅里，加盐和糖，翻炒均匀约 30 秒。<\/li>\n<li>尝一口，丝瓜软嫩没有生味 → 撒葱花，翻两下关火出锅。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>丝瓜炒出来发黑<\/strong>：丝瓜去皮切块后放久了才下锅，或者盐放得太早。记住「切好就泡淡盐水 + 出锅前才放盐」。<\/li>\n<li><strong>丝瓜炒成一滩水<\/strong>：丝瓜本身含水多，火不够大、炒太久就会软烂出汤。正确做法是大火快炒、断生就出锅（断生 = 刚熟、还带一点脆生）。<\/li>\n<li><strong>鸡蛋炒老了<\/strong>：鸡蛋炒熟后又和丝瓜一起久炒。正确做法是鸡蛋刚凝固就盛出来，最后再回锅合一下。<\/li>\n<li><strong>有蛋腥味<\/strong>：鸡蛋没搅打充分。搅到蛋液起泡、炒的时候油温别太低，腥味就没了。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/107753989/\">下厨房 · 丝瓜炒蛋<\/a> —— 家常做法，适合对照「初学版」<\/li>\n<li><a href=\"https://www.xiachufang.com/recipe/107167449/\">下厨房 · 丝瓜炒蛋步骤图<\/a> —— 带步骤图，适合边看边做<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：防黑 / 先炒蛋后炒瓜 / 控汤 / 提鲜）<\/h2>\n<p>在初学版基础上，掌握下面几点，丝瓜会更翠绿、鸡蛋更嫩、盘底不汪汤。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 防黑三步走<\/strong><\/p>\n<ol>\n<li>丝瓜削皮时尽量不用铁刀（用不锈钢刀或陶瓷刀），削好立刻泡淡盐水——这是防黑的第一道保险。<\/li>\n<li>下锅前才从水里捞出切块，减少和空气接触的时间。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 鸡蛋加「水」更嫩<\/strong><\/p>\n<ol start=\"3\">\n<li>蛋液里加 1 小勺清水（或几滴料酒），再搅打 30 秒——炒出来的鸡蛋更蓬松嫩滑。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 先炒蛋、后炒瓜（顺序不能反）<\/strong><\/p>\n<ol start=\"4\">\n<li>鸡蛋先单独滑炒到七成熟就盛出（表面刚凝固、还带一点嫩度），最后回锅借余温刚好熟透。<\/li>\n<li>丝瓜单独用大火炒到断生，再倒回鸡蛋——两者分开受热，谁都不会被拖累变老。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 盐最后放、糖提鲜<\/strong><\/p>\n<ol start=\"6\">\n<li>丝瓜炒熟、鸡蛋回锅后才放盐和 1/2 小勺糖——盐放早了丝瓜会大量出水、还容易发黑；糖能把丝瓜的清甜提出来。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/103818022/\">下厨房 · 丝瓜炒蛋（清鲜版）<\/a> —— 强调顺序与火候，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「丝瓜翠绿、鸡蛋滑嫩、出锅带锅气、盘底不汪汤」。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 滑炒鸡蛋（热锅凉油）<\/strong><\/p>\n<ol>\n<li>空锅烧到冒烟，倒油后立刻转中火（热锅凉油 = 先烧热锅再放油，防粘），下蛋液。<\/li>\n<li>蛋液下锅 3 秒后关小火，用铲子从外圈往里轻轻推，推到蛋液大半凝固、中心还带一点半流动 → 立刻盛出。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 大火逼香、快炒丝瓜<\/strong><\/p>\n<ol start=\"3\">\n<li>锅不用洗，补半汤匙油，大火烧到油冒烟，下蒜片爆香，闻到焦香立刻下丝瓜。<\/li>\n<li>颠锅或快速翻炒约 1 分半钟，看到丝瓜边缘透明、整体翠绿发亮 → 立刻转小火。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 合炒出锅<\/strong><\/p>\n<ol start=\"5\">\n<li>鸡蛋回锅，加盐和糖，转大火再翻炒 20 秒。<\/li>\n<li>看到盘底基本没有多余汤汁、丝瓜裹着一层薄薄的油光 → 立刻离火装盘（锅气 = 高温快炒带来的焦香，凉了就散，趁热吃）。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.bilibili.com/video/BV1B64y1B7Zn/\">难怪饭店的丝瓜炒鸡蛋那么好吃，原来诀窍全在这里，不出水不发黑（哔哩哔哩）<\/a> —— 讲透「不出水不发黑」，适合对照「大厨版」<\/li>\n<\/ul>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "1", "name": "红烧冬瓜", "title": "红烧冬瓜", "category": "蔬菜", "ingredient": "冬瓜", "ings": [["冬瓜"], ["蒜"], ["生抽"], ["老抽"], ["蚝油"], ["白糖"], ["盐"], ["食用油"], ["清水"]], "opt": [false, false, false, false, false, false, false, false, false], "tags": [], "html": "<h1>红烧冬瓜<\/h1>\n<blockquote>\n<p>归属食材：冬瓜 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>素版「红烧肉」，冬瓜吸饱酱汁软糯入味、咸甜浓香，低脂又下饭。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、不难吃）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>冬瓜<\/td>\n<td>500g<\/td>\n<td>去皮去瓤，切麻将大小的块<\/td>\n<\/tr>\n<tr>\n<td>蒜<\/td>\n<td>3 瓣<\/td>\n<td>切末<\/td>\n<\/tr>\n<tr>\n<td>生抽<\/td>\n<td>1 汤匙（约 15ml）<\/td>\n<td>咸鲜<\/td>\n<\/tr>\n<tr>\n<td>老抽<\/td>\n<td>1/2 小勺（约 2ml）<\/td>\n<td>上色<\/td>\n<\/tr>\n<tr>\n<td>蚝油<\/td>\n<td>1 小勺（约 5ml）<\/td>\n<td>提鲜<\/td>\n<\/tr>\n<tr>\n<td>白糖<\/td>\n<td>1 小勺（约 5g）<\/td>\n<td>提鲜<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>1 小撮<\/td>\n<td>按需补<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>2 汤匙（约 20ml）<\/td>\n<td>煎冬瓜<\/td>\n<\/tr>\n<tr>\n<td>清水<\/td>\n<td>约 150ml<\/td>\n<td>焖煮用<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点，中小火焖煮）<\/strong><\/p>\n<p><strong>第 1 步 · 切冬瓜<\/strong><\/p>\n<ol>\n<li>冬瓜去皮、去瓤，切成约 3cm 见方的块。<\/li>\n<li>在每块表面划十字花刀（不要切断）——刀口让酱汁渗进去，方便入味。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 煎冬瓜<\/strong><\/p>\n<ol start=\"3\">\n<li>锅烧热，倒油。<\/li>\n<li>下冬瓜块，中小火煎约 2~3 分钟，看到表面微微发黄 → 翻面。<\/li>\n<li>再煎另一面，煎到两面都微微发黄。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 调味焖煮<\/strong><\/p>\n<ol start=\"6\">\n<li>下蒜末，炒香（闻到蒜香，约 15 秒）。<\/li>\n<li>把冬瓜拌回来，加生抽、老抽、蚝油、白糖，翻匀上色。<\/li>\n<li>倒入清水（约到冬瓜一半高），盖盖中小火焖 5~8 分钟。<\/li>\n<li>用筷子戳一块，能轻松戳透 → 冬瓜熟了，准备收汁。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 收汁出锅<\/strong><\/p>\n<ol start=\"10\">\n<li>开盖转大火，收汁约 1 分钟，看到汤汁浓稠、挂在冬瓜上。<\/li>\n<li>尝一口，不够咸就补一点盐。<\/li>\n<li>撒葱花，关火出锅。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>冬瓜没味道<\/strong>：块太大、没划花刀、焖的时间太短。花刀 + 焖软是关键。<\/li>\n<li><strong>烧成一锅水<\/strong>：冬瓜本身会出水，清水别加太多，最后一定要大火收汁。<\/li>\n<li><strong>冬瓜太烂没形<\/strong>：焖煮时别频繁翻动，用中小火，筷子能戳透就停。<\/li>\n<li><strong>颜色淡 / 发黑<\/strong>：老抽只上色、少量即可，加多了发黑发苦。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/106856905/\">下厨房 · 红烧冬瓜<\/a> —— 用料用量明确，适合对照「初学版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1YSC1BZE7Y/\">挑战微波炉做饭 比红烧肉还好吃的红烧冬瓜（哔哩哔哩）<\/a> —— 软烂咸香拌饭，适合对照「初学版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1QdVseUErg/\">冬瓜清淡没胃口？快来试试红烧冬瓜吧（哔哩哔哩）<\/a> —— 短视频教程，适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：煎香 / 糖色 / 勾芡 / 去腥）<\/h2>\n<p>在初学版基础上，掌握下面四条，成品质感会明显提升。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 先煎再焖<\/strong><\/p>\n<ol>\n<li>冬瓜块煎到两面金黄、边缘微焦（比初学版多煎一会儿，看到边缘焦黄再翻面）。<\/li>\n<li>煎好后按初学版流程焖煮——带焦香的冬瓜焖出来口感更像肉。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 冰糖炒糖色（可选）<\/strong><\/p>\n<ol start=\"3\">\n<li>冷油下几粒冰糖，小火慢慢炒。<\/li>\n<li>看到冰糖融化、冒泡、变成琥珀色 → 下冬瓜翻裹上色，颜色红亮、味道更甜润。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 勾薄芡<\/strong><\/p>\n<ol start=\"5\">\n<li>出锅前把半小勺淀粉 + 2 汤匙水调匀。<\/li>\n<li>边倒进锅里边搅，看到汤汁浓稠、挂在冬瓜上，拌饭更香。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 姜去腥<\/strong><\/p>\n<ol start=\"7\">\n<li>爆香时加两片姜一起炒香，冬瓜的「水汽味」被压掉，味道更干净。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/107387310/\">下厨房 · 十分钟搞定 冬瓜的王炸吃法，软糯鲜香、低脂低卡<\/a> —— 虾皮提鲜 + 勾芡收汁，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「红亮挂汁、瓜糯入味、吃出红烧肉的感觉」。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 用高汤焖<\/strong><\/p>\n<ol>\n<li>焖煮时用高汤代替清水（汤汁更醇厚）；没有高汤，用半块浓汤宝或几粒虾皮提鲜。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 煎出均匀焦边<\/strong><\/p>\n<ol start=\"2\">\n<li>煎冬瓜用中大火，锅要先烧够热再下冬瓜。<\/li>\n<li>煎到每块边缘均匀焦黄、不糊 → 这就是「红烧肉口感」的来源。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 小火保持微沸<\/strong><\/p>\n<ol start=\"4\">\n<li>焖煮全程小火，保持锅底微微冒泡（微沸）。<\/li>\n<li>中途不开盖，让酱汁慢慢渗进冬瓜，避免香气流失。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 大火收汁挂汁<\/strong><\/p>\n<ol start=\"6\">\n<li>收汁时开大火 + 不停晃锅，让冬瓜在浓汁里「裹」一圈。<\/li>\n<li>看到汁亮、瓜糯、颜色红亮 → 出锅前点几滴香油，趁热吃最香。<\/li>\n<\/ol>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "2", "name": "咸蛋黄焗南瓜", "title": "咸蛋黄焗南瓜", "category": "蔬菜", "ingredient": "南瓜", "ings": [["老南瓜"], ["咸蛋黄"], ["玉米淀粉"], ["盐"], ["白糖"], ["食用油"]], "opt": [false, false, false, false, true, false], "tags": [], "html": "<h1>咸蛋黄焗南瓜<\/h1>\n<blockquote>\n<p>归属食材：南瓜 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>餐厅经典「金沙」菜，外咸里甜、外酥里糯，金黄沙香，冷吃热吃都好吃。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、不难吃）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>老南瓜<\/td>\n<td>300g<\/td>\n<td>去皮去瓤，切手指粗细的条<\/td>\n<\/tr>\n<tr>\n<td>咸蛋黄<\/td>\n<td>3 个<\/td>\n<td>熟咸鸭蛋剥出的蛋黄<\/td>\n<\/tr>\n<tr>\n<td>玉米淀粉<\/td>\n<td>约 3 汤匙（30g）<\/td>\n<td>裹粉<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>1 小撮<\/td>\n<td>按需补（咸蛋黄本身有咸味）<\/td>\n<\/tr>\n<tr>\n<td>白糖<\/td>\n<td>1/2 小勺（约 2g）<\/td>\n<td>提味，可选<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>约 300ml（炸用）<\/td>\n<td>或用少量油煎<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点，全程小火炒沙）<\/strong><\/p>\n<p><strong>第 1 步 · 处理南瓜<\/strong><\/p>\n<ol>\n<li>南瓜去皮、去瓤。<\/li>\n<li>切成约 5cm 长、手指粗细的条。<\/li>\n<li>用厨房纸吸干表面水分——表面没水，后面裹粉才挂得住。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 蒸蛋黄<\/strong><\/p>\n<ol start=\"4\">\n<li>咸蛋黄放进碗里，隔水蒸 8 分钟（或微波炉中火 1 分钟）。<\/li>\n<li>趁热用勺子压成细腻的泥。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 裹粉炸南瓜<\/strong><\/p>\n<ol start=\"6\">\n<li>南瓜条均匀裹上一层薄薄的玉米淀粉，抖掉多余的粉。<\/li>\n<li>锅里倒油，烧到五六成热（筷子伸进去，周围冒小泡）。<\/li>\n<li>下南瓜条，炸约 2 分钟，看到表面微黄、定型 → 捞出沥油。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 炒沙裹匀<\/strong><\/p>\n<ol start=\"9\">\n<li>锅里留 1 汤匙底油，小火倒入蛋黄泥。<\/li>\n<li>慢慢炒约 1 分钟，看到起绵密小泡、出沙 → 倒南瓜条。<\/li>\n<li>倒入炸好的南瓜条，加糖，快速翻拌约 30 秒，让每根都裹满金沙。<\/li>\n<li>尝一口，太淡补一点盐，出锅。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>南瓜软塌掉粉<\/strong>：南瓜表面水没吸干就裹粉。一定吸干再裹粉、抖掉浮粉。<\/li>\n<li><strong>蛋黄不香还腥<\/strong>：没蒸熟或炒的时间不够，要小火炒到起沙起泡再下南瓜。<\/li>\n<li><strong>蛋黄炒黑发苦<\/strong>：火太大，全程小火。<\/li>\n<li><strong>太咸<\/strong>：咸蛋黄本身很咸，先别放盐，最后尝了再补。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/106884890/\">下厨房 · 无敌好吃的咸蛋黄焗南瓜<\/a> —— 咸蛋黄酱版，做法省事，适合对照「初学版」<\/li>\n<li><a href=\"https://www.xiachufang.com/recipe/100552874/\">下厨房 · 婷子厨房 咸蛋黄焗南瓜（少油版）<\/a> —— 少油替代油炸，适合对照「初学版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1HX4y1G7Fv/\">咸蛋黄焗南瓜 外酥里糯，外咸里甜（哔哩哔哩）<\/a> —— 材料少易复刻，适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：控水 / 复炸 / 去腥 / 控油）<\/h2>\n<p>在初学版基础上，掌握下面四条，成品更酥、更香、更清爽。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 控水拍粉<\/strong><\/p>\n<ol>\n<li>南瓜条加一点盐，腌 10 分钟杀出水分。<\/li>\n<li>用厨房纸吸干水分再裹粉——炸出来更酥、不软塌。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 复炸<\/strong><\/p>\n<ol start=\"3\">\n<li>第一遍炸到定型就捞出。<\/li>\n<li>油温升高到七八成热，再下锅复炸约 15 秒，看到外壳更酥脆 → 捞出（放凉也不易回软）。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 蛋黄去腥<\/strong><\/p>\n<ol start=\"5\">\n<li>蛋黄压碎前喷几滴白酒（或滴几滴料酒拌一下），炒的时候腥味减、香气增。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 控油<\/strong><\/p>\n<ol start=\"6\">\n<li>炸好的南瓜先放厨房纸上吸掉多余油，成品更清爽不腻。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.douguo.net/cookbook/3113547.html\">豆果美食 · 咸蛋黄焗南瓜<\/a> —— 熟咸蛋黄 + 南瓜的经典配比，适合对照「进阶版」的控水拍粉<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1Yu411A7L1/\">金黄酥脆、口感鲜美——蛋黄焗南瓜（哔哩哔哩）<\/a> —— 强调复炸酥脆，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「根根分明、金沙均匀、外酥里糯」。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 淀粉掺吉士粉<\/strong><\/p>\n<ol>\n<li>淀粉里掺约 1 小勺吉士粉，裹粉炸出来颜色更金黄、带一股淡淡奶香。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 黄油或猪油炒蛋黄<\/strong><\/p>\n<ol start=\"2\">\n<li>炒蛋黄用黄油或猪油打底。<\/li>\n<li>小火炒到「沙状翻沙、泡沫绵密」→ 再下南瓜，金沙更香、更挂得住。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 关火裹沙<\/strong><\/p>\n<ol start=\"4\">\n<li>下南瓜后关火（或极小火）翻拌。<\/li>\n<li>快速颠锅，让金沙均匀包裹，避免高温把外壳焖软。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 出锅前撒葱花<\/strong><\/p>\n<ol start=\"6\">\n<li>出锅前撒葱花，用锅的余温激出葱香。<\/li>\n<li>看到「根根分明、金沙均匀」、不结块不粘连 → 趁热吃最香。<\/li>\n<\/ol>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "3", "name": "地三鲜", "title": "地三鲜", "category": "蔬菜", "ingredient": "土豆", "ings": [["土豆"], ["长茄子"], ["青椒"], ["蒜"], ["生抽"], ["老抽"], ["蚝油"], ["白糖"], ["淀粉"], ["食用油"]], "opt": [false, false, false, false, false, false, false, false, false, false], "tags": [], "html": "<h1>地三鲜<\/h1>\n<blockquote>\n<p>归属食材：土豆 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>东北家常素菜，味型咸鲜微甜，土豆、茄子、青椒三样合炒。三样食材火候不同，讲究分别过油再合炒勾芡，成品酱香浓郁、下饭。以下按三档给出做法。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：三样都熟、咸鲜下饭）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>土豆<\/td>\n<td>1 个（中等，约 200g）<\/td>\n<td>黄心土豆更绵<\/td>\n<\/tr>\n<tr>\n<td>长茄子<\/td>\n<td>1 根（约 200g）<\/td>\n<td>紫长茄，肉厚少籽<\/td>\n<\/tr>\n<tr>\n<td>青椒<\/td>\n<td>1 个<\/td>\n<td>选肉厚不辣的，或尖椒<\/td>\n<\/tr>\n<tr>\n<td>蒜<\/td>\n<td>3~4 瓣<\/td>\n<td>一半炝锅、一半出锅撒<\/td>\n<\/tr>\n<tr>\n<td>生抽<\/td>\n<td>2 汤匙<\/td>\n<td>底味<\/td>\n<\/tr>\n<tr>\n<td>老抽<\/td>\n<td>1/2 小勺<\/td>\n<td>上色<\/td>\n<\/tr>\n<tr>\n<td>蚝油<\/td>\n<td>1 汤匙<\/td>\n<td>提鲜<\/td>\n<\/tr>\n<tr>\n<td>白糖<\/td>\n<td>1 小勺<\/td>\n<td>提鲜<\/td>\n<\/tr>\n<tr>\n<td>淀粉<\/td>\n<td>1 汤匙 + 少许<\/td>\n<td>调碗汁、给茄子拍粉<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>约 500ml<\/td>\n<td>过油用，家常可改用煎<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 改刀<\/strong><\/p>\n<ol>\n<li>土豆去皮，切滚刀块，泡进清水里防氧化。<\/li>\n<li>茄子去蒂，切滚刀块，表面拍一层薄淀粉（减少吸油）。<\/li>\n<li>青椒去籽，切块；蒜切末。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 过油（或煎）<\/strong><\/p>\n<ol start=\"4\">\n<li>锅倒油，烧到五六成热（筷子伸进去周围冒小泡）。<\/li>\n<li>先下土豆，炸 3~4 分钟，看到表面金黄、能用筷子轻松扎透 → 捞出。<\/li>\n<li>再下茄子，炸约 2 分钟，看到变软、边缘微焦 → 捞出。<\/li>\n<li>最后下青椒，过油 10 秒，保持脆绿，立刻捞出。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 调碗汁<\/strong><\/p>\n<ol start=\"8\">\n<li>小碗里放生抽、老抽、蚝油、白糖、淀粉和半小碗清水，搅匀备用。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 合炒<\/strong><\/p>\n<ol start=\"9\">\n<li>锅里留底油，下一半蒜末爆香。<\/li>\n<li>倒入碗汁，小火熬到冒泡、变浓。<\/li>\n<li>倒入三样食材，大火快速翻拌 30 秒，让汁均匀裹上。<\/li>\n<li>撒剩下的一半蒜末，出锅。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>茄子吸油太凶、成品油腻<\/strong>：没拍淀粉、油温不够就下锅。茄子拍薄粉 + 油够热再下。<\/li>\n<li><strong>土豆没熟<\/strong>：炸的时间太短。土豆是三者里最难熟的，用筷子能扎透才算熟。<\/li>\n<li><strong>青椒炒软了<\/strong>：青椒只过油 10 秒或不过油，最后快炒，保持脆感。<\/li>\n<li><strong>碗汁没勾起来、水汪汪<\/strong>：淀粉没搅匀或熬得不够。碗汁要熬到冒泡变稠再下菜。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://mpartner.xiachufang.com/recipe/107383363/\">下厨房 · 给肉都不换的经典素菜地三鲜<\/a> —— 步骤图详细，适合对照「初学版」<\/li>\n<li><a href=\"https://mpartner.xiachufang.com/recipe/107149507/\">下厨房 · 地三鲜的做法<\/a> —— 基础做法，适合对照「初学版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV15g4y1s7Lx/\">地三鲜｜新学会的米饭消失术<\/a> —— 做法清晰，适合对照「初学版 / 进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：分别过油 / 少油 / 蒜末两放）<\/h2>\n<p>在初学版基础上，掌握下面四条，三样口感分明、酱汁油亮。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 三样分别过油，火候不同<\/strong><\/p>\n<ol>\n<li>土豆最耐炸，先下、中火炸 3~4 分钟，看到金黄微焦 → 捞出。<\/li>\n<li>茄子吸油，切块后拍淀粉，大火快炸 2 分钟，看到变软 → 捞出。<\/li>\n<li>青椒只求断生，过油 10 秒即出。三样分开炸，各自达到最佳口感。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 少油替代方案<\/strong><\/p>\n<ol start=\"4\">\n<li>想少油就用「煎」代替炸：土豆切块后中火焖煎到金黄。<\/li>\n<li>茄子加盐腌 10 分钟、挤水，再干煸到软；青椒干煸出虎皮。<\/li>\n<li>三样各自处理后再合炒，油量能减一大半。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 蒜末分两次放<\/strong><\/p>\n<ol start=\"7\">\n<li>一半蒜末炝锅出香，一半出锅前撒入，利用余温激出蒜香——蒜香足了才下饭。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 碗汁提前调好<\/strong><\/p>\n<ol start=\"8\">\n<li>生抽 2 : 老抽 0.5 : 蚝油 1 : 糖 1 小勺 + 淀粉 + 清水，调成一份「万能咸鲜汁」。<\/li>\n<li>熬到汁「挂铲」再下菜，成品才亮、才入味。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://m.lezuocai.com/recipe/2070072/\">乐做菜 · 地三鲜（超详细，连原材料都不会买的亲看这）<\/a> —— 讲解细致，适合对照「进阶版」的少油处理<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「土豆外焦里绵、茄子软糯不吸油、青椒脆嫩，出锅亮芡带锅气」。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 食材预处理<\/strong><\/p>\n<ol>\n<li>土豆滚刀块切得大小均匀（约 2~3cm），保证成熟一致。<\/li>\n<li>茄子用盐腌一下、挤水，既少吸油又更易出虎皮。<\/li>\n<li>青椒选薄皮尖椒，香味更足。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 宽油过油的温度<\/strong><\/p>\n<ol start=\"4\">\n<li>土豆用 5 成热（约 150℃）慢炸，把内部炸透。<\/li>\n<li>茄子用 7 成热（约 180℃）快炸，外壳定型、内里软糯。<\/li>\n<li>青椒极短时间过油，锁住颜色。三种油温是口感分层的来源。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 芡汁的浓度<\/strong><\/p>\n<ol start=\"7\">\n<li>芡汁用「生抽 + 蚝油 + 糖」打底，淀粉水调成流水状（不是糊状）。<\/li>\n<li>熬到起泡、汁面发亮、能挂在铲背 → 下菜。<\/li>\n<li>颠勺几下即亮芡，成品油亮不糊嘴。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 锅气<\/strong><\/p>\n<ol start=\"10\">\n<li>最后一步大火快炒，三样食材回锅后 30 秒内完成裹汁、撒蒜、出锅——慢一步青椒塌软、土豆回油，锅气就没了。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.bilibili.com/video/BV1ur4y1J7RU/\">拿肉都不换的地三鲜，软软糯糯超级下饭<\/a> —— 出锅细节，适合对照「大厨版」<\/li>\n<\/ul>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "4", "name": "酸辣土豆丝", "title": "酸辣土豆丝", "category": "蔬菜", "ingredient": "土豆", "ings": [["土豆"], ["干辣椒"], ["蒜"], ["小葱"], ["花椒"], ["白醋"], ["生抽"], ["盐"], ["白糖"], ["食用油"]], "opt": [false, false, false, false, false, false, false, false, false, false], "tags": [], "html": "<h1>酸辣土豆丝<\/h1>\n<blockquote>\n<p>归属食材：土豆 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>国民下饭菜，酸辣脆爽，成败全看土豆丝够不够「脆」。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、够脆、不难吃）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>土豆<\/td>\n<td>2 个（中等，约 400g）<\/td>\n<td>黄心土豆更香，淀粉别太高<\/td>\n<\/tr>\n<tr>\n<td>干辣椒<\/td>\n<td>3~4 个<\/td>\n<td>剪段，怕辣可去籽<\/td>\n<\/tr>\n<tr>\n<td>蒜<\/td>\n<td>2 瓣<\/td>\n<td>切片<\/td>\n<\/tr>\n<tr>\n<td>小葱<\/td>\n<td>1 根<\/td>\n<td>切段，出锅前撒<\/td>\n<\/tr>\n<tr>\n<td>花椒<\/td>\n<td>1 小撮（约 20 粒）<\/td>\n<td>炸香后捞出<\/td>\n<\/tr>\n<tr>\n<td>白醋<\/td>\n<td>2 汤匙（约 20ml）<\/td>\n<td>分两次用，是「酸」的来源<\/td>\n<\/tr>\n<tr>\n<td>生抽<\/td>\n<td>1 小勺（约 5ml）<\/td>\n<td>提咸鲜<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>约 1/2 小勺（2g）<\/td>\n<td>最后调味<\/td>\n<\/tr>\n<tr>\n<td>白糖<\/td>\n<td>1/2 小勺（约 2g）<\/td>\n<td>提鲜、中和酸辣<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>2 汤匙（约 20ml）<\/td>\n<td>分两次用<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点，全程大火快炒）<\/strong><\/p>\n<p><strong>第 1 步 · 切丝泡水<\/strong><\/p>\n<ol>\n<li>土豆去皮，先切成约 2mm 的薄片，再码齐切成细丝，粗细越均匀越好。<\/li>\n<li>切好的丝立刻放进清水里，用手抓洗 2~3 遍，洗到水不再浑浊。<\/li>\n<li>换清水泡 5 分钟，捞出沥干——洗掉表面淀粉，炒出来才脆、不粘锅。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 备配料<\/strong><\/p>\n<ol start=\"4\">\n<li>干辣椒剪成小段（怕辣就抖掉籽），蒜切片，葱切段。<\/li>\n<li>白醋、生抽、盐、糖都摆在手边——这道菜炒起来很快，料要先备齐。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 炸花椒<\/strong><\/p>\n<ol start=\"6\">\n<li>锅烧热后倒 1 汤匙油，转小火，下花椒慢慢炸。<\/li>\n<li>炸约 30 秒，看到花椒颜色变深、闻到明显麻香 → 把花椒捞出扔掉，只留油。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 爆香<\/strong><\/p>\n<ol start=\"8\">\n<li>转中大火，下干辣椒段和蒜片，快速翻炒约 10 秒，闻到辣香和蒜香就停（别让辣椒炒黑）。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 快炒出锅<\/strong><\/p>\n<ol start=\"9\">\n<li>转最大火，倒入沥干的土豆丝，快速翻炒约 1~2 分钟。<\/li>\n<li>沿锅边淋入一半白醋，加盐、糖、生抽，继续翻炒 30 秒。<\/li>\n<li>夹一根尝尝，熟透但仍脆、不软塌 → 沿锅边再淋剩下的一半白醋，撒葱段，翻两下关火出锅。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>土豆丝粘锅、成团<\/strong>：切好没淘洗、没泡水就去炒。记住「洗到水清 + 沥干」再下锅。<\/li>\n<li><strong>炒软了不脆<\/strong>：火不够大、炒得太久，或者没有沿锅边淋醋。醋能保脆，全程大火、断生就出锅。<\/li>\n<li><strong>醋味太冲 / 没醋味<\/strong>：醋放得太早会被炒挥发、酸味变淡；放得太晚又刺鼻。正确做法是分两次：中途淋一半、出锅前沿锅边再淋一半。<\/li>\n<li><strong>辣椒炒糊发苦<\/strong>：干辣椒不能在大火热油里久炒。油温别太高时下辣椒，或先关小火再下。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/107268892/\">下厨房 · 酸辣土豆丝（大火快炒脆爽版）<\/a> —— 强调火候与手速，适合对照「初学版」<\/li>\n<li><a href=\"https://m.douguo.com/caipuzuofa/134759/32\">豆果美食 · 酸辣土豆丝做法合集<\/a> —— 多版本对照，适合查配料差异<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1nbbSeuEsK/\">酸辣土豆丝这么做出来，清脆酸爽，无敌下饭～（哔哩哔哩）<\/a> —— 家常易学，适合拌饭<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：切丝 / 分两次放醋 / 火候 / 提鲜）<\/h2>\n<p>在初学版基础上，掌握下面四条，成品质感会上一个台阶。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 切丝要「细而均匀」<\/strong><\/p>\n<ol>\n<li>先把土豆修成整齐的片，再逐片码成「小楼梯」切丝。<\/li>\n<li>保证每根粗细接近，受热才一致，不会有的生、有的烂。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 醋分两次放（灵魂）<\/strong><\/p>\n<ol start=\"3\">\n<li>第一次：土豆丝刚下锅、还没炒软时淋一半醋——醋帮忙去掉表面淀粉、让丝更脆，酸味先渗进去。<\/li>\n<li>第二次：出锅前 10~20 秒沿锅边淋剩下的一半——锅边温度最高，醋一接触就挥发掉冲味、只留下醋香。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 白糖提鲜<\/strong><\/p>\n<ol start=\"5\">\n<li>加一点点糖（吃不出甜味的量），中和干辣椒的燥辣和醋的尖酸，让酸辣更圆润。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 火候<\/strong><\/p>\n<ol start=\"6\">\n<li>全程最大火、快速翻锅，土豆丝「断生即出」——刚熟还带着脆劲；多炒 30 秒就会回软出水。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/105889017/\">下厨房 · 跟着小高姐做了酸辣土豆丝<\/a> —— 醋水浸泡 + 花椒辣椒煸香，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「根根分明、酸香扑鼻、出锅带锅气」。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 泡醋水防氧化<\/strong><\/p>\n<ol>\n<li>切丝后泡水时加 1 汤匙白醋——土豆丝更白、更脆，也不会发黑。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 花椒油提香<\/strong><\/p>\n<ol start=\"2\">\n<li>冷油小火下花椒，炸约 1 分钟，看到花椒变棕红色 → 捞出。<\/li>\n<li>用这锅花椒油炒菜，麻香是普通油比不了的。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 蒜分两次放<\/strong><\/p>\n<ol start=\"4\">\n<li>爆香用蒜片，炒出底香。<\/li>\n<li>出锅前再撒一点生蒜末，翻两下，生蒜的辛香和熟蒜的醇香叠在一起。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 锅气<\/strong><\/p>\n<ol start=\"6\">\n<li>出锅前沿锅边淋醋，立刻离火，颠两下就装盘——全程动作要快，锅气（高温 + 快炒带来的香气）凉了就散。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.bilibili.com/video/BV1A54y1m7iU/\">饭店的酸辣土豆丝为啥那么好吃？大厨教你正确方法（哔哩哔哩）<\/a> —— 讲透脆爽关键，适合对照「大厨版」<\/li>\n<\/ul>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "5", "name": "清炒山药木耳", "title": "清炒山药木耳", "category": "蔬菜", "ingredient": "山药", "ings": [["山药"], ["干木耳"], ["胡萝卜"], ["蒜"], ["小葱"], ["盐"], ["生抽"], ["白醋"], ["食用油"]], "opt": [false, false, true, false, false, false, true, false, false], "tags": [], "html": "<h1>清炒山药木耳<\/h1>\n<blockquote>\n<p>归属食材：山药 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>清淡爽脆的养胃小炒，成败在「山药削皮防手痒、切好泡水防变黑」——处理对了，白嫩的山药配黑木耳，清爽不腻。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、爽脆、不难吃）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>山药<\/td>\n<td>1 根（约 300g）<\/td>\n<td>铁棍山药口感更绵，脆山药更爽口，按喜好选<\/td>\n<\/tr>\n<tr>\n<td>干木耳<\/td>\n<td>10g（泡发后约 100g）<\/td>\n<td>提前用温水泡发<\/td>\n<\/tr>\n<tr>\n<td>胡萝卜<\/td>\n<td>半根<\/td>\n<td>切片配色（可选）<\/td>\n<\/tr>\n<tr>\n<td>蒜<\/td>\n<td>2 瓣<\/td>\n<td>切片<\/td>\n<\/tr>\n<tr>\n<td>小葱<\/td>\n<td>1 根<\/td>\n<td>切段，出锅前撒<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>约 1 小勺（5g）<\/td>\n<td>分次放<\/td>\n<\/tr>\n<tr>\n<td>生抽<\/td>\n<td>1 小勺（约 5ml）<\/td>\n<td>提鲜（可选，放多会染色）<\/td>\n<\/tr>\n<tr>\n<td>白醋<\/td>\n<td>几滴<\/td>\n<td>泡山药防黑用，炒时也可滴几滴<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>2 汤匙（约 20ml）<\/td>\n<td>分两次用<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 泡木耳<\/strong><\/p>\n<ol>\n<li>干木耳放进温水里泡发约 20~30 分钟，泡软后撕成小朵、去掉根部的硬蒂，洗净——木耳现泡现用，泡太久会坏。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 处理山药（防手痒）<\/strong><\/p>\n<ol start=\"2\">\n<li>先戴一次性手套（或手上套个保鲜袋），再给山药削皮——山药黏液沾手会痒，别让皮肤直接碰。<\/li>\n<li>削好的山药切成约 2mm 的薄片（或菱形片），立刻放进加了几滴白醋的清水里泡着，防止变黑、去掉表面黏液。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 焯水<\/strong><\/p>\n<ol start=\"4\">\n<li>锅里烧水，水开后下山药片和木耳，烫约 1 分钟，看到山药由硬变微透明 → 捞出沥干。焯水就是放滚水里短烫一下，蔬菜开水下锅保色保脆。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 炒<\/strong><\/p>\n<ol start=\"5\">\n<li>锅烧热倒 2 汤匙油，下蒜片爆香约 10 秒，闻到蒜香 → 下胡萝卜片（若用）翻炒约 30 秒。<\/li>\n<li>倒山药和木耳，转大火翻炒约 1~2 分钟，太干就沿锅边淋一小勺清水防糊。<\/li>\n<li>加盐、生抽，沿锅边滴几滴白醋，撒葱段，翻匀；夹一片尝：熟了仍脆 → 关火出锅。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>削山药手痒<\/strong>：没戴手套。山药黏液里含刺激皮肤的物质，一定戴手套或套保鲜袋；已经痒了，用白醋搓洗、再用热水冲能缓解。<\/li>\n<li><strong>山药变黑<\/strong>：切好没泡水。切好立刻泡进加了几滴醋的清水里。<\/li>\n<li><strong>炒糊底<\/strong>：山药含淀粉容易粘锅。火别太干，太干时沿锅边淋一点清水。<\/li>\n<li><strong>炒烂不脆<\/strong>：炒太久。焯过水的山药下锅 1~2 分钟、断生就出锅。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/106079264/\">下厨房 · 清炒山药木耳<\/a> —— 讲清山药泡水防黑和快炒保脆，适合对照「初学版」<\/li>\n<li><a href=\"https://www.douguo.net/cookbook/2289500.html\">豆果美食 · 清炒山药木耳<\/a> —— 家常步骤完整，含焯水和配色建议<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：泡醋水防黑 / 焯水保脆 / 保持洁白 / 勾薄芡）<\/h2>\n<p>在初学版基础上，掌握下面几条，成品质感会上一个台阶。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 泡醋水防黑<\/strong><\/p>\n<ol>\n<li>清水里加几滴白醋泡山药——酸能抑制氧化，山药切好泡在里面就不会变黑。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 焯水锁脆<\/strong><\/p>\n<ol start=\"2\">\n<li>山药、木耳先焯水，下锅炒制时间就短，口感更脆、颜色更好。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 保持洁白<\/strong><\/p>\n<ol start=\"3\">\n<li>想让山药白净，就别放老抽、生抽（会染色），只用盐调味，出锅前滴几滴白醋提亮去生味。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 勾薄芡（可选）<\/strong><\/p>\n<ol start=\"4\">\n<li>出锅前淋一点水淀粉（淀粉 + 冷水调匀），让汤汁变浓、均匀挂在山药上，更入味。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://m-pr.douguo.com/cookbook/3231330.html\">豆果美食 · 清炒山药木耳（做法视频）<\/a> —— 视频演示去皮、泡水、快炒全过程，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「洁白脆嫩、清亮不糊、出锅带锅气」。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 热锅凉油防粘<\/strong><\/p>\n<ol>\n<li>山药含淀粉、容易粘锅，先空锅烧到微微冒烟再倒油、油热再下料——「热锅凉油」能让它不粘。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 山药两吃<\/strong><\/p>\n<ol start=\"2\">\n<li>脆山药（菜山药）适合清炒出爽脆；铁棍山药适合炒出粉糯口感——按想要的口感选品种。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 快炒出锅气<\/strong><\/p>\n<ol start=\"3\">\n<li>全程大火、动作快，出锅带「锅气」（高温 + 快炒带来的焦香），凉了就散，趁热吃。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 出锅前滴白醋<\/strong><\/p>\n<ol start=\"4\">\n<li>出锅前沿锅边滴几滴白醋，提亮颜色、去掉生味，山药更白更清爽。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.bilibili.com/video/BV1Lw41167Zc/\">哔哩哔哩 · 木耳炒山药<\/a> —— 低卡清爽的快炒演示，适合对照「大厨版」（点开核对是否与本菜一致）<\/li>\n<\/ul>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "6", "name": "蒜蓉油菜", "title": "蒜蓉油菜", "category": "蔬菜", "ingredient": "油菜", "ings": [["油菜"], ["大蒜"], ["盐"], ["食用油"], ["生抽"], ["蚝油"]], "opt": [false, false, false, false, true, true], "tags": [], "html": "<h1>蒜蓉油菜<\/h1>\n<blockquote>\n<p>归属食材：油菜 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>一道清口绿叶菜，蒜香配油菜的清甜。成败关键在「沥干水再下锅」和「大火快炒」，水多就变水煮、炒久就软塌。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、不难吃）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>油菜<\/td>\n<td>1 把（约 300g）<\/td>\n<td>挑叶子绿、根部不发黄的<\/td>\n<\/tr>\n<tr>\n<td>大蒜<\/td>\n<td>4~5 瓣<\/td>\n<td>切片或切末<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>1/2 小勺（约 2g）<\/td>\n<td>调味<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>1.5 汤匙（约 15ml）<\/td>\n<td>家常量<\/td>\n<\/tr>\n<tr>\n<td>生抽<\/td>\n<td>1 小勺（约 5ml）<\/td>\n<td>可选，提咸鲜<\/td>\n<\/tr>\n<tr>\n<td>蚝油<\/td>\n<td>1/2 汤匙<\/td>\n<td>可选，提鲜<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 洗菜<\/strong><\/p>\n<ol>\n<li>油菜切掉老根，一叶叶掰开，重点冲洗根部缝隙里的泥沙。<\/li>\n<li>放清水里加 1 小勺盐泡 5 分钟，再换水冲净，捞出甩干——这一步最要紧，带水下锅会变水煮。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 备蒜<\/strong><\/p>\n<ol start=\"3\">\n<li>大蒜拍扁去皮，切成蒜末（或蒜片），装碗放灶台边。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 大火快炒<\/strong><\/p>\n<ol start=\"4\">\n<li>锅烧热倒油，转大火，油微微冒烟 → 下蒜末，快速翻炒约 10 秒。<\/li>\n<li>闻到蒜香、蒜末没焦 → 下油菜，用锅铲不停翻，让每片叶子都沾上油。<\/li>\n<li>炒约 1 分钟，看到叶子变软、颜色转深绿、菜帮变得有点透 → 加盐（提鲜就加生抽或蚝油），翻匀关火出锅。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>水煮味、出汤多<\/strong>：菜没甩干就下锅。洗完一定甩干，锅要热、火要大。<\/li>\n<li><strong>菜炒烂发黄<\/strong>：炒太久。油菜叶子一软就出锅，别恋战。<\/li>\n<li><strong>根部泥沙没洗净<\/strong>：油菜根部最容易藏泥，要掰开冲、盐水泡。<\/li>\n<li><strong>蒜炒糊发苦<\/strong>：蒜末别在热油里久炒，闻到香味就下菜。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/104416013/\">下厨房 · 蒜蓉油菜的做法<\/a> —— 家常快炒版，适合对照初学版<\/li>\n<li><a href=\"http://mwx.douguo.com/cookbook/2533815.html\">豆果美食 · 蒜蓉油菜怎么做<\/a> —— 多版本，可查调料配比<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：沥干 / 蒜分两次 / 焯水淋汁）<\/h2>\n<p>在初学版基础上，掌握下面几点成品质感会上台阶。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 充分沥干<\/strong><\/p>\n<ol>\n<li>洗好的油菜放漏网上自然沥 5 分钟，再用厨房纸或干净布吸一吸根部的水，下锅才脆、不出汤。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 蒜分两次放<\/strong><\/p>\n<ol start=\"2\">\n<li>一半蒜末先下锅爆香，炒出底香。<\/li>\n<li>出锅前撒剩下的一半蒜末，翻两下关火——生熟两种蒜香叠加。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 焯水淋汁法（更清爽）<\/strong><\/p>\n<ol start=\"4\">\n<li>想更清爽：先烧一锅水，水开后加少许盐和几滴油，把油菜放进滚水里短烫（这就是焯水）30~40 秒，看到根部变透亮 → 捞出沥干摆盘。<\/li>\n<li>另起锅小火爆香蒜末，加 1 汤匙生抽、1/2 汤匙蚝油、2 汤匙清水，煮开后淋在菜上。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/106605164/\">下厨房 · 蒜蓉油菜的做法<\/a> —— 焯水淋汁与快炒两法对照<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求翠绿油亮、根叶都入味、出锅带锅气。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 根部改刀<\/strong><\/p>\n<ol>\n<li>大棵油菜把根部对半切开或一开四，粗细和叶子接近，受热才均匀、好入味。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 蒜蓉炼香<\/strong><\/p>\n<ol start=\"2\">\n<li>蒜末分三份：先下锅一份爆香、翻炒中途加一份、出锅前撒一份。<\/li>\n<li>爆香用小火，把蒜末煸到微微金黄，蒜油香先渗进油里。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 猛火快炒<\/strong><\/p>\n<ol start=\"4\">\n<li>油温七八成热（油面明显冒烟）下菜，保持最大火，靠锅的高温把菜「撞」熟而不是焖熟。<\/li>\n<li>调味只放盐和一点点糖提鲜，沿锅边淋几滴水，立刻颠锅让蒸汽把菜烫匀。<\/li>\n<li>叶子刚软、锅底无水 → 撒生蒜末，颠两下离火装盘，锅气（高温快炒那股焦香）趁热才有。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.bilibili.com/video/av327756124/\">哔哩哔哩 · 蒜蓉油菜（当和）<\/a> —— 视频演示，看焯水与快炒的火候<\/li>\n<\/ul>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "7", "name": "洋葱炒蛋", "title": "洋葱炒蛋", "category": "蔬菜", "ingredient": "洋葱", "ings": [["洋葱"], ["鸡蛋"], ["盐"], ["食用油"], ["生抽"]], "opt": [false, false, false, false, false], "tags": [], "html": "<h1>洋葱炒蛋<\/h1>\n<blockquote>\n<p>归属食材：洋葱 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>洋葱脆甜、鸡蛋嫩香，几分钟出锅的快手下饭菜，甜味自然、不加糖也好吃。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、不难吃）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>洋葱<\/td>\n<td>1 个（中等，约 200g）<\/td>\n<td>挑表皮干爽、拿在手里沉甸甸的<\/td>\n<\/tr>\n<tr>\n<td>鸡蛋<\/td>\n<td>3 个（约 150g）<\/td>\n<td>常温蛋更好打散<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>约 1/2 小勺（2g）<\/td>\n<td>分两次放<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>2 汤匙（约 20ml）<\/td>\n<td>分两次用<\/td>\n<\/tr>\n<tr>\n<td>生抽（可选）<\/td>\n<td>几滴<\/td>\n<td>提鲜<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点，全程中大火）<\/strong><\/p>\n<p><strong>第 1 步 · 切洋葱<\/strong><\/p>\n<ol>\n<li>洋葱剥掉外层老皮，切去头尾。<\/li>\n<li>先对半切开，再顺着纹路切成约 0.5cm 宽的丝（顺纹路口感更脆，逆纹路更易软烂）。<\/li>\n<li>切之前把刀和洋葱冲一下凉水，能少辣眼睛。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 打蛋<\/strong><\/p>\n<ol start=\"4\">\n<li>鸡蛋磕进碗里，加 1 小撮盐（约 1g）。<\/li>\n<li>用筷子朝一个方向打散，打到蛋清蛋黄完全融合、表面起细沫。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 炒蛋<\/strong><\/p>\n<ol start=\"6\">\n<li>锅烧热，倒 1 汤匙油，晃动锅让油铺满锅底。<\/li>\n<li>等约 10 秒，看到油微微冒烟 → 倒入蛋液，先别急着动。<\/li>\n<li>等约 15 秒，看到底部凝固 → 用铲子从外往里轻轻推，让没凝固的蛋液流到锅底。<\/li>\n<li>鸡蛋基本成型、还带一点湿润 → 盛出备用（余温会把它烘到刚好）。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 炒洋葱合炒<\/strong><\/p>\n<ol start=\"10\">\n<li>锅里补剩下的 1 汤匙油，倒入洋葱丝，中大火翻炒约 2 分钟，看到洋葱变软、微微透明、能闻到甜香。<\/li>\n<li>把鸡蛋倒回锅里，加剩下的盐（约 1g）和几滴生抽，快速翻拌约 30 秒。<\/li>\n<li>尝一口咸淡，不够再加一点盐，关火出锅。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>洋葱炒过头<\/strong>：炒到发焦发苦。洋葱变软、半透明就说明熟了，及时下鸡蛋。<\/li>\n<li><strong>鸡蛋炒老<\/strong>：蛋液一进锅就不断翻炒。记住「还带一点湿润就盛」。<\/li>\n<li><strong>太辣呛眼睛<\/strong>：切洋葱前把刀和洋葱放凉水里冲一下，或把洋葱提前放冰箱冷藏半小时。<\/li>\n<li><strong>粘锅<\/strong>：锅没烧热就下蛋。先烧热锅再放油、油热再下料。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/100281925/\">下厨房 · 洋葱炒蛋<\/a> —— 只用盐调味、做法朴素，适合对照「初学版」<\/li>\n<li><a href=\"https://www.douguo.net/cookbook/197798.html\">豆果美食 · 洋葱炒蛋<\/a> —— 用量清楚，适合对照「初学版」比例<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV13N411T7PR/\">洋葱炒鸡蛋，这也太好吃了！真的香（哔哩哔哩）BV13N411T7PR<\/a> —— 简单快手，适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：甜味 / 酱香 / 分层下锅）<\/h2>\n<p>在初学版基础上，掌握下面几条，成品质感会上一个台阶。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 炒出洋葱的甜味<\/strong><\/p>\n<ol>\n<li>洋葱下锅后，中火炒到变软、微微上色（约 2 分钟）——甜味和香气才释放出来。<\/li>\n<li>没炒到这一步别急着下鸡蛋（下锅就急着下鸡蛋，洋葱还是生辣味）。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 酱香口（可选换酱油口）<\/strong><\/p>\n<ol start=\"3\">\n<li>想把味道做浓，先把调味汁调好：生抽 1 汤匙 + 蚝油 1/2 汤匙 + 糖 1 小勺 + 清水 2 汤匙搅匀。<\/li>\n<li>合炒时倒进去，大火翻炒到汤汁裹匀，就是「酱香浓郁」的路子。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 洋葱分两次下<\/strong><\/p>\n<ol start=\"5\">\n<li>一半洋葱丝先炒到透明上色（提供甜味底子）。<\/li>\n<li>另一半后下、只炒十几秒保持脆感，成品「一半软甜一半脆」。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 鸡蛋更嫩滑<\/strong><\/p>\n<ol start=\"7\">\n<li>蛋液里加 1 小勺清水 + 几滴白醋（或料酒），打散到起细泡。<\/li>\n<li>油温六成热下锅，八成熟就盛出。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.douguo.net/cookbook/1701395.html\">豆果美食 · 炒洋蛋（洋葱炒蛋）<\/a> —— 含变体调味，适合对照「进阶版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1LUHazxEaP/\">洋葱炒鸡蛋，酱香浓郁脆甜美味（哔哩哔哩）BV1LUHazxEaP<\/a> —— 酱香口，适合对照「进阶版」酱香调味<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「鸡蛋蓬松带蛋香、洋葱半脆半甜、出锅带镬气」。每一步都是细节。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 鸡蛋——蓬松嫩滑<\/strong><\/p>\n<ol>\n<li>3 个蛋加 1/4 小勺盐、几滴白醋、1 小勺清水，顺一个方向打到表面全是细泡（约 1 分钟）。<\/li>\n<li>空锅烧到冒青烟，再下约 3 汤匙油（宽油），油热到八成（油面明显冒烟、微微波动）。<\/li>\n<li>倒入蛋液，用锅铲 <strong>背面<\/strong> 从四周向中间迅速兜散，<strong>刚断生就离火盛出<\/strong>（全程约 20 秒）。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 洋葱先「炝」出香气<\/strong><\/p>\n<ol start=\"4\">\n<li>油里先下几粒干辣椒或一小撮花椒（可选），小火炝香后捞出。<\/li>\n<li>再用这锅油炒洋葱，香气层次更丰富。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 大火收干<\/strong><\/p>\n<ol start=\"6\">\n<li>洋葱回锅后全程大火、动作要快，把洋葱里的水汽炒掉，炒到边缘微微焦边，甜香才最浓。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 出锅前点味<\/strong><\/p>\n<ol start=\"7\">\n<li>沿锅边淋几滴生抽提鲜（可选），大火颠两下。<\/li>\n<li>关火前点几滴香油，趁热上桌。<\/li>\n<\/ol>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "8", "name": "蚝油生菜", "title": "蚝油生菜", "category": "蔬菜", "ingredient": "生菜", "ings": [["生菜"], ["大蒜"], ["蚝油"], ["生抽"], ["白糖"], ["盐"], ["清水"], ["淀粉"], ["食用油"], ["小米辣"]], "opt": [false, false, false, false, false, false, false, false, false, true], "tags": [], "html": "<h1>蚝油生菜<\/h1>\n<blockquote>\n<p>归属食材：生菜 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>粤菜里的经典快手菜：生菜烫得翠绿爽脆，淋上咸鲜带微甜的蚝油蒜蓉汁。成败就两条——生菜别烫过头、蚝油汁要勾芡挂得住。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、不难吃）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>生菜<\/td>\n<td>1 颗（约 400g）<\/td>\n<td>叶生菜、球生菜都行，挑叶片完整、根部不发黄发黑的<\/td>\n<\/tr>\n<tr>\n<td>大蒜<\/td>\n<td>4 瓣<\/td>\n<td>剁成蒜末，越细越好<\/td>\n<\/tr>\n<tr>\n<td>蚝油<\/td>\n<td>1 汤匙（约 15g）<\/td>\n<td>咸鲜来源，本身偏咸，别多放<\/td>\n<\/tr>\n<tr>\n<td>生抽<\/td>\n<td>1 小勺（约 5ml）<\/td>\n<td>提咸味<\/td>\n<\/tr>\n<tr>\n<td>白糖<\/td>\n<td>1/2 小勺（约 2g）<\/td>\n<td>去生菜微苦、提鲜，吃不出甜味<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>1/2 小勺<\/td>\n<td>焯水时给菜入底味<\/td>\n<\/tr>\n<tr>\n<td>清水<\/td>\n<td>3 汤匙（约 45ml）<\/td>\n<td>调汁用<\/td>\n<\/tr>\n<tr>\n<td>淀粉<\/td>\n<td>1 小勺<\/td>\n<td>用冷水调开，让汁变稠挂住菜<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>1 汤匙 + 几滴<\/td>\n<td>炒蒜用 + 焯水保色<\/td>\n<\/tr>\n<tr>\n<td>小米辣<\/td>\n<td>1 个<\/td>\n<td>可选，不吃辣可不加<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 洗菜<\/strong><\/p>\n<ol>\n<li>生菜一片片掰开，放进清水里，加 1 小勺盐轻轻翻洗，泡 5 分钟。<\/li>\n<li>换清水冲一遍，捞出沥干——叶子上别留太多水，否则汁会被冲淡。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 备料<\/strong><\/p>\n<ol start=\"3\">\n<li>大蒜拍扁去皮，剁成蒜末，越细越好。<\/li>\n<li>小碗里把蚝油、生抽、白糖、清水倒一起搅匀；淀粉另用小碗加 2 汤匙冷水搅成牛奶状，都摆到手边。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 焯水（把生菜放进滚水里短烫一下，烫熟还保脆）<\/strong><\/p>\n<ol start=\"5\">\n<li>烧一锅水，水开（水面滚起大泡）后加半小勺盐和几滴油——盐入味、油让叶子更绿更亮。<\/li>\n<li>生菜下锅，用筷子把叶子压进水里，烫约 15~20 秒。<\/li>\n<li>看到生菜颜色变透亮翠绿、菜帮刚变软 → 立刻捞出，沥干水装盘。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 熬汁淋上<\/strong><\/p>\n<ol start=\"8\">\n<li>炒锅烧热，倒 1 汤匙油，转小火下蒜末（怕辣这时也下小米辣圈）。<\/li>\n<li>炒约 20 秒，闻到明显蒜香、蒜末微微发黄 → 倒入调好的蚝油汁，再倒进水淀粉。<\/li>\n<li>转中火，边搅边煮，看到汁冒泡、变得浓稠能挂在勺上 → 关火。<\/li>\n<li>趁热把汁淋在生菜上，上桌。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>生菜发黄发黑<\/strong>：焯水太久。水开再下菜，15~20 秒就捞，宁短勿长。<\/li>\n<li><strong>汁不挂菜、水汪汪<\/strong>：没勾芡或芡太稀。淀粉必须先冷水调匀，汁要煮到冒泡、浓稠再淋。<\/li>\n<li><strong>蚝油没香味、还发咸<\/strong>：蚝油久煮会失味，别提前下锅煮太久；它本身咸，放了蚝油盐和生抽都要减。<\/li>\n<li><strong>生菜有苦味<\/strong>：加半小勺糖能去苦提鲜，量少、吃不出甜味。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/107082981/\">下厨房 · 蚝油生菜的做法步骤图<\/a> —— 步骤图清楚，适合对照焯水淋汁流程<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1XF4m1L7G8/\">哔哩哔哩 · 清脆爽口简单美味懒人必备——蚝油生菜<\/a> —— 视频演示，看焯水火候和熬汁<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：焯水保色 / 勾芡挂汁 / 蚝油后放 / 糖去苦）<\/h2>\n<p>在初学版基础上，掌握下面几点成品质感会上台阶。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 焯水保色<\/strong><\/p>\n<ol>\n<li>水开后先加盐、再滴油，等盐化开再下菜。<\/li>\n<li>生菜一下锅就用筷子把叶子全压进水里，让每片受热均匀。<\/li>\n<li>约 15 秒，看到叶子由生硬变透亮翠绿就捞——千万别等它塌软。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 沥水别过凉<\/strong><\/p>\n<ol start=\"4\">\n<li>捞出后放在漏网上自然沥干，不要过凉水——过凉会冲掉盐味，还让叶子更容易出水。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 勾芡挂汁（用淀粉水让汤汁变浓稠、挂在菜上）<\/strong><\/p>\n<ol start=\"5\">\n<li>淀粉一定先用冷水调成牛奶状，别用热水，否则会结块。<\/li>\n<li>蚝油汁下锅后转中火慢慢搅，冒泡后再搅约 10 秒，看到汁能薄薄挂在勺背 → 关火。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 蚝油后放<\/strong><\/p>\n<ol start=\"7\">\n<li>蚝油是提鲜的，久煮香味会跑掉，所以混在汁里最后下锅、煮开就停。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/106552317/\">下厨房 · 蚝油生菜<\/a> —— 另一版家常做法，可对照调料配比差异<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求菜脆、汁浓、挂味均匀的饭店质感。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 蒜分两次放<\/strong><\/p>\n<ol>\n<li>蒜末分两份：2/3 下锅炒香，1/3 留到关火前再下——生蒜的辛香叠上熟蒜的醇香，层次更足。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 熬汁见「大泡」<\/strong><\/p>\n<ol start=\"2\">\n<li>蚝油汁里加几滴老抽（只上色、不增味），汁色会由浅褐变红亮。<\/li>\n<li>中火熬到冒大泡、勺背能挂住明显一层汁 → 下剩余生蒜末，快速搅两下。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 淋明油<\/strong><\/p>\n<ol start=\"4\">\n<li>关火前沿锅边淋半汤匙热油，搅进汁里——汁面立刻油亮，浇上菜更有光泽。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 趁热浇汁<\/strong><\/p>\n<ol start=\"5\">\n<li>汁离火要立刻浇，凉了就稠、挂不匀。菜盘里生菜还热着，热汁热菜一碰，锅气（高温快炒带来的那股焦香）才出得来。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.bilibili.com/video/BV1bS4y1r7jR/\">哔哩哔哩 · 厨师长教你「蚝油生菜」的家常做法（王刚）<\/a> —— 讲透焯水保脆与「勾浓芡才挂得住菜」，适合对照大厨版<\/li>\n<\/ul>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "9", "name": "手撕包菜", "title": "手撕包菜", "category": "蔬菜", "ingredient": "白菜", "ings": [["包菜", "圆白菜"], ["干辣椒"], ["蒜"], ["花椒"], ["生抽"], ["蚝油"], ["盐"], ["白糖"], ["陈醋"], ["食用油"]], "opt": [false, false, false, false, false, false, false, false, false, false], "tags": [], "html": "<h1>手撕包菜<\/h1>\n<blockquote>\n<p>归属食材：白菜 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>快手素菜里的「米饭杀手」，脆爽微辣，关键在「手撕」和「大火快炒」。以下按三档给出做法。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能熟、脆爽、不难吃）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>包菜（圆白菜）<\/td>\n<td>半个（约 500g）<\/td>\n<td>挑紧实、拿起来沉的<\/td>\n<\/tr>\n<tr>\n<td>干辣椒<\/td>\n<td>3~4 个<\/td>\n<td>剪段，怕辣去籽<\/td>\n<\/tr>\n<tr>\n<td>蒜<\/td>\n<td>3 瓣<\/td>\n<td>切片<\/td>\n<\/tr>\n<tr>\n<td>花椒<\/td>\n<td>1 小撮（约 20 粒）<\/td>\n<td>炸香后捞出<\/td>\n<\/tr>\n<tr>\n<td>生抽<\/td>\n<td>1 汤匙（约 15ml）<\/td>\n<td>提咸鲜<\/td>\n<\/tr>\n<tr>\n<td>蚝油<\/td>\n<td>1 汤匙（约 15ml）<\/td>\n<td>提鲜、增厚<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>约 1/4 小勺（1g）<\/td>\n<td>生抽蚝油已有咸味，少放<\/td>\n<\/tr>\n<tr>\n<td>白糖<\/td>\n<td>1/2 小勺（约 2g）<\/td>\n<td>提鲜<\/td>\n<\/tr>\n<tr>\n<td>陈醋<\/td>\n<td>1 小勺（约 5ml）<\/td>\n<td>出锅前沿锅边淋<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>2 汤匙（约 20ml）<\/td>\n<td>分两次用<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点，全程大火）<\/strong><\/p>\n<p><strong>第 1 步 · 手撕<\/strong><\/p>\n<ol>\n<li>包菜去掉外层老叶，对半切开，去掉硬芯。<\/li>\n<li>用手撕成约 5cm 的片；粗硬的梗单独放，用刀背拍扁（或撕小一点），方便炒熟。<\/li>\n<li>洗净后一定沥干水分——叶子上带水会炒成「煮菜」。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 备配料<\/strong><\/p>\n<ol start=\"4\">\n<li>干辣椒剪段，蒜切片，生抽、蚝油、盐、糖、醋都摆在手边。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 炸花椒<\/strong><\/p>\n<ol start=\"5\">\n<li>锅烧热倒 1 汤匙油，转小火下花椒，炸约 30 秒，看到颜色变深、麻香出来 → 捞出花椒不要，只留油。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 爆香<\/strong><\/p>\n<ol start=\"6\">\n<li>转中大火，下干辣椒段和蒜片，快速炒约 10 秒出香（别让辣椒炒黑）。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 快炒调味<\/strong><\/p>\n<ol start=\"7\">\n<li>转最大火，先下拍过的硬梗炒 20 秒。<\/li>\n<li>再下叶子，快速翻炒约 2 分钟，看到包菜变软、边缘微微透明。<\/li>\n<li>加生抽、蚝油、盐、糖，翻匀。<\/li>\n<li>出锅前沿锅边淋入陈醋，翻两下立刻关火装盘。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>出水变「煮菜」<\/strong>：包菜没沥干，或火太小、炒太久。记住「沥干 + 全程大火」。<\/li>\n<li><strong>硬梗不熟 / 叶子过火<\/strong>：梗和叶一起下锅，叶子烂了梗还硬。正确做法是梗先下 20 秒、叶子后下。<\/li>\n<li><strong>辣椒炒糊发苦<\/strong>：干辣椒不能在大火热油里久炒，出香即可下菜。<\/li>\n<li><strong>太咸<\/strong>：生抽和蚝油都咸，盐只放一点点，最后尝过再补。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/105950732/\">下厨房 · 不用猪肉，快手版手撕包菜<\/a> —— 素版快手做法，适合对照「初学版」<\/li>\n<li><a href=\"https://m.douguo.com/caipuzuofa/43348/32\">豆果美食 · 手撕包菜做法合集<\/a> —— 多版本对照，适合查配料差异<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：手撕 / 梗叶分炒 / 锅边醋 / 不加水）<\/h2>\n<p>在初学版基础上，掌握下面四条，成品质感会上一个台阶。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 为什么一定要手撕<\/strong><\/p>\n<ol>\n<li>用手撕，别用刀切——手撕的断面不规则，更挂汁、更入味；刀切会压破细胞、更容易出水。<\/li>\n<li>撕的时候梗撕小、叶撕大，成熟度才均匀。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 梗叶分开下锅<\/strong><\/p>\n<ol start=\"3\">\n<li>硬梗厚、熟得慢，先下锅炒 20 秒。<\/li>\n<li>叶片薄，后下。这样出锅时梗脆、叶嫩。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 锅边醋（灵魂）<\/strong><\/p>\n<ol start=\"5\">\n<li>醋要在出锅前、锅最热时沿锅边淋一圈——醋遇高温立刻挥发，带走菜腥、留下酸香。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 全程不加水<\/strong><\/p>\n<ol start=\"6\">\n<li>包菜本身含大量水分，火够大就不需要加水（加水反而焖软、冲淡味道）。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/106958850/\">下厨房 · 手撕包菜<\/a> —— 调味比例清楚，适合对照「进阶版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1sz4y1k7QE/\">老师傅的手撕包菜，别看做法简单，技巧满满（哔哩哔哩）<\/a> —— 讲火候与锅边醋，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 猪油或五花肉提香<\/strong><\/p>\n<ol>\n<li>用一勺猪油炒，或先下几片五花肉，煸到微焦出油，再用这油炒包菜——荤香压住菜的青味，是饭店味的关键。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 凉油下花椒、炸香捞出<\/strong><\/p>\n<ol start=\"2\">\n<li>凉油小火慢慢炸花椒，麻香更充分。<\/li>\n<li>捞出花椒只留油，吃口干净。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 大火颠锅出锅气<\/strong><\/p>\n<ol start=\"4\">\n<li>全程最大火，边炒边颠锅，让包菜在高温里快速脱水、边缘带一点焦香。<\/li>\n<li>出锅前沿锅边淋醋，立刻起锅。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 收尾点蒜<\/strong><\/p>\n<ol start=\"6\">\n<li>出锅前再撒一点生蒜末，翻两下，生蒜辛香叠在熟蒜底香上，香味更有层次。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.bilibili.com/video/BV1cS42197PL/\">手撕包菜｜我愿称它为素菜届的米饭杀手！（哔哩哔哩）<\/a> —— 含五花肉版详细流程，适合对照「大厨版」<\/li>\n<\/ul>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "10", "name": "凉拌萝卜丝", "title": "凉拌萝卜丝", "category": "蔬菜", "ingredient": "白萝卜", "ings": [["白萝卜"], ["盐"], ["白糖"], ["香醋", "陈醋"], ["生抽"], ["香油"], ["蒜"], ["小葱"], ["辣椒油", "小米椒"]], "opt": [false, false, false, false, false, false, false, true, true], "tags": [], "html": "<h1>凉拌萝卜丝<\/h1>\n<blockquote>\n<p>归属食材：白萝卜 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>清脆爽口、解腻开胃，成败在萝卜丝够不够「脆」、有没有去净生辣气。凉拌菜没火候，全看三件事：切丝细不细、盐腌杀水到不到位、调味比例对不对。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>做法（凉拌菜，本无三档，一档写足：切丝 / 杀水 / 调味 / 脆爽）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>白萝卜<\/td>\n<td>1/2 根（约 300g）<\/td>\n<td>挑沉手、皮光滑的，水分足、不空心<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>约 1 小勺（5g）<\/td>\n<td>腌萝卜杀水用，后面会挤掉<\/td>\n<\/tr>\n<tr>\n<td>白糖<\/td>\n<td>1 小勺（约 5g）<\/td>\n<td>提鲜、中和萝卜的辣气<\/td>\n<\/tr>\n<tr>\n<td>香醋（或陈醋）<\/td>\n<td>1 汤匙（约 15ml）<\/td>\n<td>酸味来源<\/td>\n<\/tr>\n<tr>\n<td>生抽<\/td>\n<td>1 小勺（约 5ml）<\/td>\n<td>提咸鲜<\/td>\n<\/tr>\n<tr>\n<td>香油<\/td>\n<td>1 小勺（约 5ml）<\/td>\n<td>提香<\/td>\n<\/tr>\n<tr>\n<td>蒜<\/td>\n<td>2 瓣<\/td>\n<td>切末<\/td>\n<\/tr>\n<tr>\n<td>小葱<\/td>\n<td>1 根<\/td>\n<td>切末，撒在表面（可选）<\/td>\n<\/tr>\n<tr>\n<td>辣椒油 / 小米椒<\/td>\n<td>适量（可选）<\/td>\n<td>喜辣就加<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 切丝<\/strong><\/p>\n<ol>\n<li>白萝卜去皮，先切成约 2mm 的薄片，再码齐切成细丝；刀工不熟就直接用擦丝器擦——丝越细越均匀，越容易入味、越脆。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 盐腌杀水（关键一步）<\/strong><\/p>\n<ol start=\"2\">\n<li>萝卜丝放进碗里，撒盐用手抓匀，静置腌 10 分钟。<\/li>\n<li>看到碗底渗出很多水 → 把萝卜丝捞起来，用双手把水用力挤干（这一步叫「杀水」，能去掉萝卜的生辣气和多余水分，吃起来才脆、不出一碗汤）。<\/li>\n<li>怕咸的话，挤干后用凉开水冲一下，再挤一次。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 调汁<\/strong><\/p>\n<ol start=\"5\">\n<li>小碗里调汁：白糖、香醋、生抽、香油、蒜末搅匀，搅到糖化开。<\/li>\n<li>尝一口汁，酸了加一点糖、淡了加一点生抽——凉拌汁要在拌之前调到「比自己想吃的略重一点」，因为萝卜丝还会稀释它。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 拌匀装盘<\/strong><\/p>\n<ol start=\"7\">\n<li>把汁倒进挤干的萝卜丝里，抓拌均匀。<\/li>\n<li>撒上葱花（和辣椒油 / 小米椒），现拌现吃，或盖保鲜膜冷藏 10 分钟再吃更爽口。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>萝卜丝软趴趴、出一碗汤<\/strong>：没杀水就拌。先盐腌 10 分钟、把水挤干，再调味。<\/li>\n<li><strong>有生辣气、呛口<\/strong>：杀水时间不够，或者挤水不彻底。腌够 10 分钟、用力挤干，辣气基本就没了。<\/li>\n<li><strong>太咸<\/strong>：杀水的盐没挤掉，又加了生抽。挤干后先尝一下萝卜丝，再决定要不要少放生抽。<\/li>\n<li><strong>不入味<\/strong>：丝切太粗，或拌好就急着吃。丝切细、拌匀后稍等 2 分钟让味道渗进去。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.douguo.net/cookbook/3011109.html\">豆果美食 · 凉拌萝卜丝<\/a> —— 杀水 + 调味步骤清楚，适合对照本档<\/li>\n<li><a href=\"https://www.douguo.net/cookbook/2441946.html?f=sjmy\">豆果美食 · 凉拌萝卜丝（去辛辣版）<\/a> —— 讲温水淘洗去辣气，口味清淡可参考<\/li>\n<\/ul>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "11", "name": "凉拌秋葵", "title": "凉拌秋葵", "category": "蔬菜", "ingredient": "秋葵", "ings": [["秋葵"], ["大蒜"], ["小米椒"], ["生抽"], ["香醋", "陈醋", "米醋"], ["蚝油"], ["白糖"], ["香油"], ["食用油"], ["盐"]], "opt": [false, false, true, false, false, true, false, true, false, false], "tags": [], "html": "<h1>凉拌秋葵<\/h1>\n<blockquote>\n<p>归属食材：秋葵 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>焯水加浇汁的一盘清爽凉菜，成败在「先整根煮、煮完再切、煮完过凉」——这样秋葵的黏液不流失、口感才滑嫩爽脆。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能拌、爽口、不难吃）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>秋葵<\/td>\n<td>约 250g（15~20 根）<\/td>\n<td>选个头小、表面绒毛挺的嫩秋葵<\/td>\n<\/tr>\n<tr>\n<td>大蒜<\/td>\n<td>3 瓣<\/td>\n<td>切蒜末<\/td>\n<\/tr>\n<tr>\n<td>小米椒<\/td>\n<td>1~2 个<\/td>\n<td>切圈（可选，不吃辣可不放）<\/td>\n<\/tr>\n<tr>\n<td>生抽<\/td>\n<td>2 汤匙（约 30ml）<\/td>\n<td>咸鲜底味<\/td>\n<\/tr>\n<tr>\n<td>香醋（或陈醋 / 米醋）<\/td>\n<td>1~2 汤匙（约 15~30ml）<\/td>\n<td>酸味来源<\/td>\n<\/tr>\n<tr>\n<td>蚝油<\/td>\n<td>1 小勺（约 5ml）<\/td>\n<td>提鲜（可选）<\/td>\n<\/tr>\n<tr>\n<td>白糖<\/td>\n<td>1/2 小勺（约 2g）<\/td>\n<td>中和酸辣<\/td>\n<\/tr>\n<tr>\n<td>香油<\/td>\n<td>1 小勺（约 5ml）<\/td>\n<td>提香（可选）<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>2 汤匙（约 20ml）<\/td>\n<td>最后热油激香用<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>1 小撮<\/td>\n<td>焯水用<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 洗秋葵<\/strong><\/p>\n<ol>\n<li>秋葵放进清水里，加一小撮盐，用手搓洗表面小绒毛，冲净沥干——绒毛里藏脏，搓一下更干净。<\/li>\n<li>先不去蒂——带着蒂整根煮，黏液才不会跑进水里。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 焯水<\/strong><\/p>\n<ol start=\"3\">\n<li>锅里烧一锅水，水开后加一小撮盐、滴几滴油（盐让秋葵有底味，油让它保持翠绿）。<\/li>\n<li>下秋葵，保持中大火煮约 2 分钟，看到颜色变成鲜亮的深绿、用筷子夹起一根会软软垂下 → 立刻捞出。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 过凉<\/strong><\/p>\n<ol start=\"5\">\n<li>捞出的秋葵立刻放进冰水（或凉白开）里泡 1~2 分钟，泡到完全凉透 → 捞出沥干。一热一冷，口感更脆、颜色不黄。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 切秋葵<\/strong><\/p>\n<ol start=\"6\">\n<li>切掉蒂部硬头，对半切开（或切段）摆盘。切出的黏液滑滑的属正常，留着才好吃。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 调汁浇上<\/strong><\/p>\n<ol start=\"7\">\n<li>蒜末、生抽、香醋、蚝油、白糖、香油（和切圈的小米椒）放进小碗拌匀，尝一口，调到咸酸平衡。<\/li>\n<li>把汁淋在秋葵上，拌匀就能吃。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>秋葵发黄、煮过头<\/strong>：焯得太久。水开下锅、约 2 分钟、颜色变深绿就捞。<\/li>\n<li><strong>口感软烂、黏液全跑到水里<\/strong>：先切后煮。记住「先整根煮、煮完再切」。<\/li>\n<li><strong>不入味<\/strong>：煮前没放盐、或者没切开就浇汁。煮时加盐打底，切开再淋汁，汁才会渗进缝隙。<\/li>\n<li><strong>太咸太酸<\/strong>：生抽、蚝油本身都咸，先把汁调在小碗里尝过再浇，盐最后看情况补。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/103370292/\">下厨房 · 凉拌秋葵<\/a> —— 先煮后切、过凉、调汁的标准做法，适合对照「初学版」<\/li>\n<li><a href=\"http://m-pr.douguo.com/cookbook/3317304.html\">豆果美食 · 凉拌秋葵（果妈私房菜）<\/a> —— 带「万能凉拌汁」配比，新手好上手<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：焯水火候 / 冰水过凉 / 先煮后切保黏液 / 凉拌汁配比）<\/h2>\n<p>在初学版基础上，掌握下面几条，成品质感会上一个台阶。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 焯水火候看颜色<\/strong><\/p>\n<ol>\n<li>2 分钟是参考，嫩秋葵 90 秒就够、老秋葵可到 3 分钟。判断标准：颜色由草绿变深绿发亮、筷子能轻松扎透根部就捞出。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 冰水过凉要「凉透」<\/strong><\/p>\n<ol start=\"2\">\n<li>过凉一定要泡到完全凉透，半温不凉时秋葵还会被余温继续焖熟、变软。冰水比凉白开更脆。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 先煮后切保黏液<\/strong><\/p>\n<ol start=\"3\">\n<li>秋葵切开或久煮会流出黏滑的汁液（它自带的天然胶质，不坏、还对肠胃友好）。整根带蒂煮、煮完再切，黏液留在秋葵里，口感才滑嫩。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 凉拌汁先小碗调好<\/strong><\/p>\n<ol start=\"4\">\n<li>记一个「万能凉拌汁」比例：生抽 2 : 香醋 1 : 蚝油 0.5 : 糖少许，先在小碗里调匀、尝过味再浇，盐最后看情况补。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"http://m-pr.douguo.com/cookbook/3271565.html\">豆果美食 · 凉拌秋葵（meggy 跳舞的苹果）<\/a> —— 讲焯水时间和淋油顺序，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与响油）<\/h2>\n<p>追求「翠绿发亮、滑嫩爽脆、蒜香激鼻」。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 挑嫩秋葵<\/strong><\/p>\n<ol>\n<li>用指甲轻掐秋葵根部，能留下印子 = 嫩；掐不动、捏着发硬 = 老，口感差。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 响油激香<\/strong><\/p>\n<ol start=\"2\">\n<li>摆好盘的秋葵上铺蒜末、小米椒圈。<\/li>\n<li>烧一勺油到微微冒烟（七八成热），「刺啦」泼上去——热油瞬间激出蒜香和辣香，比直接拌进去香得多。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 顺序别反<\/strong><\/p>\n<ol start=\"4\">\n<li>先淋料汁、再泼热油——料汁给味道、热油激香气，顺序反了香气会打折扣。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 冷藏入味<\/strong><\/p>\n<ol start=\"5\">\n<li>拌好盖保鲜膜，冷藏 10 分钟再吃——凉了更爽口，味道也更均匀。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.bilibili.com/video/BV1vM4y157Kg/\">哔哩哔哩 · 凉拌秋葵｜万物皆可凉拌<\/a> —— 演示焯水、过凉、调汁到浇汁全过程，适合对照「大厨版」<\/li>\n<\/ul>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "12", "name": "蒜蓉空心菜", "title": "蒜蓉空心菜", "category": "蔬菜", "ingredient": "空心菜", "ings": [["空心菜"], ["大蒜"], ["盐"], ["食用油"], ["干辣椒"], ["蚝油"]], "opt": [false, false, false, false, true, true], "tags": [], "html": "<h1>蒜蓉空心菜<\/h1>\n<blockquote>\n<p>归属食材：空心菜 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>最家常的绿叶快炒菜，蒜香浓、菜杆脆嫩。成败全看火够不够大、手够不够快——空心菜一炒久就出水发黄。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、不难吃）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>空心菜<\/td>\n<td>1 把（约 400g）<\/td>\n<td>挑茎细嫩、叶子不发黄的<\/td>\n<\/tr>\n<tr>\n<td>大蒜<\/td>\n<td>5~6 瓣<\/td>\n<td>剁蒜末，蒜多才香<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>1/2 小勺（约 2g）<\/td>\n<td>调味<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>2 汤匙（约 20ml）<\/td>\n<td>油别太少，空心菜吸油才嫩<\/td>\n<\/tr>\n<tr>\n<td>干辣椒<\/td>\n<td>2~3 个<\/td>\n<td>可选，不吃辣可不加<\/td>\n<\/tr>\n<tr>\n<td>蚝油<\/td>\n<td>1/2 汤匙<\/td>\n<td>可选，提鲜<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 洗菜切段<\/strong><\/p>\n<ol>\n<li>空心菜掐掉老根和发黄的叶子，整把放清水里洗 2~3 遍，洗到水清。<\/li>\n<li>捞出甩干水，切成约 5cm 长的段，茎和叶大致分开堆——茎难熟、叶好熟，分开方便先后下锅。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 备蒜<\/strong><\/p>\n<ol start=\"3\">\n<li>大蒜拍扁去皮，剁成蒜末，装小碗放灶台边。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 大火快炒<\/strong><\/p>\n<ol start=\"4\">\n<li>锅烧热倒油，转大火，油刚冒轻烟 → 下蒜末（怕辣这时一起下干辣椒段）。<\/li>\n<li>快速翻炒约 10 秒，闻到蒜香、蒜末还没焦黄 → 先下空心菜茎，炒约 20 秒。<\/li>\n<li>看到茎变绿、微微变软 → 下叶子，继续大火翻炒约 30 秒。<\/li>\n<li>叶子变软、颜色变深绿、锅底没有多余的水 → 加盐（要提鲜就这时加蚝油），翻炒几下关火出锅。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>出水变汤、菜发黄<\/strong>：火太小或炒太久。空心菜要全程大火、快炒，叶子一软就出锅。<\/li>\n<li><strong>茎还是生的、叶已烂<\/strong>：茎叶一起下锅。记住茎先下、叶后下，熟得才均匀。<\/li>\n<li><strong>蒜炒糊发苦<\/strong>：蒜末在热油里别久炒，闻到香味就下菜，糊了会发苦。<\/li>\n<li><strong>洗好没甩干就下锅<\/strong>：菜上带太多水，一下锅就变成「煮菜」。洗完一定甩干再炒。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"http://m-pr.douguo.com/recipe/imgs/3192293\">豆果美食 · 蒜蓉空心菜（新手版）<\/a> —— 新手版，步骤简单<\/li>\n<li><a href=\"https://www.xiachufang.com/recipe/104563176/\">下厨房 · 蒜蓉空心菜（超简快手菜）<\/a> —— 快手做法，适合对照初学版<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：茎叶分开下锅 / 蒜分两次 / 大火快炒）<\/h2>\n<p>在初学版基础上，掌握下面几点成品质感会上台阶。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 茎叶分时下锅<\/strong><\/p>\n<ol>\n<li>茎段先下锅炒约 20 秒，等它半熟、颜色转深绿，再下叶子。<\/li>\n<li>叶子一下锅就翻，让它全裹上油，炒 20~30 秒就软。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 蒜分两次放（金银蒜）<\/strong><\/p>\n<ol start=\"3\">\n<li>一半蒜末先下锅爆香，炒出底香。<\/li>\n<li>出锅前再撒剩下的一半蒜末，翻两下就关火——生蒜的冲香和熟蒜的醇香叠在一起，蒜味更立体。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 火候与出水<\/strong><\/p>\n<ol start=\"5\">\n<li>全程最大火，油烧到微微冒烟再下菜；炒到叶子刚软、锅底还没出水 → 立刻调味出锅。<\/li>\n<li>若实在偏干，可沿锅边淋 1 汤匙清水，别直接倒菜上，防止降温出汤。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/100023410/\">下厨房 · 蒜蓉空心菜<\/a> —— 基础版可对照<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1ga4y1776i/\">哔哩哔哩 · 蒜蓉空心菜，脆脆爽爽的素菜美味<\/a> —— 三分钟出锅，看大火快炒节奏<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求翠绿、脆爽、锅气足的粤式小炒质感。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 热油热水撞锅<\/strong><\/p>\n<ol>\n<li>锅烧到很热，倒油后立刻下蒜末，同时沿锅边淋一小勺热水——热油遇热水会「嗤」地窜起蒸汽，高温蒸汽把空心菜瞬间烫熟，锁住翠绿。<\/li>\n<li>下空心菜茎，大火翻两下，再下叶，全程保持最大火，动作要快。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 蒜末炼香<\/strong><\/p>\n<ol start=\"3\">\n<li>蒜末提前分三份：下锅爆香一份、翻炒中途加一份、出锅前撒一份，蒜香层层递进。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 调味从简<\/strong><\/p>\n<ol start=\"4\">\n<li>只放盐（顶多加一点点蚝油），不放生抽——生抽色重，会把翠绿染暗。<\/li>\n<li>出锅前沿锅边点几滴油提亮，颠两下装盘，锅气（高温快炒那股焦香）凉了就散，趁热上桌。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.bilibili.com/video/BV1VSqzYYE3d/\">哔哩哔哩 · 粤菜师傅教你蒜蓉炒空心菜<\/a> —— 讲透热油热水碰撞保翠绿的技巧，适合对照大厨版<\/li>\n<\/ul>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "13", "name": "胡萝卜炒肉丝", "title": "胡萝卜炒肉丝", "category": "蔬菜", "ingredient": "胡萝卜", "ings": [["胡萝卜"], ["猪里脊肉"], ["生抽"], ["料酒"], ["淀粉"], ["盐"], ["姜"], ["蒜"], ["食用油"]], "opt": [false, false, false, false, false, false, false, false, false], "tags": [], "html": "<h1>胡萝卜炒肉丝<\/h1>\n<blockquote>\n<p>归属食材：胡萝卜 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>家常快手菜，肉丝滑嫩、胡萝卜脆甜带软，咸鲜微甜，营养好下饭。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、不难吃）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>胡萝卜<\/td>\n<td>2 根（约 250g）<\/td>\n<td>切细丝<\/td>\n<\/tr>\n<tr>\n<td>猪里脊肉<\/td>\n<td>150g<\/td>\n<td>切细丝<\/td>\n<\/tr>\n<tr>\n<td>生抽<\/td>\n<td>2 小勺（约 10ml）<\/td>\n<td>腌肉 + 调味分两次用<\/td>\n<\/tr>\n<tr>\n<td>料酒<\/td>\n<td>1 小勺（约 5ml）<\/td>\n<td>去腥<\/td>\n<\/tr>\n<tr>\n<td>淀粉<\/td>\n<td>1 小勺（约 3g）<\/td>\n<td>让肉丝滑嫩<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>约 1/2 小勺（2g）<\/td>\n<td>分次放<\/td>\n<\/tr>\n<tr>\n<td>姜、蒜<\/td>\n<td>各少许<\/td>\n<td>切末<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>2 汤匙（约 20ml）<\/td>\n<td>分两次用<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点，全程中大火）<\/strong><\/p>\n<p><strong>第 1 步 · 切丝腌肉<\/strong><\/p>\n<ol>\n<li>胡萝卜去皮，切细丝（约 2mm 见方）；肉切细丝。<\/li>\n<li>肉丝加 1 小勺生抽 + 料酒 + 淀粉，抓匀腌 10 分钟（入味、锁住水分）。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 滑炒肉丝<\/strong><\/p>\n<ol start=\"3\">\n<li>锅烧热倒 1 汤匙油，油热后下肉丝，快速划散。<\/li>\n<li>炒约 1 分钟，看到肉丝完全变色 → 盛出，别炒老。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 炒胡萝卜<\/strong><\/p>\n<ol start=\"5\">\n<li>锅里补 1 汤匙油，下姜蒜爆香（约 15 秒）。<\/li>\n<li>倒入胡萝卜丝，中火翻炒 2~3 分钟，看到胡萝卜丝变软、颜色变深、锅底微微出油。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 合炒调味<\/strong><\/p>\n<ol start=\"7\">\n<li>把肉丝倒回锅，加剩下的 1 小勺生抽和盐，大火翻炒 30 秒。<\/li>\n<li>尝味，不够补盐，关火出锅。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>肉丝又柴又老<\/strong>：一是没腌（淀粉锁水），二是炒太久。变色就盛出。<\/li>\n<li><strong>胡萝卜发硬<\/strong>：切太粗或炒的时间不够。要细丝 + 中火炒软。<\/li>\n<li><strong>粘锅<\/strong>：肉丝下锅前锅要够热、油要够，下锅后别急着翻，先定型再划散。<\/li>\n<li><strong>太咸<\/strong>：生抽分两次放，合炒后尝了再补盐。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/103897211/\">下厨房 · 胡萝卜炒肉丝<\/a> —— 基础家常版，适合对照「初学版」的比例<\/li>\n<li><a href=\"https://m.meishichina.com/recipe/402788/\">美食杰 · 胡萝卜炒肉丝（独家）<\/a> —— 步骤图详细，适合对照「初学版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1LnFvejEHH/\">家常炒胡萝卜软糯入味（哔哩哔哩）<\/a> —— 强调胡萝卜炒软不焯水，适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：上浆 / 顺序 / 脂溶性 / 提鲜）<\/h2>\n<p>在初学版基础上，掌握下面四条，肉更嫩、萝卜更香。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 肉丝上浆<\/strong><\/p>\n<ol>\n<li>肉丝加生抽 + 料酒 + 淀粉后，再加 1 小勺清水和几滴食用油抓匀——水让肉更嫩，油防止粘连。<\/li>\n<li>静置 15 分钟效果更好。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 分开炒再合<\/strong><\/p>\n<ol start=\"3\">\n<li>想要胡萝卜更软糯，就先把它炒软、盛出，再炒肉。<\/li>\n<li>想要肉更嫩，就热锅凉油先滑肉。两者分开炒、最后合炒，互不抢味，火候也更好控制。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 胡萝卜素是脂溶性的<\/strong><\/p>\n<ol start=\"5\">\n<li>油量稍多一点，把胡萝卜炒到出红油——颜色更漂亮、营养也更好吸收。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 提鲜<\/strong><\/p>\n<ol start=\"6\">\n<li>出锅前滴几滴香醋或加一点点白糖，能提鲜、去掉胡萝卜的土腥味。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/100622637/\">下厨房 · 惊艳到味蕾的胡萝卜炒肉丝<\/a> —— 调味有讲究，适合对照「进阶版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1CG4y1K7Tr/\">最近频繁做的一道菜 胡萝卜丝炒肉（哔哩哔哩）<\/a> —— 家常快手，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「肉丝滑嫩、萝卜脆甜、脆嫩并存有锅气」。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 刀工<\/strong><\/p>\n<ol>\n<li>肉丝顺纹切片、逆纹切丝，粗细均匀。<\/li>\n<li>胡萝卜丝用刀切细，不要用擦丝器——擦出来的丝水分流失、口感软塌。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 滑油<\/strong><\/p>\n<ol start=\"3\">\n<li>肉丝上浆后，三成油温（油面平静、手放上方微热）下锅。<\/li>\n<li>用筷子快速划散，看到变色即捞出（全程约 20 秒），肉丝最滑嫩。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 旺火快炒<\/strong><\/p>\n<ol start=\"5\">\n<li>另起锅大火爆香姜蒜，下胡萝卜丝加少许盐炒约 1 分钟断生。<\/li>\n<li>立即倒回肉丝，沿锅边淋生抽，大火颠炒约 15 秒出锅。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 脆嫩并存的关键<\/strong><\/p>\n<ol start=\"7\">\n<li>胡萝卜「断生即出」，保留脆感和甜味、不炒塌；肉丝借余温刚好全熟，吃口才嫩。<\/li>\n<\/ol>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "14", "name": "干锅花菜", "title": "干锅花菜", "category": "蔬菜", "ingredient": "花菜", "ings": [["花菜"], ["五花肉"], ["蒜"], ["姜"], ["干辣椒"], ["青椒", "红椒"], ["生抽"], ["蚝油"], ["白糖"], ["盐"], ["食用油"], ["料酒"]], "opt": [false, false, false, false, true, true, false, false, true, false, false, true], "tags": [], "html": "<h1>干锅花菜<\/h1>\n<blockquote>\n<p>归属食材：花菜 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>焦香入味的下饭菜，成败在「花菜干煸出焦斑」——把水汽炒干才有干香，湿嗒嗒就废了。带皮五花肉煸出的猪油是灵魂。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、够香、不难吃）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>花菜<\/td>\n<td>1 颗（约 400g）<\/td>\n<td>选松散、花头紧实不发黑的「散花菜」更香<\/td>\n<\/tr>\n<tr>\n<td>五花肉<\/td>\n<td>100g<\/td>\n<td>带皮薄片，煸出猪油<\/td>\n<\/tr>\n<tr>\n<td>蒜<\/td>\n<td>3 瓣<\/td>\n<td>切片<\/td>\n<\/tr>\n<tr>\n<td>姜<\/td>\n<td>1 小块<\/td>\n<td>切片<\/td>\n<\/tr>\n<tr>\n<td>干辣椒<\/td>\n<td>3~4 个<\/td>\n<td>剪段（可选）<\/td>\n<\/tr>\n<tr>\n<td>青椒 / 红椒<\/td>\n<td>各半个<\/td>\n<td>切块，配色（可选）<\/td>\n<\/tr>\n<tr>\n<td>生抽<\/td>\n<td>1 汤匙（约 15ml）<\/td>\n<td>咸鲜味<\/td>\n<\/tr>\n<tr>\n<td>蚝油<\/td>\n<td>1 小勺（约 5ml）<\/td>\n<td>提鲜<\/td>\n<\/tr>\n<tr>\n<td>白糖<\/td>\n<td>1/2 小勺（约 2g）<\/td>\n<td>提鲜（可选）<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>约 1/2 小勺（2g）<\/td>\n<td>生抽蚝油本身咸，最后尝过再补<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>1 汤匙（约 15ml）<\/td>\n<td>煸肉用，肉肥可少放<\/td>\n<\/tr>\n<tr>\n<td>料酒<\/td>\n<td>1 小勺（约 5ml）<\/td>\n<td>出锅前沿锅边烹（可选）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 掰花菜<\/strong><\/p>\n<ol>\n<li>花菜从根部掰成一口大的小朵，太粗的梗切成薄片——薄了才容易熟透、入味。<\/li>\n<li>放进淡盐水里泡 10 分钟，冲洗干净 → 彻底沥干。带水下锅会变成「煮花菜」，不香。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 切肉备料<\/strong><\/p>\n<ol start=\"3\">\n<li>五花肉切薄片（微冻 15 分钟更好切），蒜、姜切片，干辣椒剪段，青红椒切块。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 煸五花肉<\/strong><\/p>\n<ol start=\"4\">\n<li>锅烧热倒 1 汤匙油，转中小火下五花肉片，慢慢煸约 2~3 分钟。<\/li>\n<li>看到肉片变薄、卷曲、微微焦黄、锅底渗出猪油 → 下姜蒜片和干辣椒，炒约 10 秒出香味。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 干煸花菜<\/strong><\/p>\n<ol start=\"6\">\n<li>转最大火，倒花菜快速翻炒约 2~3 分钟，全程不加水、不盖盖。<\/li>\n<li>看到花菜边缘出现焦黄小斑点、体积略缩 → 加生抽、蚝油、白糖，沿锅边烹料酒，继续翻炒约 1 分钟让味道裹匀。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 加彩椒出锅<\/strong><\/p>\n<ol start=\"8\">\n<li>加青红椒块翻炒约 30 秒，夹一朵尝：熟了仍带脆、有焦香 → 尝咸淡补盐，关火出锅。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>花菜湿软不香<\/strong>：没沥干就下锅、或加水盖盖焖。记住「彻底沥干 + 全程大火 + 不加水不盖盖」。<\/li>\n<li><strong>有的生有的熟<\/strong>：朵太大、粗梗没切薄。掰成一口大小、粗梗切薄片。<\/li>\n<li><strong>五花肉不香或炒糊<\/strong>：火太大。中小火慢煸，煸到微焦出油再下菜。<\/li>\n<li><strong>太咸<\/strong>：生抽、蚝油本身咸，盐最后尝过再补。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/101764616/\">下厨房 · 干锅花菜（美食台）<\/a> —— 讲解干煸要点，适合对照「初学版」<\/li>\n<li><a href=\"http://mwx.douguo.com/cookbook/84705.html\">豆果美食 · 干锅花菜（月亮晶晶）<\/a> —— 家常步骤清楚，讲清猪油煸肉<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：干煸出焦斑 / 猪油炒菜 / 先煸肉后炒菜 / 豆瓣酱变体）<\/h2>\n<p>在初学版基础上，掌握下面几条，成品质感会上一个台阶。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 干煸出焦斑<\/strong><\/p>\n<ol>\n<li>「干煸」就是锅里基本无水、靠高温把花菜自身的水分逼出来，炒到边缘焦黄才香——这是干锅花菜和普通炒花菜的区别。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 猪油炒菜<\/strong><\/p>\n<ol start=\"2\">\n<li>五花肉煸出的猪油裹住花菜，比色拉油香得多。肉肥就少倒油，甚至不另外倒油。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 先煸肉后炒菜<\/strong><\/p>\n<ol start=\"3\">\n<li>肉先下锅慢慢出油，油香留在锅底，再下花菜——顺序别反。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 豆瓣酱变体<\/strong><\/p>\n<ol start=\"4\">\n<li>想更下饭，爆香时加半勺豆瓣酱一起炒出红油，咸香辣更浓（豆瓣酱咸，之后少放盐）。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"http://mwx.douguo.com/cookbook/3212455.html\">豆果美食 · 干锅花菜（家常版）<\/a> —— 含豆瓣酱和干煸细节，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「焦香干爽、锅气十足、花菜入味不油」。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 热锅凉油煸肉<\/strong><\/p>\n<ol>\n<li>先空锅烧到微微冒烟，再倒油，油热下肉片——「热锅凉油」让肉片不粘锅、出油更快。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 花菜直接生炒、不过油不焯水<\/strong><\/p>\n<ol start=\"2\">\n<li>家庭版想炒出饭店感，关键是不焯水、不过油，直接生炒——花菜自身水汽炒干后，才会干香、带焦斑。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 锅气<\/strong><\/p>\n<ol start=\"3\">\n<li>全程锅够热、火够大、动作够快，才能炒出「锅气」（高温 + 快炒带来的焦香），凉了就散，出锅趁热吃。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 生蒜末收尾<\/strong><\/p>\n<ol start=\"4\">\n<li>出锅前撒一把生蒜末（或芹菜段），翻两下——生蒜的辛香叠熟蒜的醇香，香气更立体。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.bilibili.com/video/BV1hipUzaEHH/\">哔哩哔哩 · 干锅花菜，家庭小火做出猛火灶过油的锅气<\/a> —— 讲透家庭版怎么炒出锅气，适合对照「大厨版」<\/li>\n<\/ul>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "15", "name": "芹菜炒肉丝", "title": "芹菜炒肉丝", "category": "蔬菜", "ingredient": "芹菜", "ings": [["芹菜"], ["猪里脊肉"], ["生抽"], ["料酒"], ["淀粉"], ["盐"], ["姜"], ["蒜"], ["食用油"]], "opt": [false, false, false, false, false, false, false, false, false], "tags": [], "html": "<h1>芹菜炒肉丝<\/h1>\n<blockquote>\n<p>归属食材：芹菜 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>家常快手菜，芹菜脆嫩清香、肉丝滑嫩咸鲜，清清爽爽又下饭。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、不难吃）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>芹菜<\/td>\n<td>300g<\/td>\n<td>去叶切段<\/td>\n<\/tr>\n<tr>\n<td>猪里脊肉<\/td>\n<td>150g<\/td>\n<td>切细丝<\/td>\n<\/tr>\n<tr>\n<td>生抽<\/td>\n<td>2 小勺（约 10ml）<\/td>\n<td>腌肉 + 调味分两次用<\/td>\n<\/tr>\n<tr>\n<td>料酒<\/td>\n<td>1 小勺（约 5ml）<\/td>\n<td>去腥<\/td>\n<\/tr>\n<tr>\n<td>淀粉<\/td>\n<td>1 小勺（约 3g）<\/td>\n<td>让肉丝滑嫩<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>约 1/2 小勺（2g）<\/td>\n<td>分次放<\/td>\n<\/tr>\n<tr>\n<td>姜、蒜<\/td>\n<td>各少许<\/td>\n<td>切末<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>2 汤匙（约 20ml）<\/td>\n<td>分两次用<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点，全程大火快炒）<\/strong><\/p>\n<p><strong>第 1 步 · 切菜腌肉<\/strong><\/p>\n<ol>\n<li>芹菜摘叶、洗净，切约 3cm 长的段（老一点的杆先撕掉表面的粗筋）。<\/li>\n<li>肉切细丝，加 1 小勺生抽 + 料酒 + 淀粉抓匀，腌 10 分钟。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 焯芹菜（可选）<\/strong><\/p>\n<ol start=\"3\">\n<li>水烧开，放芹菜段焯 30 秒，捞出过冷水并沥干——颜色更翠绿、口感更脆。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 滑炒肉丝<\/strong><\/p>\n<ol start=\"4\">\n<li>锅烧热倒 1 汤匙油，下肉丝快速划散，炒约 1 分钟，看到变色 → 盛出。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 合炒<\/strong><\/p>\n<ol start=\"5\">\n<li>锅里补 1 汤匙油，下姜蒜爆香。<\/li>\n<li>倒入芹菜，大火快炒约 1 分钟。<\/li>\n<li>倒回肉丝，加剩下的生抽和盐，翻炒 30 秒，尝味出锅。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>芹菜老韧难嚼<\/strong>：没撕粗筋。老杆一定要撕筋，或选嫩一点的芹菜。<\/li>\n<li><strong>肉丝柴<\/strong>：没腌或炒太久。淀粉腌 + 变色即盛。<\/li>\n<li><strong>芹菜出水变软<\/strong>：焯水后没沥干，或炒太久。沥干水分、全程大火快炒。<\/li>\n<li><strong>太咸<\/strong>：生抽和盐分开放，最后尝了再补。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"http://m-pr.douguo.com/cookbook/2445353.html\">豆果美食 · 芹菜炒肉丝<\/a> —— 基础家常版，适合对照「初学版」<\/li>\n<li><a href=\"https://www.xiachufang.com/recipe/106819759/\">下厨房 · 家常芹菜炒肉丝，做法简单，营养美味<\/a> —— 步骤清晰，适合对照「初学版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1PS4y1H7iT/\">厨房小白必看！肉丝炒芹菜零翻车教程（哔哩哔哩）<\/a> —— 步骤详细、零翻车，适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：上浆 / 芹菜处理 / 分开炒 / 勾芡）<\/h2>\n<p>在初学版基础上，掌握下面四条，肉更嫩、芹更脆。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 肉丝上浆锁水<\/strong><\/p>\n<ol>\n<li>肉丝加生抽 + 料酒 + 淀粉后，再加 1 小勺清水抓出黏性、淋几滴油封住。<\/li>\n<li>静置 15 分钟——肉丝更滑嫩、不粘连。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 芹菜处理<\/strong><\/p>\n<ol start=\"3\">\n<li>嫩杆直接切段；老杆用削皮刀削去背部粗筋，再斜切成段——截面更大、更易熟、更入味。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 分开炒再合<\/strong><\/p>\n<ol start=\"4\">\n<li>芹菜大火快炒保持脆感，肉丝单独滑油保持嫩度。<\/li>\n<li>最后合炒约 20 秒即可，两者都不过火。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 勾薄芡<\/strong><\/p>\n<ol start=\"6\">\n<li>出锅前淋一点水淀粉（半小勺淀粉 + 2 汤匙水），让味道薄薄挂住，芹菜更入味。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.douguo.net/cookbook/2397015.html\">豆果美食 · 芹菜炒肉丝（douguo.net）<\/a> —— 配料配比可参考，适合对照「进阶版」的芹菜处理<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「芹菜脆绿香、肉丝嫩滑亮、出锅有锅气」。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 刀工<\/strong><\/p>\n<ol>\n<li>肉丝顺纹切片、逆纹切丝；芹菜斜刀切段，长短一致，受热均匀。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 滑油<\/strong><\/p>\n<ol start=\"2\">\n<li>肉丝上浆后三成油温下锅，筷子快速划散，刚断生就捞出（约 20 秒），保持滑嫩。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 旺火快炒<\/strong><\/p>\n<ol start=\"3\">\n<li>另起锅大火烧到冒烟，爆香姜蒜，下芹菜加一点盐炒约 40 秒。<\/li>\n<li>立即倒回肉丝，沿锅边淋生抽，大火颠炒约 15 秒。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 锅气<\/strong><\/p>\n<ol start=\"5\">\n<li>全程大火、动作快，出锅前点几滴香油。<\/li>\n<li>看到芹菜「脆、绿、香」、肉丝「嫩、滑、亮」→ 趁热吃最香。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.bilibili.com/video/BV1zq4y167c3/\">芹菜小炒肉，芹菜清脆爽口，10 分钟搞定（哔哩哔哩）<\/a> —— 强调大火快炒，适合对照「大厨版」的火候<\/li>\n<\/ul>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "16", "name": "苦瓜炒蛋", "title": "苦瓜炒蛋", "category": "蔬菜", "ingredient": "苦瓜", "ings": [["苦瓜"], ["鸡蛋"], ["蒜"], ["盐"], ["白糖"], ["料酒"], ["食用油"]], "opt": [false, false, false, false, true, true, false], "tags": [], "html": "<h1>苦瓜炒蛋<\/h1>\n<blockquote>\n<p>归属食材：苦瓜 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>苦瓜清热下火，鸡蛋的香正好压住它的苦，是夏天经典的快手菜。成败全看两件事：苦味去得干不干净、鸡蛋炒得嫩不嫩。以下按「初学 / 进阶 / 大厨」三档给出做法。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、不难吃）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>苦瓜<\/td>\n<td>1 根（约 350g）<\/td>\n<td>挑表面疙瘩大而饱满、翠绿不发黄的<\/td>\n<\/tr>\n<tr>\n<td>鸡蛋<\/td>\n<td>3 个<\/td>\n<td>室温蛋更好打散<\/td>\n<\/tr>\n<tr>\n<td>蒜<\/td>\n<td>2 瓣<\/td>\n<td>切末<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>约 1.5 小勺（约 8g）<\/td>\n<td>分三次：腌苦瓜、腌蛋液、最后调味<\/td>\n<\/tr>\n<tr>\n<td>白糖<\/td>\n<td>1/2 小勺（约 2g）<\/td>\n<td>中和苦味，可选<\/td>\n<\/tr>\n<tr>\n<td>料酒<\/td>\n<td>几滴<\/td>\n<td>去蛋腥，可选<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>2 汤匙（约 20ml）<\/td>\n<td>分两次用<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点，全程中大火）<\/strong><\/p>\n<p><strong>第 1 步 · 去苦（关键第一步）<\/strong><\/p>\n<ol>\n<li>苦瓜洗净，对半切开，用勺子把里面的籽和白色软瓤刮干净——贴着内壁那层白膜最苦，要刮到露出青绿的瓜肉。<\/li>\n<li>把苦瓜切成约 2~3mm 的薄片（越薄越容易去苦、熟得快）。<\/li>\n<li>切好的苦瓜片放进碗里，撒约 1 小勺盐，用手抓匀，腌 10 分钟，看到碗底渗出淡绿色的苦水 → 说明苦味正在被逼出来。<\/li>\n<li>用清水把苦瓜片冲洗两遍，再用手挤掉多余水分，挤到不再滴水 → 去苦就完成了。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 打鸡蛋<\/strong><\/p>\n<ol start=\"5\">\n<li>鸡蛋打进碗里，加 1 小撮盐和几滴料酒，快速搅打 30 秒，打到蛋液起细泡。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 炒鸡蛋<\/strong><\/p>\n<ol start=\"6\">\n<li>锅烧热倒 1 汤匙油，油微冒烟转中火，倒入蛋液，用铲子划散，炒约 40~60 秒，看到鸡蛋刚定型、嫩黄色 → 盛出备用。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 炒苦瓜<\/strong><\/p>\n<ol start=\"7\">\n<li>锅里再补 1 汤匙油，下蒜末爆香约 10 秒，闻到蒜香就下苦瓜片。<\/li>\n<li>大火翻炒约 1~2 分钟，看到苦瓜颜色从翠绿变得更深、微微发亮，尝一片没有生苦味 → 说明熟了。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 合炒出锅<\/strong><\/p>\n<ol start=\"9\">\n<li>倒回鸡蛋，加剩下的小半勺盐和糖，翻炒均匀约 30 秒。<\/li>\n<li>尝一口，苦味可以接受、鸡蛋还嫩 → 关火出锅。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>还是苦得没法吃<\/strong>：白膜没刮干净，或者盐腌时间太短、没挤干苦水。记住「刮净白膜 + 盐腌 10 分钟 + 挤干」三步缺一不可。<\/li>\n<li><strong>苦瓜太咸<\/strong>：盐腌之后没冲洗就直接炒。正确做法是腌完用清水冲两遍再挤干，最后调味时盐少放一点。<\/li>\n<li><strong>鸡蛋炒老了<\/strong>：和丝瓜炒蛋一样，鸡蛋要单独先炒、刚凝固就盛出，最后回锅合一下。<\/li>\n<li><strong>苦瓜炒过头发软发黄<\/strong>：炒得太久，苦瓜失去清脆。大火快炒、断生（刚熟还带点脆生）就出锅。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/106490353/\">下厨房 · 苦瓜炒蛋<\/a> —— 家常做法，适合对照「初学版」<\/li>\n<li><a href=\"https://www.xiachufang.com/recipe/100001499/\">下厨房 · 苦瓜炒蛋（去苦版）<\/a> —— 重点讲去苦，适合新手<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：刮净白膜 / 盐腌挤水 / 蛋液加料 / 火候）<\/h2>\n<p>在初学版基础上，掌握下面几点，苦瓜会爽脆不发苦、鸡蛋更滑嫩。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 白膜刮到「见绿」<\/strong><\/p>\n<ol>\n<li>用金属勺背贴着苦瓜内壁用力刮，刮到白膜完全不见、只剩青绿的瓜肉——苦味的九成都在白膜和籽里。<\/li>\n<li>苦瓜斜刀切薄片（刀和瓜成 45 度斜切），切面更大，盐腌时苦水更容易渗出来。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 盐腌出苦水<\/strong><\/p>\n<ol start=\"3\">\n<li>苦瓜片加盐抓匀后腌 15 分钟，中途再抓一次，看到苦瓜明显变软、碗底积起淡绿色汁水 → 用清水冲洗两遍，双手挤干。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 蛋液加「一勺水」<\/strong><\/p>\n<ol start=\"4\">\n<li>蛋液里加 1 小勺清水和几滴料酒再搅打——水受热变成蒸汽，鸡蛋炒出来更蓬松、更嫩，还能去蛋腥。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 大火快炒、糖提鲜<\/strong><\/p>\n<ol start=\"5\">\n<li>苦瓜下锅后全程大火、快速翻炒，断生即出（刚熟、颜色翠绿发亮就停）。<\/li>\n<li>出锅前加 1/2 小勺糖——糖能中和苦瓜的余苦，让回甘更明显。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.bilibili.com/video/BV1wY4y1v7Ah/\">苦瓜炒鸡蛋！清热好吃还减脂～这样炒苦瓜一点都不苦（哔哩哔哩）<\/a> —— 盐腌去苦讲得细，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「苦瓜碧绿爽脆、鸡蛋滑嫩、微苦回甘、出锅带锅气」。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 焯水替代盐腌（保色更脆）<\/strong><\/p>\n<ol>\n<li>苦瓜去瓤刮净白膜后切薄片，不盐腌、改用焯水：烧一锅开水，加 1 小勺盐和几滴油。<\/li>\n<li>水大开后下苦瓜片，焯约 30~40 秒（焯水 = 食材放滚水里短暂烫一下），看到苦瓜颜色变成翠绿透亮 → 立刻捞出。<\/li>\n<li>马上放进凉水里过凉（冰水更好），凉透后捞出沥干——这一步锁住翠绿和爽脆，也去掉大部分苦味。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 滑炒鸡蛋<\/strong><\/p>\n<ol start=\"4\">\n<li>空锅烧热冒烟，倒油转中火，下蛋液后用铲子从外圈往里推，推到蛋液大半凝固、中心半流动 → 立刻盛出。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 大火爆香合炒<\/strong><\/p>\n<ol start=\"5\">\n<li>锅补少许油，大火烧到冒烟，下蒜末爆香，闻到焦香下苦瓜片，大火快炒约 40 秒。<\/li>\n<li>鸡蛋回锅，加盐和 1/2 小勺糖，大火再翻 20 秒，看到苦瓜裹上油光、盘底无多余汤汁 → 立刻离火装盘（趁热吃，锅气凉了就散）。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.bilibili.com/video/BV1Nu4y1R7Zr/\">苦瓜炒蛋，苦瓜盐腌之后就不会很多水了（哔哩哔哩）<\/a> —— 讲控水与火候，适合对照「大厨版」<\/li>\n<\/ul>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "17", "name": "红烧茄子", "title": "红烧茄子", "category": "蔬菜", "ingredient": "茄子", "ings": [["长茄子"], ["大蒜"], ["小葱"], ["生抽"], ["老抽"], ["蚝油"], ["白糖"], ["盐"], ["淀粉"], ["食用油"]], "opt": [false, false, false, false, false, false, false, false, false, false], "tags": [], "html": "<h1>红烧茄子<\/h1>\n<blockquote>\n<p>归属食材：茄子 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>咸甜下饭的家常菜，难点是茄子「吸油」和「软烂入味」。以下按三档给出做法。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能熟、不齁油、下饭）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>长茄子<\/td>\n<td>2 根（约 400g）<\/td>\n<td>紫皮长茄更嫩，肉细<\/t
