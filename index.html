茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、不难吃）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>嫩豆腐（内酯豆腐）<\/td>\n<td>1 盒（约 400g）<\/td>\n<td>嫩豆腐口感最接近正宗<\/td>\n<\/tr>\n<tr>\n<td>猪肉末（或牛肉末）<\/td>\n<td>约 100g<\/td>\n<td>半肥瘦更香<\/td>\n<\/tr>\n<tr>\n<td>郫县豆瓣酱<\/td>\n<td>1 汤匙（约 15g）<\/td>\n<td>剁碎再用，咸味来源<\/td>\n<\/tr>\n<tr>\n<td>蒜<\/td>\n<td>2~3 瓣<\/td>\n<td>切末<\/td>\n<\/tr>\n<tr>\n<td>姜<\/td>\n<td>1 小片<\/td>\n<td>切末（可选）<\/td>\n<\/tr>\n<tr>\n<td>花椒粉<\/td>\n<td>约 1/2 小勺<\/td>\n<td>出锅前撒<\/td>\n<\/tr>\n<tr>\n<td>水淀粉<\/td>\n<td>2 小勺淀粉 + 3 汤匙水调匀<\/td>\n<td>勾芡用<\/td>\n<\/tr>\n<tr>\n<td>小葱（或蒜苗）<\/td>\n<td>1~2 根<\/td>\n<td>切葱花点缀<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>2 汤匙（约 20ml）<\/td>\n<td>炒肉末和酱<\/td>\n<\/tr>\n<tr>\n<td>清水<\/td>\n<td>约 150ml<\/td>\n<td>煮豆腐<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 处理豆腐<\/strong><\/p>\n<ol>\n<li>豆腐切成约 2cm 见方的小块。<\/li>\n<li>放进加了 1 小撮盐的滚水里，小火焯 1 分钟，捞出沥水。加盐焯水能去掉豆腥味，也让豆腐更紧实、后面翻动时不易碎。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 炒肉末和酱<\/strong><\/p>\n<ol start=\"3\">\n<li>锅烧热倒 2 汤匙油，下肉末中火炒散，炒到变色、微微发干出油（约 2 分钟）。<\/li>\n<li>把肉末推到一边，下剁碎的豆瓣酱，小火炒 1 分钟，炒到油变成红亮色、酱香出来。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 煮豆腐<\/strong><\/p>\n<ol start=\"5\">\n<li>加入蒜末、姜末，炒香（约 30 秒）。<\/li>\n<li>倒入豆腐块和约 150ml 清水，水量差不多没过豆腐一半即可。<\/li>\n<li>轻轻推匀，中火烧开，转小火煮 3~5 分钟，让豆腐吸进味道。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 勾芡<\/strong><\/p>\n<ol start=\"8\">\n<li>把水淀粉再次搅匀（淀粉会沉底），转中大火。<\/li>\n<li>分 2 次淋入——先淋一半，用铲背轻推让汤汁变浓，再淋剩下的一半，继续轻推到汤汁均匀裹在豆腐上、呈半透明发亮。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 出锅<\/strong><\/p>\n<ol start=\"10\">\n<li>撒花椒粉和葱花，轻轻推匀，立刻出锅装盘，趁热吃（麻婆豆腐凉了风味大减）。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>豆腐碎了<\/strong>：切块太小、焯水时间太短、翻动太猛。用铲背轻推或端起锅晃动，别用铲子大力翻。<\/li>\n<li><strong>太咸<\/strong>：豆瓣酱本身很咸，这道菜通常不用再加盐，加盐前一定先尝。<\/li>\n<li><strong>不红、不香<\/strong>：豆瓣酱没炒出红油就下豆腐。要小火慢炒到油变红亮，这是「红油」的关键。<\/li>\n<li><strong>芡汁太稀或成坨<\/strong>：淀粉没搅匀、一次全倒进去。要分次淋、边淋边轻推。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/100312346/\">下厨房 · 麻婆豆腐<\/a> —— 家常版、步骤清晰，适合对照「初学版」比例（需点开确认）<\/li>\n<li><a href=\"http://mwx.douguo.com/cookbook/1301396.html\">豆果美食 · 麻婆豆腐（凤阳的幸福滋味）<\/a> —— 家庭做法，适合对照「初学版」的炒酱与勾芡（需点开确认）<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：豆腐焯水不碎 / 豆瓣酱炒红油 / 勾芡层次）<\/h2>\n<p>在初学版基础上，掌握下面四条，成品的口感和卖相会上一个台阶。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 豆腐焯水不碎<\/strong><\/p>\n<ol>\n<li>豆腐选嫩豆腐或石膏豆腐，切块不要太小（约 2~2.5cm），太小容易碎。<\/li>\n<li>焯水用盐水：水开后加 1 小勺盐，放入豆腐，小火保持微沸焯 1~2 分钟。盐水能让豆腐表面蛋白微微凝固，焯水后更紧实不易碎，同时去掉豆腥味。<\/li>\n<li>焯好的豆腐捞出后先放在温水里保温，别直接倒进凉水（一冷一热也会碎）。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 豆瓣酱炒出红油<\/strong><\/p>\n<ol start=\"4\">\n<li>郫县豆瓣酱一定要剁碎，尤其是里面的豆瓣和辣椒块，剁碎后炒才出味、出红油。<\/li>\n<li>炒酱要小火慢炒：油温别太高，下酱后小火慢慢推，炒约 1 分钟，看到油变成红亮色、酱香扑鼻、酱渣微微发酥 → 炒到位。火大会把酱炒糊发苦。<\/li>\n<li>红油不够红可补半小勺辣椒面一起炒（可选）。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 勾芡层次（三次勾芡）<\/strong><\/p>\n<ol start=\"7\">\n<li>正宗做法是分三次勾芡，每次少量：第一次让汤汁挂在豆腐上，第二次让味道收紧进豆腐里，第三次起亮、把红油和汤汁锁住。<\/li>\n<li>每次淋入后都要等汤汁再次烧开、变浓，再淋下一次；全程用铲背轻推，不搅碎豆腐。<\/li>\n<li>水淀粉比例约 1 : 1.5（淀粉 : 水），用前一定搅匀，否则会结块。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 调味顺序<\/strong><\/p>\n<ol start=\"10\">\n<li>顺序是「炒肉末 → 炒豆瓣酱出红油 → 下姜蒜 → 加水煮豆腐 → 三次勾芡 → 撒花椒粉出锅」。花椒粉一定最后撒，早放会失去麻香。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.bilibili.com/video/BV1y7nm6ZEFS/\">拌饭一绝，这才是经典麻婆豆腐！（哔哩哔哩）<\/a> —— 强调焯水、三次勾芡、出锅撒花椒面，适合对照「进阶版」（需点开确认）<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气，六味俱全）<\/h2>\n<p>追求「麻、辣、烫、嫩、香、鲜」六味俱全。每一步都是细节。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 六味怎么来<\/strong><\/p>\n<ol>\n<li><strong>麻<\/strong>：用汉源花椒，干锅小火焙香后现碾成花椒粉，出锅前才撒，麻香最足。<\/li>\n<li><strong>辣<\/strong>：郫县豆瓣 + 刀口辣椒（辣椒段干炒后剁碎），辣得有层次、有香气，不是死辣。<\/li>\n<li><strong>烫<\/strong>：勾芡后汤汁浓稠能保温，装盘后表面不冒大汽但内里滚烫，趁热吃才正宗。<\/li>\n<li><strong>嫩<\/strong>：选嫩豆腐，焯水定型后保持水嫩，入口即化。<\/li>\n<li><strong>香<\/strong>：牛肉末要炒到酥香（传统正宗用黄牛肉，不用猪肉），豆瓣酱炒出红油香，蒜苗点缀提香。<\/li>\n<li><strong>鲜<\/strong>：用骨汤或高汤代替清水煮豆腐，鲜味更厚；起锅前沿锅边滴几滴香醋（可选），提鲜不抢味。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 牛肉末酥香<\/strong><\/p>\n<ol start=\"7\">\n<li>传统用黄牛肉末，肥三瘦七，剁得细而不泥。<\/li>\n<li>锅烧热、油稍宽，下牛肉末中小火慢炒，炒到水分收干、颜色由红变褐、粒粒分明微微发酥（约 3 分钟），这是「酥」的来源，也是香味的根基。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 三次勾芡与「大翻勺」<\/strong><\/p>\n<ol start=\"9\">\n<li>三次勾芡：第一次使豆腐挂汁，第二次入味，第三次起亮锁味。每次都是薄芡、大火烧开后再下一次。<\/li>\n<li>熟练后可「端锅大翻」代替铲子：把整锅豆腐抛起翻面，不碰碎豆腐，让芡汁均匀裹满每一块。<\/li>\n<li>出锅前撒现磨花椒粉和蒜苗碎（或葱花），再淋一点点热油提亮，红油浮面、豆腐颤而不散，就是到位。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 锅气与装盘<\/strong><\/p>\n<ol start=\"12\">\n<li>全程保持热锅热油、大火快炒，豆腐下锅后动作连贯、不拖沓，锅气才足。<\/li>\n<li>装盘后立刻上桌，配米饭最经典；凉了麻香和烫口都会打折。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/106862631/\">下厨房 · 麻婆豆腐（步骤详细）<\/a> —— 强调麻、辣、烫、香、酥、嫩、鲜，适合对照「大厨版」的六味与三次勾芡（需点开确认）<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV147411T7A4/\">川菜师傅这样烧麻婆豆腐，麻辣鲜嫩真好吃（哔哩哔哩）<\/a> —— 正宗川菜做法、讲解详细，适合对照「大厨版」（需点开确认）<\/li>\n<\/ul>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "87", "name": "蛋炒饭", "title": "蛋炒饭", "category": "主食谷物", "ingredient": "大米", "ings": [["隔夜米饭"], ["鸡蛋"], ["小葱"], ["盐"], ["食用油"]], "opt": [false, false, false, false, false], "tags": [], "html": "<h1>蛋炒饭<\/h1>\n<blockquote>\n<p>归属食材：大米 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>粒粒分明、蛋香十足的国民炒饭，隔夜饭的最佳归宿。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、粒粒分明不难吃）<\/h2>\n<p><strong>食材（1~2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>隔夜米饭<\/td>\n<td>1 大碗（约 250g）<\/td>\n<td>冷藏过更易炒散<\/td>\n<\/tr>\n<tr>\n<td>鸡蛋<\/td>\n<td>2 个（约 100g）<\/td>\n<td>打散备用<\/td>\n<\/tr>\n<tr>\n<td>小葱<\/td>\n<td>1~2 根<\/td>\n<td>切葱花<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>1/4~1/2 小勺<\/td>\n<td>分次加<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>2 汤匙（约 20ml）<\/td>\n<td>油稍多粒粒分明<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 备饭<\/strong><\/p>\n<ol>\n<li>隔夜饭从冰箱取出，用饭勺（或锅铲背面）把成块的米饭压散成粒。<\/li>\n<li>压到米粒散开、没有大块 → 冷饭水分少，炒出来才粒粒分明。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 打蛋<\/strong><\/p>\n<ol start=\"3\">\n<li>2 个鸡蛋磕进碗，加 1 小撮盐。<\/li>\n<li>打散到蛋清蛋黄完全融合。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 炒蛋<\/strong><\/p>\n<ol start=\"5\">\n<li>锅烧热，倒 1 汤匙油。<\/li>\n<li>油微热时倒入蛋液，快速用铲子划散成碎粒。<\/li>\n<li>看到鸡蛋刚凝固 → 立刻盛出备用（别炒老，余温会烘熟）。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 炒饭<\/strong><\/p>\n<ol start=\"8\">\n<li>锅里补 1 汤匙油，倒入压散的米饭。<\/li>\n<li>中大火翻炒 2~3 分钟，用铲子把结块压开。<\/li>\n<li>看到米粒在锅里「噼里啪啦」跳动、粒粒分明 → 可以合炒。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 合炒调味<\/strong><\/p>\n<ol start=\"11\">\n<li>倒回鸡蛋碎，加盐调味，翻炒均匀。<\/li>\n<li>撒葱花，大火再颠几下，关火出锅。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>米饭黏成一坨<\/strong>：用了刚煮的热饭。一定用隔夜饭或冷藏饭，下锅前先压散。<\/li>\n<li><strong>鸡蛋炒老<\/strong>：蛋炒到全干才盛出。刚凝固就盛，余温会烘熟。<\/li>\n<li><strong>糊底<\/strong>：火太大又不动铲。保持中大火、勤翻炒，让米粒都裹上油。<\/li>\n<li><strong>太咸 / 太淡<\/strong>：盐一次加太多。分次加，出锅前尝一口再补。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://hanwuji.xiachufang.com/recipe/107620661/\">下厨房 · 蛋炒饭（步骤图）<\/a> —— 基础步骤，适合对照「初学版」<\/li>\n<li><a href=\"https://mbdbj.xiachufang.com/recipe/107464490/\">下厨房 · 懒人蛋炒饭（步骤图）<\/a> —— 快手做法，适合对照「初学版」<\/li>\n<li><a href=\"http://mwx.douguo.com/cookbook/2402937.html\">豆果美食 · 蛋炒饭<\/a> —— 家常比例，适合对照「初学版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1bj411s7KV/\">B 站 · 5 分钟蛋炒饭（哔哩哔哩）<\/a> —— 快手教程，适合对照「初学版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV15tNA6JEdE/\">B 站 · 蛋炒饭 + 两个水煮蛋（哔哩哔哩）<\/a> —— 家常记录，可看成品状态参考<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：黄金炒饭 / 炒散 / 调味）<\/h2>\n<p>在初学版基础上，掌握下面几条，成品会更香、更好看。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 黄金蛋炒饭（金包银）<\/strong><\/p>\n<ol>\n<li>蛋黄蛋清分离。<\/li>\n<li>蛋黄拌进冷饭抓匀，让每粒米裹上蛋黄再下锅炒；蛋白单独炒成碎后混入。<\/li>\n<li>炒到成品金黄、蛋香渗进每粒米。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 没有隔夜饭的替代<\/strong><\/p>\n<ol start=\"4\">\n<li>现煮饭放凉或摊开晾约 20 分钟去水汽。<\/li>\n<li>再放冷藏 30 分钟，效果接近隔夜饭。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 炒散技巧<\/strong><\/p>\n<ol start=\"6\">\n<li>不要用铲子「铲」米饭，用锅铲「压 + 推」把结块压散。<\/li>\n<li>看到饭粒在锅里跳动 → 是水汽蒸干、开始粒粒分明的信号。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 调味变体（酱油版）<\/strong><\/p>\n<ol start=\"8\">\n<li>出锅前沿锅边淋 1 小勺生抽炒香。<\/li>\n<li>想上色可加少许老抽，做成「酱油蛋炒饭」；锅边淋入能激出酱香。<\/li>\n<\/ol>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「粒粒分明、蛋香浓郁、出锅有镬气」。每一步都是细节。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 锅够热、油够润<\/strong><\/p>\n<ol>\n<li>空锅烧到冒青烟，再下油。<\/li>\n<li>油晃匀润锅后，倒出多余的油再炒——「热锅凉油」让米饭不粘锅。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 蛋黄裹米<\/strong><\/p>\n<ol start=\"3\">\n<li>蛋黄提前拌入冷饭抓匀成「黄金米」（金包银的灵魂）。<\/li>\n<li>蛋白留到米饭炒热后淋入，快速翻匀成细碎蛋花。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 大火快炒出镬气<\/strong><\/p>\n<ol start=\"5\">\n<li>全程最大火、勤翻勺，让米粒在锅里跳跃。<\/li>\n<li>听到「噼里啪啦」声 → 水汽已干，炒饭开始出香。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 调味收尾<\/strong><\/p>\n<ol start=\"7\">\n<li>出锅前 30 秒加盐和葱花，大火翻两下激出葱香就离火。<\/li>\n<li>保持米饭干爽蓬松，趁热吃最香。<\/li>\n<\/ol>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "88", "name": "小米粥", "title": "小米粥", "category": "主食谷物", "ingredient": "小米", "ings": [["小米"], ["清水"], ["食用油"], ["糖", "盐"]], "opt": [false, false, true, true], "tags": [], "html": "<h1>小米粥<\/h1>\n<blockquote>\n<p>归属食材：小米 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>金黄米油、清香绵绸，是养胃的经典，熬出米油是关键。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、不难吃）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>小米<\/td>\n<td>100g<\/td>\n<td>新小米更香<\/td>\n<\/tr>\n<tr>\n<td>清水<\/td>\n<td>约 1000ml<\/td>\n<td>米水比约 1 : 10<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>几滴（可选）<\/td>\n<td>防溢、增香<\/td>\n<\/tr>\n<tr>\n<td>糖 / 盐<\/td>\n<td>少量（可选）<\/td>\n<td>按口味<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 淘洗<\/strong><\/p>\n<ol>\n<li>小米放进大碗，加清水轻轻淘洗 1～2 遍就够，<strong>不要用力搓<\/strong>。<\/li>\n<li>把表面灰尘冲掉即可（洗太狠会流失营养和米香）。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 煮开<\/strong><\/p>\n<ol start=\"3\">\n<li>锅里加约 1000ml 水烧开。<\/li>\n<li>水开后下小米，用勺子搅一下防止粘底。<\/li>\n<li>大火煮到再次沸腾，撇掉表面浮沫。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 熬煮<\/strong><\/p>\n<ol start=\"6\">\n<li>转<strong>小火<\/strong>，盖上锅盖但留一条小缝（或架一根筷子在锅沿）。<\/li>\n<li>熬约 25～30 分钟，中途搅拌几次防止糊底。<\/li>\n<li>熬到粥体浓稠、表面浮起一层细腻的米油 → 关火。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>糊底发苦<\/strong>：火太大或没搅拌。煮开后一定转小火，中途多搅几次。<\/li>\n<li><strong>溢锅<\/strong>：盖盖没留缝。锅盖留一条缝，或滴几滴油防溢。<\/li>\n<li><strong>太稀像水<\/strong>：水多了或时间不够。米水比 1 : 10 起步，多熬一会自然浓稠。<\/li>\n<li><strong>小米没香味、不出油<\/strong>：小米不新鲜、或熬的时间不够。选颜色金黄的新小米，小火慢熬 25 分钟以上。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.douguo.net/cookbook/2492595.html\">豆果美食 · 小米粥（铧发妈）<\/a> —— 基础熬法，适合对照「初学版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1QD42137RC/\">在家用小米和少许大米做小米稀饭（哔哩哔哩）<\/a> —— 关键步骤讲解，适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：比例 / 火候 / 米油）<\/h2>\n<p>在初学版基础上，掌握下面四条，粥会更绵绸、米油更厚。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 米水比例<\/strong><\/p>\n<ol>\n<li>按 <strong>1 : 10 到 1 : 12<\/strong> 配水：100g 小米配 1000～1200ml 水；喜欢稠一点就 1 : 10，喜欢稀一点就 1 : 12。<\/li>\n<li>水要<strong>一次加够<\/strong>，中途不加水（中途加水会让粥「水米分离」、不黏稠）。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 开水下锅<\/strong><\/p>\n<ol start=\"3\">\n<li><strong>水开后下小米<\/strong>更省时、更易开花：滚水让小米表面快速糊化，米粒更容易煮开花、出米油。<\/li>\n<li>新手建议开水下锅；冷水下锅也行，但要盯紧防止粘底。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 先大火后小火<\/strong><\/p>\n<ol start=\"5\">\n<li>先<strong>大火煮开<\/strong>（快速把粥滚开）。<\/li>\n<li>再<strong>转小火慢熬<\/strong>（让小米充分吸水、淀粉慢慢释放），这是出米油的关键节奏。<\/li>\n<li>全程大火容易糊底、还不出油。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 熬出米油 + 防溢<\/strong><\/p>\n<ol start=\"8\">\n<li><strong>小火慢熬 + 中途轻搅<\/strong>，让粥表面慢慢浮出细腻油膜（米油）。<\/li>\n<li>滴几滴油（橄榄油 / 玉米油 / 香油）能防溢、增香；锅盖留缝也能有效防溢。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.douguo.net/cookbook/1397773.html\">豆果美食 · 小米粥<\/a> —— 米水比例与火候，适合对照「进阶版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1G9nJ6hEGM/\">小米粥加3样蔬菜，养胃一碗管饱（哔哩哔哩）<\/a> —— 蔬菜小米粥，适合对照「进阶版」的配料<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「米油厚、米香浓、粥体绵绸」。每一步都是细节。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 选新小米<\/strong><\/p>\n<ol>\n<li>选<strong>颜色金黄、有淡淡米香<\/strong>的新小米（陈米颜色发白、煮不出米油）。<\/li>\n<li>淘洗 1～2 遍即可，<strong>不要搓、不要泡太久<\/strong>，否则米香流失。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 开水下锅、大火滚开<\/strong><\/p>\n<ol start=\"3\">\n<li>水烧开后下小米。<\/li>\n<li>先<strong>大火滚 5 分钟<\/strong>，让米粒在沸腾中充分翻滚、快速开花。<\/li>\n<li>表面浮沫撇干净，粥更清爽。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 小火慢熬、少搅多焖<\/strong><\/p>\n<ol start=\"6\">\n<li>转<strong>最小火<\/strong>，保持锅面微微冒泡，盖上锅盖留小缝，熬 25～30 分钟。<\/li>\n<li>中途<strong>少搅<\/strong>（搅太多会破坏米粒、粥发浑），只在快糊底时沿锅边轻轻推几下。<\/li>\n<li>熬到米粒开花、粥体浓稠、<strong>表面浮起一层金黄油亮的米油<\/strong> → 即可。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 搭配与收尾<\/strong><\/p>\n<ol start=\"9\">\n<li>出锅前点几滴<strong>香油<\/strong>，米香更润；也可在熬到一半时加入南瓜泥、红枣、红薯丁或山药，颜色金黄、口感更黏稠（南瓜泥是早餐店「金黄浓稠」的常用技巧）。<\/li>\n<li>咸口可加皮蛋、瘦肉、咸鸭蛋；甜口加红糖、枸杞、桂圆。趁热喝，凉了米油会凝结、口感下降。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.douguo.net/cookbook/1150937.html\">豆果美食 · 小米粥<\/a> —— 熬出米油的技巧，适合对照「大厨版」<\/li>\n<\/ul>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "89", "name": "燕麦粥", "title": "燕麦粥", "category": "主食谷物", "ingredient": "燕麦", "ings": [["即食", "快熟燕麦片"], ["清水", "牛奶"], ["糖", "蜂蜜"], ["盐"]], "opt": [false, false, true, true], "tags": [], "html": "<h1>燕麦粥<\/h1>\n<blockquote>\n<p>归属食材：燕麦 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>绵滑黏糯、麦香奶香，几分钟就能出锅，是快手又养胃的早餐。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、不难吃）<\/h2>\n<p><strong>食材（1～2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>即食 / 快熟燕麦片<\/td>\n<td>50g<\/td>\n<td>快熟燕麦片口感更绵<\/td>\n<\/tr>\n<tr>\n<td>清水或牛奶<\/td>\n<td>400ml<\/td>\n<td>纯奶更香，也可水 + 奶各半<\/td>\n<\/tr>\n<tr>\n<td>糖 / 蜂蜜<\/td>\n<td>适量<\/td>\n<td>甜口可选<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>一丁点<\/td>\n<td>提香（可选）<\/td>\n<\/tr>\n<tr>\n<td>配料（可选）<\/td>\n<td>红枣 / 葡萄干 / 香蕉等<\/td>\n<td>按喜好加<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 下锅<\/strong><\/p>\n<ol>\n<li>把燕麦片和液体（水 / 牛奶）一起倒进小锅。<\/li>\n<li>也可以先烧开水再下燕麦片，更不容易糊底。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 煮制<\/strong><\/p>\n<ol start=\"3\">\n<li>开中火煮到微微沸腾。<\/li>\n<li>立刻转<strong>小火<\/strong>，边煮边用勺子搅拌，约 3～5 分钟。<\/li>\n<li>煮到粥变浓稠、燕麦片软糯开花 → 关火前调味。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 调味出锅<\/strong><\/p>\n<ol start=\"6\">\n<li>关火前加糖或蜂蜜调味，撒上喜欢的配料，搅匀即可。<\/li>\n<li>咸口可以放一点点盐提香。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>粘锅糊底<\/strong>：火太大、或没搅拌。煮开后一定转小火，并不断搅拌。<\/li>\n<li><strong>溢锅<\/strong>：用纯牛奶煮、火又大，很容易溢。牛奶煮开要盯紧，小火 + 搅拌。<\/li>\n<li><strong>太稀像水 / 太稠像饭<\/strong>：比例不对。燕麦片 : 液体约 <strong>1 : 8<\/strong> 起步，太稀就多煮一会、太稠就加一点热奶。<\/li>\n<li><strong>燕麦片没煮软<\/strong>：用了生燕麦粒或钢切燕麦，这类要煮很久，新手先选「即食 / 快熟燕麦片」。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.douguo.net/cookbook/1568483.html\">豆果美食 · 燕麦粥<\/a> —— 基础燕麦粥做法，适合对照「初学版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1pd4y1D7uW/\">帕梅拉食谱 · 经典燕麦粥（哔哩哔哩）<\/a> —— 四食材经典版，适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：比例 / 火候 / 出黏稠）<\/h2>\n<p>在初学版基础上，掌握下面四条，粥会更绵滑黏糯。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 液体比例<\/strong><\/p>\n<ol>\n<li>按 <strong>1 : 8 到 1 : 10<\/strong> 配液体：50g 燕麦配 400～500ml 水 / 奶；喜欢稀一点就 1 : 10，喜欢稠一点就 1 : 8。<\/li>\n<li>纯牛奶煮更香浓，但容易溢、也容易糊底；「水 + 奶各半」更稳，出锅前再补一点奶更香。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 先大火后小火<\/strong><\/p>\n<ol start=\"3\">\n<li><strong>先大火把液体煮开<\/strong>。<\/li>\n<li>再<strong>转小火慢煮<\/strong>，让燕麦片充分吸水、淀粉慢慢糊化（粥才黏糯不糊底）。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 搅拌出黏稠<\/strong><\/p>\n<ol start=\"5\">\n<li>边煮边搅拌，让淀粉均匀释放、粥体更绵滑，也防止糊底。<\/li>\n<li>搅拌到粥表面出现<strong>细密的小泡、变得浓稠挂勺<\/strong> → 差不多了。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 熬出「米油感」与配料<\/strong><\/p>\n<ol start=\"7\">\n<li><strong>小火多搅、关火后盖上盖子焖 2 分钟<\/strong>，会明显更绵滑浓稠。<\/li>\n<li>甜口搭配：红枣、葡萄干、香蕉、蓝莓、蜂蜜；咸口搭配：鸡蛋花、青菜碎、火腿丁、虾仁。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/category/1016536/\">下厨房 · 燕麦粥做法大全（分类页）<\/a> —— 甜口 / 咸口多种变式，适合对照「进阶版」的配料<\/li>\n<li><a href=\"https://www.xiaohongshu.com/discovery/item/64d2121f000000000103e0e7\">小红书 · 虾仁燕麦粥<\/a> —— 咸口燕麦粥，适合对照「进阶版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV173411B7hQ/\">制作好吃的燕麦粥（哔哩哔哩）<\/a> —— 咸口味噌豆腐燕麦粥，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「绵滑黏糯、麦香奶香、入口即化」。每一步都是细节。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 燕麦片选型<\/strong><\/p>\n<ol>\n<li><strong>即食燕麦片<\/strong>（热水一冲即熟）最省事，但口感略薄；<strong>快熟燕麦片<\/strong>（煮 3～5 分钟）口感最平衡；<strong>钢切燕麦 / 生燕麦粒<\/strong>最耐嚼，但要煮 20 分钟以上，风味最足。<\/li>\n<li>想要「米油感」更浓，可用<strong>钢切燕麦 + 快熟燕麦各半<\/strong>混搭，既有嚼劲又绵滑。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 液体处理<\/strong><\/p>\n<ol start=\"3\">\n<li>用牛奶煮时，<strong>先小火把牛奶加热到温热、再下燕麦片<\/strong>，边下边搅，燕麦不容易结块。<\/li>\n<li>煮开即转最小火，防止牛奶糊底和溢锅。<\/li>\n<li>也可先用水煮到燕麦开花、再关火拌入冷牛奶或淡奶油，奶香更浓且不破坏奶味（高温久煮会让牛奶发腥）。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 火候与焖煮<\/strong><\/p>\n<ol start=\"6\">\n<li>大火煮沸后转最小火，保持锅面微微冒泡即可，不停搅拌防糊。<\/li>\n<li>煮到浓稠后<strong>关火盖盖焖 2 分钟<\/strong>，让淀粉充分吸水，口感更绵。<\/li>\n<li>看到粥能「挂勺」、表面浮起一层细腻的黏稠层 → 好了。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 咸甜两派调味<\/strong><\/p>\n<ol start=\"9\">\n<li><strong>甜口<\/strong>：煮好后加蜂蜜（不要煮，高温会破坏蜂蜜营养），配香蕉片、蓝莓、肉桂粉，麦香更立体。<\/li>\n<li><strong>咸口<\/strong>：燕麦煮到浓稠后打入蛋花搅散，加青菜碎、火腿丁、一点白胡椒和盐，成咸鲜口味；或仿广式「皮蛋燕麦粥」加皮蛋和瘦肉。<\/li>\n<\/ol>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "90", "name": "松仁玉米", "title": "松仁玉米", "category": "主食谷物", "ingredient": "玉米", "ings": [["甜玉米粒"], ["松仁"], ["胡萝卜"], ["黄瓜"], ["盐"], ["白糖"], ["水淀粉"], ["食用油"]], "opt": [false, false, false, true, false, false, false, false], "tags": [], "html": "<h1>松仁玉米<\/h1>\n<blockquote>\n<p>归属食材：玉米 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>甜咸适口、清亮挂汁，玉米清甜配松仁焦香，是家宴上好看又讨喜的素菜。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、不难吃）<\/h2>\n<p><strong>食材（2～3 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>甜玉米粒<\/td>\n<td>300g<\/td>\n<td>罐头 / 冷冻 / 鲜剥均可<\/td>\n<\/tr>\n<tr>\n<td>松仁<\/td>\n<td>30g<\/td>\n<td>约 2 汤匙<\/td>\n<\/tr>\n<tr>\n<td>胡萝卜<\/td>\n<td>半根<\/td>\n<td>切小丁<\/td>\n<\/tr>\n<tr>\n<td>黄瓜<\/td>\n<td>半根<\/td>\n<td>切小丁（可选，配色）<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>约 1/4 小勺<\/td>\n<td>提味<\/td>\n<\/tr>\n<tr>\n<td>白糖<\/td>\n<td>1 小勺<\/td>\n<td>突出清甜<\/td>\n<\/tr>\n<tr>\n<td>水淀粉<\/td>\n<td>1 小勺淀粉 + 2 汤匙水<\/td>\n<td>勾薄芡<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>1.5 汤匙<\/td>\n<td>分两次用<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 焯水<\/strong><\/p>\n<ol>\n<li>玉米粒、胡萝卜丁放进开水里焯约 1 分钟，捞出彻底沥干（黄瓜丁可以后放，保持脆）。<\/li>\n<li>焯到玉米更清甜、胡萝卜易熟，也去掉多余生水 → 沥干后焙松仁。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 焙松仁<\/strong><\/p>\n<ol start=\"3\">\n<li>冷锅（不加油或少油）开小火，倒入松仁。<\/li>\n<li>用铲子不停翻动，约 1～2 分钟。<\/li>\n<li>见松仁微微发黄、闻到坚果香 → 立刻盛出（非常容易糊，宁浅勿深，盛出后余温还会继续上色）。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 炒制<\/strong><\/p>\n<ol start=\"6\">\n<li>锅烧热倒 1 汤匙油，下玉米粒、胡萝卜丁，中大火翻炒约 1 分钟。<\/li>\n<li>加盐和白糖，再下黄瓜丁炒匀。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 勾芡出锅<\/strong><\/p>\n<ol start=\"8\">\n<li>把水淀粉搅匀，沿锅边淋入，快速翻炒。<\/li>\n<li>看到汤汁变浓、能薄薄挂在玉米粒上 → 关火。<\/li>\n<li>撒上焙好的松仁，拌匀出锅。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>松仁炒糊了发苦<\/strong>：火太大或没一直翻动。记住「冷锅小火、不停翻、微黄就盛」。<\/li>\n<li><strong>菜出水多、像汤<\/strong>：焯水后没沥干，或炒的时候又加了水。焯水后一定沥干，这道菜不用额外加水。<\/li>\n<li><strong>芡太厚像糊糊<\/strong>：水淀粉倒太多或没搅匀。薄芡就是「让汁挂在料上」，稀一点、少量淋。<\/li>\n<li><strong>松仁回软不脆<\/strong>：松仁太早下锅、和汤汁一起炒久了。松仁要最后撒，保持酥脆。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/107670674/\">下厨房 · 松仁玉米的做法（步骤图）<\/a> —— 焯水 + 勾芡流程清楚，适合对照「初学版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1EF411b77M/\">小凤凰饲养日记 · 松仁玉米的制作方法（哔哩哔哩）<\/a> —— 焯水顺序 + 最后撒松仁，适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：焯水 / 焙松仁 / 勾薄芡）<\/h2>\n<p>在初学版基础上，掌握下面四条，成菜更清亮、更挂味。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 玉米焯水保色提甜<\/strong><\/p>\n<ol>\n<li>焯水时水里加<strong>一小撮盐 + 半小勺糖<\/strong>，能让玉米更清甜、颜色更黄亮。<\/li>\n<li>焯 1 分钟即可（时间太长玉米会老、营养流失）。<\/li>\n<li>焯完捞出过一下凉水再沥干，颜色更鲜亮、口感更爽。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 松仁小火焙香（易糊）<\/strong><\/p>\n<ol start=\"4\">\n<li>松仁<strong>凉油下锅、小火慢焙<\/strong>（油温太高松仁瞬间就焦）。<\/li>\n<li>看到「颜色微黄、闻到香味」 → 立即离火。<\/li>\n<li>出锅后放在吸油纸上摊开，避免余温把它烘糊。<\/li>\n<li>想要更香，可用一点点冷油滑一下松仁再焙，但同样全程小火。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 勾薄芡让汁挂料<\/strong><\/p>\n<ol start=\"8\">\n<li>芡汁要<strong>薄<\/strong>：1 小勺淀粉 + 2 汤匙水，搅到没有颗粒。<\/li>\n<li>下锅后快速翻炒，看到汤汁从「稀」变「亮」、均匀裹在玉米粒上 → 好了。<\/li>\n<li>勾芡后再下松仁，松仁不被汁泡软，才保持酥脆。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 调味——「要想甜，加点盐」<\/strong><\/p>\n<ol start=\"11\">\n<li>这道菜偏甜口，但一定放少量盐打底，甜味才「立得住」、不齁。<\/li>\n<li>糖盐比例约 <strong>4 : 1<\/strong>（如糖 5g、盐 1.5g）。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/103561656/\">下厨房 · 自己做一个不那么甜的松仁玉米<\/a> —— 松仁先焙香，适合对照「进阶版」的松仁处理<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「玉米清亮、汁浓能挂、松仁酥香」。每一步都是细节。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 松仁——低温滑油更酥香<\/strong><\/p>\n<ol>\n<li>松仁冷油下锅，油温控制在<strong>四成热（约 120℃）<\/strong>左右。<\/li>\n<li>用小火慢慢滑到微黄，捞出沥油摊开（低温滑油的松仁颜色均匀、口感酥脆，不易焦）。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 玉米选料与处理<\/strong><\/p>\n<ol start=\"3\">\n<li>用<strong>水果玉米或甜玉米粒<\/strong>最清甜；罐头玉米要先沥干汁水，鲜玉米剥粒后可轻焯 40 秒。<\/li>\n<li>胡萝卜、黄瓜切成和玉米粒差不多大小的丁，口感统一。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 炒制与调味<\/strong><\/p>\n<ol start=\"5\">\n<li>锅热倒油，先下胡萝卜丁炒香（胡萝卜含脂溶性营养，先炒更香更营养）。<\/li>\n<li>再下玉米粒大火翻炒。<\/li>\n<li>加盐、白糖（比例约 4 : 1），让每粒都沾味。<\/li>\n<li>想要香气更足，可在出锅前点几滴<strong>牛奶或淡奶油<\/strong>（可选），奶香和玉米甜味很搭。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 勾芡与挂汁<\/strong><\/p>\n<ol start=\"9\">\n<li>芡汁用<strong>土豆淀粉<\/strong>调，勾出来的芡更亮、更透明。<\/li>\n<li>沿锅边淋入后大火快速翻匀，收到「锅边起鱼眼泡、汁能挂在玉米上」的程度。<\/li>\n<li>关火前点一点明油（几滴热油）翻匀，让成菜更油亮。<\/li>\n<li>最后撒松仁，翻两下立刻装盘，松仁的酥香才不被热汽泡软。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.douguo.net/cookbook/2511418.html\">豆果美食 · 松仁玉米<\/a> —— 甜咸调味与勾芡，适合对照「大厨版」的挂汁<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1hD4y1D7dw/\">松仁玉米 酒店标准制作流程（哔哩哔哩）<\/a> —— 酒店流程，适合对照「大厨版」<\/li>\n<\/ul>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "91", "name": "炒米粉", "title": "炒米粉", "category": "主食谷物", "ingredient": "米粉", "ings": [["干米粉"], ["鸡蛋"], ["圆白菜", "包菜"], ["胡萝卜"], ["小葱"], ["生抽"], ["老抽"], ["盐", "白糖"], ["食用油"]], "opt": [false, false, false, false, false, false, true, false, false], "tags": [], "html": "<h1>炒米粉<\/h1>\n<blockquote>\n<p>归属食材：米粉 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>干香入味、米粉爽滑不坨，配料丰俭由人，是一道快手下饭的主食。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、不难吃）<\/h2>\n<p><strong>食材（1～2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>干米粉<\/td>\n<td>100g<\/td>\n<td>细米粉最好炒<\/td>\n<\/tr>\n<tr>\n<td>鸡蛋<\/td>\n<td>2 个<\/td>\n<td>增香增味<\/td>\n<\/tr>\n<tr>\n<td>圆白菜（包菜）<\/td>\n<td>1/4 个<\/td>\n<td>切细丝<\/td>\n<\/tr>\n<tr>\n<td>胡萝卜<\/td>\n<td>半根<\/td>\n<td>切细丝<\/td>\n<\/tr>\n<tr>\n<td>小葱<\/td>\n<td>2 根<\/td>\n<td>葱白爆香、葱绿出锅撒<\/td>\n<\/tr>\n<tr>\n<td>生抽<\/td>\n<td>1 汤匙<\/td>\n<td>调味<\/td>\n<\/tr>\n<tr>\n<td>老抽<\/td>\n<td>1/2 汤匙<\/td>\n<td>上色（可选）<\/td>\n<\/tr>\n<tr>\n<td>盐 / 白糖<\/td>\n<td>各少许<\/td>\n<td>糖提鲜<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>2 汤匙<\/td>\n<td>分两次用<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 泡米粉<\/strong><\/p>\n<ol>\n<li>干米粉放进温水（约 40～50℃，手摸微热不烫）里泡 20～30 分钟。<\/li>\n<li>泡到米粉能轻松弯成 U 形、但掐一下还有一点韧性 → 捞出，彻底沥干。<\/li>\n<li>拌入几滴油抓散，防止粘连（「泡软不泡烂」，泡过头一炒就碎）。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 炒蛋<\/strong><\/p>\n<ol start=\"4\">\n<li>鸡蛋加 1 小撮盐打散。<\/li>\n<li>锅烧热倒 1 汤匙油，油热下蛋液快速划散。<\/li>\n<li>刚凝固 → 盛出备用。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 炒配料<\/strong><\/p>\n<ol start=\"7\">\n<li>锅里补 1 汤匙油，下葱白爆香。<\/li>\n<li>倒入圆白菜丝、胡萝卜丝，中大火翻炒约 1 分钟。<\/li>\n<li>炒到断生、微微变软（包菜会出水，尽量炒干一点）。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 炒粉合炒<\/strong><\/p>\n<ol start=\"10\">\n<li>转大火，倒入沥干的米粉，用「筷子 + 铲子」配合把米粉拨散、和配料拌匀。<\/li>\n<li>沿锅边淋入生抽、老抽，撒少许盐和糖，快速翻炒约 1～2 分钟，让每根粉都沾上酱色。<\/li>\n<li>倒回鸡蛋、撒葱绿，再翻两下出锅。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>米粉泡烂了一炒就碎<\/strong>：水温太高或泡太久。用温水、泡到「能弯但有韧性」就捞出，宁短勿长。<\/li>\n<li><strong>米粉粘成一坨<\/strong>：没沥干就下锅、或下锅前没加油抓散。泡好后一定沥干，抓一点油再炒。<\/li>\n<li><strong>太咸或发黑<\/strong>：生抽老抽都咸、老抽又上色。老抽只放半勺甚至不放，先少放、尝了再补。<\/li>\n<li><strong>一锅水、像煮粉<\/strong>：配菜带太多水下锅、或火不够大。包菜尽量控干，炒粉全程大火快炒。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/102235391/\">下厨房 · 炒米粉的做法（快手菜）<\/a> —— 焯水过凉 + 豆芽配菜，适合对照「初学版」的泡发与火候<\/li>\n<li><a href=\"https://www.douguo.net/cookbook/3288265.html\">豆果美食 · 炒米粉 新手零失败（详细步骤）<\/a> —— 步骤详细，适合对照「初学版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1qQ4y1x7xX/\">一分钟学会一道菜｜今天学校门口的炒米粉（哔哩哔哩）<\/a> —— 快手家常版，适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：泡发 / 火候 / 锅气）<\/h2>\n<p>在初学版基础上，掌握下面四条，米粉会干香不坨、有锅气。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 泡发的分寸<\/strong><\/p>\n<ol>\n<li>温水泡 20～30 分钟最稳；时间紧可用开水烫 2～3 分钟再冲凉，但容易软硬不均。<\/li>\n<li>判断标准：<strong>能弯曲、不硬心、但掐起来还有弹性<\/strong>。<\/li>\n<li>泡好后一定彻底沥干，最好再晾几分钟，表面略干才炒得散。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 先炒蛋、再炒配料、最后下粉<\/strong><\/p>\n<ol start=\"4\">\n<li>蛋先炒好盛出，避免和米粉一起炒变老。<\/li>\n<li>配料炒到断生、水分炒干，才下米粉（否则整锅湿答答）。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 大火快炒出锅气<\/strong><\/p>\n<ol start=\"6\">\n<li>炒粉一定开<strong>大火<\/strong>、动作要快（米粉本身是熟的，下锅只是「加热 + 裹味」，炒太久会烂）。<\/li>\n<li>用筷子拨散比铲子好用，能一根根分开，不把粉铲碎。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 调味沿锅边淋<\/strong><\/p>\n<ol start=\"8\">\n<li>酱油沿锅边淋下去，高温瞬间激出豉香（锅气来源之一），再快速翻匀。<\/li>\n<li>想要干香口感，最后可以沿锅边淋一点点热水（约 2 汤匙），快速翻炒让水汽蒸发，粉会更爽利、不粘锅。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.douguo.net/cookbook/3309302.html\">豆果美食 · 炒米粉<\/a> —— 配料与调味参考，适合对照「进阶版」的锅气<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1xafZBXEXL/\">一人食｜香辣的鲜肉炒米粉（哔哩哔哩）<\/a> —— 香辣口味，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「根根分明、干香爽滑、豉香四溢」。每一步都是细节。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 米粉——提前冷水泡<\/strong><\/p>\n<ol>\n<li>干米粉提前一晚（或至少 2 小时）用<strong>冷水<\/strong>泡发（冷水泡出来的米粉更爽滑、不易烂）。<\/li>\n<li>泡好后捞出，放在漏勺里充分甩干，表面略干再炒。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 润锅与火候<\/strong><\/p>\n<ol start=\"3\">\n<li>空锅烧到冒青烟，倒油晃动让油铺满锅壁（润锅），再倒出多余的油——这样炒粉不粘锅。<\/li>\n<li>全程最大火，动作连贯不停顿。<\/li>\n<li>米粉下锅后先别急着翻，用铲子<strong>轻轻压一下、煎 10 秒<\/strong>再翻（像炒饭一样先煎香），能带出焦香和锅气。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 下料顺序<\/strong><\/p>\n<ol start=\"6\">\n<li>先爆香葱白、蒜末，下肉丝或火腿炒熟。<\/li>\n<li>再下圆白菜丝、胡萝卜丝、豆芽炒到断生，把配料里的水分炒干。<\/li>\n<li>下米粉，用筷子把粉抖散，沿锅边淋豉油、老抽，大火快速翻匀。<\/li>\n<li>最后下鸡蛋、豆芽（豆芽后放保持脆爽）和葱绿，颠两下立刻出锅。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 干香不油的收尾<\/strong><\/p>\n<ol start=\"10\">\n<li>出锅前如果锅底偏干，沿锅边淋一汤匙热水，快速翻炒让水汽「呲」一声蒸发，粉会更爽利不粘。<\/li>\n<li>装盘后撒一点白芝麻或葱花，趁热吃——凉了米粉会回软，锅气就散了。<\/li>\n<\/ol>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "92", "name": "拔丝红薯", "title": "拔丝红薯", "category": "主食谷物", "ingredient": "红薯", "ings": [["红薯"], ["白糖"], ["清水"], ["食用油"], ["干淀粉"], ["白芝麻"]], "opt": [false, false, false, false, true, true], "tags": ["甜"], "html": "<h1>拔丝红薯<\/h1>\n<blockquote>\n<p>归属食材：红薯 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>外壳糖脆、内里软糯，夹起能拉出金黄糖丝，是宴客压轴的甜口菜，要趁热吃。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、不难吃）<\/h2>\n<p><strong>食材（2～3 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>红薯<\/td>\n<td>2 个（约 500g）<\/td>\n<td>黄心 / 红心更甜糯<\/td>\n<\/tr>\n<tr>\n<td>白糖<\/td>\n<td>100g<\/td>\n<td>熬糖用<\/td>\n<\/tr>\n<tr>\n<td>清水<\/td>\n<td>50ml<\/td>\n<td>水熬糖（约糖的一半）<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>适量<\/td>\n<td>炸红薯 + 熬糖各用<\/td>\n<\/tr>\n<tr>\n<td>干淀粉<\/td>\n<td>1 汤匙（可选）<\/td>\n<td>给红薯拍粉<\/td>\n<\/tr>\n<tr>\n<td>白芝麻<\/td>\n<td>少许（可选）<\/td>\n<td>出锅撒<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 处理红薯<\/strong><\/p>\n<ol>\n<li>红薯去皮，切成约 3cm 的滚刀块。<\/li>\n<li>放进清水里泡 5 分钟，洗去表面淀粉，捞出沥干。<\/li>\n<li>再薄薄拍一层干淀粉（可选），能让红薯炸出来表面更干爽、不吸油。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 炸红薯<\/strong><\/p>\n<ol start=\"4\">\n<li>锅里倒油，烧到<strong>五六成热<\/strong>（约 150～170℃，筷子伸进去周围快速冒小泡）。<\/li>\n<li>下红薯块，中火炸约 3～4 分钟。<\/li>\n<li>炸到表面金黄、用筷子能轻松扎透 → 捞出沥油。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 熬糖<\/strong><\/p>\n<ol start=\"7\">\n<li>另起一口干净的锅（或把炸油倒出、锅擦净），放白糖和清水。<\/li>\n<li>开小火慢慢熬，不要搅动，让糖自己融化。<\/li>\n<li>观察糖液先起大泡，慢慢变小泡、颜色由白转浅黄再转琥珀色。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 裹糖出锅<\/strong><\/p>\n<ol start=\"10\">\n<li>看到糖液变成琥珀色、气泡细密 → 迅速倒入炸好的红薯。<\/li>\n<li>快速翻拌让每块都裹上糖液。<\/li>\n<li>立刻盛进<strong>提前抹了油的盘子<\/strong>，撒白芝麻，趁热上桌。<\/li>\n<li>旁边放一碗凉白开，吃时蘸一下，糖壳更脆、还不烫嘴。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>红薯外糊内生<\/strong>：油温太高或块切太大。油温五六成热、中火慢炸，块别超过 3cm。<\/li>\n<li><strong>糖熬过头发苦<\/strong>：火大或熬太久。全程小火，颜色一到琥珀色立刻下红薯。<\/li>\n<li><strong>拔不出丝<\/strong>：糖没熬到位（还太稀、颜色太浅）。要熬到「大泡变小泡、颜色转琥珀色」才算好。<\/li>\n<li><strong>糖凉了结成硬块<\/strong>：动作太慢、或盘子没抹油。下红薯后要快速翻匀，盘子提前抹油防粘。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.douguo.net/cookbook/2459583.html\">豆果美食 · 拔丝地瓜<\/a> —— 炸制与熬糖步骤清楚，适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：炸制 / 熬糖 / 拔丝火候）<\/h2>\n<p>在初学版基础上，掌握下面四条，拔丝成功率会高很多。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 红薯炸制火候<\/strong><\/p>\n<ol>\n<li>油温<strong>五六成热<\/strong>下锅，先中火炸定型、再转中小火炸透。<\/li>\n<li>最后转大火复炸 30 秒逼出多余油分，外皮更脆。<\/li>\n<li><strong>筷子能轻松扎透<\/strong>红薯块 → 内里已软糯；炸到表面金黄、微微起皱即可。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 熬糖的两种方法<\/strong><\/p>\n<ol start=\"4\">\n<li><strong>水熬糖<\/strong>（更稳、更适合新手）：糖 + 水约 2 : 1（100g 糖 + 50ml 水），小火慢慢熬，水汽蒸发后糖液逐渐浓稠；温度上升慢、不易糊，但时间稍长。<\/li>\n<li><strong>油熬糖<\/strong>（更快、更香、更亮）：锅里放少许油（约 1 汤匙）+ 糖，小火炒化；一分钟就能成糖色、糖壳更脆亮，但火候难控、新手易糊。<\/li>\n<li>新手建议先练<strong>水熬糖<\/strong>，熟练后再试油熬糖。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 拔丝的火候判断<\/strong><\/p>\n<ol start=\"7\">\n<li>熬糖会经历：<strong>大泡（水分多）→ 小泡（水分快干）→ 细密小泡（糖液浓稠）→ 颜色转琥珀 / 香油色<\/strong>。<\/li>\n<li>糖液颜色到<strong>浅琥珀色、气泡小而密<\/strong> → 就是最佳。<\/li>\n<li>也可蘸一点糖液滴进冷水，<strong>能结成脆硬的小糖块<\/strong> → 到位了。<\/li>\n<li>没到位（太稀）拔不出丝、还粘牙；熬过头（深褐色）会发苦。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 趁热拔丝 + 防粘<\/strong><\/p>\n<ol start=\"11\">\n<li>裹糖时<strong>关火或离火<\/strong>操作，靠糖液的余温就够，避免余火把糖熬过。<\/li>\n<li>盘子提前抹一层薄油，糖丝就不会粘盘；趁热吃才拔丝，凉了糖就结成硬壳。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.douguo.com/cookbook/1635134.html\">豆果美食 · 拔丝红薯<\/a> —— 红薯切块与熬糖细节，适合对照「进阶版」<\/li>\n<li><a href=\"https://www.xiachufang.com/category/40065/\">下厨房 · 拔丝菜谱专区（含「一次成功的拔丝红薯」等高分菜谱）<\/a> —— 炒糖细节汇总，适合对照「进阶版」的熬糖<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1Msc2eTEsi/\">全网最详细拔丝教程（哔哩哔哩）<\/a> —— 熬糖「大泡转小泡」讲解详细，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「糖壳薄脆透亮、拉丝不断、内里软糯」。每一步都是细节。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 选料与切块<\/strong><\/p>\n<ol>\n<li>选<strong>红皮黄心或红心红薯<\/strong>，水分足、糖分高，炸出来更糯更甜。<\/li>\n<li>切滚刀块大小要均匀（约 3cm），受热才一致。<\/li>\n<li>切好的红薯泡清水去淀粉、沥干后<strong>拍一层薄薄的土豆淀粉<\/strong>，炸出来表面干爽、糖壳挂得更牢。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 炸制——定型、浸炸、复炸<\/strong><\/p>\n<ol start=\"4\">\n<li>油温<strong>五成热（约 150℃）<\/strong>下锅，大火快速定型。<\/li>\n<li>转中小火浸炸 3 分钟，把内里炸透。<\/li>\n<li>捞出后把油温升高到七成热（约 180℃），复炸 30 秒逼油、起酥。<\/li>\n<li>红薯炸到表面金黄、微微起皱、筷子轻松扎透 → 捞出放在漏勺上沥干，保持干爽。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 熬糖——水熬为主，防结晶<\/strong><\/p>\n<ol start=\"8\">\n<li>100g 白糖 + 50ml 清水，滴入<strong>几滴白醋<\/strong>（白醋能防止糖「返砂」结晶，让糖色更透亮）。<\/li>\n<li>小火慢熬，中间<strong>不要搅动<\/strong>，可以轻晃锅让糖液均匀。<\/li>\n<li>观察糖液从「大泡 → 小泡 → 细密小泡 → 香油色 / 琥珀色」，一到颜色 → <strong>立即离火<\/strong>。<\/li>\n<li>离火后再下红薯，用锅的余温裹糖，糖色就不会过火。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 裹糖与上桌<\/strong><\/p>\n<ol start=\"12\">\n<li>下红薯后快速颠锅或翻拌，让糖液薄薄均匀裹满每一块。<\/li>\n<li>撒熟白芝麻。<\/li>\n<li>盛入<strong>提前抹油的盘子<\/strong>，越快上桌越好。<\/li>\n<li>盘边放一碗凉白开，吃时蘸水，糖壳遇冷变脆、内里滚烫软糯，是最地道的吃法。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.bilibili.com/video/BV1Wb41167ci/\">小高姐 · 拔丝地瓜 两种熬糖浆方法（哔哩哔哩）<\/a> —— 水熬糖 vs 油熬糖对比，适合对照「大厨版」<\/li>\n<\/ul>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "93", "name": "番茄鸡蛋面", "title": "番茄鸡蛋面（西红柿鸡蛋面）", "category": "主食谷物", "ingredient": "面条", "ings": [["面条"], ["西红柿"], ["鸡蛋"], ["盐"], ["白糖"], ["生抽"], ["食用油"], ["清水"], ["葱花"]], "opt": [false, false, false, false, false, false, false, false, false], "tags": [], "html": "<h1>番茄鸡蛋面（西红柿鸡蛋面）<\/h1>\n<blockquote>\n<p>归属食材：面条 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>一碗有汤有菜有蛋的经典快手面，番茄酸香开胃、汤浓暖胃。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、汤鲜不难吃）<\/h2>\n<p><strong>食材（1~2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>面条<\/td>\n<td>1 把（约 150g 挂面）<\/td>\n<td>挂面或鲜面均可<\/td>\n<\/tr>\n<tr>\n<td>西红柿<\/td>\n<td>2 个（中等）<\/td>\n<td>挑红熟、微软的<\/td>\n<\/tr>\n<tr>\n<td>鸡蛋<\/td>\n<td>2 个<\/td>\n<td>打散备用<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>1/2 小勺<\/td>\n<td>分次放<\/td>\n<\/tr>\n<tr>\n<td>白糖<\/td>\n<td>1 小勺（约 5g）<\/td>\n<td>中和酸味<\/td>\n<\/tr>\n<tr>\n<td>生抽<\/td>\n<td>1 小勺<\/td>\n<td>提鲜<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>2 汤匙（约 20ml）<\/td>\n<td>炒蛋炒番茄用<\/td>\n<\/tr>\n<tr>\n<td>清水<\/td>\n<td>约 800ml<\/td>\n<td>煮汤用<\/td>\n<\/tr>\n<tr>\n<td>葱花<\/td>\n<td>1 小撮<\/td>\n<td>出锅撒<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 备菜<\/strong><\/p>\n<ol>\n<li>西红柿洗净去蒂，切成小块（这档不用去皮）。<\/li>\n<li>鸡蛋打散，加 1 小撮盐。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 炒蛋<\/strong><\/p>\n<ol start=\"3\">\n<li>锅烧热倒 1 汤匙油，倒入蛋液快速划散。<\/li>\n<li>刚凝固 → 盛出备用。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 炒番茄出汁<\/strong><\/p>\n<ol start=\"5\">\n<li>锅里补 1 汤匙油，下西红柿块，中大火翻炒 2~3 分钟。<\/li>\n<li>加盐和白糖。<\/li>\n<li>炒到西红柿变软、锅底渗出红汁。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 煮汤下面<\/strong><\/p>\n<ol start=\"8\">\n<li>倒入约 800ml 清水（或开水），大火煮开。<\/li>\n<li>下入面条，用筷子拨散，按包装时间煮至八九分熟（挂面约 3~5 分钟）。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 合味出锅<\/strong><\/p>\n<ol start=\"10\">\n<li>把炒好的鸡蛋倒回锅里，加 1 小勺生抽。<\/li>\n<li>尝味补盐，撒葱花，关火出锅。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>汤酸得发苦<\/strong>：西红柿太生或没炒够。选红熟的，先炒软出汁再加水。<\/li>\n<li><strong>面条坨了<\/strong>：下锅后不搅动。面条下锅后用筷子拨散，避免粘连。<\/li>\n<li><strong>蛋炒老<\/strong>：炒到全干才盛出。刚凝固就盛出备用。<\/li>\n<li><strong>汤太寡淡<\/strong>：水加太多。水量以刚好没过面条略多为宜，尝味后再补盐。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://hanwuji.xiachufang.com/recipe/107172959/\">下厨房 · 一人食十分钟番茄鸡蛋面<\/a> —— 快手做法，适合对照「初学版」<\/li>\n<li><a href=\"https://www.xiachufang.com/recipe/103916281/printable/\">下厨房 · 和下厨房学的第一个面（番茄鸡蛋面）<\/a> —— 家常做法，适合对照「初学版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1pF7T6ME5i/\">B 站 · 别饿着！番茄鸡蛋青菜面（一镜到底教程，哔哩哔哩）<\/a> —— 教程完整，适合对照「初学版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1a5bceWEqc/\">B 站 · 沉浸式做饭｜番茄鸡蛋面（哔哩哔哩）<\/a> —— 做法展示，适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：去皮 / 熬蓉 / 汤底）<\/h2>\n<p>在初学版基础上，掌握下面几条，汤底会更浓更香。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 西红柿去皮<\/strong><\/p>\n<ol>\n<li>顶部划十字，滚水烫 20 秒。<\/li>\n<li>看到皮边翻起 → 捞出过冷水，从十字口轻松撕皮，汤更顺滑。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 一半熬蓉、一半留块<\/strong><\/p>\n<ol start=\"3\">\n<li>一个西红柿切小丁先炒，加盐糖中火熬成浓稠茄蓉（汤底风味的来源）。<\/li>\n<li>另一个切大块后下，保留成块口感。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 先炒香葱白<\/strong><\/p>\n<ol start=\"5\">\n<li>炒番茄前先用油爆香一点葱白末，汤底更香。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 用开水煮汤<\/strong><\/p>\n<ol start=\"6\">\n<li>加开水而不是冷水，省时且汤更浓。<\/li>\n<li>面条煮到八九分熟就关火，余温会把它焖到刚好。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://hanwuji.xiachufang.com/recipe/106977517/\">下厨房 · 番茄鸡蛋拌面<\/a> —— 拌面变体，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「汤浓挂味、番茄出沙、面条筋道」。每一步都是细节。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 番茄熬出沙<\/strong><\/p>\n<ol>\n<li>冷油下 1 小勺白糖，小火炒到微微发黄（糖色）。<\/li>\n<li>再下番茄小丁转大火翻炒，加少许盐「杀」出汁。<\/li>\n<li>熬成浓稠沙状茄蓉，颜色更亮、甜味更圆润。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 汤底调味<\/strong><\/p>\n<ol start=\"4\">\n<li>茄蓉熬好后加开水，下 1 小勺生抽和少许白胡椒粉提鲜去腥。<\/li>\n<li>想要更浓可加半勺番茄酱。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 蛋花与荷包蛋两种做法<\/strong><\/p>\n<ol start=\"6\">\n<li>蛋花版：汤滚时把蛋液画圈淋入，几秒后轻轻推散，得到嫩滑蛋花。<\/li>\n<li>荷包蛋版：水微开时打整蛋下锅，小火焖定型再下面。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 面与汤的配合<\/strong><\/p>\n<ol start=\"8\">\n<li>面条煮到八九分熟捞进碗。<\/li>\n<li>浇上热汤和番茄鸡蛋，撒葱花、点几滴香油——汤面分离更能保持面条筋道，趁热吃锅气不散。<\/li>\n<\/ol>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "94", "name": "葱油饼", "title": "葱油饼", "category": "主食谷物", "ingredient": "面粉", "ings": [["中筋面粉"], ["开水"], ["凉水"], ["盐"], ["小葱"], ["食用油"], ["面粉", "油酥用"]], "opt": [false, false, false, false, false, false, false], "tags": [], "html": "<h1>葱油饼<\/h1>\n<blockquote>\n<p>归属食材：面粉 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>外酥里软、层层分明、葱香浓郁，配一碗粥或豆浆就是一顿热乎早餐。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、不难吃）<\/h2>\n<p><strong>食材（3～4 张饼，2～3 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>中筋面粉<\/td>\n<td>300g<\/td>\n<td>普通面粉即可<\/td>\n<\/tr>\n<tr>\n<td>开水<\/td>\n<td>约 90ml<\/td>\n<td>烫一半面<\/td>\n<\/tr>\n<tr>\n<td>凉水<\/td>\n<td>约 90ml<\/td>\n<td>和另一半<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>约 3g<\/td>\n<td>和面 + 油酥分开放<\/td>\n<\/tr>\n<tr>\n<td>小葱<\/td>\n<td>4～5 根<\/td>\n<td>只用葱绿更香<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>3 汤匙<\/td>\n<td>做油酥 + 烙饼<\/td>\n<\/tr>\n<tr>\n<td>面粉（油酥用）<\/td>\n<td>2 汤匙<\/td>\n<td>和热油拌成油酥<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 和面（半烫面）<\/strong><\/p>\n<ol>\n<li>面粉倒进大碗，中间划一道分成两半。<\/li>\n<li>一半加开水（约 90ml）用筷子快速搅成絮状，另一半加凉水（约 90ml）也搅成絮状。<\/li>\n<li>加 1 小撮盐，再下手揉成光滑面团。<\/li>\n<li>盖上保鲜膜，醒 30 分钟（让面筋松弛，后面才擀得开、饼不硬）。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 做油酥<\/strong><\/p>\n<ol start=\"5\">\n<li>小碗里放 2 汤匙面粉 + 约 1g 盐。<\/li>\n<li>另起锅把 2 汤匙油烧到微微冒烟（约 10 秒），趁热淋进碗里，快速搅成没有干粉的糊状，放凉备用（油酥是「起层」的关键——油把面层隔开，烙出来才一层层分离）。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 擀制卷层<\/strong><\/p>\n<ol start=\"7\">\n<li>醒好的面团分成 3～4 个小剂子，取一个擀成尽量薄的圆片。<\/li>\n<li>先均匀抹一层油酥，再撒满葱花。<\/li>\n<li>从一头像卷寿司一样卷成长条，再把长条盘成一圈、尾巴压在下面。<\/li>\n<li>用手压扁后擀成约 0.5cm 厚的圆饼。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 烙制<\/strong><\/p>\n<ol start=\"11\">\n<li>平底锅小火刷薄油，放入饼坯。<\/li>\n<li>盖上锅盖中小火烙约 2 分钟。<\/li>\n<li>见底面金黄、边缘微微鼓起 → 翻面，再烙 2 分钟。<\/li>\n<li>烙到两面金黄、饼身鼓泡 → 出锅。趁热吃，外酥里软。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>饼太硬<\/strong>：全用凉水和面、或没醒够时间。记住「一半开水烫、一半凉水，再醒 30 分钟」。<\/li>\n<li><strong>层次不分明<\/strong>：油酥没抹匀、或卷好后没把收口捏紧。油酥要抹到整张面皮，卷的时候稍卷紧一点。<\/li>\n<li><strong>外面糊了里面还生<\/strong>：火太大。烙饼要用中小火、盖盖焖，让它内外一起熟。<\/li>\n<li><strong>烙的时候不鼓泡<\/strong>：面饼擀得太薄或太厚、油温不够。饼到一定厚度、受热均匀才会鼓出层次。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/106734783/\">下厨房 · 新手可get的葱油饼<\/a> —— 含油酥与卷层手法，适合对照「初学版」的半烫面与层次<\/li>\n<li><a href=\"https://m-pr.douguo.com/cookbook/1701740.html\">豆果美食 · 葱油饼（杜鹃花美食）<\/a> —— 半烫面用量精确，适合对照「初学版」比例<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV167411o7Th/\">葱油饼懒人做法，不用擀面，外酥里软（哔哩哔哩）<\/a> —— 快手版，适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：半烫面 / 油酥 / 卷层 / 火候）<\/h2>\n<p>在初学版基础上，掌握下面四条，饼会明显更软、层次更多。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 半烫面的原理<\/strong><\/p>\n<ol>\n<li>开水烫过的面粉，部分淀粉被「糊化」、面筋被破坏，所以面团更软、饼凉了也不硬；凉水和的部分保留筋性，让饼有嚼劲和层次。<\/li>\n<li><strong>一半开一半凉<\/strong>是「软而不散」的平衡点。<\/li>\n<li>水粉比约 <strong>0.6 : 1<\/strong>（300g 面粉配 180ml 水），太干饼硬，太湿粘手。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 油酥的做法与作用<\/strong><\/p>\n<ol start=\"4\">\n<li>油酥 = 面粉 + 盐 + 热油，热油泼面粉会激出香味。<\/li>\n<li>油把上下两层面皮「隔开」，烙时受热水汽在层间撑开，形成千层效果。<\/li>\n<li>进阶可加一点 <strong>花椒粉或五香粉<\/strong>（约 1/2 小勺），葱香味更有层次；油用猪油更香酥。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 卷层手法<\/strong><\/p>\n<ol start=\"7\">\n<li>面皮擀得越薄、抹油酥越匀，层次越细。<\/li>\n<li>卷成长条后再盘成圈，一圈一圈叠起来，每一圈就是一层。<\/li>\n<li>盘好后稍微醒 5 分钟再擀，层次更稳定、不容易回缩。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 火候（外酥里软）<\/strong><\/p>\n<ol start=\"10\">\n<li>中小火 + 盖盖：先盖盖焖，让内部熟透、水汽把饼「蒸」软。<\/li>\n<li>两面都定型后再开盖、稍加大火烙 30 秒，把外壳烙脆。<\/li>\n<li>出锅前用铲子把饼「立起来」在锅边轻拍几下，层次会自己散开，口感更酥松。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/106740884/\">下厨房 · 凉了也不会硬的葱油饼<\/a> —— 小高姐式油酥做法，适合对照「进阶版」的层次与油酥<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1dyJ16BEJm/\">葱油饼｜外酥里软，凉了也不硬，真的太香了（哔哩哔哩）<\/a> —— 花椒油酥做法，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「外壳焦香酥脆、内里松软、层层薄如纸」。每一步都是细节。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 面团——软而不粘的水粉比<\/strong><\/p>\n<ol>\n<li>300g 面粉 + 约 3g 盐，先用 100ml 开水烫面、再补 80～90ml 凉水。<\/li>\n<li>揉到「三光」（面光、手光、盆光）。<\/li>\n<li>刚揉好会偏软，盖上湿布醒 40 分钟，面团会更柔顺、延展性更好。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 油酥——热油泼香<\/strong><\/p>\n<ol start=\"4\">\n<li>油酥比例：2 汤匙面粉 + 1/2 小勺盐 + 少许花椒粉，淋入约 2.5 汤匙烧到冒烟的热油。<\/li>\n<li>油一定要够热，才能「泼」出香味；放凉再用，太热会把面皮烫破。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 卷层与擀制<\/strong><\/p>\n<ol start=\"6\">\n<li>每个剂子擀得越薄越好（近乎透明），抹油酥后撒葱花。<\/li>\n<li>从一边卷成细长条，再盘成蜗牛状，尾巴塞进底部压紧。<\/li>\n<li>盘好后<strong>再醒 5 分钟<\/strong>再擀，否则面筋回缩、层次被压死。<\/li>\n<li>擀成约 0.5cm 厚，用力要均匀，别把层次擀「死」。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 烙制——先焖后脆<\/strong><\/p>\n<ol start=\"10\">\n<li>平底锅烧热后倒薄油，转中小火放入饼。<\/li>\n<li><strong>盖上锅盖焖 2 分钟<\/strong>，让水汽在锅盖下循环、把内层焖软；翻面再焖 2 分钟。<\/li>\n<li>两面金黄后<strong>开盖转中火<\/strong>，每面再烙约 30 秒把外壳烙到焦脆。<\/li>\n<li>出锅前把饼立起来在锅边轻拍几下，让层次蓬开。<\/li>\n<li>趁热切成三角块装盘，凉了外壳会回软，锅气就散了。<\/li>\n<\/ol>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "95", "name": "黄油煎口蘑", "title": "黄油煎口蘑", "category": "菌菇", "ingredient": "口蘑", "ings": [["口蘑"], ["黄油"], ["盐"], ["黑胡椒碎"], ["蒜末"]], "opt": [false, false, false, false, true], "tags": [], "html": "<h1>黄油煎口蘑<\/h1>\n<blockquote>\n<p>归属食材：口蘑 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>口蘑去掉柄后，菌盖就像一个天然的小碗；用黄油小火慢煎，「碗」里会慢慢渗出清亮的鲜汤，一口下去先喝汤、再吃菇，鲜美无比。做法极简，却是最能体现菌菇本味的一道菜。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、不难吃）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>口蘑<\/td>\n<td>12 个（约 300g）<\/td>\n<td>挑中等大小、菌盖完整不开口的<\/td>\n<\/tr>\n<tr>\n<td>黄油<\/td>\n<td>15~20g（约 1~1.5 汤匙）<\/td>\n<td>选无盐黄油更好控制咸淡<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>少许<\/td>\n<td>每个菇碗里撒一点<\/td>\n<\/tr>\n<tr>\n<td>黑胡椒碎<\/td>\n<td>少许<\/td>\n<td>现磨更香<\/td>\n<\/tr>\n<tr>\n<td>蒜末<\/td>\n<td>1 瓣<\/td>\n<td>可选<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 去柄洗净<\/strong><\/p>\n<ol>\n<li>口蘑轻扭一下把柄掰掉（或用刀切平），只留菌盖这个「小碗」。<\/li>\n<li>用流水把表面泥沙轻轻冲干净。<\/li>\n<li>再用厨房纸把每个口蘑表面吸干（表面有水，下锅会溅油、也不容易煎黄）。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 小火融化黄油<\/strong><\/p>\n<ol start=\"4\">\n<li>平底锅开小火，放入黄油慢慢融化（黄油烟点低、很容易焦，一定要小火）。<\/li>\n<li>黄油刚融化、还没变色 → 就下口蘑。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 煎出菇汁<\/strong><\/p>\n<ol start=\"6\">\n<li>把口蘑「碗」朝上、圆头朝下摆进锅里，保持小火，不要频繁翻动。<\/li>\n<li>约 2~3 分钟后，「碗」里慢慢渗出清亮汤汁。<\/li>\n<li>汤满到碗口 → 说明熟了。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 调味出锅<\/strong><\/p>\n<ol start=\"9\">\n<li>在每个菇碗里撒一点点盐和黑胡椒碎。<\/li>\n<li>用铲子托底小心盛出（别把汤洒了）。先喝碗里的汤，再吃菇，鲜味全在这一口汤里。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>黄油烧焦<\/strong>：火太大或黄油下锅太久。全程小火，黄油一融化就下口蘑，看到黄油变棕色就说明焦了。<\/li>\n<li><strong>菇汁没出来就乱翻<\/strong>：保持小火静置，别频繁翻动，口蘑受热后自己会渗汤。<\/li>\n<li><strong>没吸干水分<\/strong>：表面有水难以上色、还溅油。下锅前一定用厨房纸吸干。<\/li>\n<li><strong>盛菇时洒汤<\/strong>：汤汁是精华，用铲子托底慢慢盛，别用筷子夹。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://hanwuji.xiachufang.com/recipe/104651653/\">下厨房 · 黄油口蘑（含步骤图）<\/a> —— 需点开确认；适合对照「初学版」的火候与出汁判断<\/li>\n<li><a href=\"https://baijiahao.baidu.com/s?id=1721377513857700987\">百家号 · 这道黄油煎口蘑，每天吃都吃不够<\/a> —— 需点开确认；适合对照「初学版」的完整步骤<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1xh4114778/\">哔哩哔哩 · 这个下酒菜厉害了，黄油煎蒜泥蘑菇<\/a> —— 适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：黄油低温 / 煎面顺序 / 出汁判断 / 增香）<\/h2>\n<p>在初学版基础上，掌握下面四条，鲜味会更立体。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 黄油为什么必须低温<\/strong><\/p>\n<ol>\n<li>黄油烟点低（约 150℃ 上下），高温会冒烟、发苦、失去奶香。<\/li>\n<li>全程小火，让黄油只是慢慢融化、微微冒泡，才能保留奶香。<\/li>\n<li>怕焦可以「黄油 + 几滴植物油」混用，植物油烟点高，能帮黄油扛住温度。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 先煎哪一面<\/strong><\/p>\n<ol start=\"4\">\n<li>常见做法是「圆头朝下」先煎 1~2 分钟，煎出焦黄底和香气。<\/li>\n<li>再翻过来「碗」朝上，盖盖小火焖 2~3 分钟，让汁水慢慢渗进碗里。<\/li>\n<li>想让圆头有漂亮焦边，就圆头朝下多煎一会；想吃更嫩，就圆头朝上直接慢煎。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 判断熟的标准<\/strong><\/p>\n<ol start=\"7\">\n<li>看「碗」里：汤汁从无到有、逐渐渗满小碗 → 就熟了；再煎会出更多水、菇身变软塌。<\/li>\n<li>闻到明显黄油奶香、菇盖变软、底部金黄 → 也是熟了。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 增香（蒜末 / 香草 / 酱）<\/strong><\/p>\n<ol start=\"9\">\n<li>下口蘑前用黄油把蒜末小火煸香，蒜香黄油味更足。<\/li>\n<li>出锅前可以撒一点欧芹碎、迷迭香，或滴几滴蚝油、酱油提鲜。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/105856081/\">下厨房 · 黑胡椒牛油口蘑<\/a> —— 需点开确认；适合对照「进阶版」的调味<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1vz4y1Q79d/\">哔哩哔哩 · 站在食物链顶端吃素，一口一个噗噗爆汁的蒜香黄油煎口蘑<\/a> —— 蒜香黄油口蘑，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「菇底焦香、碗中满汁、奶香干净、一口爆汁」。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 普通油煎、黄油收尾<\/strong><\/p>\n<ol>\n<li>前期用烟点高的植物油把口蘑煎出焦底。<\/li>\n<li>最后 30 秒再下黄油，晃动锅让黄油融化裹住每个菇——既保住黄油香气，又不焦苦。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 煎出焦边再焖汁<\/strong><\/p>\n<ol start=\"3\">\n<li>圆头朝下中火煎 1~2 分钟，煎到底部金黄、边缘微焦。<\/li>\n<li>再翻面转小火盖盖焖 2~3 分钟，让蒸汽把菇汁逼进「碗」里。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 蒜香黄油复配<\/strong><\/p>\n<ol start=\"5\">\n<li>黄油融化时加一瓣蒜片，小火炸到蒜片微黄、香气飘出。<\/li>\n<li>再下口蘑，蒜香和奶香融合，是这道菜的高级版。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 装盘与调味<\/strong><\/p>\n<ol start=\"7\">\n<li>每个菇碗里撒海盐片和现磨黑胡椒（海盐片融化慢、咸味更干净）。<\/li>\n<li>摆盘后连锅里的黄油汁一起淋上去，配法棍或吐司蘸汁，一滴都不浪费。<\/li>\n<\/ol>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "96", "name": "平菇炒肉", "title": "平菇炒肉", "category": "菌菇", "ingredient": "平菇", "ings": [["平菇"], ["猪里脊", "五花肉"], ["青椒"], ["蒜"], ["姜"], ["生抽"], ["料酒"], ["淀粉"], ["盐"], ["白糖"], ["食用油"]], "opt": [false, false, true, false, false, false, false, false, false, false, false], "tags": [], "html": "<h1>平菇炒肉<\/h1>\n<blockquote>\n<p>归属食材：平菇 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>平菇鲜嫩、自带鲜味，但极容易出水；配肉片大火快炒是经典家常下饭菜，菇嫩、肉滑、汤汁不汪，拌饭一流。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、不难吃）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>平菇<\/td>\n<td>300g<\/td>\n<td>挑菌盖完整、不软烂的<\/td>\n<\/tr>\n<tr>\n<td>猪里脊或五花肉<\/td>\n<td>150g<\/td>\n<td>里脊嫩、五花香<\/td>\n<\/tr>\n<tr>\n<td>青椒<\/td>\n<td>1 个<\/td>\n<td>切块，可选<\/td>\n<\/tr>\n<tr>\n<td>蒜<\/td>\n<td>3 瓣<\/td>\n<td>切片<\/td>\n<\/tr>\n<tr>\n<td>姜<\/td>\n<td>1 小片<\/td>\n<td>切丝<\/td>\n<\/tr>\n<tr>\n<td>生抽<\/td>\n<td>1 汤匙（约 15ml）<\/td>\n<td>分两次用（腌肉 + 炒菜）<\/td>\n<\/tr>\n<tr>\n<td>料酒<\/td>\n<td>1 小勺（约 5ml）<\/td>\n<td>腌肉去腥<\/td>\n<\/tr>\n<tr>\n<td>淀粉<\/td>\n<td>1 小勺（约 5g）<\/td>\n<td>腌肉上浆<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>少许<\/td>\n<td>最后尝了再放<\/td>\n<\/tr>\n<tr>\n<td>白糖<\/td>\n<td>1/2 小勺（约 2g）<\/td>\n<td>提鲜<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>2 汤匙（约 20ml）<\/td>\n<td>分两次用<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 处理平菇<\/strong><\/p>\n<ol>\n<li>平菇剪去老根，用手撕成手指宽的条。<\/li>\n<li>清水快速冲洗一下就捞起，不要久泡（久泡会吸饱水，炒出来水汪汪）。<\/li>\n<li>烧一锅水，水开后下平菇焯约 1 分钟，捞出用凉水冲一下。<\/li>\n<li>再用手轻轻挤干水分备用（焯水能去掉生味和多余水分，是「炒出来不汪汤」的关键）。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 腌肉<\/strong><\/p>\n<ol start=\"5\">\n<li>肉切成薄片，加 1/2 汤匙生抽、料酒、淀粉，用手抓匀，腌 10 分钟。<\/li>\n<li>淀粉在肉表面形成一层薄浆，能锁住肉里的水分，炒出来更嫩。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 先炒肉<\/strong><\/p>\n<ol start=\"7\">\n<li>锅烧热，倒 1 汤匙油，油热后下肉片。<\/li>\n<li>中火滑炒约 1 分钟，肉片变色 → 马上盛出备用（先炒肉能让肉片定型、不粘锅，也避免后面和菇一起久炒把肉炒老）。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 炒菇合炒<\/strong><\/p>\n<ol start=\"9\">\n<li>锅里补剩下的 1 汤匙油，下蒜片姜丝爆香。<\/li>\n<li>倒入挤干的平菇，中大火翻炒约 1~2 分钟，把剩余水汽再炒掉一点。<\/li>\n<li>倒回肉片，加剩下的生抽、盐、白糖。<\/li>\n<li>大火快速翻炒 30 秒~1 分钟，让味道裹匀，出锅。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>平菇出水太多、变成水煮<\/strong>：没焯水或没挤干。焯水后一定要挤干，炒的时候用中大火。<\/li>\n<li><strong>肉炒老了<\/strong>：肉和菇一起久炒。记住「先炒肉盛出，最后再回锅」。<\/li>\n<li><strong>顺序搞反<\/strong>：先炒菇再炒肉，菇出水会把肉泡软、不香。顺序是「先肉后菇」。<\/li>\n<li><strong>太咸<\/strong>：生抽已有咸味，盐最后尝了再补。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.douguo.net/cookbook/2979651.html\">豆果美食 · 下饭神器——平菇炒肉<\/a> —— 需点开确认；适合对照「初学版」的完整流程<\/li>\n<li><a href=\"https://www.douguo.net/cookbook/3025503.html\">豆果美食 · 平菇炒肉<\/a> —— 需点开确认；适合对照「初学版」的焯水与调味<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1SG411Y7Cw/\">哔哩哔哩 · 炒菜苔 + 平菇炒肉<\/a> —— 家常做法，适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：先肉后菇 / 去水 / 上浆 / 增香）<\/h2>\n<p>在初学版基础上，掌握下面四条，成菜会更干爽、更香。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 为什么「先炒肉、后炒菇」<\/strong><\/p>\n<ol>\n<li>肉片先下锅高温定型、上色，能锁住肉汁。<\/li>\n<li>平菇后下锅，出的水在高温下快速蒸发，不会把肉泡软。<\/li>\n<li>先炒菇的话，菇一出一大摊水，肉再下锅就变成「水煮肉」，失去爆炒香气。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 平菇去水的两种路线<\/strong><\/p>\n<ol start=\"4\">\n<li>焯水派：沸水焯 1 分钟再挤干，去生味、去水最彻底，成菜最干爽，适合新手。<\/li>\n<li>不焯水派：直接下锅大火干炒，把菇自己出的水炒干再下肉，菇味更浓，但火候要求更高。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 腌肉上浆让肉更嫩<\/strong><\/p>\n<ol start=\"6\">\n<li>肉片加生抽、料酒、淀粉后再加几滴油拌匀（锁浆），下锅时更容易滑散、不粘。<\/li>\n<li>想要更嫩，用猪里脊或梅花肉；用五花肉则要多煸一会逼出猪油，香味更足。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 出锅前的增香<\/strong><\/p>\n<ol start=\"8\">\n<li>起锅前放一把蒜苗段或葱段，利用锅的余热激出香气，颜色也更好看。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/106961152/\">下厨房 · 平菇炒肉<\/a> —— 需点开确认；做法简练，适合对照「进阶版」的先后顺序<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1TP411F76F/\">哔哩哔哩 · 平菇炒肉，简单又好吃的家常菜<\/a> —— 含选肉建议（前腿肉 / 梅花肉），适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「肉片滑嫩带锅气、平菇干爽挂汁、一锅成菜香气立体」。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 五花肉煸到微焦出油<\/strong><\/p>\n<ol>\n<li>五花肉切薄片，冷锅下肉片。<\/li>\n<li>小火慢慢煸出猪油、煸到边缘微焦卷起（猪油香是这道菜的底味）。<\/li>\n<li>再下姜蒜爆香。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 平菇大火干煸<\/strong><\/p>\n<ol start=\"4\">\n<li>焯水挤干后的平菇下锅，开最大火快速翻炒。<\/li>\n<li>把剩余水分彻底炒干、表面微微起焦边 → 菇香最浓。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 沿锅边淋生抽「激香」<\/strong><\/p>\n<ol start=\"6\">\n<li>肉和菇合炒时，把生抽沿滚烫的锅边淋一圈，高温瞬间激出酱香。<\/li>\n<li>再颠锅让味道均匀挂上。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 收汁与锅气<\/strong><\/p>\n<ol start=\"8\">\n<li>汁水多可以勾一点薄芡（半小勺淀粉 + 2 汤匙水调匀），让汤汁浓稠地挂在菇和肉上。<\/li>\n<li>全程大火、动作快，出锅前撒蒜苗段，趁热吃——凉了锅气就散了。<\/li>\n<\/ol>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "97", "name": "凉拌木耳", "title": "凉拌木耳", "category": "菌菇", "ingredient": "木耳", "ings": [["干木耳"], ["蒜"], ["小米椒"], ["香菜"], ["生抽"], ["香醋", "陈醋"], ["白糖"], ["香油"], ["盐"], ["辣椒油"]], "opt": [false, false, true, true, false, false, false, false, false, true], "tags": [], "html": "<h1>凉拌木耳<\/h1>\n<blockquote>\n<p>归属食材：木耳 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>凉拌木耳酸辣爽脆、开胃解腻，是几乎零失败的凉菜。关键在泡发和焯水：冷水泡发口感更脆，焯水时间要短，焯完立刻过凉水才够爽脆。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>⚠️ 安全提示：木耳不能久泡。冷水泡发 30 分钟~1 小时即可；泡发超过 4 小时请放进冰箱冷藏，且当天吃完；千万不要室温隔夜久泡——久泡（尤其高温天）容易产生米酵菌酸毒素，可能引起中毒。务必现泡现吃。<\/p>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、不难吃）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>干木耳<\/td>\n<td>20g（泡发后约 200g）<\/td>\n<td>冷水泡发，别久泡<\/td>\n<\/tr>\n<tr>\n<td>蒜<\/td>\n<td>3 瓣<\/td>\n<td>切末<\/td>\n<\/tr>\n<tr>\n<td>小米椒<\/td>\n<td>1~2 个<\/td>\n<td>切圈，可选<\/td>\n<\/tr>\n<tr>\n<td>香菜<\/td>\n<td>2 根<\/td>\n<td>切段，可选<\/td>\n<\/tr>\n<tr>\n<td>生抽<\/td>\n<td>2 汤匙（约 30ml）<\/td>\n<td>咸鲜底味<\/td>\n<\/tr>\n<tr>\n<td>香醋 / 陈醋<\/td>\n<td>2 汤匙（约 30ml）<\/td>\n<td>酸味来源<\/td>\n<\/tr>\n<tr>\n<td>白糖<\/td>\n<td>1 小勺（约 5g）<\/td>\n<td>中和酸、提鲜<\/td>\n<\/tr>\n<tr>\n<td>香油<\/td>\n<td>1 小勺（约 5ml）<\/td>\n<td>增香<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>少许<\/td>\n<td>最后尝了再补<\/td>\n<\/tr>\n<tr>\n<td>辣椒油<\/td>\n<td>1 小勺<\/td>\n<td>可选<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 泡发<\/strong><\/p>\n<ol>\n<li>干木耳放进冷水（或温水）里，泡 30 分钟~1 小时。<\/li>\n<li>泡到完全展开、柔软有弹性（用冷水泡口感更脆，别用开水、更别泡过夜）。<\/li>\n<li>泡好后剪去根部硬蒂，抓一小把淀粉或盐，用手反复抓洗。<\/li>\n<li>再用清水冲干净，去掉褶皱里的泥沙。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 焯水<\/strong><\/p>\n<ol start=\"5\">\n<li>锅里水烧开，下木耳焯 1.5~2 分钟（时间别太长，久了会软塌不脆）。<\/li>\n<li>捞出立刻放进凉开水或冰水里过一下。<\/li>\n<li>再彻底沥干水分（过凉水是「爽脆」的关键）。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 调汁<\/strong><\/p>\n<ol start=\"8\">\n<li>小碗里放蒜末、小米椒、生抽、香醋、白糖、香油和一点点盐，搅匀（糖能中和醋酸，让酸味更柔和、更有层次）。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 拌匀<\/strong><\/p>\n<ol start=\"9\">\n<li>把料汁倒进木耳里，加香菜，翻拌均匀。<\/li>\n<li>静置 5 分钟入味即可上桌（现拌现吃最脆；泡在醋里太久，木耳会慢慢变软）。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>泡太久 / 隔夜泡<\/strong>：有中毒风险。冷水泡 1 小时内；超过 4 小时放冰箱冷藏，当天吃完。<\/li>\n<li><strong>焯水太久<\/strong>：木耳软塌不脆。1.5~2 分钟足够，捞出立刻过凉水。<\/li>\n<li><strong>没沥干<\/strong>：拌出来水汪汪、味道被稀释。沥水要彻底，或用厨房纸吸一下。<\/li>\n<li><strong>醋太冲<\/strong>：加糖中和；生抽和醋的比例大约 1 : 1，可按口味微调。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/104141546/\">下厨房 · 凉拌木耳（评分 8.1，6000+ 人做过）<\/a> —— 需点开确认；适合对照「初学版」的调味与现拌现吃<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV11C4y1t7TF/\">哔哩哔哩 · 冯小厨：泡木耳、凉拌木耳、鸡蛋炒木耳专场<\/a> —— 含泡发小技巧，适合对照「初学版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1wv4y157Xz/\">哔哩哔哩 · 凉拌黑木耳 莲藕清脆爽口<\/a> —— 适合对照「初学版」的焯水与过凉<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：冷水泡发 / 抓洗 / 焯水与过凉 / 料汁比例）<\/h2>\n<p>在初学版基础上，掌握下面四条，成菜更爽脆、更入味。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 为什么冷水泡发更脆<\/strong><\/p>\n<ol>\n<li>冷水泡发时间长但温度低，木耳的细胞结构不被烫伤，泡出来的木耳肉厚、有脆度（温水泡更快但略软，开水会泡烂）。<\/li>\n<li>想快可以用温水（约 30~40℃），但别用开水。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 淀粉 / 盐抓洗去杂质<\/strong><\/p>\n<ol start=\"3\">\n<li>木耳褶皱多，容易藏泥沙，加一勺淀粉或盐反复抓洗，淀粉能吸附杂质。<\/li>\n<li>洗到水清为止。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 焯水时间与过凉水<\/strong><\/p>\n<ol start=\"5\">\n<li>焯 1.5~2 分钟去生味、杀菌。<\/li>\n<li>时间一到立刻过凉水，让木耳骤然降温收缩，口感才脆。<\/li>\n<li>过凉水要用凉开水或纯净水（生水不卫生）。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 料汁的黄金比例<\/strong><\/p>\n<ol start=\"8\">\n<li>基础比例：生抽 : 香醋 ≈ 1 : 1，加 1 小勺白糖、蒜末、香油。<\/li>\n<li>喜欢辣就加辣椒油或小米椒。<\/li>\n<li>蒜末、小米椒先用热油激一下再调汁，香气更足（进阶到大厨版的做法）。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://hanwuji.xiachufang.com/recipe/107190548/\">下厨房 · 凉拌木耳（另一版本）<\/a> —— 需点开确认；适合对照「进阶版」的料汁配比<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「木耳爽脆、酸辣平衡、香气立体、现拌现吃」。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 蒜末热油激香<\/strong><\/p>\n<ol>\n<li>蒜末、小米椒、熟芝麻放进小碗。<\/li>\n<li>烧一勺热油（约七八成热）淋上去，「刺啦」一声激出蒜香和辣香。<\/li>\n<li>再调生抽、醋、糖、香油——香气层次完全不同。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 现炸辣椒油 / 花椒油<\/strong><\/p>\n<ol start=\"4\">\n<li>用现炸的辣椒油或花椒油代替瓶装辣椒油，麻辣香更干净、更立体。<\/li>\n<li>花椒油一点就够，麻味点睛不过量。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 配菜增加层次<\/strong><\/p>\n<ol start=\"6\">\n<li>可加黄瓜丝、洋葱丝、胡萝卜丝一起拌，颜色好看、口感更丰富。<\/li>\n<li>配菜要现切、上桌前再拌，保持脆度。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 现拌现吃、摆盘<\/strong><\/p>\n<ol start=\"8\">\n<li>料汁和木耳分开备好，上桌前最后一刻再拌匀——提前拌久，醋和盐会把木耳「腌软」。<\/li>\n<li>撒香菜段、白芝麻点缀，摆盘清爽，趁脆吃。<\/li>\n<\/ol>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "98", "name": "干煸杏鲍菇", "title": "干煸杏鲍菇", "category": "菌菇", "ingredient": "杏鲍菇", "ings": [["杏鲍菇"], ["干辣椒"], ["花椒"], ["蒜"], ["姜"], ["生抽"], ["白糖"], ["盐"], ["白芝麻", "葱花"], ["食用油"]], "opt": [false, false, true, false, true, false, false, false, false, false], "tags": [], "html": "<h1>干煸杏鲍菇<\/h1>\n<blockquote>\n<p>归属食材：杏鲍菇 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>干煸是川菜常用手法，用少量油、中小火把食材慢慢煸到表面焦黄、水分收干，成菜外韧里嫩、越嚼越香。杏鲍菇肉质厚、纤维紧，是典型的「素中荤」，干煸后吃口像肉一样有嚼劲，配饭配酒都合适。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、不难吃）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>杏鲍菇<\/td>\n<td>3 根（约 400g）<\/td>\n<td>挑菌柄粗壮、表面干爽不发黏的<\/td>\n<\/tr>\n<tr>\n<td>干辣椒<\/td>\n<td>4~6 个<\/td>\n<td>剪成段，怕辣少放<\/td>\n<\/tr>\n<tr>\n<td>花椒<\/td>\n<td>1 小撮（约 1g）<\/td>\n<td>可选，增麻香<\/td>\n<\/tr>\n<tr>\n<td>蒜<\/td>\n<td>4 瓣<\/td>\n<td>切片<\/td>\n<\/tr>\n<tr>\n<td>姜<\/td>\n<td>1 小片<\/td>\n<td>切丝，可选<\/td>\n<\/tr>\n<tr>\n<td>生抽<\/td>\n<td>1 汤匙（约 15ml）<\/td>\n<td>提咸鲜<\/td>\n<\/tr>\n<tr>\n<td>白糖<\/td>\n<td>1 小勺（约 5g）<\/td>\n<td>提鲜、中和咸辣<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>少许<\/td>\n<td>最后尝了再放<\/td>\n<\/tr>\n<tr>\n<td>白芝麻 / 葱花<\/td>\n<td>少许<\/td>\n<td>出锅前撒<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>2 汤匙（约 20ml）<\/td>\n<td>干煸油不宜多<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 预处理（手撕 / 切片）<\/strong><\/p>\n<ol>\n<li>杏鲍菇洗净，用厨房纸吸一下表面水分。<\/li>\n<li>用手撕成约手指粗的长条（手撕的断面粗糙不平，比刀切更容易挂味、更容易煸出焦香）。<\/li>\n<li>撕好后不要再泡水。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 无油干煸去水<\/strong><\/p>\n<ol start=\"4\">\n<li>锅烧热（最好用不粘锅），不放油，直接倒入杏鲍菇。<\/li>\n<li>中火慢慢煸，杏鲍菇会先渗出很多水，继续煸约 5~8 分钟。<\/li>\n<li>看到水分基本收干、菇条变软塌、表面微微发黄、体积明显缩小 → 先盛出备用（先把多余水分逼出来，是后面出香的前提）。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 爆香调料<\/strong><\/p>\n<ol start=\"7\">\n<li>把锅擦干（或倒掉锅里的水），重新倒入 2 汤匙油。<\/li>\n<li>转中小火，先下花椒和干辣椒段，炒出香味（约 20 秒）。<\/li>\n<li>再下蒜片姜丝炒香（约 10 秒），注意别把辣椒花椒炒糊。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 回锅调味<\/strong><\/p>\n<ol start=\"10\">\n<li>倒回杏鲍菇，转中大火翻炒约 1~2 分钟。<\/li>\n<li>沿锅边淋入生抽，加白糖和少许盐，快速翻炒均匀，让每根菇条都挂上味。<\/li>\n<li>撒白芝麻和葱花，关火出锅。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>水分没煸干就调味<\/strong>：菇条湿塌、不出香味。先无油煸到水干、表面微黄再下油爆香。<\/li>\n<li><strong>辣椒花椒炒糊发苦<\/strong>：油温太高或炒太久。中小火下料，一出香味立刻下菇。<\/li>\n<li><strong>油放太多<\/strong>：变成油炸而不是干煸，口感油腻。2 汤匙足够，杏鲍菇本身不吸太多油。<\/li>\n<li><strong>太咸<\/strong>：生抽本身有咸味，盐一定最后尝了再少量补。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.douguo.net/cookbook/3323292.html\">豆果美食 · 干煸杏鲍菇<\/a> —— 需点开确认；适合对照「初学版」的撕条与干煸流程<\/li>\n<li><a href=\"https://www.douguo.net/cookbook/2106057.html\">豆果美食 · 干煸杏鲍菇（再一版本）<\/a> —— 需点开确认；适合对照「初学版」的调味<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV16qpszCExM/\">哔哩哔哩 · 素食｜干煸杏鲍菇 筋道入味 越嚼越香<\/a> —— 含焯水挤干 + 干煸，适合对照「初学 / 进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：手撕 / 火候 / 油量 / 挂味）<\/h2>\n<p>在初学版基础上，掌握下面四条，成品会更有「干煸」的干香和嚼劲。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 手撕优于刀切<\/strong><\/p>\n<ol>\n<li>顺着杏鲍菇的纤维撕成长条，撕出的粗糙断口受热后更容易起焦边、更挂味（刀切的光滑切面不容易出干香）。<\/li>\n<li>撕的粗细要均匀（约手指粗），太厚难煸干，太细容易焦。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 先煸水、再下油的两段法<\/strong><\/p>\n<ol start=\"3\">\n<li>第一段无油中火把杏鲍菇煸出水、煸干。<\/li>\n<li>第二段下少量油，中小火慢慢把表面煸到金黄微焦。<\/li>\n<li>看到菇条边缘卷起、表面有焦斑、闻起来有明显干香（不是水煮味）→ 到位。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 油量与火候<\/strong><\/p>\n<ol start=\"6\">\n<li>油量控制在 1~2 汤匙（油多会变炸、油少容易糊）。<\/li>\n<li>全程以中小火为主，只有最后调味时转大火快翻（火太大会外焦里生）。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 出锅前的干香调味<\/strong><\/p>\n<ol start=\"8\">\n<li>想更香，可在最后 10 秒撒入孜然粉、辣椒面或熟芝麻，利用余热激出干香。<\/li>\n<li>不要提前放（提前放容易糊、香气挥发）。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.douguo.net/cookbook/1199313.html\">豆果美食 · 干煸杏鲍菇（另一版本）<\/a> —— 需点开确认；适合对照「进阶版」的油量与火候<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1rGk4B7EGo/\">哔哩哔哩 · 干煸杏鲍菇，蘑菇爱好者一定不能错过好吃到爆<\/a> —— 撕条干煸做法，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「干香焦边、椒麻香气立体、出锅带锅气」。每一步都是细节。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 干煸到「干香带焦边」<\/strong><\/p>\n<ol>\n<li>杏鲍菇先无油煸干。<\/li>\n<li>再下 1~2 汤匙油，中小火耐心煸 3~4 分钟。<\/li>\n<li>煸到菇条四周起焦边、整体收紧、色泽金黄（宁可稍干，不要留水汽）。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 花椒辣椒用「冷油炼香」<\/strong><\/p>\n<ol start=\"4\">\n<li>冷锅冷油下花椒和干辣椒段，小火慢慢加热，让麻香、辣香慢慢溶进油里。<\/li>\n<li>油温一高、花椒颜色变深 → 立刻下蒜片。<\/li>\n<li>再下杏鲍菇，避免焦苦。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 沿锅边淋生抽「激出酱香」<\/strong><\/p>\n<ol start=\"7\">\n<li>菇条煸到焦香后，把生抽沿滚烫的锅边淋一圈，高温瞬间把酱油的酱香激发出来。<\/li>\n<li>再快速颠锅翻炒，让每根菇条均匀裹味。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 锅气与收尾<\/strong><\/p>\n<ol start=\"9\">\n<li>最后 20 秒开最大火快炒，动作要快。<\/li>\n<li>出锅前撒葱花、白芝麻，点几滴香油，趁热吃——干煸菜凉了焦香和锅气都会打折。<\/li>\n<\/ol>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "99", "name": "凉拌金针菇", "title": "凉拌金针菇", "category": "菌菇", "ingredient": "金针菇", "ings": [["金针菇"], ["蒜"], ["小米辣"], ["香菜"], ["生抽"], ["香醋"], ["白糖"], ["香油"], ["辣椒油"]], "opt": [false, false, true, true, false, false, false, false, true], "tags": [], "html": "<h1>凉拌金针菇<\/h1>\n<blockquote>\n<p>归属食材：金针菇 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>金针菇脆嫩爽滑，吸满酸辣料汁，热量低又开胃，是几分钟就能搞定的快手凉菜。关键是剪根洗净、焯熟和「攥干水」。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能焯熟、酸辣开胃）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>金针菇<\/td>\n<td>1 把（约 200g）<\/td>\n<td>剪根、洗净<\/td>\n<\/tr>\n<tr>\n<td>蒜<\/td>\n<td>3 瓣<\/td>\n<td>切末<\/td>\n<\/tr>\n<tr>\n<td>小米辣<\/td>\n<td>1~2 个（可选）<\/td>\n<td>切圈<\/td>\n<\/tr>\n<tr>\n<td>香菜<\/td>\n<td>1 小把（可选）<\/td>\n<td>切段<\/td>\n<\/tr>\n<tr>\n<td>生抽<\/td>\n<td>2 汤匙<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>香醋<\/td>\n<td>1 汤匙<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>白糖<\/td>\n<td>1 小勺<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>香油<\/td>\n<td>1 小勺<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>辣椒油<\/td>\n<td>1 小勺（可选）<\/td>\n<td>不吃辣可不放<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 处理<\/strong><\/p>\n<ol>\n<li>金针菇切掉根部带泥的一截（约 1~2cm）。<\/li>\n<li>撕成小撮，在流水下冲干净。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 焯水<\/strong><\/p>\n<ol start=\"3\">\n<li>水烧开后下金针菇，煮约 2~3 分钟（金针菇一定要煮熟）。<\/li>\n<li>捞出过凉水。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 攥干水（关键）<\/strong><\/p>\n<ol start=\"5\">\n<li>用手把金针菇里的水攥干（金针菇特别吸水，不攥干料汁进不去、味道淡）。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 调汁<\/strong><\/p>\n<ol start=\"6\">\n<li>碗里放蒜末、小米辣、生抽、香醋、白糖、香油、辣椒油，搅匀。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 拌匀<\/strong><\/p>\n<ol start=\"7\">\n<li>金针菇放进大碗，倒料汁翻拌，撒香菜。<\/li>\n<li>腌 3~5 分钟更入味。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>金针菇咬不动 / 带土<\/strong>：根没剪干净或没煮熟。根部剪掉 1~2cm，水开煮 2~3 分钟。<\/li>\n<li><strong>味道淡<\/strong>：没攥干水。金针菇攥干再拌，料汁才挂得住。<\/li>\n<li><strong>煮过头发烂<\/strong>：煮太久。金针菇易熟，2~3 分钟就够，捞出立刻过凉水。<\/li>\n<li><strong>太辣<\/strong>：小米辣和辣椒油先少放，拌好尝过再加。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://mip.xiachufang.com/recipe/107046629/\">下厨房 · 十分钟搞定香辣凉拌金针菇<\/a> —— 快手版，适合对照「初学版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1PN4y1M7Xd/\">凉拌金针菇（哔哩哔哩）<\/a> —— 家常做法，适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：清洗 / 焯水 / 料汁 / 配菜）<\/h2>\n<p>在初学版基础上，掌握下面四条，成品质感会上一个台阶。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 清洗<\/strong><\/p>\n<ol>\n<li>剪根后把金针菇撕成小撮，放盐水里泡 5 分钟再冲洗，更干净。<\/li>\n<li>别整把一起冲，根部藏泥。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 焯水<\/strong><\/p>\n<ol start=\"3\">\n<li>水开加一点盐，下金针菇煮 2~3 分钟。<\/li>\n<li>要脆嫩口感就煮 1~2 分钟，要更熟软就煮 3 分钟。<\/li>\n<li>捞出过凉水锁住脆度。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 料汁<\/strong><\/p>\n<ol start=\"6\">\n<li>蒜末 + 小米辣 + 白芝麻 + 辣椒面，淋热油激香。<\/li>\n<li>再加生抽、醋、糖、蚝油、香油，酸辣咸香层次足。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 配菜<\/strong><\/p>\n<ol start=\"8\">\n<li>黄瓜丝、胡萝卜丝（焯熟）、火腿丝、黑木耳都可以加，颜色口感更丰富。<\/li>\n<li>冷藏 10 分钟风味更佳。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://hanwuji.xiachufang.com/recipe/106810312/\">下厨房 · 凉拌金针菇黄瓜<\/a> —— 热油泼香料汁，适合对照「进阶版」<\/li>\n<li><a href=\"https://m.lezuocai.com/recipe/2327411/\">乐做菜 · 凉拌金针菇<\/a> —— 适合对照「进阶版」配菜<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1jK4y1o7h3/\">红油金针菇（在家拌更好吃）（哔哩哔哩）<\/a> —— 红油口味，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节）<\/h2>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 处理到位<\/strong><\/p>\n<ol>\n<li>金针菇剪根后撕成均匀小撮。<\/li>\n<li>焯水时散开放，受热均匀、口感一致。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 焯水控时<\/strong><\/p>\n<ol start=\"3\">\n<li>水要大开再下锅，煮 1~2 分钟（刚熟透）。<\/li>\n<li>立刻捞出投冰水，口感最脆嫩——这是饭店凉菜「脆」的秘诀。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 料油提香<\/strong><\/p>\n<ol start=\"5\">\n<li>冷油下花椒、干辣椒段小火炸香，捞出料渣。<\/li>\n<li>热油泼在蒜末辣椒面上。<\/li>\n<li>再加生抽、香醋、糖、一点花椒油和熟芝麻，麻辣鲜香。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 拌后静置<\/strong><\/p>\n<ol start=\"8\">\n<li>拌好冷藏 10 分钟让味道进去。<\/li>\n<li>上桌前再淋一点料油、撒香菜，卖相和香气都更好。<\/li>\n<\/ol>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "100", "name": "香菇油菜", "title": "香菇油菜", "category": "菌菇", "ingredient": "香菇", "ings": [["鲜香菇"], ["油菜", "上海青"], ["大蒜"], ["生抽"], ["蚝油"], ["白糖"], ["盐"], ["食用油"], ["水淀粉"]], "opt": [false, false, false, false, true, false, false, false, true], "tags": [], "html": "<h1>香菇油菜<\/h1>\n<blockquote>\n<p>归属食材：香菇 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>香菇滑嫩带酱香，油菜碧绿爽脆，一荤一素、鲜香清爽，是饭店常见的素菜。关键是香菇炒出香气、油菜大火快炒保脆。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、清爽不苦）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>鲜香菇<\/td>\n<td>6~8 朵（约 150g）<\/td>\n<td>选菇伞厚实、没开伞的<\/td>\n<\/tr>\n<tr>\n<td>油菜（上海青）<\/td>\n<td>4~6 棵（约 250g）<\/td>\n<td>掰开洗净<\/td>\n<\/tr>\n<tr>\n<td>大蒜<\/td>\n<td>2 瓣<\/td>\n<td>切片<\/td>\n<\/tr>\n<tr>\n<td>生抽<\/td>\n<td>1 汤匙<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>蚝油<\/td>\n<td>1/2 汤匙<\/td>\n<td>提鲜（可选）<\/td>\n<\/tr>\n<tr>\n<td>白糖<\/td>\n<td>1/2 小勺<\/td>\n<td>提鲜<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>少许<\/td>\n<td>最后补味<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>2 汤匙<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>水淀粉<\/td>\n<td>1/2 小勺淀粉 + 2 汤匙水<\/td>\n<td>可选<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 备菜<\/strong><\/p>\n<ol>\n<li>香菇去蒂（根部硬、不干净），菇伞洗净切片。<\/li>\n<li>油菜一片片掰开洗净，太大的对半切。<\/li>\n<li>蒜切片。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 焯油菜（保绿）<\/strong><\/p>\n<ol start=\"4\">\n<li>水烧开加一点盐和几滴油，下油菜焯约 30 秒。<\/li>\n<li>颜色变翠绿 → 捞出，过凉水沥干（加盐和油能让油菜保持碧绿）。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 炒香菇<\/strong><\/p>\n<ol start=\"6\">\n<li>锅烧热倒油，下蒜片炒香（约 10 秒）。<\/li>\n<li>下香菇片中火翻炒 2~3 分钟。<\/li>\n<li>炒到香菇变软、出水、有香气。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 调味<\/strong><\/p>\n<ol start=\"9\">\n<li>加生抽、蚝油、白糖，翻炒均匀。<\/li>\n<li>如果太干可以加 2 汤匙水，让香菇烧出一点汁。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 合炒<\/strong><\/p>\n<ol start=\"11\">\n<li>下焯好的油菜，大火快炒约 30 秒，让油菜沾上酱汁。<\/li>\n<li>尝一下咸淡，不够补一点点盐。<\/li>\n<\/ol>\n<p><strong>第 6 步 · 勾芡出锅（可选）<\/strong><\/p>\n<ol start=\"13\">\n<li>淋入水淀粉，汤汁变浓稠 → 关火盛出。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>油菜发黄 / 软烂<\/strong>：焯太久或炒太久。焯 30 秒就捞出，最后合炒只要 30 秒。<\/li>\n<li><strong>香菇没香味<\/strong>：火太小、炒太快。香菇要炒到变软出水、闻到香味再调味。<\/li>\n<li><strong>油菜带苦味 / 有沙子<\/strong>：没洗净或根蒂没切掉。一片片掰开在流水下冲干净。<\/li>\n<li><strong>汤汁太多<\/strong>：香菇会自己出水，加水要少，或最后勾芡收浓。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/107496425/\">下厨房 · 香菇油菜<\/a> —— 适合对照「初学版」步骤<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：选菇 / 焯水 / 分炒 / 调味）<\/h2>\n<p>在初学版基础上，掌握下面四条，成品质感会上一个台阶。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 选香菇<\/strong><\/p>\n<ol>\n<li>鲜香菇挑菇伞厚、边缘内卷（没完全展开）的，香气和口感更好。<\/li>\n<li>干香菇更香，但需提前温水泡发，泡菇水留着一同烧菜更鲜。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 焯油菜的讲究<\/strong><\/p>\n<ol start=\"3\">\n<li>水里加盐和几滴油，能锁住叶绿素、保持翠绿。<\/li>\n<li>焯完立刻过凉水定型，防止余温把菜焖黄。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 分炒合味<\/strong><\/p>\n<ol start=\"5\">\n<li>香菇先单独炒出香气和汁水。<\/li>\n<li>油菜焯好后再下锅快炒合味——这样香菇入味、油菜脆嫩，两不耽误。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 调味<\/strong><\/p>\n<ol start=\"7\">\n<li>生抽 + 蚝油 + 一点糖是万能底味。<\/li>\n<li>蚝油在起锅前加，高温久煮会损失鲜味。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/dish/193087371/\">下厨房 · 香菇油菜（简单快手）<\/a> —— 高分家常版，适合对照「进阶版」<\/li>\n<li><a href=\"https://jiayaowu.com/zh-sg/meiweijiayao/sucai/emp08x.html\">佳肴屋 · 家常香菇油菜<\/a> —— 分炒合味技巧，适合对照「进阶版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1dRSCBMEVC/\">香菇油菜保姆级教学（哔哩哔哩）<\/a> —— 两个细节做出翠绿爽口，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「香菇香滑、油菜脆绿、汤汁浓稠能挂味」。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 香菇切花刀<\/strong><\/p>\n<ol>\n<li>香菇菇伞表面切十字花刀，受热更均匀、更入味，卖相也好看。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 干香菇泡发<\/strong><\/p>\n<ol start=\"2\">\n<li>用干香菇时，温水泡发 1~2 小时。<\/li>\n<li>泡菇水过滤后留用，用泡菇水代替清水烧菜，鲜味更浓。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 煸香菇出香<\/strong><\/p>\n<ol start=\"4\">\n<li>锅烧热、油宽一点，香菇片中火「煸」到边缘微焦、微微卷起（约 3 分钟）。<\/li>\n<li>逼出水分、激出香气，这是整道菜鲜味的来源。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 勾芡收汁 + 锅气<\/strong><\/p>\n<ol start=\"6\">\n<li>淋薄芡让汤汁挂在香菇和油菜上。<\/li>\n<li>全程大火、动作快，出锅前点几滴香油，趁热吃，锅气十足。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.bilibili.com/video/BV1bx411L7uu/\">心野小厨 · 老菜新做香菇油菜（哔哩哔哩）<\/a> —— 一分钟快节奏，适合对照「大厨版」<\/li>\n<\/ul>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "101", "name": "卤水", "title": "自制卤水（万能五香卤水）", "category": "调味香料", "ingredient": "八角", "ings": [["八角"], ["桂皮"], ["香叶"], ["花椒"], ["小茴香"], ["草果"], ["姜"], ["大葱"], ["生抽"], ["老抽"], ["冰糖"], ["盐"], ["食用油"], ["清水"]], "opt": [false, false, false, false, true, false, false, false, false, false, false, false, false, false], "tags": [], "html": "<h1>自制卤水（万能五香卤水）<\/h1>\n<blockquote>\n<p>归属食材：八角 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>五香咸鲜、酱香回甘，一锅卤水能卤鸡腿、鸡蛋、豆干等荤素食材，越养越香。属性：卤水（一次备好、可长期复用）。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能卤出味道、不难吃）<\/h2>\n<p><strong>食材（基础五香卤水，约 1500ml）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>八角<\/td>\n<td>3 颗<\/td>\n<td>卤水主香，别放多否则发苦<\/td>\n<\/tr>\n<tr>\n<td>桂皮<\/td>\n<td>1 小段（约 5g）<\/td>\n<td>增香<\/td>\n<\/tr>\n<tr>\n<td>香叶<\/td>\n<td>3 片<\/td>\n<td>提香<\/td>\n<\/tr>\n<tr>\n<td>花椒<\/td>\n<td>约 20 粒（1 小勺）<\/td>\n<td>微麻提味，可不放<\/td>\n<\/tr>\n<tr>\n<td>小茴香<\/td>\n<td>1 小勺（约 3g）<\/td>\n<td>可选，增香<\/td>\n<\/tr>\n<tr>\n<td>草果<\/td>\n<td>1 个<\/td>\n<td>拍破（可去籽防苦）<\/td>\n<\/tr>\n<tr>\n<td>姜<\/td>\n<td>4~5 片<\/td>\n<td>去腥<\/td>\n<\/tr>\n<tr>\n<td>大葱<\/td>\n<td>1 段（约 10cm）<\/td>\n<td>去腥<\/td>\n<\/tr>\n<tr>\n<td>生抽<\/td>\n<td>4 汤匙（约 60ml）<\/td>\n<td>提咸鲜<\/td>\n<\/tr>\n<tr>\n<td>老抽<\/td>\n<td>1 汤匙（约 15ml）<\/td>\n<td>上色，少放防发黑<\/td>\n<\/tr>\n<tr>\n<td>冰糖<\/td>\n<td>约 20g<\/td>\n<td>炒糖色用<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>约 1 汤匙（10g）<\/td>\n<td>煮开后尝味再补<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>1 汤匙<\/td>\n<td>炒糖色用<\/td>\n<\/tr>\n<tr>\n<td>清水<\/td>\n<td>约 1500ml<\/td>\n<td>没过食材<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 处理香料<\/strong><\/p>\n<ol>\n<li>八角、桂皮、香叶、花椒、小茴香、草果（拍破）放进温水里。<\/li>\n<li>泡 10 分钟，把香料表面的灰尘和部分苦涩味泡出来 → 捞出沥干（卤水会更清亮、不发苦）。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 炒糖色<\/strong><\/p>\n<ol start=\"3\">\n<li>锅烧热，倒 1 汤匙油。<\/li>\n<li>下冰糖，开小火，慢慢翻炒约 2~3 分钟。<\/li>\n<li>看到糖先化开、再冒大泡、最后变成深琥珀色（像可乐色）并冒细密小泡 → 糖色到位，立刻进行下一步（这是卤水红亮颜色的来源）。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 加水冲开<\/strong><\/p>\n<ol start=\"6\">\n<li>糖色一到位，立刻沿锅边倒入全部清水（会\"滋啦\"一声，小心烫）。<\/li>\n<li>下姜、葱和沥干的香料。<\/li>\n<li>开大火，煮到水面完全沸腾。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 调味<\/strong><\/p>\n<ol start=\"9\">\n<li>加生抽、老抽、盐。<\/li>\n<li>转小火保持微沸，煮 20 分钟，让香料味充分煮进水里。<\/li>\n<li>尝一口：偏咸一点点、有明显五香味 → 味道到位，不够再补盐（后面卤食材会吸走一部分咸味）。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 先卤一次<\/strong><\/p>\n<ol start=\"12\">\n<li>放入鸡腿 / 鸡蛋 / 豆干等你喜欢的食材（鸡蛋提前煮熟去壳）。<\/li>\n<li>小火卤 20~30 分钟（鸡腿更久些），关火。<\/li>\n<li>关火后别急着捞，浸在卤水里 1~2 小时，更入味。<\/li>\n<\/ol>\n<p><strong>第 6 步 · 保存<\/strong><\/p>\n<ol start=\"15\">\n<li>用完把食材捞出。<\/li>\n<li>卤水过滤掉渣，重新煮开。<\/li>\n<li>彻底放凉后装进干净容器，冷藏可存 3~5 天，冷冻可存更久。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>糖色炒糊发苦<\/strong>：火太大或炒太久。糖变深琥珀色就立刻加水，颜色发黑就苦了。<\/li>\n<li><strong>太咸 / 太淡<\/strong>：盐分次加，煮开后先尝，偏咸一点点即可（食材会吸收一部分）。<\/li>\n<li><strong>卤水发苦<\/strong>：八角、草果放太多。草果拍破去籽，香料煮 20 分钟就够，别久煮。<\/li>\n<li><strong>味道寡淡<\/strong>：没先卤一次就急着用，或没浸够时间。头锅卤水味道淡属正常，多卤几次会越来越香。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/104708699/\">下厨房 · 卤水<\/a> —— 家用小份量五香卤水配方，适合对照「初学版」香料与调味比例<\/li>\n<li><a href=\"https://www.xiachufang.com/recipe/101682233/\">下厨房 · 自制卤水<\/a> —— 基础卤水做法与保存，适合对照「初学版」<\/li>\n<li><a href=\"https://www.xiachufang.com/recipe/102861276/\">下厨房 · 卤水的做法步骤图（熊宝柒柒）<\/a> —— 带步骤图，适合对照「初学版」炒糖色过程<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：香料配比 / 糖色 / 老卤养汤）<\/h2>\n<p>在初学版基础上掌握下面四条，卤水会更香、更耐存。<\/p>\n<p><strong>第 1 步 · 香料配比<\/strong><\/p>\n<ol>\n<li>八角、桂皮、香叶按约 <strong>2 : 1.5 : 1<\/strong> 配（如八角 10g、桂皮 8g、香叶 3~5g）。<\/li>\n<li>再配小茴香、草果、丁香等辅香。<\/li>\n<li>丁香、草果这类味道重的少放，否则发苦发闷（八角是主香，要克制）。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 炒糖色的两种流派<\/strong><\/p>\n<ol start=\"4\">\n<li>新手先学<strong>水炒<\/strong>：冰糖加少量清水，小火熬，更稳不易糊。<\/li>\n<li>想上色快就用<strong>油炒<\/strong>：油里下糖小火炒，上色快，但新手易糊。<\/li>\n<li>看到大泡变小泡、颜色深琥珀、闻起来有焦糖香不带苦味 → 糖色到位。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 头卤先\"养一养\"<\/strong><\/p>\n<ol start=\"7\">\n<li>头锅卤水味道偏淡，先卤一次猪皮、鸡爪这类胶质多的食材。<\/li>\n<li>看到卤水起胶、变浓稠 → 养好了，再卤别的就更香、更挂味。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 老卤保存与复用<\/strong><\/p>\n<ol start=\"9\">\n<li>用完滤渣、重新烧开，晾凉再冷藏；长时间不用就冷冻。<\/li>\n<li>每次复用补少量盐、生抽，和半份新香料，老卤越养越香。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.bilibili.com/video/BV1gRvUBCE7S/\">常见香料汇总，万能香料配方，卤水的熬制，卤货的时间（哔哩哔哩）<\/a> —— 香料配比与卤制时间，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p><strong>第 1 步 · 糖色到位判断<\/strong><\/p>\n<ol>\n<li>炒糖色时，看到大泡变小泡、颜色呈深琥珀色、有焦糖香不带苦味 → 到位。<\/li>\n<li>宁可略浅，不可发黑（发黑就苦了）。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 香料先焙香再下锅<\/strong><\/p>\n<ol start=\"3\">\n<li>干锅开小火，把香料焙 1 分钟。<\/li>\n<li>闻到香味 → 下锅，香料味更足、更透。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 素菜荤菜分开卤<\/strong><\/p>\n<ol start=\"5\">\n<li>豆干、鸡蛋、海带这类素菜会带水、易让卤水变质，单独分一锅或最后卤。<\/li>\n<li>别让素菜污染老卤。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 卤水\"清卤\"<\/strong><\/p>\n<ol start=\"7\">\n<li>全程最小火，让水面只冒\"菊花心\"（微微冒泡、不翻滚）。<\/li>\n<li>看到食材不破皮、卤得入味 → 卤好了。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.bilibili.com/video/BV18xNK67EQz/\">从 0 熬出万能川味麻辣老卤水：10 斤量全套步骤拆解 + 养汤技巧（哔哩哔哩）<\/a> —— 大份量全流程 + 养汤，适合对照「大厨版」<\/li>\n<\/ul>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "102", "name": "姜汁撞奶", "title": "姜汁撞奶（姜撞奶）", "category": "调味香料", "ingredient": "姜", "ings": [["老姜", "小黄姜"], ["全脂牛奶"], ["白糖"], ["全脂奶粉"]], "opt": [false, false, false, false], "tags": ["甜"], "html": "<h1>姜汁撞奶（姜撞奶）<\/h1>\n<blockquote>\n<p>归属食材：姜 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>广东传统甜品，热牛奶冲进老姜汁后自行凝结成嫩滑豆腐状，甜中带辣、暖胃驱寒。属性：甜品。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：一次成功凝成豆腐状）<\/h2>\n<p><strong>食材（1 碗）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>老姜（小黄姜）<\/td>\n<td>30g（约 1 小块）<\/td>\n<td>必须用老姜/小黄姜，嫩姜出汁少、不易凝固<\/td>\n<\/tr>\n<tr>\n<td>全脂牛奶<\/td>\n<td>200ml<\/td>\n<td>蛋白质越高越容易凝，别用脱脂奶<\/td>\n<\/tr>\n<tr>\n<td>白糖<\/td>\n<td>1~1.5 汤匙（约 15~20g）<\/td>\n<td>按喜好调整<\/td>\n<\/tr>\n<tr>\n<td>全脂奶粉（可选）<\/td>\n<td>1 汤匙<\/td>\n<td>混进牛奶，提高成功率<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 磨姜挤汁<\/strong><\/p>\n<ol>\n<li>老姜去皮。<\/li>\n<li>用擦蓉板磨成细蓉（或用料理机打碎）。<\/li>\n<li>用纱布或干净煲汤袋包住姜蓉，用力挤出纯姜汁。<\/li>\n<li>取 15~20ml 姜汁（约 1 汤匙多）倒进碗底。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 煮奶<\/strong><\/p>\n<ol start=\"5\">\n<li>牛奶 + 白糖 + 奶粉（如果加）倒进小锅。<\/li>\n<li>中小火边搅边加热。<\/li>\n<li>看到锅边冒细密小泡、表面起一层奶皮、但还没煮沸（约 70~80℃）→ 关火（没温度计就记住「刚起小泡、不沸腾」）。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 冲撞<\/strong><\/p>\n<ol start=\"8\">\n<li>把热牛奶举高约 20cm，从高处快速、一次性冲进姜汁碗里。<\/li>\n<li>冲进去后千万不要搅拌、不要晃动碗。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 静置<\/strong><\/p>\n<ol start=\"10\">\n<li>立刻盖盖（或盖个盘子），静置 8~15 分钟。<\/li>\n<li>掀开看，用小勺轻放表面不下沉 → 成功凝结。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>不凝固<\/strong>：用了嫩姜、脱脂奶，或奶温太低/太高。记住四要素：老姜 + 全脂奶 + 70~80℃ + 不搅拌。<\/li>\n<li><strong>煮到沸腾<\/strong>：牛奶煮沸后姜里的酶被破坏，就凝不住了。刚起小泡就关火。<\/li>\n<li><strong>冲后搅拌<\/strong>：一搅拌结构就散。冲完立刻盖盖、别碰。<\/li>\n<li><strong>姜太辣<\/strong>：姜汁放太多。按姜汁 : 牛奶 ≈ 1 : 10，别贪多。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/101892631/\">下厨房 · 姜汁撞奶<\/a> —— 比例与步骤清楚，适合对照「初学版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1oE411S73h/\">【姜撞奶】牛奶和姜的神奇反应，掌握诀窍你也能做<\/a> —— 手把手教学，适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：温度 / 配比 / 牛奶选择）<\/h2>\n<p>在初学版基础上，掌握下面四条，成功率会高很多。<\/p>\n<p><strong>第 1 步 · 掌握温度<\/strong><\/p>\n<ol>\n<li>姜里的「生姜蛋白酶」在 70~80℃ 活性最好，能切断牛奶蛋白让它凝结。<\/li>\n<li>没温度计时，看到「锅边起小泡、牛奶冒轻烟」→ 温度到了，关火（太高酶失活、太低反应慢）。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 掌握配比<\/strong><\/p>\n<ol start=\"3\">\n<li>每 200ml 牛奶配 15~20ml 姜汁（约 1 : 10）。<\/li>\n<li>姜汁太少不凝、太多会辣，按这个配比来。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 选牛奶<\/strong><\/p>\n<ol start=\"5\">\n<li>选水牛奶 &gt; 全脂牛奶 &gt; 普通奶，蛋白质每 100ml 在 3g 以上最好。<\/li>\n<li>想稳一点，加 1 汤匙全脂奶粉「加浓」。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 补救<\/strong><\/p>\n<ol start=\"7\">\n<li>如果没凝固，别倒掉。<\/li>\n<li>整碗放进蒸锅，隔水小火蒸 5~8 分钟，看到凝上 → 能吃（口感略差）。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/104043259/\">下厨房 · 明星们超爱的姜汁撞奶<\/a> —— 温度与手法，适合对照「进阶版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1v5NReSEFd/\">姜撞奶（粤语配音）/ 失败后的解决法 &amp; 补救法<\/a> —— 讲原理和补救，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p><strong>第 1 步 · 姜汁现磨现用<\/strong><\/p>\n<ol>\n<li>姜汁现磨现用，放久会分层、酶活性下降。<\/li>\n<li>冲奶前再搅一下姜汁，让沉底的姜汁淀粉重新混匀，凝固更稳。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 冲撞手法<\/strong><\/p>\n<ol start=\"3\">\n<li>奶温约 75℃ 时，从 20cm 以上高处垂直冲入。<\/li>\n<li>利用冲力让奶和姜汁在碗里自然翻匀，冲完不动碗。<\/li>\n<li>立即盖盖，静置至少 10 分钟。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 用水牛奶<\/strong><\/p>\n<ol start=\"6\">\n<li>正宗顺德姜撞奶用水牛奶，脂肪和蛋白含量高，凝结后更滑嫩。<\/li>\n<li>买不到就用全脂奶 + 全脂奶粉补足。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 口感平衡<\/strong><\/p>\n<ol start=\"8\">\n<li>糖用冰糖或红糖，风味更圆润；姜用老姜，偏辛辣暖胃。<\/li>\n<li>凝固后放凉或微温吃，别放太久（放久会回苦）。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/103777006/\">下厨房 · 姜撞奶<\/a> —— 水牛奶与配比，适合对照「大厨版」<\/li>\n<\/ul>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "103", "name": "孜然土豆", "title": "孜然土豆", "category": "调味香料", "ingredient": "孜然", "ings": [["土豆"], ["孜然粒"], ["辣椒面"], ["盐"], ["生抽"], ["葱花"], ["食用油"]], "opt": [false, false, false, false, true, false, false], "tags": [], "html": "<h1>孜然土豆<\/h1>\n<blockquote>\n<p>归属食材：孜然 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>土豆外干香、内软糯，孜然香浓微辣，下饭也能当零食。属性：热菜 / 零食（干香小食）。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、不难吃）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>土豆<\/td>\n<td>2 个（约 400g）<\/td>\n<td>切滚刀块<\/td>\n<\/tr>\n<tr>\n<td>孜然粒<\/td>\n<td>1 汤匙（约 10g）<\/td>\n<td>焙香后压碎更香<\/td>\n<\/tr>\n<tr>\n<td>辣椒面<\/td>\n<td>1 小勺<\/td>\n<td>可不放<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>1/2 小勺<\/td>\n<td>最后调<\/td>\n<\/tr>\n<tr>\n<td>生抽<\/td>\n<td>1 汤匙<\/td>\n<td>提味（可选）<\/td>\n<\/tr>\n<tr>\n<td>葱花<\/td>\n<td>1 小撮<\/td>\n<td>出锅撒<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>2 汤匙<\/td>\n<td>煎土豆用<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 处理土豆<\/strong><\/p>\n<ol>\n<li>土豆去皮，切约 2cm 滚刀块。<\/li>\n<li>泡水 10 分钟，洗去表面淀粉。<\/li>\n<li>捞出沥干（泡水去淀粉，煎的时候不粘锅、更干香）。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 煮土豆<\/strong><\/p>\n<ol start=\"4\">\n<li>水开下土豆，煮约 5 分钟。<\/li>\n<li>用筷子戳，能戳动但还硬（七八分熟）→ 捞出，彻底沥干（先煮后煎，保证外焦里熟）。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 焙孜然<\/strong><\/p>\n<ol start=\"6\">\n<li>干锅开小火，放孜然粒，翻炒约 30 秒。<\/li>\n<li>闻到浓郁孜然香 → 盛出，用擀面杖或刀背压碎（现焙现压，香味最足）。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 煎土豆<\/strong><\/p>\n<ol start=\"8\">\n<li>锅烧热，倒 2 汤匙油，下土豆。<\/li>\n<li>中小火煎，别急着翻，等一面金黄（约 2 分钟）再翻。<\/li>\n<li>煎到四面焦黄、表面起皱 → 煎好了。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 调味<\/strong><\/p>\n<ol start=\"11\">\n<li>撒孜然碎、辣椒面、盐，淋少许生抽。<\/li>\n<li>大火快速翻炒 30 秒，撒葱花出锅。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>土豆粘锅 / 不干香<\/strong>：没泡水、没沥干，或火太小。泡水 + 彻底沥干 + 先煮后煎。<\/li>\n<li><strong>孜然不香<\/strong>：没焙香，或孜然粉放太久。孜然粒现焙现压最香。<\/li>\n<li><strong>太咸 / 太辣<\/strong>：盐和辣椒面少量加，炒匀尝味再补。<\/li>\n<li><strong>土豆没熟心<\/strong>：煮的时间不够。煮到筷子能轻松戳入再捞。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong
