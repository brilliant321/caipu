d>\n<\/tr>\n<tr>\n<td>大蒜<\/td>\n<td>4~5 瓣<\/td>\n<td>分两次用，多点更香<\/td>\n<\/tr>\n<tr>\n<td>小葱<\/td>\n<td>1 根<\/td>\n<td>出锅前撒<\/td>\n<\/tr>\n<tr>\n<td>生抽<\/td>\n<td>2 汤匙（约 20ml）<\/td>\n<td>咸鲜<\/td>\n<\/tr>\n<tr>\n<td>老抽<\/td>\n<td>1/2 汤匙（约 5ml）<\/td>\n<td>上色<\/td>\n<\/tr>\n<tr>\n<td>蚝油<\/td>\n<td>1 汤匙（约 15ml）<\/td>\n<td>提鲜增厚<\/td>\n<\/tr>\n<tr>\n<td>白糖<\/td>\n<td>1 小勺（约 5g）<\/td>\n<td>提鲜、回甜<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>1 小勺（约 5g）<\/td>\n<td>腌茄子杀水用<\/td>\n<\/tr>\n<tr>\n<td>淀粉<\/td>\n<td>2 小勺（约 10g）<\/td>\n<td>1 小勺裹茄、1 小勺调汁<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>3 汤匙（约 30ml）<\/td>\n<td>比平常略多，煎茄子用<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 切块杀水<\/strong><\/p>\n<ol>\n<li>茄子洗净去蒂，切成约 3cm 的滚刀块。<\/li>\n<li>撒 1 小勺盐抓匀，腌 10 分钟。<\/li>\n<li>看到茄子出水后，用手把水挤干——盐腌破坏海绵结构，后面少吸油、不发黑。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 裹淀粉<\/strong><\/p>\n<ol start=\"4\">\n<li>挤干的茄子块薄薄裹一层干淀粉（抖掉多余的）——裹粉锁水、煎的时候外皮定型。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 调碗汁<\/strong><\/p>\n<ol start=\"5\">\n<li>小碗里放生抽、老抽、蚝油、白糖、1 小勺淀粉，加小半碗清水（约 80ml）搅匀备用。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 煎茄子<\/strong><\/p>\n<ol start=\"6\">\n<li>锅烧热倒油，转中火，下茄子块摊开，中途翻动几次。<\/li>\n<li>煎约 3~4 分钟，看到表面微黄、茄子变软 → 盛出（或拨到一边）。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 烧制收汁<\/strong><\/p>\n<ol start=\"8\">\n<li>下蒜末爆香（约 15 秒）。<\/li>\n<li>把碗汁再搅一下（淀粉会沉底），倒进锅里。<\/li>\n<li>下煎好的茄子，翻炒让每块裹上汁。<\/li>\n<li>转中小火焖 1~2 分钟，再开大火收汁，收到汁浓、亮晶晶地裹在茄子上。<\/li>\n<li>撒葱花，关火。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>吸油像海绵、太腻<\/strong>：没先盐腌杀水、没裹粉。盐腌 + 挤干 + 裹粉是少油关键。<\/li>\n<li><strong>茄子发黑<\/strong>：切好没杀水就下锅。盐腌和挤干能防止氧化变黑。<\/li>\n<li><strong>不入味 / 水汪汪<\/strong>：汁没收浓就出锅。最后要大火收到浓稠挂汁。<\/li>\n<li><strong>淀粉结块<\/strong>：碗汁下锅前没搅匀，淀粉沉底结成块。倒汁前一定再搅一下。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://m.douguo.com/recipe/amp/1165916.html\">豆果美食 · 红烧茄子<\/a> —— 盐腌 + 裹粉 + 烧汁流程清楚，适合对照「初学版」<\/li>\n<li><a href=\"https://m.douguo.com/recipe/amp/3189350.html\">豆果美食 · 长相厮守红烧茄子<\/a> —— 咸甜烧汁版本，适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：杀水 / 裹粉 / 碗汁 / 蒜分两次）<\/h2>\n<p>在初学版基础上，掌握下面四条，成品质感会上一个台阶。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 盐腌杀水（少油关键）<\/strong><\/p>\n<ol>\n<li>切好的茄子撒盐腌——茄子是海绵结构，直接下锅会疯狂吸油；盐腌后细胞失水、结构塌缩，挤干后吸油能力大减，还能防氧化变黑。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 裹淀粉锁水<\/strong><\/p>\n<ol start=\"2\">\n<li>腌好挤干的茄子块裹一层干淀粉——淀粉在表面形成一层膜，煎的时候外皮先定型、内部水分不流失，口感外软内嫩。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 碗汁一次调好<\/strong><\/p>\n<ol start=\"3\">\n<li>生抽、老抽、蚝油、糖、淀粉提前调成碗汁，下锅后一步到位，避免边炒边找调料导致茄子过火。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 蒜分两次放<\/strong><\/p>\n<ol start=\"4\">\n<li>一半蒜末先爆香出底味。<\/li>\n<li>一半出锅前撒入、翻两下，生蒜香和熟蒜香叠加，蒜味更足。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/104386385/\">下厨房 · 不用炸不吸油，咸香入味三分的红烧茄子<\/a> —— 少油家常做法，适合对照「进阶版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1g54y1z7ug/\">怎么让红烧茄子即美味又不油腻（哔哩哔哩）<\/a> —— 讲透不吸油关键，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 宽油炸至金黄再烧<\/strong><\/p>\n<ol>\n<li>饭店做法：宽油把茄子炸到表面金黄定型，再回锅烧汁——外皮更香、定型更好，是「红烧」口感的来源。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 炒糖色或加豆瓣酱<\/strong><\/p>\n<ol start=\"2\">\n<li>想要颜色红亮：冷油下白糖，小火炒化、微微冒小泡（糖色）再下茄子；或加半勺豆瓣酱炒出红油，颜色和酱香都上一个档次。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 收汁要亮芡<\/strong><\/p>\n<ol start=\"3\">\n<li>大火收汁时边翻边收，收成浓稠透亮的芡汁，均匀裹满每块茄子。<\/li>\n<li>出锅前淋几滴明油（或点几滴陈醋提香解腻）。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 锅气<\/strong><\/p>\n<ol start=\"5\">\n<li>全程动作快，最后大火收汁、撒葱花立刻出锅——趁热吃最香，茄子凉了口感会回软。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.bilibili.com/video/BV1fu411r7dn/\">红烧茄子怎么做才酥脆不吸油？（哔哩哔哩）<\/a> —— 大厨示范酥脆不吸油，适合对照「大厨版」<\/li>\n<\/ul>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "18", "name": "莲藕排骨汤", "title": "莲藕排骨汤", "category": "蔬菜", "ingredient": "莲藕", "ings": [["莲藕"], ["猪肋排"], ["姜"], ["料酒"], ["小葱"], ["盐"], ["白胡椒粉"]], "opt": [false, false, false, false, true, false, true], "tags": [], "html": "<h1>莲藕排骨汤<\/h1>\n<blockquote>\n<p>归属食材：莲藕 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>汤鲜藕糯、暖胃滋补，成败在藕够不够「粉糯」、汤清不清、肉烂不烂。记住四条：藕要选粉藕、排骨要焯水去血沫、炖汤全程加热水、盐最后放。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：汤清、藕糯、不难喝）<\/h2>\n<p><strong>食材（2~3 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>莲藕<\/td>\n<td>1 节（约 300g）<\/td>\n<td>选短粗、表皮带麻点的粉藕，炖出来才粉糯<\/td>\n<\/tr>\n<tr>\n<td>猪肋排<\/td>\n<td>300g<\/td>\n<td>让摊主剁成小段；肋排肉嫩汤鲜<\/td>\n<\/tr>\n<tr>\n<td>姜<\/td>\n<td>3~4 片<\/td>\n<td>去腥<\/td>\n<\/tr>\n<tr>\n<td>料酒<\/td>\n<td>1 汤匙（约 15ml）<\/td>\n<td>焯水时去腥用<\/td>\n<\/tr>\n<tr>\n<td>小葱<\/td>\n<td>1 根<\/td>\n<td>打结放进汤里，出锅前捞出（可选）<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>约 1 小勺（5g）<\/td>\n<td>最后放<\/td>\n<\/tr>\n<tr>\n<td>白胡椒粉<\/td>\n<td>少许（可选）<\/td>\n<td>出锅撒一点，提鲜去腥<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 排骨焯水（焯水 = 把食材放进冷水里煮开，逼出血沫再捞出）<\/strong><\/p>\n<ol>\n<li>排骨放进锅里，加没过排骨的冷水，加 2 片姜和料酒。<\/li>\n<li>开火煮，水开后继续煮约 2 分钟，看到水面浮起一层灰白色的沫 → 关火。<\/li>\n<li>把排骨捞出，用温水冲掉表面的沫（别用冷水冲，肉遇冷会变紧，炖不烂）。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 藕切块泡水<\/strong><\/p>\n<ol start=\"4\">\n<li>莲藕去皮，切成滚刀块（滚一下切一刀，块约 2~3cm 大小）。<\/li>\n<li>切好的藕块放进清水里泡着防黑（藕一接触空气就会发黑），用之前再捞出。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 下锅炖<\/strong><\/p>\n<ol start=\"6\">\n<li>排骨、藕块、剩下的姜片、葱结一起放进汤锅（最好砂锅），加足量热水，没过食材约两指宽。<\/li>\n<li>开大火烧开后，转小火，盖上盖子慢慢炖 1 小时左右。<\/li>\n<li>用筷子扎一下藕块，能轻松扎透 → 藕就粉糯了；排骨肉能轻松脱骨 → 可以调味了。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 调味出锅<\/strong><\/p>\n<ol start=\"9\">\n<li>加盐搅匀，尝一口汤，咸淡合适 → 撒点白胡椒粉和葱花，关火出锅。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>藕炖不粉<\/strong>：选错了藕。脆藕（表皮白净、藕孔小）怎么炖都不粉，炖汤要选短粗、表皮带麻点的粉藕。<\/li>\n<li><strong>汤浑浊有腥味<\/strong>：排骨没焯水，或者焯水后没用温水冲。冷水下锅焯、撇净浮沫、温水冲洗，三步缺一不可。<\/li>\n<li><strong>汤变黑<\/strong>：用了铁锅炖藕。藕遇铁会发黑，炖藕用砂锅、不锈钢锅或电炖锅都行，别用铁锅。<\/li>\n<li><strong>肉柴、汤淡<\/strong>：中途加了冷水，或盐放太早。全程加热水，盐出锅前再放。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.bilibili.com/video/BV1FJ411i7br/\">冬季营养滋补，暖胃的莲藕排骨玉米汤（哔哩哔哩）<\/a> —— 炖煮步骤简单直白，适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：选粉藕 / 先炒排骨 / 水一次加足 / 盐最后放）<\/h2>\n<p>在初学版基础上，掌握下面几条，汤会浓很多。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 认准粉藕<\/strong><\/p>\n<ol>\n<li>粉藕：短粗、七孔、表皮带麻点、掰开拉丝多；脆藕：细长、九孔、表皮白净。炖汤只认粉藕。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 排骨先炒香<\/strong><\/p>\n<ol start=\"2\">\n<li>焯好水的排骨，下热锅少油，中火翻炒约 2 分钟，炒到表面微微发黄、闻到香味 → 再加热水炖。<\/li>\n<li>炒过的排骨更香，汤色也更浓白。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 水一次加足<\/strong><\/p>\n<ol start=\"4\">\n<li>炖汤的水一次加够（没过食材两指宽），中途不再加水——中途加冷水，汤会变淡、肉会变柴。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 盐最后放<\/strong><\/p>\n<ol start=\"5\">\n<li>盐一定等藕炖粉、肉炖烂之后再放——盐放早了肉会收紧、炖不烂，藕也难粉。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 时间<\/strong><\/p>\n<ol start=\"6\">\n<li>排骨先炖 30 分钟，再下藕块一起炖 40~60 分钟；藕块后放，避免炖太久散成渣。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.bilibili.com/video/BV1oXxNeAER5/\">暖身必备❗莲藕排骨汤，秋天喝刚刚好（哔哩哔哩）<\/a> —— 炒骨 + 粉藕慢炖 1.5 小时，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节：奶白汤 / 火候）<\/h2>\n<p>追求「汤白、藕粉、肉烂、有回味」。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 煎骨出奶白<\/strong><\/p>\n<ol>\n<li>焯水沥干的排骨，下热锅少油，中大火煎到两面金黄、边缘微焦 → 油香充分释放。<\/li>\n<li>一次性倒入足量开水（是滚开的水，不是温水），保持大火滚 10 分钟——高温下油脂和蛋白质乳化，汤就变奶白了。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 小火慢煨<\/strong><\/p>\n<ol start=\"3\">\n<li>转最小火，加盖煨 40 分钟，再下藕块煨 40 分钟，全程保持汤面「微微冒小泡」的状态。<\/li>\n<li>看到藕块表面起粉、筷子一扎即透 → 藕已经粉糯到心。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 后放盐、只放盐<\/strong><\/p>\n<ol start=\"5\">\n<li>出锅前只加盐（和白胡椒粉），不加其他重调料——排骨和藕本身够鲜，调味越简单越能喝出原味。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.bilibili.com/video/BV11P4y1d73i/\">莲藕排骨汤，1小时20分钟，汤汁奶白、味道浓郁（哔哩哔哩）<\/a> —— 煎骨加开水出奶白汤，适合对照「大厨版」<\/li>\n<\/ul>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "19", "name": "酸辣藕丁", "title": "酸辣藕丁", "category": "蔬菜", "ingredient": "莲藕", "ings": [["莲藕"], ["干辣椒"], ["蒜"], ["姜"], ["小葱"], ["白醋"], ["生抽"], ["白糖"], ["盐"], ["食用油"]], "opt": [false, false, false, false, true, false, false, false, false, false], "tags": [], "html": "<h1>酸辣藕丁<\/h1>\n<blockquote>\n<p>归属食材：莲藕 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>藕丁酸辣脆爽、下饭开胃，成败在藕丁够不够「脆」、酸辣味均不均匀。藕切开一碰空气就会发黑，记住「切完立刻泡水」；炒的时候全程大火、快进快出。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、够脆、不难吃）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>莲藕<\/td>\n<td>1 节（约 300g）<\/td>\n<td>挑表皮白净、藕孔里没泥的；脆藕炒着吃正合适<\/td>\n<\/tr>\n<tr>\n<td>干辣椒<\/td>\n<td>3~4 个<\/td>\n<td>剪段，怕辣可去籽<\/td>\n<\/tr>\n<tr>\n<td>蒜<\/td>\n<td>2 瓣<\/td>\n<td>切片<\/td>\n<\/tr>\n<tr>\n<td>姜<\/td>\n<td>1 小片<\/td>\n<td>切丝，去藕的土腥味<\/td>\n<\/tr>\n<tr>\n<td>小葱<\/td>\n<td>1 根<\/td>\n<td>切段，出锅前撒（可选）<\/td>\n<\/tr>\n<tr>\n<td>白醋<\/td>\n<td>2 汤匙（约 20ml）<\/td>\n<td>泡藕防黑用一点，炒制时再放一点<\/td>\n<\/tr>\n<tr>\n<td>生抽<\/td>\n<td>1 小勺（约 5ml）<\/td>\n<td>提咸鲜<\/td>\n<\/tr>\n<tr>\n<td>白糖<\/td>\n<td>1 小勺（约 5g）<\/td>\n<td>中和酸辣、提鲜<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>约 1/2 小勺（2g）<\/td>\n<td>最后调味<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>2 汤匙（约 20ml）<\/td>\n<td>分两次用<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点，全程大火快炒）<\/strong><\/p>\n<p><strong>第 1 步 · 切丁泡水<\/strong><\/p>\n<ol>\n<li>莲藕去皮，先切成约 1cm 厚的片，再改刀切成 1cm 见方的小丁，大小尽量一致。<\/li>\n<li>切好的藕丁立刻放进清水里，滴几滴白醋搅一下——藕肉一接触空气就会发黑，泡水能防黑、也洗掉表面的淀粉。<\/li>\n<li>泡 5 分钟，捞出沥干备用。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 焯水保脆（焯水 = 把食材放进滚水里短时间烫一下再捞出）<\/strong><\/p>\n<ol start=\"4\">\n<li>锅里烧一锅水，水开后下藕丁，煮约 1 分钟。<\/li>\n<li>看到藕丁颜色变透亮、还带着脆劲 → 立刻捞出，过一下凉水再沥干（这一步让藕先「断生」，缩短后面炒的时间，口感更脆）。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 备配料<\/strong><\/p>\n<ol start=\"6\">\n<li>干辣椒剪段（怕辣抖掉籽），蒜切片，姜切丝，葱切段。<\/li>\n<li>白醋、生抽、盐、糖都摆在手边——这道菜炒起来很快，料要先备齐。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 爆香<\/strong><\/p>\n<ol start=\"8\">\n<li>锅烧热倒 1 汤匙油，转中大火，下蒜片、姜丝、干辣椒段，快速翻炒约 10 秒，闻到蒜香和辣香就停（别让辣椒炒黑，黑了下锅会苦）。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 快炒出锅<\/strong><\/p>\n<ol start=\"9\">\n<li>转最大火，倒入沥干的藕丁，快速翻炒约 1 分钟。<\/li>\n<li>加生抽、白糖、盐，再沿锅边淋入白醋，继续翻炒约 30 秒。<\/li>\n<li>夹一颗尝尝，熟透但仍脆、酸辣均匀 → 撒葱段，翻两下关火出锅。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>藕发黑<\/strong>：切完没泡水，或者泡的水里没加醋。记住「切完立刻泡水 + 加几滴白醋」。<\/li>\n<li><strong>藕丁不脆、发软<\/strong>：焯水太久或者炒太久。焯水 1 分钟就够，炒的时候全程大火、断生就出锅（断生 = 食材刚熟、还带着脆劲）。<\/li>\n<li><strong>辣椒炒糊发苦<\/strong>：干辣椒在大火热油里久炒。油温别太高时下辣椒，或先关小火再下。<\/li>\n<li><strong>醋味太冲<\/strong>：醋放得太早会被炒挥发、酸味变淡；放得太晚又刺鼻。正确做法是沿锅边淋，锅边温度高，醋香更浓、冲味挥发掉。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/175025/\">下厨房 · 酸辣藕丁<\/a> —— 藕丁焯水 + 糖醋汁快炒，适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：选藕 / 泡醋水 / 调汁 / 分次放醋）<\/h2>\n<p>在初学版基础上，掌握下面几条，成品质感会上台阶。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 选脆藕<\/strong><\/p>\n<ol>\n<li>炒藕丁要选脆藕：表皮白净、藕孔小、九孔左右，水分足、淀粉少；粉藕（短粗、带麻点）留炖汤用。脆藕炒出来才脆，不是面的。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 泡醋水防黑更脆<\/strong><\/p>\n<ol start=\"2\">\n<li>切丁后泡水时加 1 汤匙白醋——酸水防黑更彻底，还能让藕丁更白更脆。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 调好糖醋汁（灵魂）<\/strong><\/p>\n<ol start=\"3\">\n<li>小碗里先调汁：2 汤匙白醋 + 1 小勺生抽 + 1 小勺白糖 + 少许盐，搅到糖盐化开。<\/li>\n<li>一次性倒入比边炒边放更均匀，每颗藕丁味道都一致。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 分次放醋更香<\/strong><\/p>\n<ol start=\"5\">\n<li>第一次：藕丁下锅炒热后淋一半汁，让酸味先渗进去。<\/li>\n<li>第二次：出锅前沿锅边淋剩下的一半——锅边温度最高，醋一接触就挥发掉冲味、只留醋香。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 火候<\/strong><\/p>\n<ol start=\"7\">\n<li>全程最大火、快速翻锅，藕丁「断生即出」——刚熟还带脆；多炒 30 秒就会回软出水。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/102150650/\">下厨房 · 酸辣藕丁（另一版本）<\/a> —— 强调藕丁泡白醋水防黑，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「颗颗脆、酸香扑鼻、出锅带锅气」。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 冰水激脆<\/strong><\/p>\n<ol>\n<li>藕丁焯水后立刻放进冰水里泡 1 分钟再沥干——冷热一激，藕丁更脆，后面怎么炒都不容易软。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 花椒油提香<\/strong><\/p>\n<ol start=\"2\">\n<li>冷油小火下 1 小撮花椒（约 20 粒），炸约 1 分钟，看到花椒变棕红色 → 捞出。<\/li>\n<li>用这锅花椒油炒菜，麻香是普通油比不了的。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 蒜分两次放<\/strong><\/p>\n<ol start=\"4\">\n<li>爆香用蒜片，炒出底香。<\/li>\n<li>出锅前再撒一点生蒜末，翻两下——生蒜的辛香和熟蒜的醇香叠在一起，更提味。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 锅气<\/strong><\/p>\n<ol start=\"6\">\n<li>出锅前沿锅边淋醋，立刻离火，颠两下就装盘——全程动作要快，锅气（高温 + 快炒带来的焦香气）凉了就散。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.bilibili.com/video/BV1Vx411L771/\">藕丁这样做，比大鱼大肉好吃百倍，吃一次就忘不了！（哔哩哔哩）<\/a> —— 大火快炒讲得细，适合对照「大厨版」<\/li>\n<\/ul>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "20", "name": "蒜蓉菠菜", "title": "蒜蓉菠菜", "category": "蔬菜", "ingredient": "菠菜", "ings": [["菠菜"], ["大蒜"], ["盐"], ["食用油"], ["蚝油"]], "opt": [false, false, false, false, false], "tags": [], "html": "<h1>蒜蓉菠菜<\/h1>\n<blockquote>\n<p>归属食材：菠菜 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>蒜香浓郁、菠菜翠绿不涩口，几分钟出锅的营养素菜。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g。<\/p>\n<p>提示：菠菜含草酸，建议先焯水，口感不涩、也更健康。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、不难吃）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>菠菜<\/td>\n<td>1 把（约 300g）<\/td>\n<td>挑叶片鲜绿、根部带红的，嫩<\/td>\n<\/tr>\n<tr>\n<td>大蒜<\/td>\n<td>4~5 瓣<\/td>\n<td>切成蒜末，蒜是这道菜的灵魂<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>约 1/2 小勺（2g）<\/td>\n<td>分两次放<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>1 汤匙 + 焯水用几滴<\/td>\n<td>分两次用<\/td>\n<\/tr>\n<tr>\n<td>蚝油（可选）<\/td>\n<td>1/2 汤匙<\/td>\n<td>提鲜<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 处理菠菜<\/strong><\/p>\n<ol>\n<li>菠菜去掉老根，掰开洗净（根部泥沙多，多冲几遍）。<\/li>\n<li>大蒜剥皮，切成蒜末。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 焯水<\/strong><\/p>\n<ol start=\"3\">\n<li>锅里烧一锅开水，加 1 小撮盐和几滴油（能让菠菜保持翠绿）。<\/li>\n<li>水开后下菠菜，焯约 20~30 秒，看到菠菜变软、颜色变鲜绿 → 捞出。<\/li>\n<li>立刻放进凉水里过一下（或直接沥干控水），然后挤掉多余水分。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 炒蒜<\/strong><\/p>\n<ol start=\"6\">\n<li>锅烧热，倒 1 汤匙油，油热后下蒜末。<\/li>\n<li>小火炒约 20 秒，闻到香味就停——别炒糊，蒜末发黄就苦了。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 炒菠菜出锅<\/strong><\/p>\n<ol start=\"8\">\n<li>下焯好的菠菜，转大火快速翻炒约 30 秒。<\/li>\n<li>加剩下的盐和蚝油，翻拌均匀。<\/li>\n<li>尝一口咸淡，关火出锅。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>菠菜发黑<\/strong>：没焯水直接下锅炒，或炒太久。先焯水、大火快炒，颜色才翠绿。<\/li>\n<li><strong>蒜炒糊发苦<\/strong>：蒜末下锅后火太大。这一步要小火，闻到蒜香就下菠菜。<\/li>\n<li><strong>太涩口<\/strong>：没焯水。菠菜含草酸，焯水 20~30 秒就能去涩。<\/li>\n<li><strong>出汤<\/strong>：焯水后没挤干水。下锅前把水分挤一挤。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://m.xiachufang.com/recipe/100429789/\">下厨房 · 蒜蓉菠菜<\/a> —— 步骤图清楚，适合对照「初学版」<\/li>\n<li><a href=\"https://www.douguo.net/cookbook/1482128.html\">豆果美食 · 蒜蓉菠菜<\/a> —— 家常易上手，适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：翠绿 / 蒜香 / 分次放蒜）<\/h2>\n<p>在初学版基础上，掌握下面几条，成品质感会上一个台阶。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 菠菜为什么先焯水<\/strong><\/p>\n<ol>\n<li>菠菜先焯水：一是去掉草酸（涩味的来源），二是让菠菜提前断生、定型，后续大火快炒就不会发黑。<\/li>\n<li>焯水时水里加盐和油，能让菠菜在高温下仍保持翠绿。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 蒜末分两次放<\/strong><\/p>\n<ol start=\"3\">\n<li>一半蒜末先下锅小火爆香（提供熟蒜香）。<\/li>\n<li>另一半在<strong>关火前 10 秒<\/strong>才撒进去（保留生蒜的冲劲）——两种蒜香叠加，是「蒜香浓郁」的关键。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 蚝油是点睛<\/strong><\/p>\n<ol start=\"5\">\n<li>蚝油在出锅前放（长时间高温会损失鲜味）——它自带咸鲜和微微的甜，比单放盐更提味。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 想要更香可淋热油<\/strong><\/p>\n<ol start=\"6\">\n<li>另一种做法：焯好摆盘的菠菜上铺满生蒜末，淋一勺烧到冒烟的热油，再浇上生抽和蚝油调的汁，蒜香瞬间激发（接近饭店「白灼」风格）。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.bilibili.com/video/BV1w54y1e7FP/\">简单经典素菜之蒜蓉菠菜（哔哩哔哩）BV1w54y1e7FP<\/a> —— 讲解翠绿不发黑的技巧，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「菠菜碧绿挺拔、蒜香霸道、出锅带镬气」。每一步都是细节。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 菠菜「快进快出」<\/strong><\/p>\n<ol>\n<li>焯水：水要滚开、菠菜要放得多、时间要短（15~20 秒）。<\/li>\n<li>看到菠菜刚变软就捞出，立刻过凉水「锁绿」——宁可稍生，后面还有炒制一步。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 蒜要「细」<\/strong><\/p>\n<ol start=\"3\">\n<li>蒜末剁得越细越好（或用刀背拍碎再剁）——蒜的细胞破裂越多、蒜香释放越充分。<\/li>\n<li>切好放置几分钟再用，蒜香更足。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 锅要「爆」<\/strong><\/p>\n<ol start=\"5\">\n<li>空锅烧到冒青烟再下油，油热到七成，蒜末下锅的瞬间「滋啦」一声，香气立刻冲出来——这就是锅气。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 出锅前「收干」<\/strong><\/p>\n<ol start=\"6\">\n<li>菠菜回锅后大火快炒，把多余水汽炒掉，让蒜蓉和调料挂在叶子上。<\/li>\n<li>关火前滴几滴香油，趁热上桌（凉了颜色和香气都打折扣）。<\/li>\n<\/ol>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "21", "name": "蒜苗回锅肉", "title": "蒜苗回锅肉", "category": "蔬菜", "ingredient": "蒜苗", "ings": [["带皮五花肉"], ["蒜苗"], ["郫县豆瓣酱"], ["姜"], ["蒜"], ["料酒"], ["生抽"], ["白糖"], ["食用油"]], "opt": [false, false, false, false, false, false, false, false, false], "tags": [], "html": "<h1>蒜苗回锅肉<\/h1>\n<blockquote>\n<p>归属食材：蒜苗 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>川菜经典下饭菜，肉片焦香、蒜苗清甜，肥而不腻。成败在「肉片煸出灯盏窝」和「蒜苗分两段炒」——先把肉煮到断生再切薄片，煸出油，最后大火快炒蒜苗。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、下饭、不难吃）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>带皮五花肉<\/td>\n<td>300g<\/td>\n<td>肥瘦相间的整块肉，别买现成的薄肉片<\/td>\n<\/tr>\n<tr>\n<td>蒜苗<\/td>\n<td>4~5 根<\/td>\n<td>斜切成段，梗和叶分开放<\/td>\n<\/tr>\n<tr>\n<td>郫县豆瓣酱<\/td>\n<td>1 汤匙（约 15g）<\/td>\n<td>这道菜的咸味和红油都靠它<\/td>\n<\/tr>\n<tr>\n<td>姜<\/td>\n<td>2~3 片<\/td>\n<td>煮肉去腥<\/td>\n<\/tr>\n<tr>\n<td>蒜<\/td>\n<td>2 瓣<\/td>\n<td>切片<\/td>\n<\/tr>\n<tr>\n<td>料酒<\/td>\n<td>1 汤匙（约 15ml）<\/td>\n<td>煮肉去腥<\/td>\n<\/tr>\n<tr>\n<td>生抽<\/td>\n<td>1 小勺（约 5ml）<\/td>\n<td>提咸鲜，豆瓣酱本身很咸，别多放<\/td>\n<\/tr>\n<tr>\n<td>白糖<\/td>\n<td>1/2 小勺（约 2g）<\/td>\n<td>提鲜、中和辣味<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>1 汤匙（约 10ml）<\/td>\n<td>煸肉用，五花肉自己会出油<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 煮肉断生（断生 = 煮到刚熟、筷子能扎透但还紧实）<\/strong><\/p>\n<ol>\n<li>整块五花肉冷水下锅，加姜片、料酒。<\/li>\n<li>开火煮，水开后转中小火再煮约 15 分钟。<\/li>\n<li>用筷子扎肉最厚处，能扎透、没有血水冒出 → 捞出放凉（这一步让肉定型、好切片）。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 切薄片<\/strong><\/p>\n<ol start=\"4\">\n<li>肉放凉后，切成约 2mm 的薄片，越薄越好——薄片才容易煸出油、起卷。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 备蒜苗<\/strong><\/p>\n<ol start=\"5\">\n<li>蒜苗洗净，斜切成约 3cm 的段；蒜白（梗）和蒜叶分开放两堆——梗难熟先下锅，叶易熟后下锅。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 煸肉出油<\/strong><\/p>\n<ol start=\"6\">\n<li>锅烧热倒 1 汤匙油，下肉片，中火慢慢煸炒约 3~5 分钟。<\/li>\n<li>看到肉片变色、边缘微微卷起、锅底渗出不少油 → 肉片已经煸香（卷起的小窝窝叫「灯盏窝」）。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 炒豆瓣酱<\/strong><\/p>\n<ol start=\"8\">\n<li>把肉拨到锅边，转小火，下豆瓣酱和蒜片，炒约 30 秒，看到油变成红色、闻到酱香 → 把肉和酱翻炒均匀。<\/li>\n<\/ol>\n<p><strong>第 6 步 · 下蒜苗出锅<\/strong><\/p>\n<ol start=\"9\">\n<li>先下蒜白（梗），中大火炒约 30 秒，看到蒜白变软、颜色变深绿。<\/li>\n<li>再下蒜叶，加生抽、白糖，大火快炒约 20 秒，看到蒜叶变翠绿、刚断生 → 立刻关火出锅（蒜叶久炒会黄、会出水）。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>肉切太厚、煸不香<\/strong>：肉没放凉就切，或切太厚。煮好放凉再切薄片，越薄越香。<\/li>\n<li><strong>蒜苗叶炒黄、出汤<\/strong>：叶子和梗一起下锅。梗先炒 30 秒，叶最后 20 秒大火快炒就出锅。<\/li>\n<li><strong>太咸<\/strong>：豆瓣酱本身很咸，一般不用再加盐。加生抽前先尝一下，别放多。<\/li>\n<li><strong>肉腥<\/strong>：煮肉时没放姜和料酒，或者没煮透。冷水下锅、加姜片料酒、煮到筷子能扎透。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://mbdbj.xiachufang.com/recipe/104373296/\">下厨房 · 超下饭的回锅肉，家庭版快手回锅肉<\/a> —— 快手家常流程，适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：灯盏窝 / 豆瓣酱剁细 / 蒜苗分两段 / 火候）<\/h2>\n<p>在初学版基础上，掌握下面几条，成品质感会上台阶。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 煸出「灯盏窝」<\/strong><\/p>\n<ol>\n<li>肉片下锅后中火耐心煸，煸到肉片自然卷成小窝窝、边缘金黄——灯盏窝说明肥肉里的油出来了，吃着才不腻、还香。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 豆瓣酱剁细<\/strong><\/p>\n<ol start=\"2\">\n<li>郫县豆瓣酱用刀剁细再下锅——酱里有豆瓣颗粒，剁细后更容易炒出红油、颜色更亮、不硌牙。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 小火炒酱防糊<\/strong><\/p>\n<ol start=\"3\">\n<li>豆瓣酱下锅一定要转小火炒，炒约 30 秒到出红油——大火会把酱炒焦发苦。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 蒜苗分两段<\/strong><\/p>\n<ol start=\"4\">\n<li>蒜白先下、炒软炒香；蒜叶最后下、大火 10~20 秒断生就起锅——梗有嚼劲、叶保持翠绿脆嫩。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 白糖提鲜<\/strong><\/p>\n<ol start=\"5\">\n<li>一点点糖（吃不出甜味的量），中和豆瓣酱的咸辣，回口更柔和。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.bilibili.com/video/BV1VL4y1i78J/\">信我这下饭绝了～蒜苗回锅肉！有它饭不够！（哔哩哔哩）<\/a> —— 蒜白蒜叶分炒讲得细，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节：二刀肉 / 豆豉甜面酱 / 锅气）<\/h2>\n<p>追求「灯盏窝明显、红油亮、锅气足」的川味。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 认准二刀肉<\/strong><\/p>\n<ol>\n<li>讲究的做法用「二刀肉」——猪后腿靠近尾巴那一段，肥瘦四六开、带着皮，切出来的回锅肉肥瘦分明、最香；买不到用带皮五花肉也行。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 加豆豉和甜面酱<\/strong><\/p>\n<ol start=\"2\">\n<li>炒豆瓣酱的同时，加 1 小勺豆豉和 1 小勺甜面酱——豆豉添豉香、甜面酱添酱香回甜，层次比单用豆瓣酱丰富。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 大火出锅气<\/strong><\/p>\n<ol start=\"3\">\n<li>下蒜苗后转最大火，快速翻炒，10~20 秒断生立刻离火装盘——锅气（高温快炒带来的焦香气）一出，凉了就散，动作要快。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.bilibili.com/video/BV1dcP6euEFG/\">蒜苗回锅肉 | 超下饭超经典的川味小炒！（哔哩哔哩）<\/a> —— 二刀肉 + 豆豉 + 甜面酱，适合对照「大厨版」<\/li>\n<\/ul>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "22", "name": "蒜蓉西兰花", "title": "蒜蓉西兰花", "category": "蔬菜", "ingredient": "西兰花", "ings": [["西兰花"], ["大蒜"], ["盐"], ["蚝油"], ["白糖"], ["食用油"], ["淀粉"]], "opt": [false, false, false, false, false, false, true], "tags": [], "html": "<h1>蒜蓉西兰花<\/h1>\n<blockquote>\n<p>归属食材：西兰花 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>清淡快手菜，蒜香浓郁、翠绿脆嫩。西兰花「翠绿不黄」和「入味」是重点。以下按三档给出做法。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能熟、翠绿、不难吃）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>西兰花<\/td>\n<td>1 颗（约 400g）<\/td>\n<td>花球紧实、颜色深绿<\/td>\n<\/tr>\n<tr>\n<td>大蒜<\/td>\n<td>4~5 瓣<\/td>\n<td>切蒜末，多点更香<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>约 1/2 小勺（2g）<\/td>\n<td>焯水和调味分用<\/td>\n<\/tr>\n<tr>\n<td>蚝油<\/td>\n<td>1 汤匙（约 15ml）<\/td>\n<td>提鲜挂味<\/td>\n<\/tr>\n<tr>\n<td>白糖<\/td>\n<td>1/2 小勺（约 2g）<\/td>\n<td>提鲜<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>2 汤匙（约 20ml）<\/td>\n<td>焯水用几滴 + 炒菜用<\/td>\n<\/tr>\n<tr>\n<td>淀粉<\/td>\n<td>1 小勺（约 5g）<\/td>\n<td>加水调成水淀粉（可选）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 处理西兰花<\/strong><\/p>\n<ol>\n<li>西兰花从花梗处切成小朵，梗太粗的可以斜刀片薄。<\/li>\n<li>放进加了少许盐的清水里泡 10 分钟，再冲洗干净——盐水把花球里的小虫和杂质泡出来。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 焯水<\/strong><\/p>\n<ol start=\"3\">\n<li>锅里烧开一锅水，加 1 小撮盐和几滴油（让它更绿更亮）。<\/li>\n<li>下西兰花，保持水滚，焯约 40~60 秒。<\/li>\n<li>用筷子戳花梗，刚能戳动、颜色变得更绿 → 捞出，立刻过一遍凉水，沥干（防止余温焖黄）。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 爆蒜<\/strong><\/p>\n<ol start=\"6\">\n<li>锅烧热倒油，转小火，下蒜末慢慢炒。<\/li>\n<li>炒约 30 秒，看到蒜末微微金黄、满屋蒜香 → 停（别炒焦）。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 炒制<\/strong><\/p>\n<ol start=\"8\">\n<li>转大火，倒入沥干的西兰花，快速翻炒约 1 分钟。<\/li>\n<li>加盐、糖、蚝油，翻匀。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 勾芡出锅<\/strong><\/p>\n<ol start=\"10\">\n<li>把 1 小勺淀粉加 2 汤匙清水调匀，转圈淋进锅里。<\/li>\n<li>快速翻炒十几秒，等汤汁变浓、均匀裹在西兰花上 → 关火出锅。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>西兰花发黄<\/strong>：焯水太久、捞出后没立刻过凉水。焯到「刚能戳动」就捞，别煮到软塌。<\/li>\n<li><strong>蒜末炒糊发苦<\/strong>：蒜末要用小火炒，微金黄就停；火一大几秒就焦。<\/li>\n<li><strong>出水软塌、不入味<\/strong>：炒太久会让它出水变软。大火快炒、最后勾个薄芡，蒜香蚝油汁才能挂上去。<\/li>\n<li><strong>没洗干净<\/strong>：花球缝隙多，一定要淡盐水泡过再冲洗。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/104483998/\">下厨房 · 蒜蓉蚝油西兰花（焯水摆盘淋汁）<\/a> —— 蚝油汁配方清楚，适合对照「初学版」<\/li>\n<li><a href=\"https://www.xiachufang.com/recipe/103879289/\">下厨房 · 蒜蓉西兰花（蚝油勾芡版）<\/a> —— 基础蚝油勾芡做法，适合对照「初学版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV17M411R7Yg/\">减脂版蒜蓉西兰花（哔哩哔哩）<\/a> —— 先焯水再调汁，适合减脂少油<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：焯水保绿 / 蒜分两次 / 勾芡 / 蒸焖法）<\/h2>\n<p>在初学版基础上，掌握下面几条，成品质感会上一个台阶。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 焯水保翠绿<\/strong><\/p>\n<ol>\n<li>焯水时水里加盐（提底味）和油（在表面形成薄油膜、减少叶绿素流失）。<\/li>\n<li>捞出后立刻过凉水，让温度骤降、锁住绿色。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 蒜末分两次放<\/strong><\/p>\n<ol start=\"3\">\n<li>一半蒜末小火炒成金黄色（熟蒜的甜香）。<\/li>\n<li>另一半出锅前才撒进去、翻两下（生蒜的辛香）——两种蒜香叠加，层次更足。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 勾芡挂味<\/strong><\/p>\n<ol start=\"5\">\n<li>水淀粉一勾，汤汁变浓稠，才能「挂」在花球上——西兰花表面光滑，不勾芡汁水都沉在盘底，每一口才有味。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 不焯水的「蒸焖法」<\/strong><\/p>\n<ol start=\"6\">\n<li>冷油下蒜末和干辣椒，炒香后下西兰花，加小半碗水（或高汤）。<\/li>\n<li>盖盖中火焖 1 分半，再开盖收汁——不焯水，维生素 C 保留更多，口感也脆。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/106546941/\">下厨房 · 小高姐蒜蓉西兰花（蒸焖法，搬运）<\/a> —— 不焯水蒸焖，适合对照「进阶版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1fy4y1W7z5/\">【小高姐】蒜蓉西兰花（哔哩哔哩）<\/a> —— 蒸焖法保留营养，讲解细致<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 金蒜 + 银蒜<\/strong><\/p>\n<ol>\n<li>一半蒜末用油小火炸到金黄酥脆（金蒜）。<\/li>\n<li>出锅前再撒另一半生蒜末（银蒜），再淋几滴炸蒜的油——香气翻倍。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 高汤代替清水<\/strong><\/p>\n<ol start=\"3\">\n<li>蒸焖或收汁时用鸡汤/高汤代替清水，鲜味能渗进花球，比单放蚝油更立体。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 收汁要亮<\/strong><\/p>\n<ol start=\"4\">\n<li>水淀粉分次加入，边淋边翻，收成「玻璃芡」——浓稠透亮、均匀裹满每朵花。<\/li>\n<li>出锅前淋几滴明油更亮。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 火候<\/strong><\/p>\n<ol start=\"6\">\n<li>炒制全程大火、动作快，西兰花下锅到出锅控制在 1 分钟内，才能翠绿脆嫩、带锅气。<\/li>\n<\/ol>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "23", "name": "西红柿炒蛋", "title": "西红柿炒蛋（番茄炒蛋）", "category": "蔬菜", "ingredient": "西红柿", "ings": [["西红柿"], ["鸡蛋"], ["盐"], ["白糖"], ["葱花"], ["食用油"]], "opt": [false, false, false, false, false, false], "tags": [], "html": "<h1>西红柿炒蛋（番茄炒蛋）<\/h1>\n<blockquote>\n<p>归属食材：西红柿 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>家常第一菜，酸甜下饭，拌饭拌面都合适。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。三档都是<strong>点对点写法：念一句、做一句<\/strong>，每步标明火候、时间，以及「看到什么状态算到位」。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、不难吃）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>西红柿<\/td>\n<td>2 个（中等，约 300g）<\/td>\n<td>挑红熟、摸起来微软的，汁多<\/td>\n<\/tr>\n<tr>\n<td>鸡蛋<\/td>\n<td>3 个（约 150g）<\/td>\n<td>常温蛋更好打散<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>约 1/2 小勺（2g）<\/td>\n<td>分两次放<\/td>\n<\/tr>\n<tr>\n<td>白糖<\/td>\n<td>1 小勺（约 5g）<\/td>\n<td>提鲜、中和酸<\/td>\n<\/tr>\n<tr>\n<td>葱花<\/td>\n<td>1 小撮<\/td>\n<td>出锅前撒<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>2 汤匙（约 20ml）<\/td>\n<td>分两次用<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点，全程中大火）<\/strong><\/p>\n<p><strong>第 1 步 · 切菜备料<\/strong><\/p>\n<ol>\n<li>西红柿洗净，对半切开，切掉顶部的硬蒂。<\/li>\n<li>切成约 2cm 的滚刀块（这档不用去皮）。<\/li>\n<li>鸡蛋磕进碗里，加 1 小撮盐（约 1g）。<\/li>\n<li>用筷子朝一个方向打散，打到蛋清蛋黄完全融合、表面起一层细沫（约 30 秒）。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 炒蛋<\/strong><\/p>\n<ol start=\"5\">\n<li>空锅开中大火干烧约 30 秒，把手放在锅上方 10cm 处感到热气 → 锅烧热了。<\/li>\n<li>倒 1 汤匙油，端起锅晃一圈，让油铺满锅底。<\/li>\n<li>等约 10 秒，看到油面微微冒烟 → 油温到了。<\/li>\n<li>倒入蛋液，<strong>先别动<\/strong>，等约 15 秒（看到底部凝固、边缘微微翘起）。<\/li>\n<li>用铲子从外往内轻轻推，让没凝固的蛋液流到锅底，再等几秒。<\/li>\n<li>鸡蛋基本成型、还带一点湿润 → 立刻盛出备用（余温会把它烘到刚好）。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 炒西红柿<\/strong><\/p>\n<ol start=\"11\">\n<li>锅里补剩下的 1 汤匙油，倒入西红柿块。<\/li>\n<li>中大火翻炒约 1 分钟。<\/li>\n<li>加剩下的盐（约 1g）和 1 小勺白糖。<\/li>\n<li>继续翻炒 2~3 分钟，直到西红柿明显变软、锅底渗出红汁。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 合炒出锅<\/strong><\/p>\n<ol start=\"15\">\n<li>把炒好的鸡蛋倒回锅里，和西红柿一起翻拌约 30 秒，让鸡蛋裹满汤汁。<\/li>\n<li>尝一口咸淡，不够再加一点盐（少量多次）。<\/li>\n<li>撒葱花，关火，出锅。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>鸡蛋炒老了<\/strong>：蛋液一倒进锅就不断翻炒、炒到全干才盛出。记住「还带一点湿润就盛」，余温会把它烘到刚好。<\/li>\n<li><strong>西红柿没汁<\/strong>：火太小或炒的时间太短。西红柿要炒到变软塌、锅底有明显红汁再下鸡蛋。<\/li>\n<li><strong>太咸 / 太甜<\/strong>：盐一定分两次、少量加，合炒后先尝再补。<\/li>\n<li><strong>粘锅<\/strong>：锅没烧热就倒油，或油温不够就下蛋。先烧热锅再放油、油热再下料，就不易粘。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"http://mwx.douguo.com/cookbook/2297640.html\">豆果美食 · 好吃又下饭的西红柿炒鸡蛋（馨心杨）<\/a> —— 用量精确，适合对照「初学版」比例<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1SCB4BHEP4/\">家常 No.1！番茄炒蛋（哔哩哔哩）<\/a> —— 简单易学，适合拌饭配面<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1KF411R7Ta/\">西红柿炒鸡蛋的做法（哔哩哔哩）<\/a> —— 含详细文字步骤<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：嫩蛋 / 去皮 / 出沙 / 调味）<\/h2>\n<p>在初学版基础上掌握四条，成品质感上一个台阶。同样点对点，每一步都标了「看什么算到位」。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 去皮（可选，口感更顺滑）<\/strong><\/p>\n<ol>\n<li>西红柿顶部用刀划一个十字（只划破皮，不切深）。<\/li>\n<li>放进滚水里烫约 20 秒，看到皮边翻起 → 捞出。<\/li>\n<li>立刻放进冷水里过一下。<\/li>\n<li>从十字口处撕下整张皮。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 切块：一半熬蓉、一半留块<\/strong><\/p>\n<ol start=\"5\">\n<li>一个西红柿切成<strong>小丁<\/strong>（用来熬成茄蓉）。<\/li>\n<li>另一个切成<strong>大块<\/strong>（用来保留成块口感）。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 调蛋液（更嫩滑）<\/strong><\/p>\n<ol start=\"7\">\n<li>鸡蛋磕进碗里，加 1 小撮盐、<strong>1 小勺清水<\/strong>、<strong>几滴白醋（或料酒）<\/strong>。<\/li>\n<li>顺一个方向打散，打到表面起细泡（水让蛋受热更蓬松，白醋去腥）。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 炒蛋（六成热下锅、八成熟出锅）<\/strong><\/p>\n<ol start=\"9\">\n<li>空锅开中大火烧热，倒 1 汤匙油。<\/li>\n<li>等油温六成热：锅边冒轻烟、把筷子伸进油里周围快速冒小泡。<\/li>\n<li>倒入蛋液，快速划散。<\/li>\n<li>蛋八成熟（还有少量流动蛋液）→ 立刻盛出，余温烘到全熟。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 熬蓉出沙（先小丁后大块）<\/strong><\/p>\n<ol start=\"13\">\n<li>锅里补油，先下西红柿<strong>小丁<\/strong>。<\/li>\n<li>加盐和糖（约盐 2g + 糖 3g，比例约 1:1.5，糖略多）。<\/li>\n<li>中火慢慢熬 2~3 分钟，熬成浓稠沙状茄蓉——这是整道菜「茄汁味」的来源。<\/li>\n<\/ol>\n<p><strong>第 6 步 · 下大块 + 合炒<\/strong><\/p>\n<ol start=\"16\">\n<li>下大块西红柿，快速翻炒约 30 秒（保留成块口感）。<\/li>\n<li>倒回鸡蛋，翻拌均匀。<\/li>\n<li>汁太少可加 1~2 勺清水；想更红更浓可加半勺番茄酱。<\/li>\n<li>撒葱花，出锅。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/105896441/\">下厨房 · 跟饭店一样的西红柿番茄炒蛋<\/a> —— 适合对照「进阶版」的切法（1:3 大小块 + 炒糖）<\/li>\n<li><a href=\"http://mwx.douguo.com/cookbook/754876.html\">豆果美食 · 西红柿炒鸡蛋 经典易学版（小王子记事簿）<\/a> —— 去皮 + 熬蓉技巧，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「鸡蛋蓬松带蛋香、茄汁浓稠能挂味、出锅有锅气」。每一步都是细节，照做即可。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 调蛋液<\/strong><\/p>\n<ol>\n<li>3 个蛋加 1/4 小勺盐、几滴白醋、1 小勺清水。<\/li>\n<li>顺一个方向打约 1 分钟，打到表面全是细泡。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 烧锅到位再下油（关键）<\/strong><\/p>\n<ol start=\"3\">\n<li>空锅烧到冒青烟。<\/li>\n<li>倒约 3 汤匙油（宽油），烧到八成热（油面明显冒烟、微微波动）。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 炒蛋（蓬松嫩滑，全程约 20 秒）<\/strong><\/p>\n<ol start=\"5\">\n<li>倒入蛋液，蛋会快速蓬起。<\/li>\n<li>用锅铲<strong>背面<\/strong>从四周向中间迅速兜散。<\/li>\n<li>刚断生就离火盛出——宁可稍生不可炒老。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 炒糖出沙<\/strong><\/p>\n<ol start=\"8\">\n<li>冷油下 1 小勺白糖，小火慢慢炒化、炒到微微发黄（糖色）。<\/li>\n<li>下西红柿小丁，转大火翻炒，加少许盐「杀」出汁。<\/li>\n<li>熬成浓稠沙状茄蓉（糖先炒化，甜味更圆润、颜色更亮）。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 番茄分两次下<\/strong><\/p>\n<ol start=\"11\">\n<li>下大块番茄，大火快速翻炒约 30 秒（保持块状口感与鲜甜，不要炒塌）。<\/li>\n<\/ol>\n<p><strong>第 6 步 · 收汁挂味 + 锅气<\/strong><\/p>\n<ol start=\"12\">\n<li>倒回鸡蛋，沿锅边淋一点点生抽提鲜（可选）。<\/li>\n<li>大火颠炒约 20 秒，让汤汁均匀裹住每块蛋。<\/li>\n<li>汁太多可勾薄芡：半小勺淀粉 + 2 汤匙水调匀，倒入。<\/li>\n<li>撒葱花、点几滴香油，趁热出锅——凉了锅气就散了。<\/li>\n<\/ol>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "24", "name": "西葫芦炒鸡蛋", "title": "西葫芦炒鸡蛋", "category": "蔬菜", "ingredient": "西葫芦", "ings": [["西葫芦"], ["鸡蛋"], ["蒜"], ["小葱"], ["盐"], ["蚝油"], ["食用油"]], "opt": [false, false, false, true, false, true, false], "tags": [], "html": "<h1>西葫芦炒鸡蛋<\/h1>\n<blockquote>\n<p>归属食材：西葫芦 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>西葫芦清甜脆嫩、汁水足，配鸡蛋是一道 5 分钟搞定的快手下饭菜。成败全看西葫芦会不会「炒成一滩水」。以下按「初学 / 进阶 / 大厨」三档给出做法。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、不难吃）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>西葫芦<\/td>\n<td>1 根（约 400g）<\/td>\n<td>挑表皮光滑、硬实、没有软点的嫩瓜<\/td>\n<\/tr>\n<tr>\n<td>鸡蛋<\/td>\n<td>3 个<\/td>\n<td>室温蛋更好打散<\/td>\n<\/tr>\n<tr>\n<td>蒜<\/td>\n<td>2 瓣<\/td>\n<td>切末<\/td>\n<\/tr>\n<tr>\n<td>小葱<\/td>\n<td>1 根<\/td>\n<td>切葱花，可选<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>约 1 小勺（5g）<\/td>\n<td>分两次放<\/td>\n<\/tr>\n<tr>\n<td>蚝油<\/td>\n<td>1 小勺（约 5ml）<\/td>\n<td>提鲜，可选<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>2 汤匙（约 20ml）<\/td>\n<td>分两次用<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点，全程中大火）<\/strong><\/p>\n<p><strong>第 1 步 · 处理西葫芦<\/strong><\/p>\n<ol>\n<li>西葫芦洗净，切掉两头。嫩瓜可以不去皮，直接对半切再切成约 2~3mm 的半月形薄片。<\/li>\n<li>切好后不用泡水（它不像丝瓜会发黑），先放一边备用。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 打鸡蛋<\/strong><\/p>\n<ol start=\"3\">\n<li>鸡蛋打进碗里，加 1 小撮盐，快速搅打 30 秒，打到蛋液起细泡、看不出蛋白蛋黄分层。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 炒鸡蛋<\/strong><\/p>\n<ol start=\"4\">\n<li>锅烧热倒 1 汤匙油，油微冒烟转中火，倒入蛋液划散，炒约 40~60 秒，看到鸡蛋刚定型、嫩黄色 → 盛出备用。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 炒西葫芦<\/strong><\/p>\n<ol start=\"5\">\n<li>锅里再补 1 汤匙油，下蒜末爆香约 10 秒，闻到蒜香就下西葫芦片。<\/li>\n<li>大火翻炒约 2 分钟，看到西葫芦边缘开始变透明、整体变软一点 → 说明快熟了。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 合炒出锅<\/strong><\/p>\n<ol start=\"7\">\n<li>倒回鸡蛋，加盐和蚝油，翻炒均匀约 30 秒。<\/li>\n<li>尝一口，西葫芦断生（刚熟、还带点脆）、没有生味 → 撒葱花，关火出锅。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>炒成一滩水<\/strong>：西葫芦含水多，火太小、炒太久或者盐放太早都会大量出汤。正确做法是大火快炒、出锅前才放盐。<\/li>\n<li><strong>西葫芦软塌没口感<\/strong>：炒过头了。断生（刚熟还带脆）就出锅，不要等它彻底软烂。<\/li>\n<li><strong>鸡蛋炒老了<\/strong>：和丝瓜炒蛋、苦瓜炒蛋一样，鸡蛋单独先炒、刚凝固就盛出，最后回锅合一下。<\/li>\n<li><strong>有生蒜味 / 有瓜腥味<\/strong>：蒜末没爆香就下瓜。闻到蒜香再下西葫芦，多炒半分钟腥味就没了。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/107094968/\">下厨房 · 西葫芦炒鸡蛋（下饭菜）<\/a> —— 家常下饭做法，适合对照「初学版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1Sx42127wF/\">这个季节一定要吃西葫芦炒鸡蛋，做法好吃又下饭！（哔哩哔哩）<\/a> —— 步骤简单，适合新手跟做<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：去瓤 / 盐腌杀水 / 先炒蛋后炒瓜 / 提鲜）<\/h2>\n<p>在初学版基础上，掌握下面几点，西葫芦会更脆嫩、成菜不汪汤。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 老瓜去瓤<\/strong><\/p>\n<ol>\n<li>如果西葫芦偏老、中间的籽已经发硬，就先竖着对半切开，用小勺把中间带籽的软瓤挖掉再切片——瓤是出水和软烂的元凶。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 盐腌杀水（控汤关键）<\/strong><\/p>\n<ol start=\"2\">\n<li>切好的西葫芦片撒 1/2 小勺盐，抓匀腌 5~10 分钟，看到西葫芦变软、碗底渗出水分 → 用清水冲一下再挤干。<\/li>\n<li>挤干后再下锅，炒的时候就不会汪一盘子汤。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 先炒蛋、后炒瓜<\/strong><\/p>\n<ol start=\"4\">\n<li>鸡蛋先单独滑炒到七成熟盛出，西葫芦单独大火炒到断生，最后再合炒——分开受热，鸡蛋嫩、西葫芦脆。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 蚝油 / 生抽提鲜<\/strong><\/p>\n<ol start=\"5\">\n<li>合炒时加 1 小勺蚝油（或几滴生抽），再加 1/2 小勺糖，把西葫芦的清甜和鸡蛋的鲜香提出来。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/103965288/\">下厨房 · 简单快手西葫芦炒鸡蛋<\/a> —— 强调控水与快手，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「西葫芦脆嫩透亮、鸡蛋滑嫩、干香无汤、出锅带锅气」。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 滑炒鸡蛋（热锅凉油）<\/strong><\/p>\n<ol>\n<li>空锅烧到冒烟，倒油后转中火（热锅凉油防粘），下蛋液，用铲子从外圈往里推，推到蛋液大半凝固、中心半流动 → 立刻盛出。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 大火快炒西葫芦<\/strong><\/p>\n<ol start=\"2\">\n<li>锅补半汤匙油，大火烧到油冒烟，下蒜末爆香，闻到焦香下西葫芦片。<\/li>\n<li>颠锅或快速翻炒约 1 分钟，看到西葫芦边缘透明、整体油亮翠绿 → 立刻转小火（宁可欠一点，也别炒软）。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 合炒出锅<\/strong><\/p>\n<ol start=\"4\">\n<li>鸡蛋回锅，加盐、糖和 1 小勺蚝油，转大火再翻炒 20 秒。<\/li>\n<li>看到盘底没有多余汤汁、西葫芦裹着薄薄油光 → 立刻离火装盘（锅气 = 高温快炒的焦香，趁热吃才香）。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.bilibili.com/video/BV1uG2jBGEru/\">极简式教程，西葫炒鸡蛋，小白轻松做（哔哩哔哩）<\/a> —— 讲得利落、锅气足，适合对照「大厨版」<\/li>\n<\/ul>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "25", "name": "醋溜绿豆芽", "title": "醋溜绿豆芽", "category": "蔬菜", "ingredient": "豆芽", "ings": [["绿豆芽"], ["干辣椒"], ["蒜"], ["小葱"], ["花椒"], ["白醋", "香醋", "米醋"], ["生抽"], ["盐"], ["白糖"], ["食用油"]], "opt": [false, true, false, false, true, false, false, false, true, false], "tags": [], "html": "<h1>醋溜绿豆芽<\/h1>\n<blockquote>\n<p>归属食材：豆芽 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>便宜快手的一盘酸辣脆爽小炒，成败全在「大火快炒、出锅前淋醋」——炒慢了豆芽出水变软，就成煮豆芽了。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、够脆、不难吃）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>绿豆芽<\/td>\n<td>约 400g（一大把）<\/td>\n<td>挑根白茎挺、不发软不发黄的<\/td>\n<\/tr>\n<tr>\n<td>干辣椒<\/td>\n<td>3~4 个<\/td>\n<td>剪段，怕辣可去籽（可选，可不放）<\/td>\n<\/tr>\n<tr>\n<td>蒜<\/td>\n<td>2 瓣<\/td>\n<td>切片<\/td>\n<\/tr>\n<tr>\n<td>小葱<\/td>\n<td>1 根<\/td>\n<td>切段，出锅前撒<\/td>\n<\/tr>\n<tr>\n<td>花椒<\/td>\n<td>1 小撮（约 20 粒）<\/td>\n<td>炸香后捞出（可选）<\/td>\n<\/tr>\n<tr>\n<td>白醋（或香醋 / 米醋）<\/td>\n<td>2 汤匙（约 20ml）<\/td>\n<td>分两次用，是「酸」的来源<\/td>\n<\/tr>\n<tr>\n<td>生抽<\/td>\n<td>1 小勺（约 5ml）<\/td>\n<td>提咸鲜<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>约 1/2 小勺（2g）<\/td>\n<td>最后调味<\/td>\n<\/tr>\n<tr>\n<td>白糖<\/td>\n<td>1/2 小勺（约 2g）<\/td>\n<td>提鲜、中和酸辣（可选）<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>2 汤匙（约 20ml）<\/td>\n<td>分两次用<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点，全程大火快炒）<\/strong><\/p>\n<p><strong>第 1 步 · 洗豆芽沥干<\/strong><\/p>\n<ol>\n<li>豆芽放进清水里漂洗 2 遍，洗掉杂质，捞起来彻底沥干——水多下锅就变成「煮豆芽」了。<\/li>\n<li>讲究的话可以掐掉根须，不掐也不影响口感。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 备配料<\/strong><\/p>\n<ol start=\"3\">\n<li>干辣椒剪成小段（怕辣就抖掉籽），蒜切片，葱切段。<\/li>\n<li>白醋、生抽、盐、糖都摆在手边——这道菜炒起来很快，料要先备齐。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 炸花椒<\/strong><\/p>\n<ol start=\"5\">\n<li>锅烧热后倒 1 汤匙油，转小火，下花椒慢慢炸。<\/li>\n<li>炸约 30 秒，看到花椒颜色变深、闻到明显麻香 → 把花椒捞出扔掉，只留油。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 爆香<\/strong><\/p>\n<ol start=\"7\">\n<li>转中大火，下干辣椒段和蒜片，快速翻炒约 10 秒，闻到辣香和蒜香就停（别让辣椒炒黑发苦）。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 大火快炒出锅<\/strong><\/p>\n<ol start=\"8\">\n<li>转最大火，倒入沥干的豆芽，快速翻炒约 30 秒 ~ 1 分钟。<\/li>\n<li>沿锅边淋入一半白醋，加盐、糖、生抽，继续翻炒约 30 秒。<\/li>\n<li>夹一根尝尝：熟了仍脆、不发软 → 沿锅边再淋剩下的一半白醋，撒葱段，翻两下关火出锅。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>豆芽出水、变成煮豆芽<\/strong>：没沥干就下锅、火不够大，或者炒得太久。记住「沥干 + 全程最大火 + 断生就出锅」。<\/li>\n<li><strong>不脆发软<\/strong>：醋放太早被炒挥发、没保脆作用，或者久炒。正确做法是分两次放：中途淋一半、出锅前再淋一半。<\/li>\n<li><strong>醋味太冲 / 没醋味<\/strong>：醋放太早会挥发变淡、放太晚又刺鼻，分两次放刚好。<\/li>\n<li><strong>辣椒炒糊发苦<\/strong>：干辣椒不能在大火热油里久炒，油温别太高时下辣椒，或先关小火再下。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/102157960/\">下厨房 · 醋溜银芽（绿豆芽）<\/a> —— 大火快炒、锅边淋醋的经典做法，适合对照「初学版」<\/li>\n<li><a href=\"http://m-pr.douguo.com/cookbook/3250846.html\">豆果美食 · 醋溜绿豆芽（阳春白雪）<\/a> —— 图文步骤清楚，强调豆芽控水和快炒<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：断生即出 / 锅边醋分两次 / 盐后放 / 白糖提鲜）<\/h2>\n<p>在初学版基础上，掌握下面几条，成品质感会上一个台阶。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 豆芽「断生即出」<\/strong><\/p>\n<ol>\n<li>豆芽下锅后炒到体积刚变软一点点、颜色由半透明变白亮就出锅——「断生」就是刚熟、还带脆，余温会把它烘到刚好。<\/li>\n<li>多炒 30 秒豆芽就会回软出水，所以手要快。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 锅边醋分两次（灵魂）<\/strong><\/p>\n<ol start=\"3\">\n<li>第一次：豆芽刚下锅时烹少量醋——去豆腥、帮忙保脆，酸味先渗进去。<\/li>\n<li>第二次：出锅前 10~20 秒沿锅边淋剩下的醋——锅边温度最高，醋一接触就挥发掉冲味、只留醋香。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 盐最后放<\/strong><\/p>\n<ol start=\"5\">\n<li>盐放太早会让豆芽出水、口感发蔫，出锅前再放，尝过咸淡再定。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 白糖提鲜<\/strong><\/p>\n<ol start=\"6\">\n<li>加一点点糖（吃不出甜味的量），中和醋的尖酸和干辣椒的燥辣，让酸辣更圆润。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"http://mwx.douguo.com/cookbook/3290843.html\">豆果美食 · 醋溜绿豆芽怎么做（图文步骤）<\/a> —— 视频版，讲清锅边醋和大火快炒的节奏<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「根根挺脆、酸香扑鼻、出锅带锅气」。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 热锅凉油<\/strong><\/p>\n<ol>\n<li>先空锅烧到微微冒烟，再倒油，油热再下料——「热锅凉油」能让豆芽不粘锅、锅气更足。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 花椒油提香<\/strong><\/p>\n<ol start=\"2\">\n<li>冷油小火下花椒，炸约 1 分钟，看到花椒变棕红色 → 捞出。<\/li>\n<li>用这锅花椒油炒菜，麻香是普通油比不了的。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 蒜分两次放<\/strong><\/p>\n<ol start=\"4\">\n<li>爆香用蒜片，炒出底香。<\/li>\n<li>出锅前再撒一点生蒜末，翻两下——生蒜的辛香和熟蒜的醇香叠在一起。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 锅气<\/strong><\/p>\n<ol start=\"6\">\n<li>全程最大火、不盖盖，出锅前沿锅边淋醋、立刻离火，颠两下装盘——锅气（高温 + 快炒带来的焦香）凉了就散。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.bilibili.com/video/BV14r4y1h7P3/\">哔哩哔哩 · 红烧肉醋溜豆芽儿拌饭<\/a> —— 含醋溜豆芽的锅边溜醋做法段落，适合对照「大厨版」（点开核对是否含完整豆芽步骤）<\/li>\n<\/ul>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "26", "name": "干煸豆角", "title": "干煸豆角（干煸四季豆）", "category": "蔬菜", "ingredient": "豆角", "ings": [["豆角", "四季豆", "豇豆"], ["猪肉末"], ["干辣椒"], ["花椒"], ["大蒜"], ["姜"], ["盐"], ["生抽"], ["白糖"], ["食用油"]], "opt": [false, true, false, false, false, false, false, false, false, false], "tags": [], "html": "<h1>干煸豆角（干煸四季豆）<\/h1>\n<blockquote>\n<p>归属食材：豆角 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>川味下饭神菜，豆角外皮微皱、干香入味，配干辣椒和肉末越嚼越香。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g。<\/p>\n<p>安全提示：豆角必须彻底做熟。生豆角含皂苷和血球凝集素，没熟透会引起不适，宁可多炒一会儿。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、不难吃）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>豆角（四季豆/豇豆均可）<\/td>\n<td>约 300g<\/td>\n<td>挑细长、豆粒不鼓的，嫩<\/td>\n<\/tr>\n<tr>\n<td>猪肉末<\/td>\n<td>50g（可选）<\/td>\n<td>不放也行，可做纯素版<\/td>\n<\/tr>\n<tr>\n<td>干辣椒<\/td>\n<td>3~4 个<\/td>\n<td>剪成小段<\/td>\n<\/tr>\n<tr>\n<td>花椒<\/td>\n<td>1 小撮（约 1g）<\/td>\n<td>麻香来源<\/td>\n<\/tr>\n<tr>\n<td>大蒜<\/td>\n<td>3 瓣<\/td>\n<td>切末<\/td>\n<\/tr>\n<tr>\n<td>姜<\/td>\n<td>1 小片<\/td>\n<td>切末<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>约 1/2 小勺（2g）<\/td>\n<td>分两次放<\/td>\n<\/tr>\n<tr>\n<td>生抽<\/td>\n<td>1 汤匙（约 15ml）<\/td>\n<td>调味<\/td>\n<\/tr>\n<tr>\n<td>白糖<\/td>\n<td>1 小勺（约 5g）<\/td>\n<td>提鲜<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>3 汤匙（约 30ml）<\/td>\n<td>豆角吸油<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 处理豆角<\/strong><\/p>\n<ol>\n<li>掐掉豆角两头，撕掉两侧的老筋，掰成约 6cm 的段。<\/li>\n<li>洗净后一定沥干水分（带水进锅会溅油）。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 煸豆角<\/strong><\/p>\n<ol start=\"3\">\n<li>锅烧热，倒 3 汤匙油，油温五成热（筷子伸进去周围冒小泡）下豆角。<\/li>\n<li>中小火慢慢煸，期间不断翻动，煸约 5~8 分钟。<\/li>\n<li>看到豆角表皮起皱、颜色变深、出现「虎皮」纹 → 熟了（判断标准：整体变软塌、没有生豆角的硬脆感）。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 盛出豆角<\/strong><\/p>\n<ol start=\"6\">\n<li>煸好的豆角盛出，油留在锅里。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 炒香料<\/strong><\/p>\n<ol start=\"7\">\n<li>锅里的底油烧热，下肉末炒散，炒约 1 分钟，看到微微发白、出油。<\/li>\n<li>再下干辣椒段、花椒、蒜末、姜末，小火炒约 30 秒，闻到香味就停（别把辣椒炒糊）。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 回锅调味<\/strong><\/p>\n<ol start=\"9\">\n<li>把豆角倒回锅里，加生抽、白糖和盐，开大火快速翻炒约 1 分钟，让每根豆角都裹上调料。<\/li>\n<li>尝一口咸淡，不够再加盐，关火出锅。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>豆角没熟<\/strong>：只煸了几分钟、豆角还是脆的就出锅。宁可多煸几分钟，表皮起皱、变软才是熟了。<\/li>\n<li><strong>豆角发黑发苦<\/strong>：油温太高、火太大把豆角炒焦。中小火慢慢煸，勤翻动。<\/li>\n<li><strong>辣椒花椒炒糊<\/strong>：香料下锅后火太大。这一步要转小火，出香味就下豆角。<\/li>\n<li><strong>不入味<\/strong>：回锅后炒得太快、时间太短。加调料后大火翻炒 1 分钟，让味道裹上去。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"http://mwx.douguo.com/cookbook/3018014.html\">豆果美食 · 干煸豆角<\/a> —— 家常易上手，适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：少油煸 / 干煸原理 / 调味）<\/h2>\n<p>在初学版基础上，掌握下面几条，成品质感会上一个台阶。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 「煸」到底是什么<\/strong><\/p>\n<ol>\n<li>「干煸」= 用油慢慢把食材里的水分煸干，表皮收缩起皱、香味浓缩。<\/li>\n<li>煸到位（表面起皱）才挂得住调料——豆角不入味是很多人失败的原因。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 少油版（怕油就选这个）<\/strong><\/p>\n<ol start=\"3\">\n<li>豆角洗净控干后，<strong>不放油<\/strong>先下锅，中小火干炒 3~4 分钟，把表面水汽炒掉、豆角变蔫。<\/li>\n<li>拨到锅边，中间倒 1 汤匙油，继续煸到起皱——用油量只有初学版的一半，更清爽。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 蒜末分两次放<\/strong><\/p>\n<ol start=\"5\">\n<li>一半蒜末跟干辣椒一起下锅爆香。<\/li>\n<li>另一半在<strong>关火前 10 秒<\/strong>才撒进去——既有熟蒜的香，又有生蒜的冲，层次更足。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 调味配比<\/strong><\/p>\n<ol start=\"7\">\n<li>生抽 : 糖 : 盐 ≈ 1 汤匙 : 1 小勺 : 1/2 小勺；喜欢重口加半勺豆瓣酱或老干妈，一起炒出红油。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/107795482/\">下厨房 · 少油版干煸四季豆（详细不踩雷）<\/a> —— 少油不油腻，适合对照「进阶版」少油煸<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1JbyUYWEKK/\">家常版干煸豆角（哔哩哔哩）BV1JbyUYWEKK<\/a> —— 少油健康版，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「豆角虎皮完整、肉末干香酥松、麻辣回甜带镬气」。每一步都是细节。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 豆角「炸煸」出虎皮<\/strong><\/p>\n<ol>\n<li>传统川菜版：油烧到七成热（油面冒青烟），下豆角炸约 2~3 分钟。<\/li>\n<li>看到表皮起皱、颜色转深 → 捞出沥油（炸比煸快、虎皮更均匀，但用油多、热量高）。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 肉末要「煸酥」<\/strong><\/p>\n<ol start=\"3\">\n<li>肉末下锅后先摊平煎 30 秒，再拨散。<\/li>\n<li>小火慢慢煸约 2 分钟，看到肉末吐油、变得干香酥松 → 这是「干香」的灵魂。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 香料炝出「糊辣香」<\/strong><\/p>\n<ol start=\"5\">\n<li>干辣椒剪段后先用水泡 5 分钟、沥干（下锅不容易糊）。<\/li>\n<li>油里先炝花椒出麻香，再下干辣椒段，保持小火，看到辣椒颜色变深、香气冲鼻 → 下豆角。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 收尾「提亮」<\/strong><\/p>\n<ol start=\"7\">\n<li>回锅后沿锅边淋 1 小勺香醋（或生抽），大火颠炒，醋香挥发后只留香气。<\/li>\n<li>出锅前撒白芝麻和葱花，趁热上桌。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/102223253/\">下厨房 · 干煸豆角<\/a> —— 传统炸煸版，适合对照「大厨版」<\/li>\n<\/ul>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "27", "name": "虎皮青椒", "title": "虎皮青椒", "category": "蔬菜", "ingredient": "青椒", "ings": [["青椒"], ["蒜"], ["生抽"], ["香醋"], ["白糖"], ["盐"], ["食用油"]], "opt": [false, false, false, true, false, false, false], "tags": [], "html": "<h1>虎皮青椒<\/h1>\n<blockquote>\n<p>归属食材：青椒 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>川湘家常下饭菜，青椒煎出金黄「虎皮」，配蒜末豆豉酱香微辣，皮皱肉软、汁浓下饭。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、不难吃）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>青椒<\/td>\n<td>5~6 个（约 300g）<\/td>\n<td>选皮薄、肉厚、不太辣的薄皮青椒或螺丝椒<\/td>\n<\/tr>\n<tr>\n<td>蒜<\/td>\n<td>3 瓣<\/td>\n<td>切末<\/td>\n<\/tr>\n<tr>\n<td>生抽<\/td>\n<td>1 汤匙（约 15ml）<\/td>\n<td>提咸鲜<\/td>\n<\/tr>\n<tr>\n<td>香醋<\/td>\n<td>1 小勺（约 5ml）<\/td>\n<td>提香解腻，可选<\/td>\n<\/tr>\n<tr>\n<td>白糖<\/td>\n<td>1/2 小勺（约 2g）<\/td>\n<td>中和辣味、提鲜<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>1 小撮<\/td>\n<td>最后按需补<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>2 汤匙（约 20ml）<\/td>\n<td>煎青椒用<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点，全程中小火）<\/strong><\/p>\n<p><strong>第 1 步 · 处理青椒<\/strong><\/p>\n<ol>\n<li>青椒洗净，去蒂去籽（怕辣可把白色内筋也撕掉）。<\/li>\n<li>用刀背或手掌把青椒拍扁、拍裂，方便受热起虎皮。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 煎虎皮<\/strong><\/p>\n<ol start=\"3\">\n<li>锅烧热倒 1 汤匙油，中小火放入青椒，边煎边用锅铲按压，让青椒贴紧锅底。<\/li>\n<li>一面煎约 2~3 分钟，看到焦黄虎皮 → 翻面。<\/li>\n<li>再煎另一面，直到青椒整体变软、两面起皱。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 爆香调味<\/strong><\/p>\n<ol start=\"6\">\n<li>把青椒拨到锅边，补 1 汤匙油，放蒜末小火炒香（约 20 秒）。<\/li>\n<li>把青椒拌回来，淋生抽、香醋、白糖，翻炒均匀约 30 秒。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 出锅<\/strong><\/p>\n<ol start=\"8\">\n<li>尝一口咸淡，不够咸补一点点盐，关火装盘。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>青椒煎糊发苦<\/strong>：火太大或一直不翻面。全程中小火，勤翻、勤按压。<\/li>\n<li><strong>不起虎皮<\/strong>：青椒没拍扁、油温不够或没按压。拍扁 + 热锅 + 按压三件套。<\/li>\n<li><strong>太咸<\/strong>：生抽本身有咸味，先别急着加盐，最后尝了再补。<\/li>\n<li><strong>出水太多变成煮椒<\/strong>：锅要够热、油要够，中途不要加水。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/107206202/\">下厨房 · 家庭版虎皮青椒<\/a> —— 步骤简单、用料家常，适合对照「初学版」<\/li>\n<li><a href=\"https://www.douguo.com/cookbook/3328588.html\">豆果美食 · 春食素界顶流 清香软糯下饭｜保姆级教程<\/a> —— 强调选皮薄不辣的青椒，适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：干煸 / 豆豉 / 碗汁 / 选椒）<\/h2>\n<p>在初学版基础上，掌握下面四条，成品的香和层次会明显上一个台阶。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 先干煸再加油<\/strong><\/p>\n<ol>\n<li>青椒先不放油，干锅煸 1 分钟，煸掉表面水汽、逼出清香味。<\/li>\n<li>再补油煎虎皮——虎皮更香、口感更干爽。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 加豆豉增香<\/strong><\/p>\n<ol start=\"3\">\n<li>蒜末里加 1 小勺阳江豆豉（或老干妈豆豉），小火炒香——酱香更浓，层次感翻倍。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 提前调碗汁<\/strong><\/p>\n<ol start=\"4\">\n<li>小碗里放生抽 1 汤匙 + 老抽几滴 + 香醋 1 小勺 + 糖 1/2 小勺 + 蚝油 1 小勺 + 清水 2 汤匙，搅匀。<\/li>\n<li>一次倒入，味道更均匀、不易手忙脚乱。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 选椒<\/strong><\/p>\n<ol start=\"6\">\n<li>选薄皮青椒更容易起虎皮：螺丝椒、杭椒偏辣，大青椒不辣；皮薄肉嫩是首选，太厚的圆椒不容易煎出好看的虎皮。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/107593544/\">下厨房 · 虎皮青椒（调碗汁版，木子李_520）<\/a> —— 先调碗汁再煸炒，适合对照「进阶版」的调味方式<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1DE411Y7VL/\">一把青椒和 2 个鸡蛋，川菜师傅教你新吃法（哔哩哔哩）<\/a> —— 川菜师傅手法，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「虎皮金黄焦香、酱香干爽不水、出锅有锅气」。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 空锅烧透再下油<\/strong><\/p>\n<ol>\n<li>空锅烧到冒青烟，再下油，油六成热下青椒。<\/li>\n<li>大火快煎，用锅铲背面按压，让每块青椒贴紧锅底形成焦香虎皮（全程约 1.5 分钟）——快而不糊。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 用猪油煸五花肉末打底<\/strong><\/p>\n<ol start=\"3\">\n<li>少量五花肉末先下锅，煸出油脂。<\/li>\n<li>用猪油 + 豆豉 + 蒜末爆香——这是「干香不水」的底味来源，比纯素油更香。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 只放生抽 + 蚝油，不加水不勾芡<\/strong><\/p>\n<ol start=\"5\">\n<li>调味只放生抽和蚝油，不加糖醋水、不勾芡。<\/li>\n<li>大火颠炒约 20 秒，让酱香裹满，保持虎皮干香口感。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 出锅前沿锅边炝醋<\/strong><\/p>\n<ol start=\"7\">\n<li>关火前沿锅边淋几滴香醋「炝」一下，激出香气，趁热吃最香——凉了锅气就散了。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.bilibili.com/video/BV1vY411Q7FV/\">你做的虎皮辣椒炒对了吗？大厨教你正确做法（哔哩哔哩）<\/a> —— 香辣过瘾，适合对照「大厨版」的锅气处理<\/li>\n<\/ul>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "28", "name": "韭菜炒蛋", "title": "韭菜炒蛋", "category": "蔬菜", "ingredient": "韭菜", "ings": [["韭菜"], ["鸡蛋"], ["盐"], ["食用油"], ["生抽"]], "opt": [false, false, false, false, true], "tags": [], "html": "<h1>韭菜炒蛋<\/h1>\n<blockquote>\n<p>归属食材：韭菜 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>春天最鲜的一口，韭菜辛香、鸡蛋滑嫩，几分钟出锅，拌饭单吃都香。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、不难吃）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>韭菜<\/td>\n<td>1 把（约 200g）<\/td>\n<td>挑叶子挺立、根部白净的，别选发蔫发黄的<\/td>\n<\/tr>\n<tr>\n<td>鸡蛋<\/td>\n<td>3 个（约 150g）<\/td>\n<td>常温蛋更好打散<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>约 1/2 小勺（2g）<\/td>\n<td>分两次放，盐后放不易出水<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>2 汤匙（约 20ml）<\/td>\n<td>分两次用<\/td>\n<\/tr>\n<tr>\n<td>生抽（可选）<\/td>\n<td>几滴<\/td>\n<td>提鲜，也可不加<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点，全程大火快炒）<\/strong><\/p>\n<p><strong>第 1 步 · 备菜<\/strong><\/p>\n<ol>\n<li>韭菜摘去黄叶烂叶，洗净后一定沥干水分（带水进锅会炒成汤）。<\/li>\n<li>切成约 4cm 的段。<\/li>\n<li>鸡蛋磕进碗里，加 1 小撮盐（约 1g），用筷子朝一个方向打散，打到蛋清蛋黄完全融合、表面起细沫。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 炒蛋<\/strong><\/p>\n<ol start=\"4\">\n<li>锅烧热，倒 1 汤匙油，晃动锅让油铺满锅底。<\/li>\n<li>等约 10 秒，看到油微微冒烟 → 倒入蛋液，先别急着动。<\/li>\n<li>等约 15 秒，看到底部凝固 → 用铲子从外往里轻轻推，让没凝固的蛋液流到锅底。<\/li>\n<li>鸡蛋基本成型、还带一点湿润 → 盛出备用。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 炒韭菜<\/strong><\/p>\n<ol start=\"8\">\n<li>锅里补剩下的 1 汤匙油，油热后倒入韭菜段。<\/li>\n<li>开最大火快速翻炒约 30 秒，看到韭菜明显变软、颜色变深一点就停（别炒过头，否则出水发黄）。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 合炒出锅<\/strong><\/p>\n<ol start=\"10\">\n<li>把炒好的鸡蛋倒回锅里，加剩下的盐（约 1g）。<\/li>\n<li>大火快速翻拌约 20 秒，让鸡蛋裹上韭菜香。<\/li>\n<li>尝一口咸淡，不够再加一点，关火出锅，趁热吃。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>韭菜出汤<\/strong>：韭菜没沥干水、盐放太早、或炒太久。记住「大火快炒 + 盐后放」，一出锅就关火。<\/li>\n<li><strong>鸡蛋炒老<\/strong>：蛋液一进锅就不断翻炒。记住「还带一点湿润就盛」，余温会把蛋烘到刚好。<\/li>\n<li><strong>韭菜炒黄发蔫<\/strong>：火太小、时间太长。韭菜一定要大火快炒，30 秒左右就够。<\/li>\n<li><strong>粘锅<\/strong>：锅没烧热就下蛋。先烧热锅再放油、油热再下料，就不易粘。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/107561888/\">下厨房 · 韭菜炒蛋的做法步骤图（差不多姐姐）<\/a> —— 步骤图清楚，适合对照「初学版」<\/li>\n<li><a href=\"https://www.xiachufang.com/recipe/107474223/\">下厨房 · 韭菜炒蛋（年年美食成长记）<\/a> —— 用量简单，适合对照「初学版」比例<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1Qe4y1g7bA/\">韭菜炒鸡蛋（哔哩哔哩）BV1Qe4y1g7bA<\/a> —— 简单易学，适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：先炒蛋后炒韭菜 / 分茎叶 / 不出水）<\/h2>\n<p>在初学版基础上，掌握下面几条，成品质感会上一个台阶。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 为什么「先炒蛋、后炒韭菜」<\/strong><\/p>\n<ol>\n<li>蛋和韭菜分开炒（蛋要定型、韭菜只要几十秒，一起炒容易蛋老或韭菜不熟）。<\/li>\n<li>鸡蛋盛出时保留「八成熟、还带一点流动」，回锅后余温刚好把它烘到全熟。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 韭菜分茎叶下锅<\/strong><\/p>\n<ol start=\"3\">\n<li>韭菜靠近根部的「白茎」先下锅，炒约 10 秒。<\/li>\n<li>再下绿叶段一起炒，两段熟度一致，口感更好。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 蛋液里加点料<\/strong><\/p>\n<ol start=\"5\">\n<li>打蛋时加 1 小勺清水 + 几滴白醋（或料酒），打到起细泡——水让蛋更蓬松，白醋去蛋腥。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 调味顺序<\/strong><\/p>\n<ol start=\"6\">\n<li>盐放在最后合炒时放（甚至出锅前才放）——盐放早了会「杀」出韭菜的水分，整盘就变成水煮韭菜。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://home.meishichina.com/recipe-352442.html\">美食天下 · 韭菜炒鸡蛋<\/a> —— 有技巧说明，适合对照「进阶版」控水<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「韭菜碧绿挺拔、鸡蛋金黄蓬松、出锅带镬气」。每一步都是细节。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 锅要烧透、油要够热<\/strong><\/p>\n<ol>\n<li>空锅烧到冒青烟再下油，油热到七成（油面明显波动、微微冒烟），再下蛋液——蛋下锅瞬间快速蓬起，才出「蛋香」。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 鸡蛋——蓬松的关键<\/strong><\/p>\n<ol start=\"2\">\n<li>3 个蛋加 1/4 小勺盐、几滴白醋、1 小勺清水，顺一个方向打到表面全是细泡（约 1 分钟）。<\/li>\n<li>蛋液入锅，用锅铲 <strong>背面<\/strong> 从四周向中间迅速兜散，<strong>刚断生就离火盛出<\/strong>（全程约 20 秒，宁可稍生不可炒老）。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 韭菜「断生即出」<\/strong><\/p>\n<ol start=\"4\">\n<li>韭菜下锅后只翻三四下，看到叶片刚软、还带一点脆劲 → 立刻回锅鸡蛋（前后不超过 30 秒）。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 出锅前「点锅气」<\/strong><\/p>\n<ol start=\"5\">\n<li>沿锅边淋几滴生抽（可选），大火颠两下，让酱香和蛋香、韭香混合。<\/li>\n<li>关火前滴几滴香油，趁热上桌——凉了锅气就散了。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.bilibili.com/video/BV17S4y1U73S/\">《韭菜炒蛋》的烧制流程（哔哩哔哩）BV17S4y1U73S<\/a> —— 强调手速与火候，适合对照「大厨版」<\/li>\n<\/ul>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "29", "name": "拍黄瓜", "title": "拍黄瓜", "category": "蔬菜", "ingredient": "黄瓜", "ings": [["黄瓜"], ["大蒜"], ["盐"], ["白糖"], ["生抽"], ["陈醋"], ["香油"], ["辣椒油"]], "opt": [false, false, false, false, false, false, false, true], "tags": [], "html": "<h1>拍黄瓜<\/h1>\n<blockquote>\n<p>归属食材：黄瓜 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>最省事的凉菜，蒜香酸爽、脆嫩开胃，成败在「拍」和「蒜泥」。以下按三档给出做法。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能拌、爽口、不难吃）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>黄瓜<\/td>\n<td>2 根（约 300g）<\/td>\n<td>选刺密、硬挺的，水分足<\/td>\n<\/tr>\n<tr>\n<td>大蒜<\/td>\n<td>3 瓣<\/td>\n<td>捣成蒜泥，不是蒜末<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>约 1/2 小勺（2g）<\/td>\n<td>腌黄瓜出水用<\/td>\n<\/tr>\n<tr>\n<td>白糖<\/td>\n<td>1/2 小勺（约 2g）<\/td>\n<td>提鲜<\/td>\n<\/tr>\n<tr>\n<td>生抽<\/td>\n<td>1 汤匙（约 15ml）<\/td>\n<td>提咸鲜<\/td>\n<\/tr>\n<tr>\n<td>陈醋<\/td>\n<td>1 汤匙（约 15ml）<\/td>\n<td>酸味来源<\/td>\n<\/tr>\n<tr>\n<td>香油<\/td>\n<td>1 小勺（约 5ml）<\/td>\n<td>提香<\/td>\n<\/tr>\n<tr>\n<td>辣椒油<\/td>\n<td>1 小勺（可选）<\/td>\n<td>喜欢辣就加<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 拍黄瓜<\/strong><\/p>\n<ol>\n<li>黄瓜洗净，切掉头尾。<\/li>\n<li>用刀背（或擀面杖）把整根黄瓜拍裂、拍扁，再斜切成约 3cm 的段——裂纹能挂住料汁，比刀切更入味。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 腌出水<\/strong><\/p>\n<ol start=\"3\">\n<li>把黄瓜段放进碗里，撒盐拌匀，腌 5~10 分钟。<\/li>\n<li>看到碗底有汁水渗出 → 把水倒掉（这一步让黄瓜更脆、后面不容易出汤）。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 捣蒜泥<\/strong><\/p>\n<ol start=\"5\">\n<li>蒜瓣加一点点盐，用捣蒜器（或刀背压碎再剁）捣成黏糊的蒜泥——蒜泥能附着在黄瓜上，蒜末会掉下来、香味差很多。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 拌汁装盘<\/strong><\/p>\n<ol start=\"6\">\n<li>把蒜泥、生抽、陈醋、白糖、香油（和辣椒油）调成汁，倒进黄瓜里拌匀。<\/li>\n<li>想吃凉的可以盖保鲜膜，放冰箱冷藏 10 分钟再吃。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>黄瓜出水、越拌越淡<\/strong>：没先用盐腌出水。先腌、倒掉汁，再拌调味汁。<\/li>\n<li><strong>蒜味不浓<\/strong>：用了蒜末而不是蒜泥。蒜泥加盐捣出来，才能牢牢挂在黄瓜上。<\/li>\n<li><strong>太咸 / 太酸<\/strong>：盐先只用来腌（倒掉），调味汁里生抽本身咸，尝过再决定加不加盐；醋少量多次。<\/li>\n<li><strong>不入味<\/strong>：拌好就急着吃。冷藏 10 分钟或现拌现吃前稍微等两分钟，味道会进去。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/104105787/\">下厨房 · 王一博版拍黄瓜<\/a> —— 强调「越陈越香」的陈醋，适合对照「初学版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1RV41167WV/\">【小高姐】拍黄瓜（哔哩哔哩）<\/a> —— 蒜泥拍黄瓜经典做法，讲解清晰<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：拍 / 腌水 / 蒜泥 / 现拌现吃）<\/h2>\n<p>在初学版基础上，掌握下面几条，成品质感会上一个台阶。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 拍比切好（为什么）<\/strong><\/p>\n<ol>\n<li>用拍、别用切——拍裂让黄瓜内部组织松散、断面粗糙，料汁顺着裂纹渗进去；刀切断面太平滑，汁只裹在表面，一口有味一口没味。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 盐腌杀水<\/strong><\/p>\n<ol start=\"2\">\n<li>撒盐腌：盐让黄瓜细胞里的水分先析出，倒掉后黄瓜更脆、更吸味，也能避免拌好后出汤冲淡味道。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 蒜泥（不是蒜末）<\/strong><\/p>\n<ol start=\"3\">\n<li>蒜泥加盐捣——破坏蒜的细胞、释放出蒜素，辛香更浓；质地黏糊，正好「挂」在拍裂的黄瓜上。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 现拌现吃<\/strong><\/p>\n<ol start=\"4\">\n<li>拌好后别久放（醋和盐会持续让黄瓜出水、变软），吃前再拌，或冷藏片刻就上桌。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/106768420/\">下厨房 · 蒜蓉黄瓜拌鸡丝（小高姐的拍黄瓜）<\/a> —— 去瓤 + 盐腌杀水，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与响油）<\/h2>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 蒜泥用盐捣<\/strong><\/p>\n<ol>\n<li>蒜瓣拍扁后加少许盐，用刀背反复压碾成泥——盐既是研磨介质又能出蒜汁，蒜香最足。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 响油激香<\/strong><\/p>\n<ol start=\"2\">\n<li>蒜泥、辣椒碎、白芝麻铺在黄瓜上。<\/li>\n<li>烧一勺油到微微冒烟（七八成热），「刺啦」泼上去——热油瞬间激出蒜香和辣香，味道渗进黄瓜而不是浮在表面。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 去瓤更脆<\/strong><\/p>\n<ol start=\"4\">\n<li>追求极致脆感：黄瓜纵向剖开、刮掉中间的软瓤再拍，减少出水、口感更脆。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 冷藏入味<\/strong><\/p>\n<ol start=\"5\">\n<li>拌好盖保鲜膜，冷藏 10~20 分钟——凉了更爽口，味道也更均匀。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"http://mwx.douguo.com/cookbook/3016317.html\">豆果美食 · 拍黄瓜<\/a> —— 含响油与芝麻酱版本，适合对照「大厨版」<\/li>\n<\/ul>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "30", "name": "柠檬鸡爪", "title": "柠檬鸡爪", "category": "水果", "ingredient": "柠檬", "ings": [["鸡爪"], ["柠檬"], ["姜"], ["料酒"], ["小米辣"], ["蒜"], ["香菜"], ["生抽"], ["香醋", "陈醋"], ["白糖"], ["盐"], ["凉开水", "冰水"]], "opt": [false, false, false, false, false, false, true, false, false, false, false, false], "tags": [], "html": "<h1>柠檬鸡爪<\/h1>\n<blockquote>\n<p>归属食材：柠檬 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>酸辣开胃的凉菜，鸡爪 Q 弹脆爽，柠檬清香解腻，冷藏浸泡入味后更爽口，追剧、下酒都合适。属性：凉菜。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、不难吃）<\/h2>\n<p><strong>食材（约 500g 鸡爪）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>鸡爪<\/td>\n<td>500g<\/td>\n<td>剪去指甲、对半切开<\/td>\n<\/tr>\n<tr>\n<td>柠檬<\/td>\n<td>1 个<\/td>\n<td>用盐搓洗后切片，去籽防苦<\/td>\n<\/tr>\n<tr>\n<td>姜<\/td>\n<td>4~5 片<\/td>\n<td>焯水去腥<\/td>\n<\/tr>\n<tr>\n<td>料酒<\/td>\n<td>2 汤匙<\/td>\n<td>焯水去腥<\/td>\n<\/tr>\n<tr>\n<td>小米辣<\/td>\n<td>3~5 个<\/td>\n<td>切圈，喜辣可加<\/td>\n<\/tr>\n<tr>\n<td>蒜<\/td>\n<td>5~6 瓣<\/td>\n<td>切末<\/td>\n<\/tr>\n<tr>\n<td>香菜<\/td>\n<td>2 根<\/td>\n<td>切段，可选<\/td>\n<\/tr>\n<tr>\n<td>生抽<\/td>\n<td>4 汤匙<\/td>\n<td>咸鲜底味<\/td>\n<\/tr>\n<tr>\n<td>香醋 / 陈醋<\/td>\n<td>3 汤匙<\/td>\n<td>酸味来源<\/td>\n<\/tr>\n<tr>\n<td>白糖<\/td>\n<td>1~2 汤匙<\/td>\n<td>提鲜、中和酸辣<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>1/2 小勺<\/td>\n<td>按口味补<\/td>\n<\/tr>\n<tr>\n<td>凉开水 / 冰水<\/td>\n<td>适量<\/td>\n<td>过凉用，另备料汁用<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 处理鸡爪<\/strong><\/p>\n<ol>\n<li>鸡爪剪去指甲，对半切开（更好入味）。<\/li>\n<li>冷水下锅，加姜片、料酒。<\/li>\n<li>开大火煮开，撇去浮沫。<\/li>\n<li>转中火再煮 10~12 分钟，用筷子能轻松戳穿鸡爪 → 熟了，捞出。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 过凉<\/strong><\/p>\n<ol start=\"5\">\n<li>捞出后立刻放进冰水（或大量凉开水）里泡 10~15 分钟，让鸡爪收缩变脆。<\/li>\n<li>捞出沥干水分。看到鸡爪皮收紧、摸起来弹手 → 过凉到位。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 备料<\/strong><\/p>\n<ol start=\"7\">\n<li>柠檬用盐搓洗表面，切成薄片并去掉籽（去籽防苦）。<\/li>\n<li>小米辣切圈、蒜切末、香菜切段。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 调汁<\/strong><\/p>\n<ol start=\"9\">\n<li>碗里放生抽、香醋、白糖、盐，搅匀到糖完全化开。<\/li>\n<li>加入小米辣、蒜末、柠檬片。<\/li>\n<li>再加能没过鸡爪一半左右的凉开水，搅匀成料汁。尝一口咸酸平衡 → 料汁调好了。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 泡制<\/strong><\/p>\n<ol start=\"12\">\n<li>把鸡爪放进料汁拌匀，密封。<\/li>\n<li>放冰箱冷藏浸泡至少 3~4 小时（隔夜更入味），中途翻拌一两次。泡够时间、鸡爪入味 → 可以吃了。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>鸡爪腥<\/strong>：没焯水或没放姜料酒。冷水下锅、加姜料酒、撇净浮沫是去腥关键。<\/li>\n<li><strong>发苦<\/strong>：柠檬带籽，或柠檬片泡太久（籽和白瓤会释放苦味）。柠檬一定去籽，泡过夜的话吃前把柠檬片挑出。<\/li>\n<li><strong>不脆<\/strong>：煮熟后没过冰水。冰水过凉是 Q 弹的关键一步。<\/li>\n<li><strong>太咸 / 太酸<\/strong>：生抽和醋比例失衡。先按 4 : 3 起步，拌好后尝一下再补，宁淡勿过。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://m.douguo.com/recipe/xiaomi/3354688.html\">豆果美食 · 全网封神的柠檬鸡爪配方！零失败复刻摆摊味道<\/a> —— 精确用量，适合对照「初学版」<\/li>\n<li><a href=\"https://www.xiachufang.com/recipe/103138747/\">下厨房 · 零厨艺做抖音网红柠檬鸡爪<\/a> —— 适合对照「初学版」的醋糖配比<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV13N411h76j/\">网红柠檬鸡爪的制作方法和配料，酸甜开胃，学会可以开店了（哔哩哔哩）<\/a> —— 适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：去骨 / 冰水原理 / 调味平衡 / 浸泡时间）<\/h2>\n<p>在初学版基础上，掌握下面四条，口感和入味都更好。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 去骨（可选）<\/strong><\/p>\n<ol>\n<li>鸡爪煮熟过冰水后，趁还温软时，用小刀沿每根骨头划开。<\/li>\n<li>逐根脱骨，做成「无骨鸡爪」。看到骨肉分离、皮完整 → 去骨完成。<\/li>\n<li>别等过凉太久再动手——皮收紧反而难脱。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 冰水过凉<\/strong><\/p>\n<ol start=\"4\">\n<li>热鸡爪先冲凉水降温。<\/li>\n<li>再入冰水泡 15 分钟以上，让胶原蛋白收紧。看到皮更紧、更弹 → 冰镇到位。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 调味平衡<\/strong><\/p>\n<ol start=\"6\">\n<li>按酸 : 咸 : 甜约 3 : 4 : 2 起步（香醋 3、生抽 4、糖 2），加 1 小勺蚝油提鲜。<\/li>\n<li>可加百香果、洋葱丝、青柠增加层次。尝一口咸酸平衡 → 料汁调好。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 浸泡时间<\/strong><\/p>\n<ol start=\"8\">\n<li>密封后冷藏 6 小时以上（隔夜最佳）。<\/li>\n<li>中途翻拌一两次，让上面的鸡爪也浸到料汁。<\/li>\n<li>3 天内吃完口感最好。泡够时间、入味 → 可以吃了。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/104577368/\">下厨房 · 秘制超火的网红百香果柠檬鸡爪<\/a> —— 加百香果，适合对照「进阶版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1Vb4y1a7Pr/\">雪碧柠檬鸡爪你想吃吗？动手做起来哦（哔哩哔哩）<\/a> —— 雪碧版调味，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「鸡爪 Q 弹脆嫩、酸辣层次分明、柠檬清香不苦」，焯水、冰镇和复合料汁是重点。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 焯水去腥<\/strong><\/p>\n<ol>\n<li>鸡爪冷水下锅，加姜片、葱段、料酒，再加几粒花椒、一个八角增香去腥。<\/li>\n<li>大火煮开后转中火，煮 10~15 分钟（喜欢脆口 10 分钟、偏软口 15 分钟），全程撇净浮沫。看到鸡爪能被筷子戳穿 → 焯好。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 冰镇更脆<\/strong><\/p>\n<ol start=\"3\">\n<li>捞出鸡爪，先冲冷水降温。<\/li>\n<li>再入冰水加几块冰泡 20 分钟。看到皮紧、摸起来肉脆 → 冰镇到位。<\/li>\n<li>彻底沥干水分——料汁才挂得住、不稀释。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 复合料汁<\/strong><\/p>\n<ol start=\"6\">\n<li>蒜末、小米辣用热油泼香。<\/li>\n<li>加生抽、香醋、蚝油、白糖、盐、少许花椒油 / 香油，搅匀。<\/li>\n<li>挤入半个柠檬汁，再放柠檬片（去籽），加百香果、洋葱丝、香菜。尝一口酸辣鲜香都齐 → 料汁完成。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 入味与保存<\/strong><\/p>\n<ol start=\"9\">\n<li>料汁倒进去，基本没过鸡爪，冷藏一夜最入味。<\/li>\n<li>吃前把柠檬片挑出（防久泡发苦），回温 10 分钟再吃，酸辣更明显。<\/li>\n<\/ol>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "31", "name": "冰糖雪梨", "title": "冰糖雪梨", "category": "水果", "ingredient": "梨", "ings": [["雪梨"], ["冰糖"], ["清水"], ["枸杞"], ["红枣"]], "opt": [false, false, false, true, true], "tags": ["甜"], "html": "<h1>冰糖雪梨<\/h1>\n<blockquote>\n<p>归属食材：梨 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>清润甘甜的甜品炖品，梨肉软糯、汤汁清甜，润喉解燥，冷热皆宜。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：炖得软糯、汤不苦）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>雪梨<\/td>\n<td>2 个（约 500g）<\/td>\n<td>选水分足的雪梨 / 皇冠梨 / 丰水梨<\/td>\n<\/tr>\n<tr>\n<td>冰糖<\/td>\n<td>30~40g（约 6~8 小块）<\/td>\n<td>黄冰糖风味更醇<\/td>\n<\/tr>\n<tr>\n<td>清水<\/td>\n<td>约 500ml<\/td>\n<td>刚好没过梨块<\/td>\n<\/tr>\n<tr>\n<td>枸杞<\/td>\n<td>1 小撮（约 10 粒）<\/td>\n<td>可选，出锅前放<\/td>\n<\/tr>\n<tr>\n<td>红枣<\/td>\n<td>2~3 颗（可选）<\/td>\n<td>增香增甜<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 处理梨<\/strong><\/p>\n<ol>\n<li>雪梨洗净、削皮（怕涩可不去皮，但去皮口感更细腻）。<\/li>\n<li>对半切开，用勺子或小刀挖去中间的核和硬芯。<\/li>\n<li>再切成约 2cm 的小块。看到梨块大小均匀、没有残留硬芯 → 备料完成。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 下锅<\/strong><\/p>\n<ol start=\"4\">\n<li>梨块、冰糖一起放进锅里。<\/li>\n<li>加清水没过梨块（约 500ml）。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 炖煮<\/strong><\/p>\n<ol start=\"6\">\n<li>开大火烧开。<\/li>\n<li>转小火炖 30~40 分钟。看到梨块变半透明、筷子能轻松戳透、汤汁微黄有梨香 → 炖好了。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 加枸杞出锅<\/strong><\/p>\n<ol start=\"8\">\n<li>出锅前 5 分钟放枸杞，再煮一下。<\/li>\n<li>关火。趁热喝，或放凉 / 冷藏后喝都行。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>梨切完变黑<\/strong>：切好的梨接触空气会氧化变褐。切好尽快下锅，或先泡在淡盐水里。<\/li>\n<li><strong>冰糖一次放太多<\/strong>：太甜盖住梨香。从 30~40g 起放，炖好尝一口再补。<\/li>\n<li><strong>火太大炖干<\/strong>：全程小火，中途看水量，少了补一点开水。<\/li>\n<li><strong>梨没炖透<\/strong>：炖到筷子能轻松戳穿，才是软糯出汁，别半生就关火。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"http://mwx.douguo.com/cookbook/1473705.html\">豆果美食 · 冰糖雪梨<\/a> —— 切块水煮 + 枸杞，适合对照「初学版」<\/li>\n<li><a href=\"https://www.xiachufang.com/recipe/106909299/\">下厨房 · 冰糖雪梨（做法步骤图）<\/a> —— 冰糖枸杞配比，适合对照「初学版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1vx411o7Nn/\">自制夏天冰糖雪梨（哔哩哔哩）<\/a> —— 简单炖法，适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：隔水炖 vs 水煮 / 梨盅 / 加料）<\/h2>\n<p>在初学版基础上，掌握下面五条，口感和功效都更好。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 选炖法<\/strong><\/p>\n<ol>\n<li>赶时间选<strong>水煮<\/strong>：快（约 30~40 分钟），汤多清甜。<\/li>\n<li>讲究口感选<strong>隔水炖<\/strong>：慢（约 40~60 分钟），汁更浓、梨香锁得更足——梨和冰糖放进炖盅，炖盅放进加了水的锅里，盖上锅盖慢慢炖。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 梨盅造型（可选）<\/strong><\/p>\n<ol start=\"3\">\n<li>梨顶部 1/4 处横切当「盖子」。<\/li>\n<li>用勺挖出核和一部分果肉，做成「碗」。<\/li>\n<li>填入冰糖（可再加枸杞、川贝粉），盖上梨盖。<\/li>\n<li>放碗里隔水蒸 40~60 分钟。看到梨肉软透、汤汁渗出 → 蒸好了，连梨带汤一起吃。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 川贝（对症才加）<\/strong><\/p>\n<ol start=\"7\">\n<li>咳嗽、喉咙干时，加川贝粉 2~3g 放梨盅里一起炖；川贝微苦，日常清润可不加。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 选黄冰糖<\/strong><\/p>\n<ol start=\"8\">\n<li>炖梨用黄冰糖——未经精炼、蔗香更醇，甜度比白冰糖略低、更耐吃。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 加水比例<\/strong><\/p>\n<ol start=\"9\">\n<li>水刚好没过梨块即可，汤更浓；想喝汤多一点，就加到梨块的 1.5 倍水量。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"http://mwx.douguo.com/cookbook/988988.html\">豆果美食 · 冰糖雪梨<\/a> —— 梨盅挖核 + 蒸制，适合对照「进阶版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1xJxXz6EXR/\">冰糖炖雪梨（哔哩哔哩）<\/a> —— 秋冬季润喉炖梨，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与出品）<\/h2>\n<p>追求「梨肉软糯不烂、汤汁清亮不浑、梨香纯净、甜度恰到好处」。每一步都是细节。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 选梨<\/strong><\/p>\n<ol>\n<li>想要「软糯化汤」选雪梨 / 雪花梨（水分足、肉质细，炖后软糯）。<\/li>\n<li>想要「成型有口感」选皇冠梨（更甜脆，久炖仍能保持形状）。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 去皮去核<\/strong><\/p>\n<ol start=\"3\">\n<li>削皮、挖净梨核和附近发硬的部分——核附近口感酸涩，一定要挖净，否则汤里带涩味。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 火候<\/strong><\/p>\n<ol start=\"4\">\n<li>先大火催开，撇去浮沫。<\/li>\n<li>转小火，保持水面只冒小泡的「微沸」慢炖。看到汤面只轻轻冒泡、汤不浑浊 → 火候对了。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 放枸杞红枣<\/strong><\/p>\n<ol start=\"6\">\n<li>枸杞、红枣要<strong>后放<\/strong>（出锅前 5~10 分钟），久煮会烂、把汤弄得发浑。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 出品<\/strong><\/p>\n<ol start=\"7\">\n<li>炖好后静置 10 分钟再盛，让梨块吸足糖汁；冷藏后是另一种清甜口感，夏天更爽口。<\/li>\n<\/ol>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "32", "name": "香橙蒸蛋", "title": "香橙蒸蛋", "category": "水果", "ingredient": "橙子", "ings": [["橙子"], ["鸡蛋"], ["温牛奶", "温水"], ["白糖"], ["盐"]], "opt": [false, false, false, true, true], "tags": ["甜"], "html": "<h1>香橙蒸蛋<\/h1>\n<blockquote>\n<p>归属食材：橙子 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>橙子挖空当盅，蛋液蒸得嫩滑如布丁，带着橙香与淡淡酸甜，清甜润口。属性：甜品（也常作宝宝辅食）。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、不难吃）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>橙子<\/td>\n<td>2 个<\/td>\n<td>选皮厚、果形圆正、底部能立稳的<\/td>\n<\/tr>\n<tr>\n<td>鸡蛋<\/td>\n<td>2 个<\/td>\n<td>常温蛋更好打散<\/td>\n<\/tr>\n<tr>\n<td>温牛奶 / 温水<\/td>\n<td>约 120ml<\/td>\n<td>与蛋液约 1 : 1，口感更嫩<\/td>\n<\/tr>\n<tr>\n<td>白糖<\/td>\n<td>1~2 小勺<\/td>\n<td>可选，喜甜可加<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>1 小撮<\/td>\n<td>可选，去蛋腥<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 处理橙子<\/strong><\/p>\n<ol>\n<li>橙子用盐搓洗表皮。<\/li>\n<li>在顶部约 1/4 处切开当盖子。<\/li>\n<li>用小勺把果肉挖出来，留约 0.5cm 厚的果皮当「盅」，别挖破底部。<\/li>\n<li>挖出的果肉挤出橙汁备用。看到橙盅完整、没破洞 → 可以装蛋液。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 调蛋液<\/strong><\/p>\n<ol start=\"5\">\n<li>鸡蛋打散，加白糖搅匀。<\/li>\n<li>橙汁过筛去渣（或直接用温水 / 牛奶），与蛋液按约 1 : 1 混合搅匀。<\/li>\n<li>再过筛 1~2 次，撇去表面浮沫。看到蛋液顺滑、表面没大泡 → 调好了。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 装盅<\/strong><\/p>\n<ol start=\"8\">\n<li>把蛋液倒回橙皮盅，倒到约 8 分满。<\/li>\n<li>盖上橙皮盖（或用保鲜膜封口、扎几个小孔）。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 蒸<\/strong><\/p>\n<ol start=\"10\">\n<li>蒸锅水烧开后上锅，转中火蒸 10~12 分钟。<\/li>\n<li>关火再焖 3 分钟。揭开看蛋液已凝固、轻轻晃动不散开 → 蒸好了。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>蛋液起蜂窝、变老<\/strong>：火太大或蒸太久。用中火蒸，别用大火猛蒸；蛋液过筛、撇掉浮沫能减少气孔。<\/li>\n<li><strong>蛋液不凝固<\/strong>：液体加太多、比例失衡。蛋液与液体约 1 : 1~1 : 1.5 比较稳。<\/li>\n<li><strong>橙皮盅漏汁<\/strong>：挖果肉时戳破底部或侧壁。留 0.5cm 厚，用小勺沿边慢慢挖。<\/li>\n<li><strong>发苦<\/strong>：刮瓤时把白色内皮刮得太狠。挖果肉时别刮到白皮，保留果肉部分更清甜。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/104782069/\">下厨房 · 香橙蒸蛋<\/a> —— 适合对照「初学版」的挖盅与蒸制<\/li>\n<li><a href=\"https://home.meishichina.com/recipe-321674.html\">美食天下 · 香橙蒸蛋（步骤图）<\/a> —— 图解挖盅与蒸制，适合对照「初学版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1Tt411r7c7/\">嫩滑无比入口即化，橙子蒸蛋吃一口让人回味无穷（哔哩哔哩）<\/a> —— 适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：配比 / 蒸制 / 去腥提香 / 口感）<\/h2>\n<p>在初学版基础上，掌握下面四条，蛋更嫩、橙香更足。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 调配比<\/strong><\/p>\n<ol>\n<li>蛋液 : 液体 ≈ 1 : 1.2~1 : 1.5，液体用「橙汁 + 温牛奶」混合，比纯水更嫩滑。<\/li>\n<li>过筛 2 次。看到表面平整、无大气泡 → 蛋液调好。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 中火蒸 + 盖盖<\/strong><\/p>\n<ol start=\"3\">\n<li>蒸锅水开后再上锅。<\/li>\n<li>中火（保持水微微滚）蒸 10 分钟。<\/li>\n<li>关火焖 3 分钟。盖橙盖或封保鲜膜（扎孔），防止蒸汽水滴到蛋液上、蒸出蜂窝。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 去腥提香<\/strong><\/p>\n<ol start=\"6\">\n<li>蛋液里加 1 小撮盐 + 几滴香草精，或擦入半个橙皮屑（只取橙色外皮，不带白色），橙香更浓。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 口感分级<\/strong><\/p>\n<ol start=\"7\">\n<li>全蛋蒸：口感厚实。<\/li>\n<li>只用蛋黄 + 牛奶：更细腻，像布丁。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/104032899/\">下厨房 · 香橙蒸蛋<\/a> —— 蛋液与橙汁配比参考，适合对照「进阶版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1qt411S7s4/\">这吃法真奇葩，橙子蒸鸡蛋，吃一口让你欲罢不能（哔哩哔哩）<\/a> —— 酸甜嫩滑，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「蛋面平整如镜、无气孔，橙香清雅、入口即化」，挖盅和蒸温是关键。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 选盅与挖盅<\/strong><\/p>\n<ol>\n<li>选皮厚、果形圆正的橙子；底部切掉薄薄一片，让橙子能平稳站立。<\/li>\n<li>先用小刀在果肉上划十字，再沿边挖。看到盅壁厚度均匀、不易漏 → 挖好了。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 橙汁处理<\/strong><\/p>\n<ol start=\"3\">\n<li>果肉榨汁后过细筛，只取清汁，与蛋液按 1 : 1 混合。<\/li>\n<li>加少量橙皮屑（只取橙色外皮）提香，不带白色瓤，避免发苦。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 蒸制温度<\/strong><\/p>\n<ol start=\"5\">\n<li>蒸锅水开冒气后再放盅。<\/li>\n<li>先盖橙盖、再盖锅盖。<\/li>\n<li>中火蒸 10 分钟（保持水微微滚而不是大滚），关火焖 5 分钟。看到蛋面平整如镜、无气孔 → 蒸好了。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 上桌点缀<\/strong><\/p>\n<ol start=\"8\">\n<li>上桌前淋一勺蜂蜜、撒薄荷叶或枸杞点缀，温热吃最嫩。<\/li>\n<\/ol>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "33", "name": "猕猴桃沙拉", "title": "猕猴桃沙拉", "category": "水果", "ingredient": "猕猴桃", "ings": [["猕猴桃"], ["酸奶"], ["蜂蜜"], ["香蕉", "苹果", "草莓"], ["坚果碎", "葡萄干"]], "opt": [false, false, true, true, true], "tags": ["甜"], "html": "<h1>猕猴桃沙拉<\/h1>\n<blockquote>\n<p>归属食材：猕猴桃 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>清爽的水果凉菜沙拉，猕猴桃酸甜、酸奶香滑，搭配其他水果口感丰富，开胃解腻。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能拌好、不烂不酸）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>猕猴桃<\/td>\n<td>2 个<\/td>\n<td>挑稍硬（轻捏微弹）的，太软易烂<\/td>\n<\/tr>\n<tr>\n<td>酸奶<\/td>\n<td>100g<\/td>\n<td>原味或希腊酸奶，作酱汁基底<\/td>\n<\/tr>\n<tr>\n<td>蜂蜜<\/td>\n<td>1 小勺<\/td>\n<td>调味，可选<\/td>\n<\/tr>\n<tr>\n<td>香蕉 / 苹果 / 草莓<\/td>\n<td>1 根 / 半个 / 适量<\/td>\n<td>搭配水果（可选其一）<\/td>\n<\/tr>\n<tr>\n<td>坚果碎 / 葡萄干<\/td>\n<td>1 小撮（可选）<\/td>\n<td>增口感<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 判断生熟<\/strong><\/p>\n<ol>\n<li>猕猴桃轻捏：微软有弹性、能捏动但不变形 = 正好，可以用。<\/li>\n<li>硬邦邦 = 太生（酸、硬），先室温放几天催熟；一按一个坑 = 太熟（会烂、出水），别用。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 去皮切块<\/strong><\/p>\n<ol start=\"3\">\n<li>猕猴桃切掉两端，用勺子贴着皮内壁转一圈，把整颗果肉挖出来（或直接削皮）。<\/li>\n<li>切成约 2cm 的小块；搭配水果也切成差不多大小的块。看到大小差不多 → 切好了。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 调酱<\/strong><\/p>\n<ol start=\"5\">\n<li>酸奶加蜂蜜搅匀；喜欢酸就少放或不放蜂蜜。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 拌匀<\/strong><\/p>\n<ol start=\"6\">\n<li>所有水果块放大碗里，淋上酸奶酱。<\/li>\n<li>轻轻翻拌均匀，撒上坚果碎 / 葡萄干。<strong>现拌现吃<\/strong>最好，拌好别久放。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>猕猴桃太软<\/strong>：切块变烂泥、出汁。选「微软偏硬」的，按下去能回弹的那种。<\/li>\n<li><strong>切块太大 / 不匀<\/strong>：不好入口、酱拌不匀。都切成约 2cm 的小块。<\/li>\n<li><strong>酱太稀 / 太稠<\/strong>：希腊酸奶浓、普通酸奶稀；太稀可少加或不加蜂蜜，太稠可加半勺酸奶搅开。<\/li>\n<li><strong>提前拌好放太久<\/strong>：出水、氧化发软。临吃前再拌。<\/li>\n<li><strong>太酸<\/strong>：猕猴桃偏酸时蜂蜜多放一点，或搭配香蕉、芒果增加甜度。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.douguo.net/cookbook/2107011.html\">豆果美食 · 超级无敌系列之经典猕猴桃苹果沙拉<\/a> —— 猕猴桃 + 苹果 + 沙拉酱，适合对照「初学版」<\/li>\n<li><a href=\"http://mwx.douguo.com/cookbook/1631025.html\">豆果美食 · 香甜水果沙拉<\/a> —— 猕猴桃 + 苹果 + 砂糖橘切块，适合对照「初学版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1LW4y1f7bX/\">早餐吃什么｜水果蔬菜沙拉（含猕猴桃）（哔哩哔哩）<\/a> —— 水果蔬菜沙拉搭配，适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：生熟判断 / 搭配 / 酱汁变体）<\/h2>\n<p>在初学版基础上，掌握下面四条，口感更平衡、层次更丰富。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 生熟判断<\/strong><\/p>\n<ol>\n<li>用「软硬 + 香味」一起判断：闻起来有猕猴桃香 + 轻捏微软，才是最佳食用状态。<\/li>\n<li>冰箱里猕猴桃熟得慢，室温放 2~3 天即可变软。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 催熟<\/strong><\/p>\n<ol start=\"3\">\n<li>太生的猕猴桃和苹果 / 香蕉一起装进保鲜袋，常温放 2~3 天。它们会释放乙烯，帮猕猴桃加快成熟。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 搭配<\/strong><\/p>\n<ol start=\"4\">\n<li>甜酸互补：猕猴桃（酸）+ 香蕉 / 芒果 / 草莓（甜），整体不会太酸。<\/li>\n<li>口感层次：加坚果碎、燕麦脆，软滑中带脆。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 酱汁<\/strong><\/p>\n<ol start=\"6\">\n<li>酸奶 + 蜂蜜：清爽；酸奶 + 几滴柠檬汁：提亮、防氧化；希腊酸奶 + 蜂蜜：浓稠、能更好挂在水果上。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 防氧化<\/strong><\/p>\n<ol start=\"7\">\n<li>切好的猕猴桃淋几滴柠檬汁，或马上拌进酸奶，能延缓表面变褐。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"http://mwx.douguo.com/cookbook/1540180.html\">豆果美食 · 水果沙拉<\/a> —— 猕猴桃 + 多种水果 + 酸奶，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与出品）<\/h2>\n<p>追求「水果大小统一、酱汁浓稠挂果、酸甜清爽、卖相干净」。每一步都是细节。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 选果<\/strong><\/p>\n<ol>\n<li>沙拉用「硬熟」猕猴桃（略微软、微酸带甜），口感清爽；太软的虽甜，但切块易烂、易出水，拌出来糊成一团。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 切法统一<\/strong><\/p>\n<ol start=\"2\">\n<li>所有水果切成接近大小（约 2cm 方块），入口一致、拌酱均匀。<\/li>\n<li>猕猴桃用「两端切开 + 勺挖」法去皮最完整、不浪费果肉。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 酱汁调味<\/strong><\/p>\n<ol start=\"4\">\n<li>希腊酸奶 + 蜂蜜 + 几滴柠檬汁，调到浓稠能「挂」在水果上。<\/li>\n<li>喜欢更顺滑可加一点淡奶油，风味更高级。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 上桌前拌<\/strong><\/p>\n<ol start=\"6\">\n<li>酱汁临吃前才拌，避免出水。<\/li>\n<li>坚果碎最后撒，保持脆感。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 摆盘<\/strong><\/p>\n<ol start=\"8\">\n<li>盘底先铺一层酸奶酱，再堆水果块，点缀薄荷叶或坚果碎，视觉清爽。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.bilibili.com/video/BV1nSuc6cEx1/\">法式夏日蔬果沙拉（含猕猴桃）（哔哩哔哩）<\/a> —— 蔬果沙拉与料汁调制，适合对照「大厨版」<\/li>\n<\/ul>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "34", "name": "芒果西米露", "title": "芒果西米露", "category": "水果", "ingredient": "芒果", "ings": [["小西米"], ["芒果"], ["牛奶"], ["椰浆", "椰奶"], ["白糖"], ["清水"]], "opt": [false, false, false, false, false, false], "tags": ["甜"], "html": "<h1>芒果西米露<\/h1>\n<blockquote>\n<p>归属食材：芒果 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>港式糖水铺的经典甜品，椰香奶香浓郁，西米 Q 弹、芒果清甜，冰镇后清爽解腻。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做出来、西米不糊）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>小西米<\/td>\n<td>50g<\/td>\n<td>一定买「小西米」，别买大西米（煮法不同）<\/td>\n<\/tr>\n<tr>\n<td>芒果<\/td>\n<td>1 个（约 300g）<\/td>\n<td>挑熟软、香味浓的（如小台农 / 贵妃芒）<\/td>\n<\/tr>\n<tr>\n<td>牛奶<\/td>\n<td>200ml<\/td>\n<td>可部分换成椰浆更香<\/td>\n<\/tr>\n<tr>\n<td>椰浆 / 椰奶<\/td>\n<td>100ml<\/td>\n<td>香浓关键，没有可全用牛奶<\/td>\n<\/tr>\n<tr>\n<td>白糖<\/td>\n<td>1~2 小勺<\/td>\n<td>芒果够甜可少放<\/td>\n<\/tr>\n<tr>\n<td>清水<\/td>\n<td>约 1L<\/td>\n<td>煮西米用，水量要足<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 煮西米（最关键）<\/strong><\/p>\n<ol>\n<li>锅里放足量清水（约 1L）。<\/li>\n<li><strong>大火烧开后再下西米<\/strong>（西米必须开水下锅）。<\/li>\n<li>下锅后转中火，用勺子不停搅拌防止粘底，煮约 10~15 分钟。舀几粒看：西米四周已透明、只剩中间一个针尖大的小白心 → 可以关火。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 焖熟<\/strong><\/p>\n<ol start=\"4\">\n<li>关火，盖上锅盖焖 5~10 分钟，用余温把中间白心焖透。看到西米完全透明、没有白芯 → 焖好了。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 过凉<\/strong><\/p>\n<ol start=\"5\">\n<li>西米倒进滤网，用凉开水（冰水更好）冲几遍，洗掉表面黏浆。<\/li>\n<li>沥干备用。看到西米粒粒分明 → 过凉完成（这步让口感 Q 弹）。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 处理芒果 + 组装<\/strong><\/p>\n<ol start=\"7\">\n<li>芒果沿核两侧切下两大块果肉，在果肉上划十字刀、翻起后切下芒果丁。<\/li>\n<li>杯或碗里先放西米，再倒牛奶和椰浆，加白糖搅匀，最后放芒果丁。<\/li>\n<li>可留一小部分芒果加牛奶打成泥倒进去更香。<\/li>\n<li>冷藏 30 分钟后再吃口感最好。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>西米冷水下锅<\/strong>：会直接化成一锅糊。西米是木薯淀粉做的，必须等水烧开再下。<\/li>\n<li><strong>西米有白芯或煮烂<\/strong>：要么没焖够，要么煮过头。记住「煮到只剩小白心就关火焖」，别一直煮。<\/li>\n<li><strong>西米黏成一团<\/strong>：水太少或没搅拌。水要多（约 20 倍）、煮时勤搅拌、煮好过凉水。<\/li>\n<li><strong>西米不 Q 弹<\/strong>：煮好没过凉水，表面淀粉把西米黏住了。<\/li>\n<li><strong>太甜 / 不甜<\/strong>：白糖分次加，先尝芒果甜度再决定放多少。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/106882211/\">下厨房 · 芒果西米露（做法步骤图）<\/a> —— 西米煮焖过凉的完整步骤，适合对照「初学版」<\/li>\n<li><a href=\"https://zh.dachu.co/zh-hk/recipe/34038\">大厨网 · 芒果西米露详细做法<\/a> —— 椰奶 / 牛奶搭配比例，适合对照「初学版」与「进阶版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1wx411i7r5/\">【港式甜品速递】冰爽芒果西米露（哔哩哔哩）<\/a> —— 西米煮法直观，适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：煮焖过凉 / 芒果打泥与切丁 / 椰浆配比）<\/h2>\n<p>在初学版基础上，掌握下面五条，成品更接近糖水铺口感。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 煮—焖—过凉三步<\/strong><\/p>\n<ol>\n<li><strong>开水下锅<\/strong>：让西米表面淀粉快速糊化定型，不容易化开。<\/li>\n<li><strong>剩白心关火焖<\/strong>：用余温把中心焖熟，避免外糊内硬。<\/li>\n<li><strong>过凉水<\/strong>：冲掉表面溶出的淀粉。看到西米粒粒分明、Q 弹不黏 → 西米处理好了。<\/li>\n<li>西米<strong>不用洗<\/strong>：一碰水表面淀粉就溶掉，直接下锅即可。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 芒果一半打泥、一半切丁<\/strong><\/p>\n<ol start=\"5\">\n<li>一部分芒果加牛奶打成细腻的芒果泥（香气和颜色靠它）。<\/li>\n<li>另一部分切丁，保留「吃到果肉」的口感。两者混搭，层次比全切丁高。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 椰浆与牛奶比例<\/strong><\/p>\n<ol start=\"7\">\n<li>椰浆 : 牛奶 ≈ 1 : 2 最平衡：椰浆多了发腻、少了发淡。<\/li>\n<li>没有椰浆时，用椰奶或全牛奶 + 少量炼乳代替糖，奶香更足。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 甜度调整<\/strong><\/p>\n<ol start=\"9\">\n<li>用炼乳代替部分白糖，甜味更圆润、奶香更浓；芒果本身够甜就先少放糖，拌好尝一口再补。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 进阶搭配（接近杨枝甘露）<\/strong><\/p>\n<ol start=\"10\">\n<li>在芒果西米露里加几块西柚果肉，就是简化版杨枝甘露，酸甜更丰富。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.bilibili.com/video/BV1WV4y1B7tA/\">天热快来做这个！清爽健康的芒果椰汁西米露（哔哩哔哩）<\/a> —— 芒果打泥 + 椰奶组装，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与出品）<\/h2>\n<p>追求「西米 Q 弹有咬劲、椰香奶香平衡、芒果香气突出、卖相有层次」。每一步都是细节。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 煮西米的水量<\/strong><\/p>\n<ol>\n<li>水 : 西米 ≥ 10 : 1，水量少西米一煮就糊、还容易粘底。宁可多烧水，别省。<\/li>\n<li>焖完若还有零星白点，再开小火煮 1 分钟、盖盖再焖，别硬煮。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 过凉用冰水<\/strong><\/p>\n<ol start=\"3\">\n<li>煮好的西米先用流水冲掉表面黏浆。<\/li>\n<li>再泡进冰水里激一下。看到西米更脆弹 → 过凉完成。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 芒果选熟度<\/strong><\/p>\n<ol start=\"5\">\n<li>选九成熟：果皮金黄、轻按微软、凑近有浓郁果香。太青的酸、太软熟透的切块易烂、纤维感重。<\/li>\n<li>选甜度高的小台农或贵妃芒，糖都可以少放。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 装杯层次与出品<\/strong><\/p>\n<ol start=\"7\">\n<li>杯底铺西米 → 倒入芒果泥 → 加椰奶牛奶混合液 → 表面堆芒果丁，最后点缀几粒西柚和一片薄荷叶。<\/li>\n<li>冷藏 1 小时让风味融合最好；西米放久会「返生」变硬，最好 4 小时内吃完，现做现吃最 Q。<\/li>\n<\/ol>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "35", "name": "拔丝苹果", "title": "拔丝苹果", "category": "水果", "ingredient": "苹果", "ings": [["苹果"], ["白糖"], ["清水"], ["玉米淀粉"], ["食用油"], ["熟白芝麻"], ["凉开水"]], "opt": [false, false, false, false, false, true, false], "tags": ["甜"], "html": "<h1>拔丝苹果<\/h1>\n<blockquote>\n<p>归属食材：苹果 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>鲁菜经典热甜品，炸脆的苹果块裹上熬成琥珀色的糖浆，夹起能拉出细长糖丝，外脆内甜，趁热蘸凉开水吃更脆爽。属性：甜品。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、不难吃）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>苹果<\/td>\n<td>2 个（约 300g）<\/td>\n<td>选脆甜、偏硬的红富士，口感更脆<\/td>\n<\/tr>\n<tr>\n<td>白糖<\/td>\n<td>约 100g（6~7 汤匙）<\/td>\n<td>熬糖用<\/td>\n<\/tr>\n<tr>\n<td>清水<\/td>\n<td>约 50ml（4 汤匙）<\/td>\n<td>水炒糖用，比油炒糖好控制<\/td>\n<\/tr>\n<tr>\n<td>玉米淀粉<\/td>\n<td>约 3 汤匙<\/td>\n<td>裹苹果，炸出脆壳<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>约 500ml<\/td>\n<td>炸制用，实耗不多<\/td>\n<\/tr>\n<tr>\n<td>熟白芝麻<\/td>\n<td>1 小撮<\/td>\n<td>出锅前撒，可选<\/td>\n<\/tr>\n<tr>\n<td>凉开水<\/td>\n<td>1 碗<\/td>\n<td>蘸食用，吃时糖丝一拉就断<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点，全程中火炸、小火熬糖）<\/strong><\/p>\n<p><strong>第 1 步 · 切苹果<\/strong><\/p>\n<ol>\n<li>苹果洗净去皮，对半切开去核。<\/li>\n<li>切成约 2cm 的滚刀块。<\/li>\n<li>切好后立刻撒入玉米淀粉抓匀，让每块都裹上薄薄一层（防止氧化变色，也帮糖浆挂得更牢）。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 调糊（可选，更脆）<\/strong><\/p>\n<ol start=\"4\">\n<li>若想外壳更厚更脆，用「2 汤匙淀粉 + 1 汤匙面粉 + 少量清水」调成酸奶状。<\/li>\n<li>把裹过干淀粉的苹果块放进去再裹一层。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 炸苹果<\/strong><\/p>\n<ol start=\"6\">\n<li>锅里倒油，中火烧到六成热（筷子伸进油里，周围快速冒小泡）。<\/li>\n<li>下苹果块炸约 2 分钟至表面微黄定型，捞出。<\/li>\n<li>把油温升高，复炸 30 秒至金黄酥脆，捞出沥油。
