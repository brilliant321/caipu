香与浓稠度，适合对照「大厨版」的滤渣与火候<\/li>\n<\/ul>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "122", "name": "老醋花生", "title": "老醋花生", "category": "坚果干果", "ingredient": "花生", "ings": [["花生米"], ["陈醋"], ["白糖"], ["生抽"], ["盐"], ["洋葱"], ["青椒", "黄瓜"], ["淀粉"], ["食用油"]], "opt": [false, false, false, false, false, false, false, true, false], "tags": [], "html": "<h1>老醋花生<\/h1>\n<blockquote>\n<p>归属食材：花生 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>花生酥脆、糖醋汁酸甜醇厚，配洋葱青椒清爽解腻，是经典下酒凉菜。属性：凉菜（下酒菜）。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、不难吃）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>花生米<\/td>\n<td>200g<\/td>\n<td>选大小均匀的<\/td>\n<\/tr>\n<tr>\n<td>陈醋<\/td>\n<td>3 汤匙（约 45ml）<\/td>\n<td>老醋香浓<\/td>\n<\/tr>\n<tr>\n<td>白糖<\/td>\n<td>2 汤匙（约 30g）<\/td>\n<td>酸甜比可调<\/td>\n<\/tr>\n<tr>\n<td>生抽<\/td>\n<td>1 汤匙<\/td>\n<td>提鲜<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>1/4 小勺<\/td>\n<td>调味<\/td>\n<\/tr>\n<tr>\n<td>洋葱<\/td>\n<td>1/4 个<\/td>\n<td>切小丁<\/td>\n<\/tr>\n<tr>\n<td>青椒（或黄瓜）<\/td>\n<td>半个<\/td>\n<td>切小丁<\/td>\n<\/tr>\n<tr>\n<td>淀粉<\/td>\n<td>1 小勺<\/td>\n<td>勾芡让汁挂住（可选）<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>约 2 汤匙<\/td>\n<td>炸花生用<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 炸花生<\/strong><\/p>\n<ol>\n<li>冷锅冷油下花生米，小火慢慢加热，不停翻炒约 3~5 分钟。<\/li>\n<li>听到\"噼啪\"声、花生皮变深、有香味 → 立刻关火捞出（余温会继续烘）。<\/li>\n<li>捞出摊开晾凉，凉透才脆。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 调糖醋汁<\/strong><\/p>\n<ol start=\"4\">\n<li>小碗里陈醋、白糖、生抽、盐拌匀。<\/li>\n<li>想汁浓稠挂住，就加半小勺淀粉调成水淀粉。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 熬汁<\/strong><\/p>\n<ol start=\"6\">\n<li>把糖醋汁倒进锅里，小火熬到糖完全融化、汁微微浓稠（约 1~2 分钟），关火晾凉。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 拌<\/strong><\/p>\n<ol start=\"7\">\n<li>花生米彻底晾凉后，加洋葱丁、青椒丁。<\/li>\n<li>倒晾凉的糖醋汁拌匀，腌 5~10 分钟更入味。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>花生炸糊<\/strong>：火太大。全程小火，变色就关火，余温会继续加热。<\/li>\n<li><strong>花生不脆<\/strong>：没彻底晾凉就拌汁。炸好一定摊开晾透再拌。<\/li>\n<li><strong>太酸 / 太甜<\/strong>：先按比例调，熬汁前尝一下，酸多放糖、甜多放醋。<\/li>\n<li><strong>汁太稀挂不住<\/strong>：想挂汁就加淀粉勾芡，或熬久一点。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/104420986/\">下厨房 · 老醋花生<\/a> —— 糖醋汁配比清晰，适合对照「初学版」调汁<\/li>\n<li><a href=\"https://www.xiachufang.com/recipe/107199385/\">下厨房 · 老醋花生的做法步骤图（123 涵涵麻麻）<\/a> —— 带步骤图，适合对照「初学版」炸花生火候<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1K7h46vEGy/\">老醋花生（哔哩哔哩）<\/a> —— 老牌下酒菜，短小易学，适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：酥脆 / 糖醋比 / 免油炸）<\/h2>\n<p>在初学版基础上掌握下面四条，口感和味道更好。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 酥脆更持久<\/strong><\/p>\n<ol>\n<li>炸好的花生趁热喷少许高度白酒（或白酒），拌散晾凉，凉后更脆、不易回软。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 调糖醋比例<\/strong><\/p>\n<ol start=\"2\">\n<li>按经典约醋 : 糖 = 3 : 2（也可 1 : 1）调，按口味微调；加一点蚝油更鲜。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 免油炸<\/strong><\/p>\n<ol start=\"3\">\n<li>烤箱 150℃ 烤 15~20 分钟、中途翻面，或空气炸锅 160℃ 炸 10~12 分钟，少油同样酥脆。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 吃前再拌<\/strong><\/p>\n<ol start=\"4\">\n<li>糖醋汁熬好冷藏，吃前再把汁和花生、配菜拌在一起，花生更脆不回软。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://home.meishichina.com/recipe-302271.html\">美食杰 · 老醋花生米<\/a> —— 经典家常版，适合对照「进阶版」糖醋比例<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1fUQZBxECm/\">老醋花生保姆级教学（哔哩哔哩）<\/a> —— 炸花生小妙招 + 醋汁秘方，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 炸花生<\/strong><\/p>\n<ol>\n<li>冷锅冷油下花生，全程小火。<\/li>\n<li>听到密集\"噼啪\"声 → 离火，靠锅底余温烘到金黄，最不容易糊。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 勾芡挂汁<\/strong><\/p>\n<ol start=\"3\">\n<li>糖醋汁熬到\"挂勺\"（勺子蘸汁能挂一层）→ 关火，晾凉后能均匀裹住每颗花生。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 配菜切细丁<\/strong><\/p>\n<ol start=\"4\">\n<li>洋葱、青椒切成约 0.5cm 的小丁，与花生大小相称，一勺入口口感统一。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 点缀<\/strong><\/p>\n<ol start=\"5\">\n<li>拌好前点几滴香油，撒一点香菜段提香，装盘后现吃最脆。<\/li>\n<\/ol>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "123", "name": "葡萄干司康", "title": "葡萄干司康", "category": "坚果干果", "ingredient": "葡萄干", "ings": [["低筋面粉"], ["泡打粉"], ["细砂糖"], ["盐"], ["无盐黄油"], ["牛奶"], ["葡萄干"], ["蛋液"]], "opt": [false, false, false, false, false, false, false, true], "tags": ["甜"], "html": "<h1>葡萄干司康<\/h1>\n<blockquote>\n<p>归属食材：葡萄干 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>英式烘焙点心，外酥内软，黄油奶香浓郁、葡萄干酸甜，配茶配咖啡都合适。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、不难吃）<\/h2>\n<p><strong>食材（约 6~8 块）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>低筋面粉<\/td>\n<td>200g<\/td>\n<td>低筋口感酥松<\/td>\n<\/tr>\n<tr>\n<td>泡打粉<\/td>\n<td>6g（约 1.5 小勺）<\/td>\n<td>膨松剂<\/td>\n<\/tr>\n<tr>\n<td>细砂糖<\/td>\n<td>35g<\/td>\n<td>按口味<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>1g（一小撮）<\/td>\n<td>提味<\/td>\n<\/tr>\n<tr>\n<td>无盐黄油<\/td>\n<td>50g<\/td>\n<td>必须冷藏<\/td>\n<\/tr>\n<tr>\n<td>牛奶<\/td>\n<td>约 80ml<\/td>\n<td>分次加<\/td>\n<\/tr>\n<tr>\n<td>葡萄干<\/td>\n<td>50g<\/td>\n<td>提前泡软沥干<\/td>\n<\/tr>\n<tr>\n<td>蛋液<\/td>\n<td>少许<\/td>\n<td>刷表面，可选<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 预处理<\/strong><\/p>\n<ol>\n<li>葡萄干用温水泡 15 分钟，捞出挤干水分。<\/li>\n<li>黄油保持冷藏状态，切成小丁备用。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 混合粉类<\/strong><\/p>\n<ol start=\"3\">\n<li>低筋面粉、泡打粉、细砂糖、盐一起过筛进大碗，用刮刀或筷子拌匀。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 搓黄油<\/strong><\/p>\n<ol start=\"4\">\n<li>把冷藏黄油丁放进粉里，用手指尖把黄油和粉搓成粗沙粒状（约 2~3 分钟，动作要快，别让手温把黄油搓化）。<\/li>\n<li>看到粉里没有明显黄油块、像粗玉米粉、摸起来松散 → 搓好了。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 加奶成团<\/strong><\/p>\n<ol start=\"6\">\n<li>分次倒入牛奶，用刮刀翻拌到基本成团。<\/li>\n<li>倒入泡好的葡萄干，轻轻压成一个面团（不要用力揉）。<\/li>\n<li>看到没有干粉、能成团、面团软软的 → 可以整形了。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 整形烘烤<\/strong><\/p>\n<ol start=\"9\">\n<li>烤箱预热 200℃。<\/li>\n<li>把面团放在案板上压扁成约 2cm 厚，切成三角形（或圆形），摆上烤盘，表面刷一层蛋液。<\/li>\n<li>放中层烤 15~20 分钟，烤到表面金黄。<\/li>\n<li>看到表面金黄、底部也上色、用筷子戳一下内部不粘 → 熟了。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>揉面过度、成品硬<\/strong>：面团成团就停，不要像揉馒头那样反复揉，揉出面筋司康就不酥了。<\/li>\n<li><strong>黄油没搓匀<\/strong>：还有大块黄油，烤出来口感不均匀。搓到「粗玉米粉」状再停。<\/li>\n<li><strong>烤过头干硬<\/strong>：温度太高或时间太长。200℃ 15~20 分钟，盯着上色，金黄就出炉。<\/li>\n<li><strong>葡萄干没沥干<\/strong>：带着水进面团，面会发粘、烤不酥。泡完一定挤干。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/107629137/\">下厨房 · 葡萄干司康饼<\/a> —— 步骤清楚，适合对照「初学版」的搓黄油与整形<\/li>\n<li><a href=\"https://www.douguo.net/cookbook/227222.html\">豆果美食 · 葡萄干司康（简单天然的早餐）<\/a> —— 泡打粉快手版，适合对照「初学版」比例<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1m4bC6yERW/\">原来司康这么简单！葡萄干司康外酥内软（哔哩哔哩）<\/a> —— 零基础可上手，适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：冷黄油 / 搓沙 / 低筋粉 / 不揉面）<\/h2>\n<p>在初学版基础上，掌握下面四条，成品外酥内软。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 冷黄油搓沙<\/strong><\/p>\n<ol>\n<li>冷黄油在粉里保持颗粒，烘烤时黄油颗粒融化形成小气室，让司康酥松、有层次。<\/li>\n<li>搓的动作要快，也可以把手先冲凉（黄油一化开，手温、室温都会让它没有这个效果）。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 低筋面粉 + 泡打粉<\/strong><\/p>\n<ol start=\"3\">\n<li>用低筋面粉（蛋白质少、筋性弱，烤出来松软）加泡打粉（受热产生气体，让司康膨胀）。<\/li>\n<li>没有低筋粉可用「中筋粉 + 20% 玉米淀粉」代替。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 葡萄干先泡软<\/strong><\/p>\n<ol start=\"5\">\n<li>葡萄干泡软再烤，饱满多汁、不干硬；用朗姆酒或牛奶泡风味更好。<\/li>\n<li>泡完务必挤干，否则水分会破坏面团的酥松结构。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 不揉面<\/strong><\/p>\n<ol start=\"7\">\n<li>用翻拌 + 压折的方式让面团成形，看到没干粉就停，最多轻压 2~3 次（一旦「出筋」，司康就变得硬、韧）。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/106890040/printable/\">下厨房 · 无糖低卡葡萄干司康（酵母版）<\/a> —— 酵母版做法，适合对照「进阶版」的原理<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1ny4y127w8/\">烘焙小白也能一次成功的葡萄干司康（哔哩哔哩）<\/a> —— 保姆级教程，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与口感）<\/h2>\n<p>追求「外壳酥脆、内里湿润绵软、黄油香浓、葡萄干爆汁」。每一步都是细节。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 冷操作<\/strong><\/p>\n<ol>\n<li>黄油提前冷冻 15 分钟再切丁，或用刨丝器把冷冻黄油刨成丝拌进粉里，颗粒更均匀、更不易化。<\/li>\n<li>粉和糖也可以提前冷藏，全程手快、环境别太热。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 折叠出层次<\/strong><\/p>\n<ol start=\"3\">\n<li>面团成团后，轻轻压扁、对折、再压扁，重复 2~3 次（不要揉），形成自然层次，烤出来外壳更酥、内里更松。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 淡奶油替换<\/strong><\/p>\n<ol start=\"4\">\n<li>把牛奶换成等量淡奶油（或奶油 + 牛奶各半），奶香更浓、口感更湿润绵软。<\/li>\n<li>喜欢更酥的，可在表面多刷一层蛋黄液，上色更金黄。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 烘烤与判断<\/strong><\/p>\n<ol start=\"6\">\n<li>烤箱务必充分预热，用 190~200℃ 中层烤，高温让黄油快速起酥。<\/li>\n<li>烤到「表面金黄、边缘微焦、轻按外壳硬挺但内部软」→ 出炉。<\/li>\n<li>出炉放烤网上晾 5 分钟再吃，外壳最酥。<\/li>\n<\/ol>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}], "guide": "<h1>入门总纲（三大基本功）<\/h1>\n<blockquote>\n<p>做菜好不好，就看三样：刀工、火候、调味。先把这三样打牢，后面任何菜都一通百通。<\/p>\n<\/blockquote>\n<p>本库所有菜谱都是「点对点」写法，会反复出现一些术语（断生、收汁、焯水、六成热…）。这篇总纲就是它们的「说明书」——看菜谱时遇到不懂的词，回来这里查。<\/p>\n<hr>\n<h2>一、刀工<\/h2>\n<h3>安全第一（比切得好看更重要）<\/h3>\n<ul>\n<li><strong>握刀<\/strong>：惯用手握刀柄，虎口贴住刀柄，手腕放松，靠手臂发力往下切。<\/li>\n<li><strong>护手（最重要）<\/strong>：另一只手按住食材，<strong>手指弯曲、用指关节顶住刀身<\/strong>，指尖永远缩在关节后面——这样刀最多蹭到关节，不会切到指尖。新手切到手，根因几乎都是指尖伸平了。<\/li>\n<li><strong>砧板防滑<\/strong>：砧板下面垫一块湿抹布，切起来不会滑。<\/li>\n<li><strong>刀要快<\/strong>：钝刀打滑、要更用力，反而更危险。备个磨刀器定期磨。<\/li>\n<\/ul>\n<h3>菜谱里常见的几种切法<\/h3>\n<table>\n<thead>\n<tr>\n<th>切法<\/th>\n<th>长什么样<\/th>\n<th>怎么切<\/th>\n<th>常见用途<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>片<\/td>\n<td>薄片<\/td>\n<td>刀身斜着平推<\/td>\n<td>肉片、土豆片<\/td>\n<\/tr>\n<tr>\n<td>丝<\/td>\n<td>细长条<\/td>\n<td>先切片、再码齐切丝<\/td>\n<td>土豆丝、青椒丝、姜丝<\/td>\n<\/tr>\n<tr>\n<td>丁<\/td>\n<td>小方块<\/td>\n<td>先切条、再切丁<\/td>\n<td>肉丁、西红柿小丁<\/td>\n<\/tr>\n<tr>\n<td>块 / 滚刀块<\/td>\n<td>不规则大块<\/td>\n<td>一边切一边滚动食材<\/td>\n<td>西红柿、土豆炖菜<\/td>\n<\/tr>\n<tr>\n<td>末<\/td>\n<td>极细碎<\/td>\n<td>先切丝、再剁末<\/td>\n<td>蒜末、姜末<\/td>\n<\/tr>\n<tr>\n<td>段<\/td>\n<td>一段一段<\/td>\n<td>直刀切<\/td>\n<td>葱段、芹菜段<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>新手练习顺序<\/h3>\n<ol>\n<li>先练「切丝」：土豆、胡萝卜便宜耐切，练到粗细均匀。<\/li>\n<li>再练「滚刀块」：西红柿、土豆转着切。<\/li>\n<li>最后练「片」：肉先冻 15 分钟微硬再切，更好切整齐。<\/li>\n<\/ol>\n<hr>\n<h2>二、火候<\/h2>\n<h3>火力三档<\/h3>\n<table>\n<thead>\n<tr>\n<th>档位<\/th>\n<th>表现<\/th>\n<th>适合做什么<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>小火<\/td>\n<td>火焰小、锅温低<\/td>\n<td>炒糖色、炖煮、熬酱<\/td>\n<\/tr>\n<tr>\n<td>中火<\/td>\n<td>中等火焰<\/td>\n<td>煸炒、煎、慢慢炒<\/td>\n<\/tr>\n<tr>\n<td>大火<\/td>\n<td>火焰大、锅温高<\/td>\n<td>爆炒、收汁、颠锅<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>电磁炉没火焰，大致看功率：800W 以下 ≈ 小火，1200W ≈ 中火，1800W 以上 ≈ 大火。<\/p>\n<\/blockquote>\n<h3>油温怎么判断（「几成热」）<\/h3>\n<p>菜谱里的「六成热」「八成热」就是油温。新手记住两句就够用：<\/p>\n<ul>\n<li><strong>五六成热<\/strong>：油面微微冒烟、有轻微波纹；筷子伸进油里，周围<strong>快速冒小泡<\/strong> → 适合下肉片、炒菜。<\/li>\n<li><strong>七八成热<\/strong>：油面<strong>明显冒烟、微微波动<\/strong>；筷子进去大量气泡 → 适合爆炒、下蛋液。<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>成数<\/th>\n<th>表现<\/th>\n<th>判断口诀<\/th>\n<th>适合<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>三四成<\/td>\n<td>无烟、油面平静<\/td>\n<td>手放油上方微温<\/td>\n<td>冷油炒糖色、滑炒<\/td>\n<\/tr>\n<tr>\n<td>五六成<\/td>\n<td>微冒烟、有波纹<\/td>\n<td>筷子周围起小泡<\/td>\n<td>炒肉、炒菜<\/td>\n<\/tr>\n<tr>\n<td>七八成<\/td>\n<td>明显冒烟、油面波动<\/td>\n<td>筷子进去大气泡<\/td>\n<td>爆炒、炒蛋、炸<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>几个关键动作（菜谱高频词）<\/h3>\n<ul>\n<li><strong>热锅凉油（防粘）<\/strong>：先空锅烧热，再倒油，油热再下料——这样煎蛋、炒肉都不易粘锅。<\/li>\n<li><strong>爆香<\/strong>：油热后先下葱 / 姜 / 蒜 / 干辣椒，快速炒出香味，再下主料。<\/li>\n<li><strong>断生<\/strong>：食材「刚熟、还带一点点生」就盛出或关火，余温会把它烘到刚好。菜谱说「断生即出」就是要你手快。<\/li>\n<li><strong>焯水<\/strong>：把食材放滚水里短暂烫一下，去腥去杂质。<strong>肉类冷水下锅<\/strong>（让血水慢慢逼出来），<strong>蔬菜开水下锅<\/strong>（保色保脆）；肉类捞出后用温水冲洗。<\/li>\n<li><strong>收汁<\/strong>：出锅前开大火，把多余水分炒/煮掉，让汤汁变浓、挂在菜上。<\/li>\n<li><strong>勾芡<\/strong>：淀粉 + 冷水调匀，出锅前淋入，让汤汁变浓稠挂味。<\/li>\n<li><strong>锅气<\/strong>：高温 + 快炒带来的那种「刚出锅的焦香」，凉了就散，所以趁热吃。<\/li>\n<\/ul>\n<hr>\n<h2>三、调味<\/h2>\n<h3>基础调料各是什么用<\/h3>\n<table>\n<thead>\n<tr>\n<th>调料<\/th>\n<th>作用<\/th>\n<th>什么时候放<\/th>\n<th>注意<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>盐<\/td>\n<td>基础咸味<\/td>\n<td>炒菜中途 / 出锅前<\/td>\n<td>少量多次，先尝后补<\/td>\n<\/tr>\n<tr>\n<td>糖<\/td>\n<td>提鲜、中和酸、炒糖色上色<\/td>\n<td>炒菜中途；糖醋菜先下<\/td>\n<td>一点点就够，别吃出甜味<\/td>\n<\/tr>\n<tr>\n<td>生抽<\/td>\n<td>咸鲜、提味<\/td>\n<td>炒菜中途<\/td>\n<td>本身偏咸，放了生抽盐要减<\/td>\n<\/tr>\n<tr>\n<td>老抽<\/td>\n<td>上色（红亮）<\/td>\n<td>炖煮 / 上色时<\/td>\n<td>只上色不增味，少放<\/td>\n<\/tr>\n<tr>\n<td>醋<\/td>\n<td>酸味、去腥、保脆<\/td>\n<td>中途一半、出锅前一半<\/td>\n<td>沿锅边淋更香<\/td>\n<\/tr>\n<tr>\n<td>料酒 / 黄酒<\/td>\n<td>去腥<\/td>\n<td>烹肉时沿锅边<\/td>\n<td>高温挥发才去腥<\/td>\n<\/tr>\n<tr>\n<td>蚝油<\/td>\n<td>提鲜<\/td>\n<td>出锅前<\/td>\n<td>久煮会失味<\/td>\n<\/tr>\n<tr>\n<td>淀粉<\/td>\n<td>勾芡、让肉更嫩<\/td>\n<td>出锅前<\/td>\n<td>先冷水调匀再倒<\/td>\n<\/tr>\n<tr>\n<td>葱姜蒜<\/td>\n<td>去腥增香<\/td>\n<td>爆香（先下）<\/td>\n<td>蒜分两次放更香<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>调味顺序与三条原则<\/h3>\n<ol>\n<li><strong>先定咸<\/strong>：盐 / 生抽负责咸味，先少量放，后面随时补。<\/li>\n<li><strong>糖醋要平衡<\/strong>：酸甜菜糖和醋一起下，糖略多，突出酸甜。<\/li>\n<li><strong>鲜味最后加<\/strong>：蚝油这类出锅前放，早放等于白放。<\/li>\n<\/ol>\n<blockquote>\n<p>总原则：<strong>少量多次、先尝后补<\/strong>。宁可淡了再加，别一次放咸了救不回来。<\/p>\n<\/blockquote>\n<h3>计量换算（和菜谱一致）<\/h3>\n<ul>\n<li>1 小勺（茶匙）≈ 5ml；1 汤匙 ≈ 15ml（= 3 小勺）<\/li>\n<li>1 小勺盐 ≈ 5g，1 小勺糖 ≈ 5g<\/li>\n<\/ul>\n<hr>\n<h2>给新手的起步建议<\/h2>\n<ol>\n<li><strong>先做熟、再做对、再做好<\/strong>：从每道菜的「初学版」开始，别一上来追大厨版。<\/li>\n<li><strong>一次只练一个点<\/strong>：这周练「热锅凉油不粘」，下周练「糖醋配比」，比什么都想一次到位快得多。<\/li>\n<li><strong>先尝再补<\/strong>：调味永远少量多次，出锅前必尝一口。<\/li>\n<li><strong>做完记一笔<\/strong>：照菜谱做完，把翻车点记下来反馈给我，我帮你修订、锁定成那道菜底部的「🔒 已锁定最佳方案」。<\/li>\n<\/ol>"};
const dishes = DATA.dishes;
const byId = {};
dishes.forEach(d => byId[d.id] = d);

const $ = id => document.getElementById(id);
function show(id){['view-home','view-cat','view-dish','view-guide','view-ing'].forEach(v=>$(v).style.display='none');$(id).style.display='block';window.scrollTo(0,0);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* ---- 首页 ---- */
function renderHome(){
  const cats = DATA.categories;
  $('totalCnt').textContent = DATA.total + ' 道菜';
  $('dishCnt').textContent = '';
  $('catGrid').innerHTML = cats.map(c=>{
    const n = dishes.filter(d=>d.category===c.name).length;
    return `<div class="cat" onclick="goCat('${esc(c.name)}')">
      <span class="em">${c.icon}</span><span class="nm">${esc(c.name)}<span>${n} 道菜</span></span></div>`;
  }).join('');
  renderList(dishes);
}
function renderList(list){
  $('dishCnt').textContent = list.length + ' 道';
  if(!list.length){ $('dishList').innerHTML=''; $('noResult').style.display='block'; return; }
  $('noResult').style.display='none';
  $('dishList').innerHTML = list.map(d=>
    `<div class="dish" onclick="goDish('${d.id}')">
      <div class="t">${esc(d.title)}<span class="tag">${esc(d.category)}</span></div>
      <div class="m">${esc(d.ingredient)} · 三档做法 · 点开看</div>
    </div>`).join('');
}

/* ---- 导航 ---- */
let mode = 'search';
let dishFromIng = false;
function goHome(){
  dishFromIng = false;
  $('q').value=''; $('taboo').value='';
  setMode('search');
  location.hash='#/';
}
function goCat(name){location.hash='#/c/'+encodeURIComponent(name);}
function goDish(id){
  dishFromIng = (mode==='ing' && $('q').value.trim()!=='');
  location.hash='#/d/'+id;
}
function goGuide(){location.hash='#/g';}
function goBack(){
  const d=$('dishBody').dataset;
  if(d && d.from==='ing'){ dishFromIng=false; show('view-ing'); renderIng(); window.scrollTo(0,0); return; }
  if(d && d.cat){ location.hash='#/c/'+encodeURIComponent(d.cat); }
  else location.hash='#/';
}

function route(){
  const h=location.hash||'#/';
  if(h.startsWith('#/d/')){
    const id=h.slice(4); const d=byId[id];
    if(!d){goHome();return;}
    show('view-dish');
    $('dishBody').dataset.cat=d.category;
    $('dishBody').dataset.from=(dishFromIng?'ing':'');
    $('dishCrumb').textContent=d.title;
    $('dishBody').innerHTML=
      `<div class="detail-head"><h1>${esc(d.title)}</h1>
       <div class="m">📂 ${esc(d.category)} · ${esc(d.ingredient)} · <span class="tag" onclick="goCat('${esc(d.category)}')">看同类</span></div></div>
       <div class="recipe">${d.html}</div>`;
  } else if(h.startsWith('#/c/')){
    const name=decodeURIComponent(h.slice(4));
    const list=dishes.filter(d=>d.category===name);
    if(!list.length){goHome();return;}
    show('view-cat');
    $('catCrumb').textContent=name;
    const byIng={};
    list.forEach(d=>{ (byIng[d.ingredient]=byIng[d.ingredient]||[]).push(d); });
    $('catBody').innerHTML=Object.keys(byIng).map(ing=>
      `<div class="sec-title">${ing}<span class="cnt">${byIng[ing].length} 道</span></div>`+
      byIng[ing].map(d=>
        `<div class="dish" onclick="goDish('${d.id}')">
           <div class="t">${esc(d.title)}</div>
           <div class="m">${esc(d.ingredient)} · 三档做法</div>
         </div>`).join('')).join('');
  } else if(h==='#/g'){
    show('view-guide');
    $('guideBody').innerHTML=DATA.guide||'<div class="empty">暂无内容</div>';
  } else {
    show('view-home'); renderHome();
  }
}

/* ---- 模式切换 ---- */
function setMode(m){
  mode = m;
  document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('on', b.dataset.mode===m));
  $('ingExtra').style.display = (m==='ing') ? 'block' : 'none';
  $('searchIc').textContent = (m==='ing') ? '🧺' : '🔍';
  $('q').placeholder = (m==='ing') ? '输入现有原料：西红柿 鸡蛋 盐 油' : '搜菜名 / 食材 / 分类，如「鱼香」「猪肉」';
  onQuery();
}
$('modes').addEventListener('click', e=>{
  const b = e.target.closest('.mode'); if(!b) return;
  setMode(b.dataset.mode);
});

// 反向索引：类名 -> 该类的所有成员词
const MEMBERS = {};
Object.keys(FAMILY).forEach(k => { (MEMBERS[FAMILY[k]] = MEMBERS[FAMILY[k]] || []).push(k); });
const FAMILY_IDS = new Set(Object.values(FAMILY));
function hasFam(s){ const n=norm(s); return Object.prototype.hasOwnProperty.call(FAMILY,n) || FAMILY_IDS.has(n); }
function familyOf(s){
  const n = norm(s);
  return Object.prototype.hasOwnProperty.call(FAMILY, n) ? FAMILY[n] : n;
}
function matchIng(alt, tok){
  const a=norm(alt), t=norm(tok);
  if(!a||!t) return false;
  const fa=familyOf(alt), ft=familyOf(tok);
  const aKnown=hasFam(alt), tKnown=hasFam(tok);
  if(aKnown && tKnown) return fa===ft;
  if(a===t || a.includes(t) || t.includes(a)) return true;
  // 一侧已知、一侧未知：未知侧只要「包含」已知侧某个同类成员，即算等价
  if(aKnown){ const mem=MEMBERS[fa]||[a]; if(mem.some(m=>t.includes(m)||m.includes(t))) return true; }
  if(tKnown){ const mem=MEMBERS[ft]||[t]; if(mem.some(m=>a.includes(m)||m.includes(a))) return true; }
  return false;
}
function parseTokens(s){return String(s).split(/[、，,;；\s]+/).map(x=>x.trim()).filter(Boolean);}

function dishMatchWord(d, w){
  const cands = [d.title, d.name, d.category, d.ingredient].concat((d.ings||[]).flat(), (d.tags||[]));
  return cands.some(c=>matchIng(c, w));
}
function parseTaboo(s){
  const excl=[], incl=[];
  const NEG=/^(不吃|不要吃|不想要|不要|忌口|忌|讨厌|别|免|无|不喜|怕|不)/;
  parseTokens(s).forEach(raw=>{
    const neg = NEG.test(raw);
    const word = raw.replace(NEG,'').trim();
    if(word){ (neg?excl:incl).push(word); }
  });
  return {excl, incl};
}

/* ---- 软忌口（甜 / 糖 / 辣）：可剔除「可选料」、只对「必需料/菜名/标签」整体排除 ---- */
const SOFT_TABOOS = new Set(['甜','甜食','甜品','甜点','糖水','糖','白糖','白砂糖','砂糖','冰糖','红糖','绵白糖','蜂蜜','炼乳','焦糖','糖浆','枫糖','麦芽糖','辣','辣椒','香辣','麻辣']);
// 甜类忌口：只排除「甜点/甜口菜」，并剔除「可选糖」；不因「必需糖」排除咸口菜（糖醋排骨/红烧肉/西红柿炒蛋不算「甜食」）
const SWEET_TABOOS = new Set(['甜','甜食','甜品','甜点','糖水']);
// 甜类忌口要能关联到「糖」类原料（FAMILY 里甜/糖是两族，这里补一条桥；辣类已由 FAMILY 覆盖）
const SOFT_TABOO_FAMS = {'甜':['糖'],'甜食':['糖'],'甜品':['糖'],'甜点':['糖'],'糖水':['糖']};
function tabooConflictFams(w){
  const n = norm(w);
  if(Object.prototype.hasOwnProperty.call(SOFT_TABOO_FAMS, n)) return SOFT_TABOO_FAMS[n];
  if(FAMILY_IDS.has(n)) return [familyOf(w)];
  return [];
}
// 返回 { action: 'keep' | 'exclude' | 'adapt', removedIdx: [可选料所在组下标] }
function tabooVerdict(d, w){
  const n = norm(w);
  // 硬忌口（海鲜/牛/羊/花生…）：命中即排除（沿用旧逻辑）
  if(!SOFT_TABOOS.has(n)){
    return dishMatchWord(d, w) ? {action:'exclude'} : {action:'keep'};
  }
  // 软忌口
  const idCands = [d.title, d.name, d.ingredient, d.category].concat(d.tags||[]);
  if(idCands.some(c=>matchIng(c, w))) return {action:'exclude'};
  const fams = tabooConflictFams(w);
  const groups = (d.ings && d.ings.length) ? d.ings : [[d.ingredient]];
  const removedIdx = [];
  let hitCore = false;
  groups.forEach((g,i)=>{
    const hit = g.find(a => matchIng(a, w) || fams.some(f => matchIng(a, f)));
    if(!hit) return;
    const opt = d.opt && d.opt[i];
    if(opt) removedIdx.push(i);
    else if(!SWEET_TABOOS.has(n)) hitCore = true; // 甜类忌口：必需糖不算命中（提鲜/糖醋不算「甜食」）
  });
  if(hitCore) return {action:'exclude'};
  if(removedIdx.length) return {action:'adapt', removedIdx};
  return {action:'keep'};
}

/* ---- 报原料 → 推荐菜 ---- */
// 水默认随时有，不算「需补购」（其余调料按用户要求：全都要报）
const ALWAYS = new Set(['水','开水','清水','凉开水','温水','热水','冷水','纯净水','凉白开']);
function dishCard(d){
  const ok = d._can ? '<span class="tag ok">✅ 能做</span>' : '';
  const miss = d._can ? '' : `<div class="need">🛒 缺：${d._missingNames.join('、')}</div>`;
  const cut = (d._cutNames && d._cutNames.length) ? `<div class="cut">✂️ 已按忌口去掉：${d._cutNames.join('、')}</div>` : '';
  const skip = (d._skipNames && d._skipNames.length) ? `<div class="skip">◽ 可不加：${d._skipNames.join('、')}</div>` : '';
  return `<div class="dish" onclick="goDish('${d.id}')">
    <div class="t">${esc(d.title)}<span class="tag">${esc(d.category)}</span>${ok}</div>
    <div class="m">${esc(d.ingredient)} · 匹配 ${d._matched}/${d._total} 样（必需料）</div>${miss}${cut}${skip}
  </div>`;
}
function renderIng(){
  const toks = parseTokens($('q').value);
  if(!toks.length){ show('view-home'); renderHome(); return; }
  show('view-ing');
  const {excl, incl} = parseTaboo($('taboo').value);

  // 1) 忌口：硬忌口命中即排除；软忌口（甜/糖/辣）命中「可选料」→ 剔除、命中「必需料/菜名/标签」→ 排除
  const pool = [];
  dishes.forEach(d=>{
    const removedIdx = new Set();
    let drop = false;
    for(const w of excl){
      const v = tabooVerdict(d, w);
      if(v.action==='exclude'){ drop = true; break; }
      if(v.action==='adapt'){ v.removedIdx.forEach(i=>removedIdx.add(i)); }
    }
    if(drop) return;
    d._removedIdx = removedIdx;
    pool.push(d);
  });

  // 2) 算匹配度 + 口味偏好命中数（可选料不算缺、不计入「匹配分母」）
  pool.forEach(d=>{
    const groups = (d.ings && d.ings.length) ? d.ings : [[d.ingredient]];
    const opt = d.opt || [];
    let matched=0, total=0; const missNames=[], cutNames=[], skipNames=[];
    groups.forEach((g,i)=>{
      if(g.some(a=>ALWAYS.has(norm(a)))){ total++; matched++; return; } // 水默认有
      if(opt[i]){ // 可选料：不做「缺」，按是否被忌口命中分「去掉/可不加」
        if(d._removedIdx && d._removedIdx.has(i)) cutNames.push(g[0]);
        else skipNames.push(g[0]);
        return;
      }
      total++;
      if(g.some(a=>toks.some(t=>matchIng(a,t)))){ matched++; }
      else missNames.push(g[0]);
    });
    d._matched=matched; d._total=total;
    d._can = (missNames.length===0);
    d._missingNames = missNames;
    d._cutNames = cutNames;
    d._skipNames = skipNames;
    d._taste = incl.filter(w=>dishMatchWord(d,w)).length;
  });

  // 3) 排序：口味偏好命中数 ↓ → 原料匹配度 ↓ → 缺的少 ↓
  pool.sort((a,b)=>
    (b._taste - a._taste) ||
    ((b._total ? b._matched/b._total : 1) - (a._total ? a._matched/a._total : 1)) ||
    (a._missingNames.length - b._missingNames.length) ||
    (a.title<b.title?-1:1)
  );

  const canCount = pool.filter(d=>d._can).length;
  const cutCount = pool.filter(d=>d._cutNames && d._cutNames.length).length;
  const tag=[];
  if(excl.length) tag.push('忌口：'+excl.join('、'));
  if(incl.length) tag.push('偏好：'+incl.join('、'));
  let html = `<div class="sum">你报了 <b>${toks.length}</b> 样原料${tag.length?'，'+tag.join(' · '):''}。<br>命中 <b>${pool.length}</b> 道，按「口味偏好 → 原料匹配度」排序：✅能做 <b>${canCount}</b> 道 · 🛒需补购 <b>${pool.length-canCount}</b> 道${cutCount?' · ✂️已按忌口自动去料 <b>'+cutCount+'</b> 道':''}。</div>`;

  html += pool.length ? pool.map(dishCard).join('')
    : `<div class="empty">没找到符合的菜（可能忌口把菜都排掉了），换个原料或忌口试试。</div>`;
  $('ingResult').innerHTML = html;
}

/* ---- 搜索（搜菜名模式） ---- */
let timer=null;
function onQuery(){
  const kw=$('q').value.trim();
  if(mode==='ing'){ renderIng(); return; }
  if(!kw){ show('view-home'); renderHome(); return; }
  show('view-home');
  const k=kw.toLowerCase();
  const hit=dishes.filter(d=>
    d.name.toLowerCase().includes(k)||d.title.toLowerCase().includes(k)||
    d.ingredient.toLowerCase().includes(k)||d.category.toLowerCase().includes(k));
  $('catGrid').innerHTML='';
  $('totalCnt').textContent='';
  renderList(hit);
}
$('q').addEventListener('input',()=>{
  clearTimeout(timer);
  timer=setTimeout(onQuery,120);
});
$('taboo').addEventListener('input',()=>{
  clearTimeout(timer);
  timer=setTimeout(onQuery,120);
});

window.addEventListener('hashchange',route);
