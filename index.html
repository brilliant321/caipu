><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/101814739/\">下厨房 · 孜然土豆<\/a> —— 先煮后炒的经典做法，适合对照「初学版」<\/li>\n<li><a href=\"https://www.xiachufang.com/recipe/1048991/\">下厨房 · 孜然土豆<\/a> —— 家常调味配比，适合对照「初学版」调味<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1pu4y137ud/\">好吃就行 · 孜然土豆片和韭菜鸡蛋，好吃下饭（哔哩哔哩）<\/a> —— 家常快炒，适合对照「初学版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1pW411d7VH/\">孜然土豆片，好吃的不得了，关键是够简单（哔哩哔哩）<\/a> —— 简单快手，适合对照「初学版」焙孜然技巧<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：干香 / 孜然用法 / 空气炸锅）<\/h2>\n<p>在初学版基础上掌握下面四条，口感更干香。<\/p>\n<p><strong>第 1 步 · 干香关键<\/strong><\/p>\n<ol>\n<li>煮过的土豆下锅后先别动，让表面水分蒸干、煎出脆壳。<\/li>\n<li>用\"煎—翻—压\"让每个面都贴锅，煎到四面焦黄才香。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 孜然两种用法<\/strong><\/p>\n<ol start=\"3\">\n<li>孜然粒焙香压碎，香气足。<\/li>\n<li>出锅前再补一点孜然粉，香气更有层次。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 空气炸锅版<\/strong><\/p>\n<ol start=\"5\">\n<li>土豆拌油和调料。<\/li>\n<li>180℃ 炸 15 分钟，翻面再炸 10 分钟，少油更省事。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 加洋葱 / 青椒<\/strong><\/p>\n<ol start=\"7\">\n<li>先炒洋葱丝出香再下土豆，或出锅前加青椒块，风味更丰富。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/102816640/\">下厨房 · 葱香孜然土豆丁<\/a> —— 焖煎出焦黄，适合对照「进阶版」干香口感<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p><strong>第 1 步 · 先蒸后煎<\/strong><\/p>\n<ol>\n<li>土豆先蒸熟（蒸熟的土豆水分更少）。<\/li>\n<li>再下锅煎，煎出来更干香、不吸油，比水煮版更酥。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 孜然现焙现磨<\/strong><\/p>\n<ol start=\"3\">\n<li>干锅把孜然焙到冒烟、微微出油光。<\/li>\n<li>磨碎使用，香气翻倍（孜然是整道菜的灵魂）。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 锅气<\/strong><\/p>\n<ol start=\"5\">\n<li>最后转大火快炒。<\/li>\n<li>沿锅边淋一点点生抽，让酱香在高温下\"呲\"出来，均匀裹在土豆上。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 点缀<\/strong><\/p>\n<ol start=\"7\">\n<li>出锅前撒熟白芝麻和一点香菜末点缀，趁热吃最香。<\/li>\n<\/ol>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "104", "name": "肉桂卷", "title": "肉桂卷", "category": "调味香料", "ingredient": "桂皮", "ings": [["高筋面粉"], ["干酵母"], ["白糖"], ["盐"], ["牛奶"], ["鸡蛋"], ["黄油"], ["肉桂粉"], ["红糖", "白糖"], ["融化黄油"], ["糖粉 + 牛奶"]], "opt": [false, false, false, false, false, false, false, false, false, false, true], "tags": ["甜"], "html": "<h1>肉桂卷<\/h1>\n<blockquote>\n<p>归属食材：桂皮 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>松软面包卷裹着肉桂糖的温暖甜香，出炉淋一层糖霜更香甜。属性：烘焙（面包甜品）。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能发起来、烤熟、不难吃）<\/h2>\n<p><strong>食材（约 8~10 个）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>高筋面粉<\/td>\n<td>250g<\/td>\n<td>面包用高筋粉<\/td>\n<\/tr>\n<tr>\n<td>干酵母<\/td>\n<td>3g（约 1 小勺）<\/td>\n<td>耐高糖或普通干酵母<\/td>\n<\/tr>\n<tr>\n<td>白糖<\/td>\n<td>25g（约 2 汤匙）<\/td>\n<td>面团用<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>1/2 小勺（约 2g）<\/td>\n<td>提味<\/td>\n<\/tr>\n<tr>\n<td>牛奶<\/td>\n<td>约 130ml<\/td>\n<td>温牛奶（约 35℃），分次加<\/td>\n<\/tr>\n<tr>\n<td>鸡蛋<\/td>\n<td>1 个<\/td>\n<td>可留一点蛋液刷表面<\/td>\n<\/tr>\n<tr>\n<td>黄油<\/td>\n<td>20g（约 1.5 汤匙）<\/td>\n<td>室温软化<\/td>\n<\/tr>\n<tr>\n<td>肉桂粉<\/td>\n<td>1 汤匙（约 5g）<\/td>\n<td>内馅用<\/td>\n<\/tr>\n<tr>\n<td>红糖（或白糖）<\/td>\n<td>2 汤匙（约 30g）<\/td>\n<td>内馅用<\/td>\n<\/tr>\n<tr>\n<td>融化黄油<\/td>\n<td>1 汤匙<\/td>\n<td>刷面皮粘肉桂糖<\/td>\n<\/tr>\n<tr>\n<td>糖粉 + 牛奶<\/td>\n<td>适量<\/td>\n<td>可选糖霜<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 激活酵母<\/strong><\/p>\n<ol>\n<li>温牛奶（手指伸进去不烫手、约 35℃）里加酵母和一点糖。<\/li>\n<li>静置 5 分钟，看到表面起细泡 → 酵母还活着，可以用。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 和面<\/strong><\/p>\n<ol start=\"3\">\n<li>面粉、糖、盐混合，倒入酵母奶和鸡蛋，揉成团。<\/li>\n<li>加入软化黄油，继续揉约 10 分钟。<\/li>\n<li>揉到面团光滑、能拉出半透明薄膜 → 揉到位（没厨师机就多揉一会儿）。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 一次发酵<\/strong><\/p>\n<ol start=\"6\">\n<li>面团盖湿布 / 保鲜膜，放温暖处（约 28℃）发酵约 1 小时。<\/li>\n<li>发到 2 倍大，手指蘸面粉戳洞不回缩 → 发酵完成。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 做肉桂糖并擀卷<\/strong><\/p>\n<ol start=\"8\">\n<li>肉桂粉和红糖混合均匀。<\/li>\n<li>发酵好的面团排气，擀成长方形约 0.5cm 厚。<\/li>\n<li>刷一层融化黄油，均匀撒上肉桂糖，边缘留 1cm 不撒。<\/li>\n<li>从长边卷起，收口捏紧，切成约 3~4cm 的小段。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 二次发酵<\/strong><\/p>\n<ol start=\"12\">\n<li>切好的卷排进烤盘、留出间距。<\/li>\n<li>盖布二次发酵约 30~40 分钟，发到明显变大（约 1.5 倍）→ 可以烤了。<\/li>\n<\/ol>\n<p><strong>第 6 步 · 烘烤<\/strong><\/p>\n<ol start=\"14\">\n<li>烤箱提前预热 180℃。<\/li>\n<li>中层烤约 15~18 分钟，看到表面金黄、飘出肉桂香 → 出炉。<\/li>\n<li>出炉可趁热淋糖霜（糖粉 + 牛奶调成糊）。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>发不起来<\/strong>：牛奶太烫把酵母烫死了（超过 45℃）或环境太冷。牛奶用温水，冬天可放烤箱发酵档。<\/li>\n<li><strong>面团太干 / 太湿<\/strong>：牛奶分次加，不同面粉吸水不同。<\/li>\n<li><strong>肉桂糖漏出来<\/strong>：卷得太松、收口没捏紧。擀时留边、卷紧、收口朝下放。<\/li>\n<li><strong>烤糊 / 没熟<\/strong>：每家烤箱温差大，最后 5 分钟多看着，表面金黄就出炉。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/106777341/\">下厨房 · 肉桂卷的做法步骤图（面包）<\/a> —— 30℃ 一发 + 170℃ 烘烤，适合对照「初学版」发酵与烘烤温度<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1PXynByEmT/\">零失败肉桂卷教程！手残党也能做出软 fufu 的蓬松口感（哔哩哔哩）<\/a> —— 完整配方 + 手套膜讲解，适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：出膜 / 湿度 / 内馅）<\/h2>\n<p>在初学版基础上掌握下面四条，面包更软、更香。<\/p>\n<p><strong>第 1 步 · 揉出手套膜<\/strong><\/p>\n<ol>\n<li>用\"摔打 + 折叠\"手法：抓起面团摔在案板上再折叠，反复进行。<\/li>\n<li>取一小块慢慢拉开，能透光、破洞边缘光滑 → 揉到薄而不破的\"手套膜\"，到位（面包组织更松软）。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 二发补湿度<\/strong><\/p>\n<ol start=\"3\">\n<li>烤箱里放一碗热水，再放烤盘发酵。<\/li>\n<li>湿度够、表皮不干，成品更柔软不裂。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 肉桂糖加料<\/strong><\/p>\n<ol start=\"5\">\n<li>加一点融化黄油，把肉桂粉和糖拌成肉桂酱涂抹，糖不散落。<\/li>\n<li>或加核桃碎、橙皮屑增加风味层次。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 免揉法（省力）<\/strong><\/p>\n<ol start=\"7\">\n<li>面团拌到没干粉，盖上冷藏发酵过夜。<\/li>\n<li>第二天回温整形，风味更足、也省揉面。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/103564684/\">下厨房 · 肉桂卷的做法步骤图<\/a> —— 折叠式整形，适合对照「进阶版」整形手法<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1HVVWebEWv/\">超详细制作肉桂卷，柔软酥脆，比外面卖的还好吃（哔哩哔哩）<\/a> —— 详细步骤，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p><strong>第 1 步 · 汤种 / 中种法<\/strong><\/p>\n<ol>\n<li>先取部分面粉加开水烫成汤种，或提前发酵中种面团。<\/li>\n<li>再混合主面团，面包更柔软、保湿、不易老化。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 红糖焦糖底<\/strong><\/p>\n<ol start=\"3\">\n<li>烤盘底部铺融化的黄油 + 红糖。<\/li>\n<li>把卷放上去烤，出炉倒扣，底部有一层焦糖，甜香浓郁。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 精确温控<\/strong><\/p>\n<ol start=\"5\">\n<li>上火 190℃ / 下火 170℃，放中下层烤约 15 分钟。<\/li>\n<li>看到上色均匀、底部不焦 → 出炉。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 奶油奶酪糖霜<\/strong><\/p>\n<ol start=\"7\">\n<li>奶油奶酪 + 糖粉 + 牛奶打顺滑。<\/li>\n<li>趁热淋在卷上，半融化渗透进缝隙，比纯糖霜更香浓。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/106928562/\">下厨房 · 深冬的慰藉 · 不寻常的肉桂卷<\/a> —— 红糖糖浆打底，适合对照「大厨版」焦糖底<\/li>\n<\/ul>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "105", "name": "花椒油", "title": "花椒油（麻油）", "category": "调味香料", "ingredient": "花椒", "ings": [["干花椒"], ["食用油"], ["高度白酒"]], "opt": [false, false, false], "tags": [], "html": "<h1>花椒油（麻油）<\/h1>\n<blockquote>\n<p>归属食材：花椒 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>花椒的麻香慢慢析进油里做成的调味油，麻香浓而不苦，拌凉菜、调蘸水、做麻婆豆腐都靠它。属性：调味油。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：做出麻香、不苦的花椒油）<\/h2>\n<p><strong>食材（成品约 200ml）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>干花椒<\/td>\n<td>30g<\/td>\n<td>青花椒偏麻、红花椒偏香，可混合<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>200ml<\/td>\n<td>菜籽油最香<\/td>\n<\/tr>\n<tr>\n<td>高度白酒（可选）<\/td>\n<td>1 汤匙<\/td>\n<td>激发麻味、防炸糊<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 洗花椒<\/strong><\/p>\n<ol>\n<li>花椒用清水快速冲一下，去灰尘。<\/li>\n<li>捞出彻底沥干（或用厨房纸吸干）（这一步去杂味、防发苦）。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 泡酒（推荐）<\/strong><\/p>\n<ol start=\"3\">\n<li>沥干的花椒拌 1 汤匙高度白酒，腌 10~15 分钟。<\/li>\n<li>腌到花椒湿润、酒香渗入 → 激发麻味、还能防炸糊。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 冷油小火熬<\/strong><\/p>\n<ol start=\"5\">\n<li>锅倒油 + 处理好的花椒，开最小火，让油慢慢升温，期间轻轻搅动。<\/li>\n<li>熬约 5~8 分钟，看到油面冒细小的泡、闻到明显麻香、花椒颜色变深但不变黑 → 关火（花椒不发黑）。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 焖泡过滤<\/strong><\/p>\n<ol start=\"7\">\n<li>关火后不急着倒，让花椒在油里焖到油凉（越久越香）。<\/li>\n<li>用细筛或纱布过滤掉花椒，装进干净无水瓶，阴凉处或冷藏保存。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>发苦<\/strong>：花椒直接下热油炸，或熬太久熬到变黑。记住「冷油下 + 最小火 + 变深就关火」。<\/li>\n<li><strong>麻味淡<\/strong>：熬的时间太短，或没焖泡。关火后焖到凉再过滤，麻味更足。<\/li>\n<li><strong>溅油<\/strong>：花椒没沥干水。一定要彻底沥干或吸干。<\/li>\n<li><strong>保存变味<\/strong>：瓶里有水。瓶子无水、油凉后再装。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/107375820/\">下厨房 · 自制花椒油<\/a> —— 步骤清楚，适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：冷油慢熬 vs 热油泼 / 青红搭配 / 白酒激发）<\/h2>\n<p>在初学版基础上，掌握下面四条，麻香更足、更不苦。<\/p>\n<p><strong>第 1 步 · 冷油小火慢熬（更稳）<\/strong><\/p>\n<ol>\n<li>花椒和油一起从冷开始加热，麻味慢慢析出、不容易焦，适合新手。<\/li>\n<li>想更快就用「热油泼 + 焖」：油烧热降到约 150℃，再泼花椒，焖泡出味。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 青红花椒搭配<\/strong><\/p>\n<ol start=\"3\">\n<li>青花椒负责麻、红花椒负责香，按约 1 : 1 或青多红少搭配。<\/li>\n<li>只用青花椒麻味纯，只用红花椒香味足。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 白酒激发<\/strong><\/p>\n<ol start=\"5\">\n<li>花椒先用白酒拌一下再下锅，酒精带走杂味、帮助麻香析出，还能防糊。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 过滤时机<\/strong><\/p>\n<ol start=\"6\">\n<li>焖到油完全凉再过滤，麻香才渗得透。<\/li>\n<li>滤掉花椒后油更清亮、不易继续发苦。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/107396341/\">下厨房 · 自制花椒油（麻油）<\/a> —— 青花椒 + 浸泡做法，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p><strong>第 1 步 · 三分炸七分泡<\/strong><\/p>\n<ol>\n<li>小火短炸：炸到花椒刚变深、出麻香 → 关火。<\/li>\n<li>密封浸泡 24 小时以上再过滤，麻味最醇（三分炸七分泡）。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 先炼香料油<\/strong><\/p>\n<ol start=\"3\">\n<li>冷油下姜片、葱段，小火炸香捞出。<\/li>\n<li>用这锅香料油再熬花椒，香味更立体。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 油温控制<\/strong><\/p>\n<ol start=\"5\">\n<li>全程油温别超过约 130℃（手放油面上方感觉明显热但不冒烟）。<\/li>\n<li>超过 130℃，花椒里的挥发麻香成分会跑掉，还容易苦。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 保存<\/strong><\/p>\n<ol start=\"7\">\n<li>滤净后装深色瓶、避光保存，麻香保持更久。<\/li>\n<li>建议 1~2 个月内用完。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.jiachangcai.net.cn/caipu/227180.html\">家常菜网 · 新鲜青花椒油制作方法，最忌直接下锅炸<\/a> —— 防苦技巧，适合对照「大厨版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1hV4y1n7q5/\">【家庭自制青花椒油】花椒油在家这样做，又麻又香，拌啥都好吃<\/a> —— 含浸泡 3 天做法，适合对照「大厨版」<\/li>\n<\/ul>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "106", "name": "葱油", "title": "葱油", "category": "调味香料", "ingredient": "葱", "ings": [["小葱"], ["食用油"], ["生抽"]], "opt": [false, false, false], "tags": [], "html": "<h1>葱油<\/h1>\n<blockquote>\n<p>归属食材：葱 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>小葱用小火慢慢熬出来的调味油，葱香浓郁、香而不焦，拌面、拌菜、蒸鱼、淋汤都百搭。属性：调味油。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：熬出一锅香而不苦的葱油）<\/h2>\n<p><strong>食材（成品约 250ml）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>小葱<\/td>\n<td>150g（约 1 大把）<\/td>\n<td>挑叶子绿、葱白结实的，洗净后必须彻底晾干<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>250ml<\/td>\n<td>玉米油、菜籽油等味道轻的油，别用橄榄油<\/td>\n<\/tr>\n<tr>\n<td>生抽（可选）<\/td>\n<td>2 汤匙<\/td>\n<td>想吃葱油拌面可最后加<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点，全程小火）<\/strong><\/p>\n<p><strong>第 1 步 · 备葱<\/strong><\/p>\n<ol>\n<li>小葱洗净，重点冲干净葱白根部的泥沙。<\/li>\n<li>用厨房纸擦干或晾干架彻底晾干（有水下锅会溅油）。<\/li>\n<li>切成约 5~6cm 长的段，葱白和葱叶分开放。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 冷油下锅<\/strong><\/p>\n<ol start=\"4\">\n<li>找一口小锅或厚底锅，先倒油、不开火。<\/li>\n<li>把葱白段先放进去（葱白含水多、耐熬），再开最小火。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 小火慢熬<\/strong><\/p>\n<ol start=\"6\">\n<li>保持最小火，让油和葱一起慢慢升温。<\/li>\n<li>葱白先变软、变浅黄（约 3~5 分钟）后，下葱叶。<\/li>\n<li>继续熬 10~15 分钟，偶尔用筷子拨一下让受热均匀。<\/li>\n<li>看到葱叶由绿变黄、变干硬、呈金黄色（不是焦黑）→ 关火。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 捞葱保存<\/strong><\/p>\n<ol start=\"10\">\n<li>关火后立刻把葱段捞出（葱留在油里会继续把油染苦）。<\/li>\n<li>葱油放凉，倒进干净无水的玻璃瓶，冷藏可存 1~2 个月（捞出的葱段别扔，拌面时是灵魂）。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>葱炸焦发苦<\/strong>：火开太大或熬太久。全程最小火，看到葱变金黄就关火，宁可早关。<\/li>\n<li><strong>溅油<\/strong>：葱没晾干就下锅。务必擦干、晾干水分。<\/li>\n<li><strong>油没葱香<\/strong>：热油下葱只炸不香。要冷油下葱，让葱香随油温慢慢渗进油里。<\/li>\n<li><strong>保存变味<\/strong>：装油瓶子有生水。瓶子必须无水无油，油凉透再装。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/104175029/\">下厨房 · 葱油（拌面拌饭用）<\/a> —— 用量清楚，适合对照「初学版」比例<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：分次下葱 / 油葱比 / 低温慢熬）<\/h2>\n<p>在初学版基础上，掌握下面四条，葱油更香更稳。<\/p>\n<p><strong>第 1 步 · 葱白葱叶分次下锅<\/strong><\/p>\n<ol>\n<li>葱白含水多、质地厚，先下锅多熬 3~5 分钟。<\/li>\n<li>葱叶易焦，后下。<\/li>\n<li>看到葱白和葱叶同时到达金黄 → 一个不生一个不焦。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 油葱比约 2 : 1<\/strong><\/p>\n<ol start=\"4\">\n<li>大致 250ml 油配 120~150g 小葱。<\/li>\n<li>油太少葱香淡、还容易焦，油太多味薄，按这个比例缩放。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 冷油 + 最小火 + 低温慢熬<\/strong><\/p>\n<ol start=\"6\">\n<li>油温控制在约 100~130℃（手放油面上方感觉温热但不烫），葱香缓慢释放。<\/li>\n<li>用筷子试：放入葱叶，周围只冒极细小的泡 → 火候对，熬出的葱油清亮、不苦。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 增香（可选）<\/strong><\/p>\n<ol start=\"8\">\n<li>加 2 片姜、半个洋葱切丝一起熬，熬好后捞掉，葱油香味更有层次。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/107536343/\">下厨房 · 正宗上海葱油熬制全过程<\/a> —— 葱白葱叶分次下锅、小火慢熬，适合对照「进阶版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1c54y127TP/\">老饭骨《国宴大厨教你：在家轻松制作葱油，三种技法》<\/a> —— 多种熬法对比，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p><strong>第 1 步 · 三种葱复合<\/strong><\/p>\n<ol>\n<li>小香葱 + 大葱 + 洋葱按约 1 : 1 : 1 搭配。<\/li>\n<li>葱香、甜香、辛香叠加，层次更足。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 熬到「焦而不糊」<\/strong><\/p>\n<ol start=\"3\">\n<li>葱段熬到深金棕色、边缘微焦、一捏就碎，但油里不能出现黑渣。<\/li>\n<li>捞出葱段后，让油自然降温再装瓶，避免余温把葱油焖出糊味。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 酱汁同熬（做葱油拌面）<\/strong><\/p>\n<ol start=\"5\">\n<li>葱段捞出后，转最小火。<\/li>\n<li>沿锅边倒入生抽 + 老抽 + 糖（约 4 : 1 : 1）。<\/li>\n<li>搅到糖化、冒小泡 → 葱油酱汁做好，拌面一绝。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 保存与醒油<\/strong><\/p>\n<ol start=\"8\">\n<li>装瓶后密封冷藏，隔夜「醒」一晚再吃，葱香更融合、更圆润。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/104362283/\">下厨房 · 从新手到大师葱油教程<\/a> —— 层次与保存技巧，适合对照「大厨版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1AW411c7xe/\">美食作家王刚《厨师长教你：「葱油」制作方法》<\/a> —— 葱姜洋葱复合配比，适合对照「大厨版」<\/li>\n<\/ul>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "107", "name": "蒜蓉酱", "title": "蒜蓉酱（金银蒜蓉酱）", "category": "调味香料", "ingredient": "蒜", "ings": [["大蒜"], ["食用油"], ["盐"], ["白糖"], ["生抽"], ["蚝油"]], "opt": [false, false, false, false, false, false], "tags": [], "html": "<h1>蒜蓉酱（金银蒜蓉酱）<\/h1>\n<blockquote>\n<p>归属食材：蒜 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>一半炸成金黄「金蒜」、一半保留生蒜「银蒜」的复合蒜香酱，蒸海鲜、烤生蚝、拌菜都百搭。属性：酱料。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：做出不苦、蒜香浓的金银蒜蓉酱）<\/h2>\n<p><strong>食材（成品约 1 小碗）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>大蒜<\/td>\n<td>200g（约 4~5 头）<\/td>\n<td>剥成蒜瓣<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>150~200ml<\/td>\n<td>油多更易保存、不易糊<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>约 1/2 小勺（2g）<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>白糖<\/td>\n<td>1 小勺（约 5g）<\/td>\n<td>提鲜<\/td>\n<\/tr>\n<tr>\n<td>生抽<\/td>\n<td>1 汤匙<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>蚝油（可选）<\/td>\n<td>1 汤匙<\/td>\n<td>增鲜<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 剁蒜<\/strong><\/p>\n<ol>\n<li>蒜瓣拍一下去皮。<\/li>\n<li>剁成细末（约米粒大小）（用刀剁比机器打更香、不易出水）。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 洗蒜去苦<\/strong><\/p>\n<ol start=\"3\">\n<li>蒜末放进细筛网，用清水冲 2~3 遍，冲掉黏液。<\/li>\n<li>挤干水分 → 这步是「不苦」的关键。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 分成两份<\/strong><\/p>\n<ol start=\"5\">\n<li>蒜末分成 2/3（做金蒜）和 1/3（做银蒜）。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 炸金蒜<\/strong><\/p>\n<ol start=\"6\">\n<li>锅倒油，开小火。<\/li>\n<li>油温热但不冒烟（约三成热）时，下 2/3 蒜末。<\/li>\n<li>小火不停搅拌，约 3~5 分钟。<\/li>\n<li>看到蒜末变浅金黄色 → 立刻关火（余温会继续让它变深，晚了就苦）。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 拌银蒜调味<\/strong><\/p>\n<ol start=\"10\">\n<li>关火后立刻把剩下 1/3 生蒜倒进去拌匀。<\/li>\n<li>再加盐、糖、生抽、蚝油搅匀。<\/li>\n<li>放凉装瓶，冷藏可存 1~2 周。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>发苦<\/strong>：蒜末没洗黏液，或炸过头。先洗后挤干，金黄就离火。<\/li>\n<li><strong>金蒜变黑<\/strong>：火太大。全程小火 + 不停搅。<\/li>\n<li><strong>酱太稀<\/strong>：蒜末没挤干水。挤干再下锅，油酱才稠。<\/li>\n<li><strong>保存变味<\/strong>：装瓶容器有水。瓶子干净干燥、酱放凉再封。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/106966262/\">下厨房 · 金银蒜蓉酱<\/a> —— 步骤清楚，适合对照「初学版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV14x4y1475V/\">一分钟学会熬制金银蒜<\/a> —— 步骤简洁，适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：金银蒜配比 / 油温 / 洗蒜）<\/h2>\n<p>在初学版基础上，掌握下面四条，蒜香层次会明显上一个台阶。<\/p>\n<p><strong>第 1 步 · 金银蒜配比<\/strong><\/p>\n<ol>\n<li>金蒜 2 份、银蒜 1 份（或 1 : 1）。<\/li>\n<li>金蒜负责焦香、银蒜负责鲜辣生香，两者缺一不可。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 油温三成热下金蒜<\/strong><\/p>\n<ol start=\"3\">\n<li>三成热约 90~120℃，蒜末下锅只冒细小泡、不瞬间变黄 → 油温对。<\/li>\n<li>温度太高蒜一下锅就焦。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 洗蒜挤干<\/strong><\/p>\n<ol start=\"5\">\n<li>洗掉蒜的黏液和表面糖分，炸出来才金黄不发黑、不苦、不粘锅。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 关火后调味<\/strong><\/p>\n<ol start=\"6\">\n<li>调味料在关火后、油稍降温时加，避免酱油蚝油遇高温发苦。<\/li>\n<li>先拌蒜再调味，盐糖更容易化开。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/106067954/\">下厨房 · 黄金比例💯金银蒜蓉酱<\/a> —— 配比明确，适合对照「进阶版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1Vh411g78u/\">万能蒜蓉酱｜好吃有窍门｜家中必备调味料<\/a> —— 讲洗蒜去苦窍门，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p><strong>第 1 步 · 先熬香料油<\/strong><\/p>\n<ol>\n<li>冷油下葱段、姜片、几颗花椒、八角。<\/li>\n<li>小火炸到焦黄捞出，用这锅香料油再炸金蒜，香味更复合。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 金蒜「酥」的关键<\/strong><\/p>\n<ol start=\"3\">\n<li>金蒜炸到浅金黄、酥脆但不焦，捞出后能听到轻微沙沙声 → 到位。<\/li>\n<li>关火后立刻倒银蒜，用余温把它「烫」到半熟，既有生蒜香气又不太冲。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 调味配比<\/strong><\/p>\n<ol start=\"5\">\n<li>加盐、糖、生抽、蚝油、少许白胡椒粉。<\/li>\n<li>爱吃辣加小米辣末，喜欢豉香加一点豆豉同炸。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 保存<\/strong><\/p>\n<ol start=\"7\">\n<li>装进无水玻璃罐，油要没过蒜蓉（油封住就不易坏），冷藏保存。<\/li>\n<li>每次取用都用干净勺子。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"http://m-pr.douguo.com/cookbook/3331062.html\">豆果美食 · 万能金银蒜蓉酱<\/a> —— 含香料油做法，适合对照「大厨版」<\/li>\n<\/ul>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "108", "name": "油泼辣子", "title": "油泼辣子（辣椒红油）", "category": "调味香料", "ingredient": "辣椒", "ings": [["辣椒面"], ["食用油"], ["熟白芝麻"], ["盐"], ["白糖"], ["花椒粉"]], "opt": [false, false, false, false, false, false], "tags": [], "html": "<h1>油泼辣子（辣椒红油）<\/h1>\n<blockquote>\n<p>归属食材：辣椒 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>辣椒面被热油一泼激出的红油，香辣红亮，是凉皮、拌面、蘸料的灵魂。属性：调味油（辣椒红油）。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：做出一罐不糊、红亮的油泼辣子）<\/h2>\n<p><strong>食材（成品约 1 罐 250ml）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>辣椒面<\/td>\n<td>60g<\/td>\n<td>用粗细混合的辣椒面，粗的出香、细的上色<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>250ml<\/td>\n<td>菜籽油最香，没有就用玉米油<\/td>\n<\/tr>\n<tr>\n<td>熟白芝麻<\/td>\n<td>1 汤匙<\/td>\n<td>增香<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>约 1/2 小勺（2g）<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>白糖（可选）<\/td>\n<td>1 小勺<\/td>\n<td>回甜<\/td>\n<\/tr>\n<tr>\n<td>花椒粉（可选）<\/td>\n<td>1/2 小勺<\/td>\n<td>增麻<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 拌辣椒面<\/strong><\/p>\n<ol>\n<li>辣椒面、芝麻、盐、糖、花椒粉放进耐热碗（陶瓷或厚玻璃）。<\/li>\n<li>加 2 汤匙凉油或常温油拌湿，让辣椒面不干（防止热油一泼就糊）。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 热油<\/strong><\/p>\n<ol start=\"3\">\n<li>锅倒油，中火烧到油面明显冒青烟、微微波动（约八成热，180℃ 以上）。<\/li>\n<li>关火。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 降温再泼<\/strong><\/p>\n<ol start=\"5\">\n<li>关火后让油稍微降温 1~2 分钟，等油面不再冒大烟。<\/li>\n<li>把油分 2 次泼进辣椒碗：先泼一半，立刻用筷子搅拌激香；再泼另一半，搅匀。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 静置装瓶<\/strong><\/p>\n<ol start=\"7\">\n<li>等完全放凉，装进干净无水的罐子，冷藏或阴凉处保存。<\/li>\n<li>放一晚，红油更香更红。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>辣椒糊了发苦<\/strong>：油温太高就泼，或没先用凉油拌湿。记住「先拌湿 + 关火降温 + 分次泼」。<\/li>\n<li><strong>不红不香<\/strong>：辣椒面全是粗的，或油温不够。粗细混合 + 油温到位。<\/li>\n<li><strong>溅油烫伤<\/strong>：辣椒碗里有水。碗和勺子都要擦干。<\/li>\n<li><strong>保存变味<\/strong>：罐子有水，或用带水的勺子取。取用用干勺。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/104643134/\">下厨房 · 油泼辣子（步骤图）<\/a> —— 步骤详细，适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：辣椒面配比 / 分层泼油 / 油温）<\/h2>\n<p>在初学版基础上，掌握下面四条，红油会更香更红、不苦。<\/p>\n<p><strong>第 1 步 · 辣椒面粗细配比<\/strong><\/p>\n<ol>\n<li>粗辣椒面（如秦椒）负责香、细辣椒面负责红和辣，按约 7 : 3 混合。<\/li>\n<li>想更辣掺朝天椒细粉，想香辣回甜掺二荆条。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 分层泼油<\/strong><\/p>\n<ol start=\"3\">\n<li>高温油（约 160~180℃）先泼一部分，激出辣椒香。<\/li>\n<li>等油温降到约 130~150℃，再泼剩下的，出红油、防糊。<\/li>\n<li>分 2~3 次泼，比一次泼更香更红。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 先拌湿再泼<\/strong><\/p>\n<ol start=\"6\">\n<li>泼油前用 2~3 汤匙凉油，把辣椒面拌成湿润的膏状，热油下去温度均匀、不易焦。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 点睛之笔<\/strong><\/p>\n<ol start=\"7\">\n<li>泼完趁热滴几滴香醋或白酒，会「呲啦」一声激出复合浓香，还能降温、让红油更亮。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/106127617/\">下厨房 · 老陕的灵魂：油泼辣子<\/a> —— 分次泼油 + 滴醋，适合对照「进阶版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1MJ411G73U/\">【小高姐】油泼辣子 如何才能做出色香味俱全的油泼辣子<\/a> —— 强调调料顺序与醋，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p><strong>第 1 步 · 先炼香料油<\/strong><\/p>\n<ol>\n<li>冷油下洋葱丝、大葱段、姜片、香菜，加几颗八角、香叶、花椒。<\/li>\n<li>小火炸到焦黄捞出，做成香料底油再泼，香味更有层次。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 精确油温<\/strong><\/p>\n<ol start=\"3\">\n<li>菜籽油烧到约 240℃ 冒青烟，去生味。<\/li>\n<li>降到约 120℃ 炸香料、170℃ 放芝麻。<\/li>\n<li>再分三次泼：180℃ 出香、150℃ 出辣、120℃ 出红。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 选油<\/strong><\/p>\n<ol start=\"6\">\n<li>首选菜籽油，香味最配辣椒；其次花生油。<\/li>\n<li>烟点高的油才耐高温、不冒黑烟。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 醒油<\/strong><\/p>\n<ol start=\"8\">\n<li>做好的油泼辣子盖上盖，焖一晚上再开，辣椒香和油充分融合，第二天颜色更深、味更香。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/107226741/\">下厨房 · 油泼辣子（秋雨欣欣）<\/a> —— 给出精准油温，适合对照「大厨版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV12C4y1H7py/\">正宗辣椒红油：油泼辣子 凉拌菜的灵魂 Chili Oil<\/a> —— 含香料油做法，适合对照「大厨版」<\/li>\n<\/ul>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "109", "name": "香菜拌牛肉", "title": "香菜拌牛肉", "category": "调味香料", "ingredient": "香菜", "ings": [["牛肉", "牛里脊", "牛腱"], ["香菜"], ["生抽"], ["料酒"], ["淀粉"], ["蒜"], ["小米辣"], ["白芝麻"], ["辣椒面"], ["陈醋", "香醋"], ["白糖"], ["食用油"], ["盐"]], "opt": [false, false, false, false, false, false, false, false, false, false, false, false, false], "tags": [], "html": "<h1>香菜拌牛肉<\/h1>\n<blockquote>\n<p>归属食材：香菜 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>牛肉嫩滑、香菜清爽，酸辣开胃，一烫一拌就能上桌。属性：凉菜。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、不难吃）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>牛肉（牛里脊 / 牛腱）<\/td>\n<td>300g<\/td>\n<td>逆纹切薄片<\/td>\n<\/tr>\n<tr>\n<td>香菜<\/td>\n<td>1 大把（约 80g）<\/td>\n<td>切长段，梗叶都用<\/td>\n<\/tr>\n<tr>\n<td>生抽<\/td>\n<td>2 汤匙<\/td>\n<td>腌 1 汤匙 + 拌 1 汤匙<\/td>\n<\/tr>\n<tr>\n<td>料酒<\/td>\n<td>1 汤匙<\/td>\n<td>去腥<\/td>\n<\/tr>\n<tr>\n<td>淀粉<\/td>\n<td>1 小勺<\/td>\n<td>让牛肉嫩滑<\/td>\n<\/tr>\n<tr>\n<td>蒜<\/td>\n<td>3 瓣<\/td>\n<td>切末<\/td>\n<\/tr>\n<tr>\n<td>小米辣<\/td>\n<td>1~2 个<\/td>\n<td>切圈，可不放<\/td>\n<\/tr>\n<tr>\n<td>白芝麻<\/td>\n<td>1 小勺<\/td>\n<td>增香<\/td>\n<\/tr>\n<tr>\n<td>辣椒面<\/td>\n<td>1 小勺<\/td>\n<td>可不放<\/td>\n<\/tr>\n<tr>\n<td>陈醋（或香醋）<\/td>\n<td>2 汤匙<\/td>\n<td>提酸<\/td>\n<\/tr>\n<tr>\n<td>白糖<\/td>\n<td>1/2 小勺<\/td>\n<td>提鲜<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>2 汤匙<\/td>\n<td>泼热油用<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>少许<\/td>\n<td>最后调<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 切牛肉<\/strong><\/p>\n<ol>\n<li>牛肉逆着肉纹切成薄片（刀和肉的纹理垂直）（逆纹切能把肌肉纤维切断，吃口才嫩不塞牙）。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 腌牛肉<\/strong><\/p>\n<ol start=\"2\">\n<li>牛肉加 1 汤匙生抽、料酒、淀粉抓匀。<\/li>\n<li>最后加半汤匙油抓匀，封住水分，腌 10 分钟（淀粉和油让牛肉焯水时锁住水分、更嫩滑）。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 调汁<\/strong><\/p>\n<ol start=\"4\">\n<li>碗里放蒜末、小米辣、白芝麻、辣椒面。<\/li>\n<li>另起锅烧 2 汤匙油到微微冒烟，泼进去激香。<\/li>\n<li>再加 1 汤匙生抽、陈醋、白糖拌匀（热油一激，蒜香和辣香全出来了）。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 煮牛肉<\/strong><\/p>\n<ol start=\"7\">\n<li>水开下牛肉，用筷子拨散。<\/li>\n<li>烫约 30~60 秒，看到颜色一变白 → 立刻捞出（久煮就老了），沥干。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 拌<\/strong><\/p>\n<ol start=\"9\">\n<li>牛肉加大量香菜段，倒料汁。<\/li>\n<li>戴手套抓拌均匀，尝味补盐，装盘。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>牛肉老<\/strong>：顺纹切或煮太久。逆纹切薄 + 水开下锅 30~60 秒就捞。<\/li>\n<li><strong>粘成一坨<\/strong>：下锅没拨散。水宽一点，下锅就用筷子拨开。<\/li>\n<li><strong>太酸 / 太辣<\/strong>：料汁先拌一点点再尝，醋和辣椒面都少量加。<\/li>\n<li><strong>香菜发蔫<\/strong>：香菜洗净后要沥干水再拌，否则出水冲淡味道。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/107052373/\">下厨房 · 香菜拌牛肉 好吃到离谱 夏日开胃菜<\/a> —— 一烫一拌快手做法，适合对照「初学版」<\/li>\n<li><a href=\"https://www.xiachufang.com/recipe/107382494/\">下厨房 · 香菜拌牛肉（陈老师）<\/a> —— 详细步骤，适合对照「初学版」焯水火候<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1bE42157zQ/\">10 分钟！一烫一拌！开胃下饭 · 香菜拌牛肉（哔哩哔哩）<\/a> —— 主打嫩滑多汁，适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：嫩牛肉 / 汁水层次 / 卤牛肉版）<\/h2>\n<p>在初学版基础上掌握下面四条，成品质感更好。<\/p>\n<p><strong>第 1 步 · 牛肉更嫩<\/strong><\/p>\n<ol>\n<li>腌肉时用葱姜水（葱姜拍碎泡水）代替部分料酒，或加半个蛋清，嫩度更高、去腥更自然。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 料汁分层<\/strong><\/p>\n<ol start=\"2\">\n<li>先用热油激香蒜末、辣椒面，再调入醋和糖。<\/li>\n<li>热油激发脂溶性香气，醋糖提供酸甜，层次更分明。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 卤牛肉版（更省事）<\/strong><\/p>\n<ol start=\"4\">\n<li>用现成卤牛腱切片代替鲜牛肉焯水，省去腌制和煮制，风味更浓（适合家里有卤水时复用）。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 提前冷藏<\/strong><\/p>\n<ol start=\"5\">\n<li>拌好后冷藏 10 分钟再吃，更入味、更爽口。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/106583997/\">下厨房 · 低卡减脂 · 香菜凉拌牛肉<\/a> —— 少油版料汁，适合对照「进阶版」调味<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p><strong>第 1 步 · 选部位<\/strong><\/p>\n<ol>\n<li>里脊最嫩、牛腱有嚼劲、肥牛片最省事，按想要的口感选。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 激油火候<\/strong><\/p>\n<ol start=\"2\">\n<li>油烧到八成热（冒青烟），泼在蒜末辣椒面上，香味全部激发。<\/li>\n<li>油温不够，香味出不来。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 最后点香<\/strong><\/p>\n<ol start=\"4\">\n<li>拌好前点几滴香油和几滴花椒油，增香提层次。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 香菜梗叶分开<\/strong><\/p>\n<ol start=\"5\">\n<li>香菜梗切细先拌，让它先入味。<\/li>\n<li>叶子后放，保持爽脆，口感层次分明。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.bilibili.com/video/BV1zA411L75S/\">据说这是香菜最好吃的做法！香菜牛肉真的绝了（哔哩哔哩）<\/a> —— 强调逆纹切牛里脊，适合对照「大厨版」选肉切法<\/li>\n<\/ul>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "110", "name": "凉拌海带丝", "title": "凉拌海带丝", "category": "干货", "ingredient": "海带", "ings": [["海带丝"], ["蒜"], ["生抽"], ["香醋", "米醋"], ["白糖"], ["盐"], ["香油"], ["小米辣"], ["香菜", "葱花"]], "opt": [false, false, false, false, false, false, false, false, false], "tags": [], "html": "<h1>凉拌海带丝<\/h1>\n<blockquote>\n<p>归属食材：海带 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>酸辣脆爽、蒜香开胃，是下饭解腻的快手凉菜。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、脆爽不难吃）<\/h2>\n<p><strong>食材（2~3 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>海带丝<\/td>\n<td>200g（干海带约 50g 泡发）<\/td>\n<td>干海带或盐渍海带皆可<\/td>\n<\/tr>\n<tr>\n<td>蒜<\/td>\n<td>3~4 瓣<\/td>\n<td>切蒜末<\/td>\n<\/tr>\n<tr>\n<td>生抽<\/td>\n<td>2 汤匙<\/td>\n<td>咸味主力<\/td>\n<\/tr>\n<tr>\n<td>香醋（或米醋）<\/td>\n<td>1 汤匙<\/td>\n<td>酸味<\/td>\n<\/tr>\n<tr>\n<td>白糖<\/td>\n<td>1 小勺（约 5g）<\/td>\n<td>提鲜、平衡酸辣<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>约 1/4 小勺（1g）<\/td>\n<td>海带和生抽有咸味，少放<\/td>\n<\/tr>\n<tr>\n<td>香油<\/td>\n<td>1 小勺<\/td>\n<td>增香<\/td>\n<\/tr>\n<tr>\n<td>小米辣（可选）<\/td>\n<td>1 个<\/td>\n<td>切圈，不吃辣可省<\/td>\n<\/tr>\n<tr>\n<td>香菜 / 葱花<\/td>\n<td>1 小撮<\/td>\n<td>点缀<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 泡发海带<\/strong><\/p>\n<ol>\n<li>干海带提前用清水泡 1~2 小时，泡到完全变软；盐渍海带先冲洗掉表面盐粒，再用清水泡 20~30 分钟去咸。<\/li>\n<li>看到海带变软、尝起来不齁咸 → 泡好了。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 切丝<\/strong><\/p>\n<ol start=\"3\">\n<li>泡好的海带叠起来卷成卷，切成细丝（约 0.5cm 宽），太长可再切短，方便入口和入味。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 焯水<\/strong><\/p>\n<ol start=\"4\">\n<li>锅里烧一锅水，水开后下海带丝。<\/li>\n<li>加几滴醋（去腥、更快煮软），煮 2~3 分钟。<\/li>\n<li>看到海带丝变软但仍带脆劲、不发黏 → 捞出。<\/li>\n<li>立刻放进凉水（有冰水更好）里过凉，沥干水分。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 调味拌匀<\/strong><\/p>\n<ol start=\"8\">\n<li>海带丝放进大碗，加蒜末、生抽、香醋、白糖、盐、香油和小米辣。<\/li>\n<li>用筷子翻拌均匀，腌 5 分钟入味，撒香菜或葱花即可。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>太咸<\/strong>：盐渍海带没泡够、又加盐。盐渍海带先泡去咸，盐少放或不放。<\/li>\n<li><strong>海带发硬<\/strong>：焯水时间太短或没泡发透。泡够时间、水开后再煮 2~3 分钟。<\/li>\n<li><strong>发腥发黏<\/strong>：没加醋焯水，或焯完没及时过凉水。加几滴醋去腥，捞出立刻过凉保脆。<\/li>\n<li><strong>不入味<\/strong>：拌完就吃。至少腌 5 分钟，冷藏半小时更入味。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/104728072/\">下厨房 · 凉拌海带（厨房小白也拿得出手的菜）<\/a> —— 冷水下锅煮 1 分钟 + 料汁淋面，适合对照「初学版」<\/li>\n<li><a href=\"http://mwx.douguo.com/cookbook/1323354.html\">豆果美食 · 凉拌黄瓜海带丝<\/a> —— 干海带泡发 + 加醋焯水去腥，适合对照「初学版」的泡发步骤<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1gA4y1R7xT/\">凉拌海带丝，酸辣脆爽，夏天开胃必备哦！（哔哩哔哩）<\/a> —— 酸辣脆爽的家常做法，适合对照「初学版 / 进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：保脆 / 去腥 / 料汁配比）<\/h2>\n<p><strong>第 1 步 · 保脆（焯水 + 冰水）<\/strong><\/p>\n<ol>\n<li>海带丝一定要<strong>水开后再下锅<\/strong>，煮 2~3 分钟即可，煮久了会发黏发烂。<\/li>\n<li>捞出后立刻过<strong>冰水<\/strong>，冷热交替让海带收紧。<\/li>\n<li>看到入口有「咔嚓」的脆感 → 保脆到位。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 去腥（加醋 / 料酒焯水）<\/strong><\/p>\n<ol start=\"4\">\n<li>焯水时加 1 小勺白醋或料酒，能明显去掉海带的腥味，也更快煮软。<\/li>\n<li>焯完过凉水后，用手把海带丝轻轻挤干，料汁才挂得住、不稀汤寡水。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 料汁配比（酸辣为主）<\/strong><\/p>\n<ol start=\"6\">\n<li>基础比例：生抽 2 汤匙 + 香醋 1 汤匙 + 白糖 1 小勺 + 香油 1 小勺。<\/li>\n<li>想吃酸辣版：加蒜末、小米辣，再淋 1 小勺辣椒油或花椒油。<\/li>\n<li>想吃更「香」：蒜末、小米辣、白芝麻放最上面，用 1 汤匙热油「泼」一下激香，再加料汁拌匀。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 腌渍更入味<\/strong><\/p>\n<ol start=\"9\">\n<li>拌好后盖保鲜膜，放冰箱冷藏 30 分钟到 1 小时再吃，风味明显更足。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/104534217/\">下厨房 · 简单又好吃的凉拌海带丝<\/a> —— 豆瓣酱热油激香 + 静置半小时入味，适合对照「进阶版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1Gh6vBnEPQ/\">酸辣海带丝和扇贝粉丝煲（哔哩哔哩）<\/a> —— 凉菜调味诀窍，适合对照「进阶版 / 大厨版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与层次）<\/h2>\n<p>追求「根根分明、酸辣蒜香有层次、脆而不腥」。<\/p>\n<p><strong>第 1 步 · 海带选料与处理<\/strong><\/p>\n<ol>\n<li>凉拌首选<strong>厚脆的海带丝或海带头切丝<\/strong>，口感最好。<\/li>\n<li>干海带提前泡 1~2 小时，泡发后用清水反复搓洗掉黏液和表面杂质（去腥的基础）。<\/li>\n<li>盐渍海带冲洗掉盐粒后，泡水时间不要太长（20 分钟即可），保留海带本身的鲜味。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 焯水控时<\/strong><\/p>\n<ol start=\"4\">\n<li>水中加 1 小勺白醋 + 几片姜，水大开后下海带，煮 2 分钟左右。<\/li>\n<li>看到能咬断但仍脆 → 捞出。<\/li>\n<li>立刻过冰水，凉透后挤干，越干越能挂汁。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 蒜香的层次<\/strong><\/p>\n<ol start=\"7\">\n<li>蒜末分两份：一份直接拌进海带，一份铺在最上面。<\/li>\n<li>热油泼在蒜末、小米辣、白芝麻上，激出香味（既有「生蒜的冲劲」又有「熟蒜的香气」）。<\/li>\n<li>再加生抽、香醋、糖、香油拌匀。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 静置入味<\/strong><\/p>\n<ol start=\"10\">\n<li>拌好后至少静置 20 分钟再上桌；冷藏 1 小时风味最佳。<\/li>\n<li>上桌前再补几滴香油、撒香菜段提香。<\/li>\n<\/ol>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "111", "name": "蚂蚁上树", "title": "蚂蚁上树（肉末粉丝）", "category": "干货", "ingredient": "粉丝", "ings": [["粉丝"], ["猪肉末"], ["姜"], ["蒜"], ["葱"], ["郫县豆瓣酱"], ["生抽"], ["老抽"], ["白糖"], ["食用油"], ["清水"]], "opt": [false, false, false, false, false, false, false, true, false, false, false], "tags": [], "html": "<h1>蚂蚁上树（肉末粉丝）<\/h1>\n<blockquote>\n<p>归属食材：粉丝 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>肉末咸香、粉丝吸饱汤汁又根根分明，豆瓣酱的微辣酱香最下饭。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、不糊锅、不难吃）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>粉丝<\/td>\n<td>2 把（约 100g）<\/td>\n<td>红薯粉丝或龙口粉丝皆可<\/td>\n<\/tr>\n<tr>\n<td>猪肉末<\/td>\n<td>150g<\/td>\n<td>三分肥七分瘦更香<\/td>\n<\/tr>\n<tr>\n<td>姜<\/td>\n<td>3~4 片<\/td>\n<td>切末<\/td>\n<\/tr>\n<tr>\n<td>蒜<\/td>\n<td>3~4 瓣<\/td>\n<td>切末<\/td>\n<\/tr>\n<tr>\n<td>葱<\/td>\n<td>1 根<\/td>\n<td>葱白切末爆香、葱绿切花<\/td>\n<\/tr>\n<tr>\n<td>郫县豆瓣酱<\/td>\n<td>1 汤匙<\/td>\n<td>切碎再用，提味<\/td>\n<\/tr>\n<tr>\n<td>生抽<\/td>\n<td>1 汤匙<\/td>\n<td>咸鲜<\/td>\n<\/tr>\n<tr>\n<td>老抽<\/td>\n<td>1/2 汤匙<\/td>\n<td>上色（可选）<\/td>\n<\/tr>\n<tr>\n<td>白糖<\/td>\n<td>1/2 小勺（约 2g）<\/td>\n<td>中和豆瓣酱咸辣<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>2 汤匙<\/td>\n<td>炒肉末用<\/td>\n<\/tr>\n<tr>\n<td>清水<\/td>\n<td>约 1 小碗（150~200ml）<\/td>\n<td>让粉丝吸汁<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点，全程中大火，最后收汁）<\/strong><\/p>\n<p><strong>第 1 步 · 泡软粉丝<\/strong><\/p>\n<ol>\n<li>粉丝剪成 15cm 左右的段，放进 40℃ 左右温水中泡 15~20 分钟。<\/li>\n<li>泡到能用指甲掐断、但中心还有一点韧性 → 捞出，沥干水分（别泡到软烂）。<\/li>\n<li>看到粉丝变软但不发胀、不粘成一坨 → 泡好了。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 煸香肉末<\/strong><\/p>\n<ol start=\"4\">\n<li>锅烧热倒油，下肉末。<\/li>\n<li>中火用铲子把肉末划散，煸炒约 3 分钟。<\/li>\n<li>看到肉末变色、肥肉部分析出油、表面微微焦黄 → 肉末煸香了。<\/li>\n<li>加姜末、蒜末、葱白末炒香。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 炒酱调味<\/strong><\/p>\n<ol start=\"8\">\n<li>加豆瓣酱，转中小火炒出红油（约 30 秒，闻到酱香、油变红）。<\/li>\n<li>再加生抽、老抽、白糖和清水，煮开。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 下粉丝收汁<\/strong><\/p>\n<ol start=\"10\">\n<li>放入泡好的粉丝，用筷子轻轻拨散、翻拌，让粉丝均匀裹上汤汁。<\/li>\n<li>中小火焖 2~3 分钟。<\/li>\n<li>等汤汁基本收干、粉丝变透明入味 → 撒葱花，翻两下出锅。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>粉丝泡烂成坨<\/strong>：泡太久或水温太高。温水泡 15~20 分钟、留一点韧性就捞出。<\/li>\n<li><strong>粘锅<\/strong>：下粉丝后一直大火猛炒。改中小火、少翻拌，让粉丝慢慢吸汁。<\/li>\n<li><strong>粉丝发硬没入味<\/strong>：水加太少或焖的时间不够。水约 1 小碗，焖到粉丝变透明。<\/li>\n<li><strong>太咸<\/strong>：豆瓣酱本身很咸，生抽要少放，尝一口再决定加不加盐。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/107655733/\">下厨房 · 蚂蚁上树（小花点私房菜）<\/a> —— 步骤图详细，适合对照「初学版 / 进阶版」<\/li>\n<li><a href=\"https://mbdbj.xiachufang.com/recipe/107501446/\">下厨房 · 蚂蚁上树，家常简单省时版<\/a> —— 下饭神器、快手版，适合对照「初学版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1Ng411g7QQ/\">【蚂蚁上树】肉末与粉条原来这么般配，三碗饭起步！（哔哩哔哩）<\/a> —— 小白快手菜，适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：泡而不烂 / 肉末干香 / 吸汁不粘锅）<\/h2>\n<p><strong>第 1 步 · 粉丝泡软不烂<\/strong><\/p>\n<ol>\n<li>用<strong>温水<\/strong>（约 40℃）泡，不要用开水（开水会把粉丝泡发过头、一炒就断）。<\/li>\n<li>泡好后<strong>沥干水分<\/strong>，最好再用厨房纸吸一下表面水分（水分多会稀汤寡味、容易粘锅）。<\/li>\n<li>泡好的粉丝淋几滴油抓散，可防粘连。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 肉末煸香<\/strong><\/p>\n<ol start=\"4\">\n<li>肉末先用 1 小勺料酒 + 少许姜末腌 5 分钟，去腥更香。<\/li>\n<li>肉末下锅先<strong>摊开不动<\/strong>，让它底部煎出焦香，再划散翻炒。<\/li>\n<li>煸到肥肉出油、瘦肉微焦 → 有「干香」。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 豆瓣酱提味<\/strong><\/p>\n<ol start=\"7\">\n<li>郫县豆瓣酱用刀<strong>剁碎<\/strong>再用，酱香味更均匀释放。<\/li>\n<li>中小火炒出红油，看到油变红、出香味 → 再下别的料（这是整道菜的灵魂）。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 粉丝吸汁不粘锅<\/strong><\/p>\n<ol start=\"9\">\n<li>粉丝下锅后改<strong>中小火<\/strong>，用<strong>筷子<\/strong>（不是铲子）轻轻拨散，少翻拌，让粉丝慢慢吸满汤汁。<\/li>\n<li>水量控制在小半碗到一碗之间，焖到粉丝变透明、汤汁快收干 → 保留一点汤汁更润，即可出锅。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/107565396/\">下厨房 · 蚂蚁上树（七月姐姐家的小厨房）<\/a> —— 经典豆瓣酱版，适合对照「进阶版」的酱料处理<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1mW411m7zf/\">蚂蚁上树：看肉末悄悄地爬上来～（哔哩哔哩）<\/a> —— 豆瓣酱与葱姜蒜香的结合，适合对照「进阶版 / 大厨版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「粉丝油亮、根根分明、肉末干香、出锅有锅气」。<\/p>\n<p><strong>第 1 步 · 选料<\/strong><\/p>\n<ol>\n<li>首选<strong>红薯粉丝<\/strong>，耐煮、吸汁后口感好；龙口粉丝更细、更易熟，适合快手版。<\/li>\n<li>肉末选<strong>三分肥七分瘦<\/strong>，肥肉是香气的来源，太瘦会柴。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 粉丝预处理<\/strong><\/p>\n<ol start=\"3\">\n<li>温水泡到「软而不烂、中心还带一点白芯」→ 捞出，挤干水分（这个状态才能在吸汁时既有嚼劲又入味）。<\/li>\n<li>泡好的粉丝拌一点老抽提前上个底色，成菜颜色更均匀。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 先炒肉末出油、再下酱<\/strong><\/p>\n<ol start=\"5\">\n<li>锅烧热下冷油，肉末下锅用中大火煸到<strong>肥肉吐出油、瘦肉边缘焦黄<\/strong>、锅底有滋滋声。<\/li>\n<li>下姜蒜末爆香，再下剁碎的豆瓣酱，转小火炒出红油。<\/li>\n<li>顺序别反：先肉后酱，肉末才有干香；酱后下，避免酱炒焦发苦。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 加汤收汁与锅气<\/strong><\/p>\n<ol start=\"8\">\n<li>加清水（或高汤）煮开后下粉丝，中小火焖到粉丝吸汁、变透明。<\/li>\n<li>最后转<strong>大火<\/strong>快速收汁，沿锅边淋几滴香醋和香油，颠两下锅，让锅气出来、粉丝挂满亮亮的酱汁。<\/li>\n<li>出锅前撒葱花，趁热吃（放久了粉丝会继续吸汁、变干）。<\/li>\n<\/ol>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "112", "name": "紫菜蛋花汤", "title": "紫菜蛋花汤", "category": "干货", "ingredient": "紫菜", "ings": [["紫菜"], ["鸡蛋"], ["虾皮"], ["盐"], ["白胡椒粉"], ["香油"], ["葱花", "香菜"], ["清水"]], "opt": [false, false, false, false, true, false, false, false], "tags": [], "html": "<h1>紫菜蛋花汤<\/h1>\n<blockquote>\n<p>归属食材：紫菜 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>汤清味鲜、蛋花轻盈如絮，几分钟就能上桌的百搭快手汤。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做好、蛋花成絮、不难喝）<\/h2>\n<p><strong>食材（2~3 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>紫菜<\/td>\n<td>1 小片（约 3~5g）<\/td>\n<td>免洗紫菜直接用，普通紫菜冲一下<\/td>\n<\/tr>\n<tr>\n<td>鸡蛋<\/td>\n<td>2 个<\/td>\n<td>打散成蛋液<\/td>\n<\/tr>\n<tr>\n<td>虾皮（可选）<\/td>\n<td>1 小撮<\/td>\n<td>提鲜<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>约 1/2 小勺（2g）<\/td>\n<td>分次放<\/td>\n<\/tr>\n<tr>\n<td>白胡椒粉<\/td>\n<td>1/4 小勺<\/td>\n<td>提味（可选）<\/td>\n<\/tr>\n<tr>\n<td>香油<\/td>\n<td>几滴<\/td>\n<td>出锅前滴<\/td>\n<\/tr>\n<tr>\n<td>葱花 / 香菜<\/td>\n<td>1 小撮<\/td>\n<td>出锅前撒<\/td>\n<\/tr>\n<tr>\n<td>清水<\/td>\n<td>约 600~800ml<\/td>\n<td>汤底<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点，全程中火，很快）<\/strong><\/p>\n<p><strong>第 1 步 · 准备<\/strong><\/p>\n<ol>\n<li>紫菜用手撕成小片放碗里（普通紫菜用清水快速冲一下去沙，免洗紫菜跳过）。<\/li>\n<li>鸡蛋磕进碗里，充分打散备用。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 烧水<\/strong><\/p>\n<ol start=\"3\">\n<li>锅里加清水烧开（约 3 分钟）。<\/li>\n<li>加盐和白胡椒粉调味。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 淋蛋液成花<\/strong><\/p>\n<ol start=\"5\">\n<li>水开后<strong>关小火<\/strong>（保持微沸）。<\/li>\n<li>把蛋液从高处、画圈式慢慢淋进锅里，先别搅动。<\/li>\n<li>等蛋液浮起成絮（约 5 秒），再用勺子背轻轻推一下，蛋花就散开了。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 出锅加紫菜<\/strong><\/p>\n<ol start=\"8\">\n<li>关火，把撕好的紫菜和虾皮放进锅里（或直接放碗里再冲入蛋花汤）。<\/li>\n<li>撒葱花、滴几滴香油即可（紫菜不用久煮，一烫就软）。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>蛋花成团成块<\/strong>：火太大或蛋液一下全倒进去。转小火、画圈慢慢淋，先别搅。<\/li>\n<li><strong>汤浑浊<\/strong>：蛋液淋入后马上猛搅。先等蛋花定型再轻推。<\/li>\n<li><strong>紫菜煮老了<\/strong>：紫菜放进锅里一直煮。紫菜一烫就熟，出锅前放即可。<\/li>\n<li><strong>太咸<\/strong>：盐一次性放多。先少放，出锅前尝一口再补。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"http://mwx.douguo.com/cookbook/2459964.html\">豆果美食 · 紫菜蛋花汤（正确打开姿势）<\/a> —— 水开调味后倒蛋液、关火撕紫菜焖半分钟，适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：蛋花 / 提鲜 / 紫菜处理）<\/h2>\n<p><strong>第 1 步 · 蛋液淋成漂亮蛋花<\/strong><\/p>\n<ol>\n<li>水烧开后<strong>转小火或直接关火<\/strong>，让水面保持微沸或刚停滚，再淋蛋液，蛋花才轻、薄、成絮。<\/li>\n<li>蛋液要<strong>从高处、绕圈、细流慢慢淋<\/strong>，淋完先等 5 秒让它定型。<\/li>\n<li>再用勺背轻轻推，别用勺搅。<\/li>\n<li>蛋液里加 1 小勺水或几滴香油打散，蛋花更嫩滑。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 提鲜（虾皮 / 水淀粉）<\/strong><\/p>\n<ol start=\"5\">\n<li>加一小撮虾皮，汤的鲜味立刻不一样（虾皮可先干锅小火烘一下或直接下锅）。<\/li>\n<li>想要饭店那种「顺滑、蛋花悬浮」的口感，水开后先倒一点水淀粉（1 小勺淀粉 + 2 汤匙水调匀）勾个薄芡，再淋蛋液。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 紫菜处理<\/strong><\/p>\n<ol start=\"7\">\n<li>普通紫菜冲水去沙；想要更香，可把紫菜放干锅小火烘 10 秒，或撕碎后先放碗里，用热汤冲入，鲜味更足。<\/li>\n<li>紫菜<strong>千万不用久煮<\/strong>，久煮会软烂发黏、失去鲜味，出锅前加即可。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 调味配比<\/strong><\/p>\n<ol start=\"9\">\n<li>盐 + 白胡椒粉 + 香油是基础；想更丰富可加西红柿丁、虾皮、香菜。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"http://mwx.douguo.com/cookbook/3246290.html\">豆果美食 · 紫菜蛋花汤（蓉小厨）<\/a> —— 紫菜放碗底、热汤冲入 + 淀粉水蛋花，适合对照「进阶版 / 大厨版」<\/li>\n<li><a href=\"http://mwx.douguo.com/cookbook/3144475.html\">豆果美食 · 紫菜蛋花汤（视频版）<\/a> —— 水淀粉 + 关火淋蛋液技巧，适合对照「进阶版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV14K411e73N/\">紫菜蛋花汤｜片絮如云朵的蛋花一看就会（哔哩哔哩）<\/a> —— 打蛋花技巧，适合对照「进阶版 / 大厨版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「汤清见底、蛋花片絮如云、紫菜鲜而不烂」。<\/p>\n<p><strong>第 1 步 · 紫菜先烘香<\/strong><\/p>\n<ol>\n<li>普通紫菜放干锅，小火烘 10~15 秒（别烘糊），烘出香味后撕碎放碗底。<\/li>\n<li>虾皮也干锅小火烘香，热汤一冲，香气立刻激发。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 蛋液与蛋花<\/strong><\/p>\n<ol start=\"3\">\n<li>蛋液充分打散，加几滴香油和 1 小勺清水，打匀到表面起细泡。<\/li>\n<li>水烧开后<strong>关小火<\/strong>，让水面只有细小的气泡翻动。<\/li>\n<li>蛋液<strong>贴着锅边、转圈、细流<\/strong>淋入，淋完静置 5 秒。<\/li>\n<li>用勺背沿锅边轻轻推一圈，蛋花即大片成絮（秘诀是「先定型再轻推」，忌猛搅）。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 勾薄芡（可选）<\/strong><\/p>\n<ol start=\"7\">\n<li>想蛋花悬浮不沉底、汤有轻微挂口感，淋蛋液前先倒入薄薄的水淀粉，边倒边搅。<\/li>\n<li>汤变微稠后关小火，再淋蛋液。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 出锅前下紫菜<\/strong><\/p>\n<ol start=\"9\">\n<li>关火后再下紫菜和虾皮，靠余温烫软，紫菜保持鲜绿不烂。<\/li>\n<li>撒葱花、滴香油，趁热上桌（紫菜久煮会褪色发黏，这一锅的「鲜」就在这最后一步）。<\/li>\n<\/ol>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "113", "name": "虾皮蒸蛋", "title": "虾皮蒸蛋", "category": "干货", "ingredient": "虾皮", "ings": [["鸡蛋"], ["虾皮"], ["温水"], ["盐"], ["生抽"], ["香油"], ["葱花"]], "opt": [false, false, false, false, false, false, false], "tags": [], "html": "<h1>虾皮蒸蛋<\/h1>\n<blockquote>\n<p>归属食材：虾皮 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>蛋羹嫩滑如布丁，虾皮咸鲜补钙，清淡又下饭。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能蒸熟、不蜂窝、不难吃）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>鸡蛋<\/td>\n<td>3 个<\/td>\n<td>常温蛋更好打散<\/td>\n<\/tr>\n<tr>\n<td>虾皮<\/td>\n<td>1 汤匙（约 10g）<\/td>\n<td>温水泡洗去咸去沙<\/td>\n<\/tr>\n<tr>\n<td>温水<\/td>\n<td>约蛋液的 1~1.5 倍<\/td>\n<td>五六十度，别用开水<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>约 1/4 小勺（1g）<\/td>\n<td>虾皮有咸味，少放<\/td>\n<\/tr>\n<tr>\n<td>生抽<\/td>\n<td>1 小勺<\/td>\n<td>出锅后淋<\/td>\n<\/tr>\n<tr>\n<td>香油<\/td>\n<td>几滴<\/td>\n<td>出锅后淋<\/td>\n<\/tr>\n<tr>\n<td>葱花<\/td>\n<td>1 小撮<\/td>\n<td>点缀<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 泡洗虾皮<\/strong><\/p>\n<ol>\n<li>虾皮放进小碗，加温水泡 5 分钟。<\/li>\n<li>用手轻轻搅一搅，让盐和细沙沉底，再倒掉水、用清水冲一遍，挤干水分。<\/li>\n<li>尝一粒不太咸、没有硌牙的沙粒 → 洗好了（虾皮本身咸，这一步很关键）。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 打蛋液<\/strong><\/p>\n<ol start=\"4\">\n<li>鸡蛋磕进碗里，加盐。<\/li>\n<li>用筷子朝一个方向打散，打到蛋清蛋黄完全融合、表面起细沫。<\/li>\n<li>倒入 1~1.5 倍蛋液量的温水（五六十度），边倒边搅匀。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 过滤装碗<\/strong><\/p>\n<ol start=\"7\">\n<li>把蛋液用滤网过一遍，去掉泡沫和没打散的蛋筋，倒进深一点的碗。<\/li>\n<li>表面还有浮沫就用小勺撇掉，撒上泡洗好的虾皮。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 蒸制<\/strong><\/p>\n<ol start=\"9\">\n<li>蒸锅水烧开后，把碗放进去，上面盖一个盘子（或蒙一层耐热保鲜膜、扎几个小孔）。<\/li>\n<li>转<strong>中火<\/strong>蒸 10~12 分钟。<\/li>\n<li>轻轻晃碗，蛋液中心已经凝固、不流动、表面平整 → 蒸好了。<\/li>\n<li>关火后再虚蒸（盖着焖）2 分钟，出锅淋生抽和香油、撒葱花。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>蒸出蜂窝<\/strong>：火太大、没盖盖、或蒸太久。水开后用中火，碗上盖盘防滴水，10 分钟左右就够。<\/li>\n<li><strong>蛋羹发硬发老<\/strong>：蒸太久或水太少。蛋水比例至少 1 : 1，最多 1 : 1.5。<\/li>\n<li><strong>太咸<\/strong>：虾皮没泡洗就直接撒，还额外加盐。虾皮先温水泡洗，盐少放。<\/li>\n<li><strong>蛋液有沙或腥<\/strong>：虾皮没泡洗干净。泡 5 分钟、冲一遍再挤干。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/107726528/\">下厨房 · 虾皮蒸蛋<\/a> —— 基础版步骤，适合对照「初学版」<\/li>\n<li><a href=\"https://www.xiachufang.com/recipe/102902820/\">下厨房 · 虾皮蒸蛋<\/a> —— 适合对照「初学版 / 进阶版」的蒸制时间<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1RV4y1v7wX/\">虾皮鸡蛋羹做法（哔哩哔哩）<\/a> —— 比例和火候讲解，适合对照「初学版 / 进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：嫩滑 / 无气孔 / 虾皮增香）<\/h2>\n<p><strong>第 1 步 · 蛋水比例（嫩滑的关键）<\/strong><\/p>\n<ol>\n<li>蛋液 : 温水 = <strong>1 : 1.5<\/strong> 左右最嫩滑；水越多越嫩，但超过 1.5 倍容易不成形。<\/li>\n<li>用<strong>温水<\/strong>（五六十度）蒸出来更嫩；冷水蛋羹偏硬，开水会直接把蛋液烫成蛋花。<\/li>\n<li>没有量杯时，用半个蛋壳当量杯：3 个蛋约加 6~9 个「半蛋壳」的温水。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 无气孔（过滤 + 撇沫 + 盖盖）<\/strong><\/p>\n<ol start=\"4\">\n<li>蛋液过筛一遍，去掉蛋筋和大气泡；表面浮沫撇干净。<\/li>\n<li>蒸的时候碗上盖盘或蒙保鲜膜，防止水汽滴落砸出蜂窝，成品表面才平整。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 虾皮增香<\/strong><\/p>\n<ol start=\"6\">\n<li>虾皮温水泡洗去咸去沙后，可先用少许油小火煸香再撒进蛋液，香味更浓；不煸直接撒也可以。<\/li>\n<li>虾皮有咸味，盐最多放 1/4 小勺，甚至可以不放盐，靠虾皮和出锅后的生抽提味。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 火候与虚蒸<\/strong><\/p>\n<ol start=\"8\">\n<li>水开后<strong>中火<\/strong>蒸 10~12 分钟（碗越深时间略长）。<\/li>\n<li>关火后不要马上开盖，<strong>虚蒸 2~3 分钟<\/strong>再出锅，蛋羹更嫩、不回缩。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/101790828/\">下厨房 · 虾皮蒸蛋<\/a> —— 温水 + 过筛 + 保鲜膜的嫩滑做法，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与层次）<\/h2>\n<p>追求「嫩如豆腐、表面镜面般平整、虾皮鲜香不腥」。<\/p>\n<p><strong>第 1 步 · 蛋液处理<\/strong><\/p>\n<ol>\n<li>3 个蛋加盐打散后，冲入 1.5 倍的五六十度温水，搅匀。<\/li>\n<li><strong>过筛两遍<\/strong>，去掉所有泡沫和蛋筋（这是「镜面蒸蛋」的基础）。<\/li>\n<li>装碗后表面若有小泡，用喷枪轻扫或小勺刮掉；没有工具就静置 1 分钟让泡上浮再撇。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 虾皮预处理<\/strong><\/p>\n<ol start=\"4\">\n<li>虾皮温水泡 5 分钟去咸去沙，挤干。<\/li>\n<li>用一点点油<strong>小火煸到微黄出香<\/strong>，再撒进蛋液（煸过的虾皮鲜香更足、腥味更少）。<\/li>\n<li>想更精致，可把一半虾皮煸香、一半直接撒，口感层次更丰富。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 蒸制细节<\/strong><\/p>\n<ol start=\"7\">\n<li>蒸锅水要<strong>先烧开再放碗<\/strong>，蒸汽足、受热均匀；碗上盖一个比碗口大的盘子，防止冷凝水滴落。<\/li>\n<li>全程<strong>中火<\/strong>（火太大蛋羹会鼓泡起蜂窝，太小则蒸不熟）。<\/li>\n<li>蒸约 10~12 分钟后关火，<strong>虚蒸 2 分钟<\/strong>，让余温把中心烘透又不至于老。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 出锅调味<\/strong><\/p>\n<ol start=\"10\">\n<li>出锅后淋 1 小勺生抽（或蒸鱼豉油）+ 几滴香油，再撒葱花。<\/li>\n<li>生抽沿碗边淋，别直接倒在中间，成色更好看。<\/li>\n<\/ol>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "114", "name": "冰糖银耳羹", "title": "冰糖银耳羹", "category": "干货", "ingredient": "银耳", "ings": [["干银耳"], ["冰糖"], ["枸杞"], ["红枣"], ["清水"]], "opt": [false, false, false, false, false], "tags": ["甜"], "html": "<h1>冰糖银耳羹<\/h1>\n<blockquote>\n<p>归属食材：银耳 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>胶质浓稠、清甜润口，冷热皆宜的养颜甜品。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能炖熟、出胶、不难喝）<\/h2>\n<p><strong>食材（3~4 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>干银耳<\/td>\n<td>1 朵（约 15~20g）<\/td>\n<td>冷水充分泡发<\/td>\n<\/tr>\n<tr>\n<td>冰糖<\/td>\n<td>30~40g<\/td>\n<td>出锅前 20 分钟放<\/td>\n<\/tr>\n<tr>\n<td>枸杞（可选）<\/td>\n<td>1 小撮<\/td>\n<td>关火前放<\/td>\n<\/tr>\n<tr>\n<td>红枣（可选）<\/td>\n<td>4~5 颗<\/td>\n<td>去核，可同炖<\/td>\n<\/tr>\n<tr>\n<td>清水<\/td>\n<td>约 1.5~2 升<\/td>\n<td>一次加足<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点，全程以小火慢炖为主）<\/strong><\/p>\n<p><strong>第 1 步 · 泡发银耳<\/strong><\/p>\n<ol>\n<li>干银耳放进大碗，加足量<strong>冷水<\/strong>（不要用热水，热水泡不出胶），水要没过银耳，泡 2 小时以上，最好泡过夜。<\/li>\n<li>看到银耳完全涨发、体积明显变大、摸起来软 → 泡好了。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 处理银耳<\/strong><\/p>\n<ol start=\"3\">\n<li>剪掉底部发黄的硬根（这个部分不出胶）。<\/li>\n<li>把银耳撕成小朵（<strong>撕得越小越容易出胶<\/strong>），用清水再冲洗一遍。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 慢炖出胶<\/strong><\/p>\n<ol start=\"5\">\n<li>银耳放进汤锅，加清水一次加足。<\/li>\n<li>大火烧开（约 10 分钟）后转<strong>小火<\/strong>，盖上盖子炖 1.5~2 小时。<\/li>\n<li>看到汤汁变得浓稠、有黏滑的胶质感、银耳软糯 → 出胶了。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 放冰糖出锅<\/strong><\/p>\n<ol start=\"8\">\n<li>炖到出胶后加冰糖，再小火煮 15~20 分钟，让冰糖融化、味道渗进去。<\/li>\n<li>关火前放枸杞，搅匀即可。<\/li>\n<li>尝一口甜度合适、汤汁挂勺 → 出锅。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>不出胶<\/strong>：用热水泡发、银耳撕太大块、或炖的时间不够。冷水泡发、撕小朵、小火炖 1.5 小时以上。<\/li>\n<li><strong>发酸发苦<\/strong>：银耳没洗干净，或底部黄根没剪干净。黄根一定剪掉。<\/li>\n<li><strong>冰糖放太早<\/strong>：冰糖早放会让银耳久煮发酸。等出胶后再放。<\/li>\n<li><strong>糊锅<\/strong>：水太少或火太大。水一次加足，小火慢炖，中途不够加热水。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/103711671/\">下厨房 · 超 easy 冰糖银耳羹<\/a> —— 冷水泡发 1 小时、沸水下锅滚 5 分钟转中小火、冰糖 40 分钟时加，适合对照「初学版 / 进阶版」<\/li>\n<li><a href=\"https://hanwuji.xiachufang.com/recipe/100471554/\">下厨房 · 银耳羹（用户菜谱）<\/a> —— 银耳羹单篇菜谱，适合对照「初学版」的炖煮步骤<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1wT4y1R7Qm/\">干燥季节，喝口热乎乎甜丝丝的银耳汤（哔哩哔哩）<\/a> —— 冰糖梨银耳汤家常做法，适合对照「初学版 / 进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：出胶 / 撕朵 / 冰糖后放）<\/h2>\n<p><strong>第 1 步 · 冷水充分泡发（出胶的前提）<\/strong><\/p>\n<ol>\n<li>银耳一定要用<strong>冷水<\/strong>泡发 2 小时以上，最好是隔夜冷藏泡（热水泡会让表面胶质提前糊化，反而炖不出浓稠的胶）。<\/li>\n<li>泡发后体积会涨 2~3 倍，碗要够大、水要没过。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 撕小朵（出胶的关键）<\/strong><\/p>\n<ol start=\"3\">\n<li>泡发后把银耳<strong>撕得越小越好<\/strong>，断面越多，越容易把胶质熬进汤里（有人用剪刀剪成碎末，出胶更快更浓）。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 慢炖出胶<\/strong><\/p>\n<ol start=\"4\">\n<li>大火烧开转小火，炖 <strong>1.5~2 小时<\/strong>。<\/li>\n<li>看到汤汁变黏、有拉丝感、银耳软糯半透明 → 出胶了。<\/li>\n<li>想要更快出胶，炖 40 分钟时用勺子在锅里朝一个方向搅 1~2 分钟，帮助胶质析出。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 冰糖后放<\/strong><\/p>\n<ol start=\"7\">\n<li>冰糖在<strong>出锅前 20 分钟<\/strong>放，既让甜味进去，又不会因久煮而发酸。<\/li>\n<li>红枣可在炖到一半时加入，枸杞在关火前放（久煮会烂、褪色）。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://m.meishichina.com/recipe/457231/\">美食天下 · 冰糖银耳雪梨羹<\/a> —— 银耳 + 雪梨搭配，适合对照「进阶版」的配料变化<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与层次）<\/h2>\n<p>追求「胶质浓稠如羹、清甜不腻、银耳软糯入口即化」。<\/p>\n<p><strong>第 1 步 · 选料<\/strong><\/p>\n<ol>\n<li>选<strong>朵大、色淡黄、无硫熏<\/strong>的干银耳；硫熏银耳颜色过白、有刺鼻味，泡发时多换几次水。<\/li>\n<li>新鲜银耳出胶更快，但干银耳香气更清，各有取舍。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 泡发与处理<\/strong><\/p>\n<ol start=\"3\">\n<li>冷水（可加一点点盐）泡 2 小时以上或隔夜。<\/li>\n<li>泡发后剪掉黄根，撕成<strong>指甲盖大小的碎朵<\/strong>，断面越多出胶越足。<\/li>\n<li>撕好后用清水反复冲洗，洗掉表面杂质和浮沫。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 火候与搅动<\/strong><\/p>\n<ol start=\"6\">\n<li>银耳下锅加足量冷水，大火烧开后转小火，盖子留一条缝（防扑锅），炖 1.5~2 小时。<\/li>\n<li>炖到 40~60 分钟时，用勺子朝一个方向搅 1~2 分钟，能明显加速出胶。<\/li>\n<li>之后每 20 分钟轻轻搅一次，防粘底。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 冰糖与配料的分层加入<\/strong><\/p>\n<ol start=\"9\">\n<li>冰糖在出锅前 20 分钟加入（加早了银耳久煮会发酸、甜味也发闷）。<\/li>\n<li>红枣去核、炖到一半时下（甜香融入汤中）；枸杞、桂圆、莲子等最后 10 分钟下，保持口感与色泽。<\/li>\n<li>炖好后自然放凉或冷藏，胶质会更浓；冷藏后吃口感更爽滑。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.bilibili.com/video/BV1kK4y1v73p/\">闷热的夏天来一碗醪糟冰糖炖银耳（哔哩哔哩）<\/a> —— 国宴甜品做法，适合对照「大厨版」<\/li>\n<\/ul>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "115", "name": "香菇炖鸡汤", "title": "香菇炖鸡汤", "category": "干货", "ingredient": "香菇干", "ings": [["干香菇"], ["鸡"], ["姜"], ["料酒"], ["盐"], ["枸杞"], ["清水"]], "opt": [false, false, false, false, false, false, false], "tags": [], "html": "<h1>香菇炖鸡汤<\/h1>\n<blockquote>\n<p>归属食材：香菇干 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>汤清味鲜，鸡肉软烂不柴，干香菇特有的菌香比鲜香菇更浓，一锅喝汤吃鸡两不误。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、汤鲜不难喝）<\/h2>\n<p><strong>食材（2~3 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>干香菇<\/td>\n<td>6~8 朵<\/td>\n<td>温水泡发，比鲜香菇更香<\/td>\n<\/tr>\n<tr>\n<td>鸡<\/td>\n<td>半只（约 500g）<\/td>\n<td>三黄鸡、鸡腿皆可<\/td>\n<\/tr>\n<tr>\n<td>姜<\/td>\n<td>4~5 片<\/td>\n<td>去腥<\/td>\n<\/tr>\n<tr>\n<td>料酒<\/td>\n<td>1 汤匙<\/td>\n<td>焯水用<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>约 1 小勺（5g）<\/td>\n<td>出锅前再放<\/td>\n<\/tr>\n<tr>\n<td>枸杞（可选）<\/td>\n<td>1 小撮<\/td>\n<td>出锅前放<\/td>\n<\/tr>\n<tr>\n<td>清水<\/td>\n<td>约 1.5~2 升<\/td>\n<td>一次加足<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点，全程以小火炖为主）<\/strong><\/p>\n<p><strong>第 1 步 · 泡发香菇<\/strong><\/p>\n<ol>\n<li>干香菇放进大碗，倒 40℃ 左右的温水（手伸进去不烫），水要没过香菇，上面压个小盘防止浮起，泡 30~40 分钟。<\/li>\n<li>看到香菇完全变软、捏起来没有硬心 → 泡好了。<\/li>\n<li>泡发水先别倒，静置后留上层清汤备用（底部细沙倒掉）。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 处理鸡肉<\/strong><\/p>\n<ol start=\"4\">\n<li>鸡块用清水冲洗几遍，去血水。<\/li>\n<li>冷水下锅，加姜片和料酒，开中火煮到水开（约 5 分钟）。<\/li>\n<li>水面冒出灰白浮沫时用勺子撇掉，再煮 2 分钟捞出。<\/li>\n<li>用温水冲净表面（别用冷水冲，否则鸡皮收缩、肉变柴）。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 炖汤<\/strong><\/p>\n<ol start=\"8\">\n<li>把鸡块、泡好的香菇、姜片一起放进汤锅，加清水一次加足。<\/li>\n<li>大火烧开（约 10 分钟）后转小火，盖上盖子炖 1~1.5 小时。<\/li>\n<li>看到鸡肉能用筷子轻松戳透、汤色清亮微黄、能闻到明显菌香 → 炖好了。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 调味出锅<\/strong><\/p>\n<ol start=\"11\">\n<li>加盐搅匀，先尝一口咸淡再决定是否补。<\/li>\n<li>想更好看可放枸杞再煮 2 分钟，关火出锅。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>香菇没泡透<\/strong>：泡的时间不够或水温太低，炖出来有硬心、不出香。用 40℃ 温水泡够 30 分钟以上，泡到无硬心。<\/li>\n<li><strong>汤腥<\/strong>：血沫没撇干净，或干脆没焯水。冷水下锅煮出血沫后一定要撇净。<\/li>\n<li><strong>中途加水<\/strong>：汤不够了就补冷水，汤味立刻变淡。水要一次加足，实在要加也加热水。<\/li>\n<li><strong>盐放太早<\/strong>：盐早放会让鸡肉发柴、汤偏咸。盐一律出锅前放。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"http://mwx.douguo.com/cookbook/1344510.html\">豆果美食 · 香菇鸡汤（新手易学）<\/a> —— 干香菇泡发 2 小时 + 焯水炖煮，适合对照「初学版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1PT411z7Yj/\">砂锅煲鸡汤（哔哩哔哩）<\/a> —— 香菇药材鸡汤，滋补家常，适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：泡发水提鲜 / 不焯水 / 火候）<\/h2>\n<p>在初学版基础上，掌握下面四条，鲜度会明显上一个台阶。<\/p>\n<p><strong>第 1 步 · 泡发水留用提鲜<\/strong><\/p>\n<ol>\n<li>香菇泡发后的水不要倒，静置沉淀后只取上层清汤，和清水一起下锅炖（泡发水里含有香菇释放的鲜味物质，是「天然高汤」）。<\/li>\n<li>关键在沉淀：底部会有一层细沙，倒的时候稳住，只倒上面清的部分。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 鸡肉不焯水（更鲜香肥美）<\/strong><\/p>\n<ol start=\"3\">\n<li>新鲜鸡块用温水抓洗 2~3 遍去血水即可，<strong>不焯水<\/strong>，直接冷水下锅、小火慢慢烧开，再撇净浮沫（这样鸡肉的鲜香不流失，汤更肥美）。<\/li>\n<li>如果鸡肉不太新鲜或冷冻过，仍建议焯水去腥，两种方法按食材新鲜度选择。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 火候控制<\/strong><\/p>\n<ol start=\"5\">\n<li>大火烧开后一定转<strong>小火慢炖<\/strong>，汤面保持「微沸、冒小泡」的状态，不滚大泡，汤才清亮不浑浊。<\/li>\n<li>三黄鸡炖 1~1.5 小时；老母鸡、土鸡要炖 2 小时以上才出味、肉质才软。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 出锅前调味<\/strong><\/p>\n<ol start=\"7\">\n<li>盐最后放；可加几粒枸杞、红枣增色增甜。<\/li>\n<li>想更鲜，可加一点点白胡椒粉（约 1/4 小勺）提味。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/104102836/\">下厨房 · 香菇炖鸡汤<\/a> —— 焯水煸炒 + 砂锅慢炖，适合对照「进阶版 / 大厨版」的火候<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1k2421L7yD/\">香菇炖鸡汤家常做法，大厨教你诀窍（哔哩哔哩）<\/a> —— 汤色诱人、鲜香，适合对照「进阶版 / 大厨版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「汤清见底、鸡肉香而不柴、菌香浓郁有层次」。<\/p>\n<p><strong>第 1 步 · 选料与泡发<\/strong><\/p>\n<ol>\n<li>干香菇选<strong>肉厚的小朵<\/strong>，香气更集中；泡发水温控制在 40℃ 左右（水温过高会让鲜味物质流失、香气发闷）。<\/li>\n<li>泡发水沉淀后只取上层清汤入锅，这是汤底「菌香」的关键来源。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 鸡块先煸炒（出鸡油、汤更白）<\/strong><\/p>\n<ol start=\"3\">\n<li>锅烧热加少许油，下焯过水的鸡块，中火煸炒到表面微黄、锅底析出鸡油。<\/li>\n<li>再<strong>冲入热水<\/strong>（这一步让鸡肉定型、香味激发，汤色更白更浓）。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 冷水 vs 热水下锅的讲究<\/strong><\/p>\n<ol start=\"5\">\n<li>焯过水的鸡：下锅用<strong>热水<\/strong>，避免温差让肉质收缩发柴。<\/li>\n<li>不焯水直接炖的鸡：<strong>冷水下锅<\/strong>，慢慢升温，血沫才容易浮出来撇净。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 分层下料与撇沫<\/strong><\/p>\n<ol start=\"7\">\n<li>全程保持小火微沸，浮沫要勤撇、撇干净，汤才清亮。<\/li>\n<li>香菇可以和鸡同下（汤味更浓），也可以在炖 40 分钟后再下（香菇口感更弹、形更完整），按喜好取舍。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 器具<\/strong><\/p>\n<ol start=\"9\">\n<li>砂锅受热均匀、保温好，炖出来更香；电饭煲选「煲汤 / 汤粥」模式炖 2 小时最省心（两种都可）。<\/li>\n<\/ol>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "116", "name": "杏仁豆腐", "title": "杏仁豆腐", "category": "坚果干果", "ingredient": "杏仁", "ings": [["南杏仁", "甜杏仁"], ["牛奶"], ["琼脂"], ["冰糖", "白糖"], ["清水"], ["糖桂花", "蜂蜜"]], "opt": [false, false, false, false, false, false], "tags": ["甜"], "html": "<h1>杏仁豆腐<\/h1>\n<blockquote>\n<p>归属食材：杏仁 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>中式传统甜品（点心），南杏仁打浆、加奶与琼脂 / 吉利丁凝固成豆腐状，切块淋糖桂花，清甜爽滑、杏仁香浓。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、不难吃）<\/h2>\n<p><strong>食材（2~3 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>南杏仁（甜杏仁）<\/td>\n<td>60g<\/td>\n<td>一定要南杏，别用北杏（苦）<\/td>\n<\/tr>\n<tr>\n<td>牛奶<\/td>\n<td>250ml<\/td>\n<td>常温即可<\/td>\n<\/tr>\n<tr>\n<td>琼脂<\/td>\n<td>5g<\/td>\n<td>凝固剂；也可用吉利丁片 10g<\/td>\n<\/tr>\n<tr>\n<td>冰糖（或白糖）<\/td>\n<td>35~40g<\/td>\n<td>按口味<\/td>\n<\/tr>\n<tr>\n<td>清水<\/td>\n<td>400ml<\/td>\n<td>打浆用<\/td>\n<\/tr>\n<tr>\n<td>糖桂花（或蜂蜜）<\/td>\n<td>2 汤匙<\/td>\n<td>最后淋面<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 泡杏仁<\/strong><\/p>\n<ol>\n<li>南杏仁用冷水浸泡 4 小时以上（或温水泡 1~2 小时），泡到明显膨胀、皮起皱。<\/li>\n<li>看到杏仁捏起来饱满、易掐开 → 泡好了，可顺手把皮搓掉（成品更白、口感更细）。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 泡琼脂<\/strong><\/p>\n<ol start=\"3\">\n<li>琼脂用凉白开浸泡约 1 小时泡软（用吉利丁片的话，冷水泡软约 5 分钟即可）。<\/li>\n<li>看到琼脂变软、透明 → 可以用了。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 打浆<\/strong><\/p>\n<ol start=\"5\">\n<li>泡好的杏仁加 400ml 清水，倒进料理机打成细腻的浆，约 1~2 分钟。<\/li>\n<li>用纱布或细筛过滤，滤掉豆渣，得到顺滑的杏仁汁。<\/li>\n<li>看到滤出的汁基本无颗粒 → 过滤到位。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 煮浆<\/strong><\/p>\n<ol start=\"8\">\n<li>杏仁汁加牛奶、冰糖倒进锅里，开小火煮到冰糖完全融化（约 3~5 分钟），微沸即可。<\/li>\n<li>放入泡软的琼脂，继续搅拌煮 1~2 分钟，直到琼脂完全融化（用吉利丁片的话，关火后等温度降到 50~60℃ 再加入搅化，不能煮沸）。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 过筛入模<\/strong><\/p>\n<ol start=\"10\">\n<li>把煮好的浆再过一次细筛，倒进容器，撇掉表面泡沫。<\/li>\n<li>室温放凉后盖保鲜膜，进冰箱冷藏 2~4 小时凝固。<\/li>\n<li>看到表面按压有弹性、不粘手 → 凝固好了。<\/li>\n<\/ol>\n<p><strong>第 6 步 · 切块淋蜜<\/strong><\/p>\n<ol start=\"13\">\n<li>用小刀沿容器边划一圈脱模，倒扣出来切成方块。<\/li>\n<li>装碗淋上糖桂花或蜂蜜，可再加一勺冰水或糖水。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>用错杏仁<\/strong>：买了北杏仁（苦杏仁），做出来发苦。认准「南杏仁 / 甜杏仁」。<\/li>\n<li><strong>琼脂不化、成品不成型<\/strong>：琼脂必须<strong>煮开 1~2 分钟<\/strong>才会彻底融化，光泡软就下锅煮不到沸是凝固不了的。<\/li>\n<li><strong>有豆渣口感<\/strong>：打浆后没过滤或滤得不细。打久一点、用纱布滤，口感才嫩滑。<\/li>\n<li><strong>表面有气泡 / 不光滑<\/strong>：倒模后没撇泡沫。入模前再过一次筛、撇掉浮沫。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.douguo.net/cookbook/1685336.html\">豆果美食 · 杏仁豆腐<\/a> —— 经典配方，适合对照「初学版」的泡发打浆流程<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1o73i6dEMk/\">清爽版杏仁豆腐（哔哩哔哩）<\/a> —— 纯杏仁粉复刻，适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：选杏仁 / 选凝固剂 / 过滤 / 冷藏）<\/h2>\n<p>在初学版基础上，掌握下面四条，成品质感会上一个台阶。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 认准杏仁<\/strong><\/p>\n<ol>\n<li>买杏仁时看包装上写「南杏仁 / 甜杏仁 / 光杏仁」。<\/li>\n<li>南杏仁（甜杏仁）味甜、适合做甜品；北杏仁（苦杏仁）苦味重、且含微量苦杏仁苷，不要用来做杏仁豆腐。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 选凝固剂<\/strong><\/p>\n<ol start=\"3\">\n<li>想口感脆爽、常温不易化，选琼脂（寒天）；想软嫩 Q 弹，选吉利丁片；想最省事，选白凉粉 / 寒天粉。<\/li>\n<li>记住各自用法：琼脂必须煮沸融化；吉利丁片化开后 50~60℃ 加入、不能煮沸（沸了会失效）；白凉粉直接煮化即可。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 过滤<\/strong><\/p>\n<ol start=\"5\">\n<li>打浆后至少滤一次，讲究的用纱布挤，滤出的汁越清，成品越像「豆腐」一样细腻无渣。<\/li>\n<li>入模前再过一次细筛（二次过筛），还能去掉气泡。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 冷藏与脱模<\/strong><\/p>\n<ol start=\"7\">\n<li>冷藏至少 2 小时（琼脂 2 小时左右、吉利丁 4 小时更稳）。<\/li>\n<li>切块前把容器在温水里浸 10 秒，更容易脱模、切面也更整齐。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.douguo.net/cookbook/1117420.html\">豆果美食 · 杏仁露和杏仁豆腐<\/a> —— 杏仁露 + 凝固剂做法，适合对照「进阶版」的凝固剂选择<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1n7hu6rEEP/\">简简单单的传统甜品 中式杏仁豆腐（哔哩哔哩）<\/a> —— 讲琼脂凝固细节，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与口感）<\/h2>\n<p>追求「洁白如玉、入口即化、杏香清爽、甜而不腻」。每一步都是细节。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 去皮泡发<\/strong><\/p>\n<ol>\n<li>南杏仁泡透后搓去外皮，只用白色的杏仁肉打浆（成品颜色雪白、没有皮的涩味）。<\/li>\n<li>泡发时间宁可久一点（过夜），打出的浆更细腻。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 打浆滤渣<\/strong><\/p>\n<ol start=\"3\">\n<li>杏仁加水后低速慢打、少量多次。<\/li>\n<li>打完用纱布「挤出」而不是「滤出」，把杏仁里的淀粉和油脂都挤出来，杏香更足。<\/li>\n<li>挤出的杏仁渣再加少量水打一次、再挤，把香味榨干。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 煮浆与控温<\/strong><\/p>\n<ol start=\"6\">\n<li>牛奶和杏仁浆小火加热、不能大火煮沸，微沸就离火（避免牛奶起膜、杏仁香挥发）。<\/li>\n<li>琼脂煮到「勺背划过锅底能见底、浆液微微挂勺」→ 煮好了；吉利丁片控温在 50~60℃，温度计测最稳。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 糖水与糖桂花<\/strong><\/p>\n<ol start=\"8\">\n<li>熬一小锅冰糖糖水：冰糖 + 水煮化放凉。<\/li>\n<li>和糖桂花按口味混合，切好的杏仁豆腐浸在糖水里上桌，冰镇后口感最清爽。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/category/1008396/\">下厨房 · 杏仁豆腐分类页（多篇菜谱合集）<\/a> —— 含温州杏仁腐、鲜奶杏仁豆腐等多个版本，适合对照「大厨版」<\/li>\n<\/ul>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "117", "name": "枸杞蒸蛋", "title": "枸杞蒸蛋", "category": "坚果干果", "ingredient": "枸杞", "ings": [["鸡蛋"], ["温水", "约 40℃"], ["盐"], ["枸杞"], ["香油"], ["生抽"]], "opt": [false, false, false, false, true, true], "tags": [], "html": "<h1>枸杞蒸蛋<\/h1>\n<blockquote>\n<p>归属食材：枸杞 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>家常蒸菜（药膳），鸡蛋羹嫩滑如布丁，枸杞点缀提色增香，清淡鲜美、滋补明目，老人小孩都适合。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、不难吃）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>鸡蛋<\/td>\n<td>2 个<\/td>\n<td>常温蛋<\/td>\n<\/tr>\n<tr>\n<td>温水（约 40℃）<\/td>\n<td>150~200ml<\/td>\n<td>约为蛋液的 1.5~2 倍<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>1/4 小勺<\/td>\n<td>提味<\/td>\n<\/tr>\n<tr>\n<td>枸杞<\/td>\n<td>1 小把（约 5~8g）<\/td>\n<td>提前泡软<\/td>\n<\/tr>\n<tr>\n<td>香油<\/td>\n<td>几滴<\/td>\n<td>出锅淋，可选<\/td>\n<\/tr>\n<tr>\n<td>生抽<\/td>\n<td>几滴<\/td>\n<td>出锅淋，可选<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 泡枸杞<\/strong><\/p>\n<ol>\n<li>枸杞用温水浸泡约 10 分钟，泡到软、饱满。<\/li>\n<li>看到枸杞鼓起、颜色变亮 → 捞出沥干。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 打蛋液<\/strong><\/p>\n<ol start=\"3\">\n<li>鸡蛋磕进碗里，加 1/4 小勺盐。<\/li>\n<li>用筷子朝一个方向打散，打到蛋清蛋黄完全融合、表面起一层细泡。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 加水<\/strong><\/p>\n<ol start=\"5\">\n<li>加入约 1.5~2 倍的温水，边加边搅匀。<\/li>\n<li>用细筛把蛋液过滤一遍、撇掉表面泡沫（不想过滤就多搅几下）。<\/li>\n<li>看到蛋液均匀、表面基本没有大泡沫 → 可以上锅。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 蒸制<\/strong><\/p>\n<ol start=\"8\">\n<li>碗上盖一层保鲜膜并扎几个小孔（或扣一个盘子）。<\/li>\n<li>水烧开后上锅，中火蒸 8~10 分钟。<\/li>\n<li>晃动碗，看到蛋羹表面已经凝固、微微颤动 → 熟了。（喜欢枸杞点缀在表面的，可在蒸到约 6~7 分钟、蛋液半凝固时掀盖放上枸杞，再蒸 2~3 分钟。）<\/li>\n<\/ol>\n<p><strong>第 5 步 · 调味出锅<\/strong><\/p>\n<ol start=\"11\">\n<li>出锅后淋几滴香油或生抽（可选），也可以什么都不加，吃蛋的原味。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>蒸成蜂窝、口感老<\/strong>：火太大或蒸太久。用中火、8~10 分钟就够。<\/li>\n<li><strong>表面坑坑洼洼<\/strong>：水汽滴到蛋液上。盖保鲜膜（扎孔）或扣盘子就能避免。<\/li>\n<li><strong>不成型 / 太稀<\/strong>：水加多了。控制在蛋液 1.5~2 倍以内。<\/li>\n<li><strong>枸杞没泡软<\/strong>：直接撒干的枸杞，吃起来硬、也没香味。先温水泡 10 分钟。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/101873707/printable/\">下厨房 · 枸杞蒸蛋（做法）<\/a> —— 步骤清楚，适合对照「初学版」的蛋水比例<\/li>\n<li><a href=\"https://www.douguo.com/cookbook/1249533.html\">豆果美食 · 枸杞蒸蛋<\/a> —— 家常做法，适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：水温 / 蛋水比例 / 过筛 / 火候）<\/h2>\n<p>在初学版基础上，掌握下面四条，成品会像布丁一样嫩滑。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 用温水<\/strong><\/p>\n<ol>\n<li>用温开水（约 40℃）调蛋液，蒸出来更快、更均匀地凝固、更细腻。<\/li>\n<li>别用生冷水（水里的空气受热易形成气孔、蜂窝），也别用开水（会把蛋液烫成蛋花）。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 控蛋水比例<\/strong><\/p>\n<ol start=\"3\">\n<li>按 1 个蛋配 1.5~2 倍水调，想吃更嫩就偏 2 倍，想吃扎实就偏 1.5 倍。<\/li>\n<li>记住水少蛋硬、水多不成型，别超出这个区间。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 过筛去泡<\/strong><\/p>\n<ol start=\"5\">\n<li>打好的蛋液过一遍细筛，滤掉没打散的蛋筋和泡沫。<\/li>\n<li>看到蛋液表面像镜面一样平滑 → 过筛到位。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 中火虚蒸<\/strong><\/p>\n<ol start=\"7\">\n<li>用中火蒸（比大火稳，蛋液不会剧烈沸腾产生大气孔）。<\/li>\n<li>锅盖留一条小缝（或保鲜膜扎孔）让蒸汽缓和，避免水汽滴落。<\/li>\n<li>蒸到「表面凝固、中心微颤」→ 关火，余温焖 1~2 分钟。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://mip.xiachufang.com/recipe/102160380/\">下厨房 · 枸杞蒸蛋（步骤图）<\/a> —— 含过筛与蒸制细节，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与口感）<\/h2>\n<p>追求「镜面嫩滑、入口即化、枸杞鲜亮、咸鲜回甘」。每一步都是细节。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 调蛋液<\/strong><\/p>\n<ol>\n<li>2 个蛋加盐打散后，加 1.5 倍温水。<\/li>\n<li>用筛子过滤两次，撇净所有浮沫（过滤越净，蒸出来越嫩滑、越没有气孔）。<\/li>\n<li>加 1 小勺熟猪油（或几滴香油）进蛋液，蒸出来更香、更润。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 虚蒸<\/strong><\/p>\n<ol start=\"4\">\n<li>水开后再上锅，中小火蒸。<\/li>\n<li>锅盖留一条缝（垫一根筷子），蒸汽柔和、温度稳定，蛋羹才会细腻如布丁、表面无孔。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 放枸杞（两种放法）<\/strong><\/p>\n<ol start=\"6\">\n<li>蒸前放：枸杞拌进蛋液或半凝固时放，枸杞沉在表面、颜色略暗，味道更融合。<\/li>\n<li>蒸后点缀：蛋羹蒸好后再撒上泡软的枸杞、淋香油，枸杞颜色鲜亮、卖相更好（两种都好吃，看你要味道还是要颜值）。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 调味<\/strong><\/p>\n<ol start=\"8\">\n<li>出锅后淋几滴生抽 + 几滴香油 + 一小撮葱花，咸鲜回甘；也可只放盐吃原味。<\/li>\n<li>生抽别多，会盖掉蛋香、颜色也发暗。<\/li>\n<\/ol>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "118", "name": "琥珀核桃", "title": "琥珀核桃", "category": "坚果干果", "ingredient": "核桃", "ings": [["核桃仁"], ["冰糖", "白糖"], ["清水"], ["蜂蜜"], ["白芝麻"], ["食用油"]], "opt": [false, false, false, true, false, true], "tags": ["甜"], "html": "<h1>琥珀核桃<\/h1>\n<blockquote>\n<p>归属食材：核桃 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>核桃仁裹一层琥珀色糖衣，香甜酥脆，撒芝麻更香，是年节零食也是下酒小点。属性：零食（挂糖甜品）。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、不难吃）<\/h2>\n<p><strong>食材（约 200g 成品）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>核桃仁<\/td>\n<td>200g<\/td>\n<td>选完整核桃仁<\/td>\n<\/tr>\n<tr>\n<td>冰糖（或白糖）<\/td>\n<td>100g（约半碗）<\/td>\n<td>挂糖用<\/td>\n<\/tr>\n<tr>\n<td>清水<\/td>\n<td>2 汤匙<\/td>\n<td>熬糖用<\/td>\n<\/tr>\n<tr>\n<td>蜂蜜<\/td>\n<td>1 汤匙<\/td>\n<td>可选，更亮泽<\/td>\n<\/tr>\n<tr>\n<td>白芝麻<\/td>\n<td>1 汤匙<\/td>\n<td>熟芝麻<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>少许<\/td>\n<td>烤核桃可刷油（可选）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 核桃去涩<\/strong><\/p>\n<ol>\n<li>水开下核桃仁煮 1~2 分钟，捞出沥干（焯水去掉涩味，也让糖更好挂上）。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 烤香<\/strong><\/p>\n<ol start=\"2\">\n<li>烤箱 150℃ 烤约 10~15 分钟（或平底锅小火干炒约 5 分钟）。<\/li>\n<li>看到核桃微黄、飘出核桃香 → 取出晾凉（烤干水分，挂糖才脆）。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 熬糖<\/strong><\/p>\n<ol start=\"4\">\n<li>锅里放冰糖、清水（和蜂蜜），小火慢慢熬，别频繁搅动。<\/li>\n<li>先看到糖化开、冒大泡，再熬到变成小泡、颜色呈浅琥珀色（像蜂蜜色）。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 判断糖色<\/strong><\/p>\n<ol start=\"6\">\n<li>用筷子蘸一点糖液放进冷水，迅速变硬变脆 → 糖熬好了（软了继续熬，发黑就苦了）。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 裹糖<\/strong><\/p>\n<ol start=\"7\">\n<li>糖色到位立刻倒入烤好的核桃，快速翻炒，让每颗核桃裹匀糖液。<\/li>\n<li>趁热撒白芝麻。<\/li>\n<\/ol>\n<p><strong>第 6 步 · 晾凉<\/strong><\/p>\n<ol start=\"9\">\n<li>趁热把核桃倒在不粘油纸 / 大盘上，用筷子拨散分开，摊开放凉。<\/li>\n<li>凉透后糖壳变脆，密封保存。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>糖熬过头发苦<\/strong>：火太大或熬太久。全程小火，颜色到浅琥珀色就离火。<\/li>\n<li><strong>核桃不脆<\/strong>：核桃没烤干水分，或没晾透。烤香 + 彻底晾凉才脆。<\/li>\n<li><strong>粘成一坨<\/strong>：出锅没拨散。趁热趁软就摊开拨开。<\/li>\n<li><strong>糖不挂<\/strong>：核桃有水汽，或糖没熬到位。核桃一定晾凉再下锅。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/106891717/\">下厨房 · 琥珀核桃<\/a> —— 白糖 + 蜂蜜熬糖，冷水测试法，适合对照「初学版」熬糖判断<\/li>\n<li><a href=\"https://m.meishichina.com/recipe/308817/\">美食杰 · 湖北 · 琥珀核桃——新年里的小甜点<\/a> —— 家常挂糖步骤，适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：熬糖判断 / 防反砂 / 免烤箱）<\/h2>\n<p>在初学版基础上掌握下面四条，糖衣更透亮、更稳定。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 熬糖判断<\/strong><\/p>\n<ol>\n<li>看泡：大泡变细密小泡、颜色微黄即好。<\/li>\n<li>最稳的办法是冷水测试：糖液入冷水迅速凝成硬脆小块 → 到位。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 防反砂<\/strong><\/p>\n<ol start=\"3\">\n<li>糖浆里加一点蜂蜜或麦芽糖，能防止糖结晶变白霜，成品糖衣更晶莹透亮。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 免烤箱烤香<\/strong><\/p>\n<ol start=\"4\">\n<li>核桃小火干炒到微黄（约 5 分钟），或空气炸锅 150℃ 炸 8~10 分钟，同样烤香。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 芝麻焙香<\/strong><\/p>\n<ol start=\"5\">\n<li>白芝麻先用小火焙 1 分钟出香再撒，香气更足。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://m.meishichina.com/recipe/99256/\">美食杰 · 琥珀核桃——掌握熬糖要点轻松做健康零食<\/a> —— 熬糖要点讲解，适合对照「进阶版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1JH4y127QE/\">非油炸琥珀核桃教程：简单快手（哔哩哔哩）<\/a> —— 炒糖 + 烤制，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 熬糖上色<\/strong><\/p>\n<ol>\n<li>冰糖 + 少量麦芽糖 + 蜂蜜，熬到\"琥珀色\"离火，糖衣晶莹透亮、入口不粘牙。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 冷水测试<\/strong><\/p>\n<ol start=\"2\">\n<li>糖液入冷水立即凝成硬脆小块 → 到位；软丝则未到、焦黑则过。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 离火裹糖<\/strong><\/p>\n<ol start=\"3\">\n<li>糖到位先离火，再倒核桃，利用余温裹匀，避免持续加热把糖熬苦。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 摊开风干<\/strong><\/p>\n<ol start=\"4\">\n<li>放油纸逐颗分开，凉后装密封罐保存。<\/li>\n<li>回潮后复烤 5 分钟即可恢复酥脆。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.bilibili.com/video/BV1PK4y1J7Xk/\">炒糖色与琥珀核桃（哔哩哔哩）<\/a> —— 熬糖裹糖过程，适合对照「大厨版」糖色<\/li>\n<\/ul>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "119", "name": "心太软", "title": "心太软（糯米红枣）", "category": "坚果干果", "ingredient": "红枣", "ings": [["红枣"], ["水磨糯米粉"], ["温水"], ["糖桂花", "蜂蜜"]], "opt": [false, false, false, true], "tags": ["甜"], "html": "<h1>心太软（糯米红枣）<\/h1>\n<blockquote>\n<p>归属食材：红枣 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>中式甜品（点心），红枣去核夹入糯米团蒸熟，枣甜糯香、软糯拉丝，可淋桂花蜜，冷热都好吃。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、不难吃）<\/h2>\n<p><strong>食材（约 12~15 个）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>红枣<\/td>\n<td>12~15 颗<\/td>\n<td>选肉厚、个头匀的大枣<\/td>\n<\/tr>\n<tr>\n<td>水磨糯米粉<\/td>\n<td>80g<\/td>\n<td>认准「水磨」更细腻<\/td>\n<\/tr>\n<tr>\n<td>温水<\/td>\n<td>约 60~70g<\/td>\n<td>分次加<\/td>\n<\/tr>\n<tr>\n<td>糖桂花（或蜂蜜）<\/td>\n<td>1~2 汤匙<\/td>\n<td>最后淋，可选<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 泡红枣<\/strong><\/p>\n<ol>\n<li>红枣洗净，用温水泡 20~30 分钟（或冷水泡 1~2 小时），泡到明显膨胀、皮变软。<\/li>\n<li>看到红枣摸起来饱满、不干瘪 → 泡好了（这样好去核、蒸完也软糯）。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 去核开口<\/strong><\/p>\n<ol start=\"3\">\n<li>用小刀沿红枣一侧纵向划一刀（不要切断），掰开一点。<\/li>\n<li>用刀尖或手指把枣核挑出来。<\/li>\n<li>看到红枣能像「小船」一样张开、核取干净 → 去核完成。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 和糯米团<\/strong><\/p>\n<ol start=\"6\">\n<li>糯米粉里分次加温水，边加边揉，约 2~3 分钟，揉成光滑、不粘手的面团。<\/li>\n<li>取一小块能搓成条、不开裂、不粘手 → 软硬刚好（水要一点点加，别一次加多）。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 塞糯米<\/strong><\/p>\n<ol start=\"8\">\n<li>取一小块面团搓成和枣等长的小条，塞进红枣开口里。<\/li>\n<li>轻轻捏合整形，摆进盘子里，每颗之间留点缝隙（蒸后会膨胀）。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 蒸制<\/strong><\/p>\n<ol start=\"10\">\n<li>水烧开后上锅，大火蒸 10~15 分钟。<\/li>\n<li>看到糯米变成半透明、用筷子能轻松戳透 → 熟了。<\/li>\n<li>出锅后淋上糖桂花或蜂蜜，趁热吃最软糯。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>糯米团开裂<\/strong>：水加少了、面团太干。和面时水要分次加，揉到能搓条不开裂。<\/li>\n<li><strong>太软塌、蒸完变形<\/strong>：水加多了。面团要「不粘手、能成型」，不是稀糊。<\/li>\n<li><strong>蒸太久<\/strong>：糯米溢出、红枣塌掉。10~15 分钟足够，用筷子戳一戳判断。<\/li>\n<li><strong>红枣没泡软<\/strong>：去核时容易裂、口感也干硬。先泡够时间再操作。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.douguo.net/cookbook/2417963.html\">豆果美食 · 糯米红枣（心太软）<\/a> —— 步骤详细，适合对照「初学版」的去核与蒸制<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1HNNgztEvE/\">糯叽叽星人快冲！软糯香甜，搅一搅就搞定（哔哩哔哩）<\/a> —— 家常易学，适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：和面 / 选粉 / 蒸制 / 糖水）<\/h2>\n<p>在初学版基础上，掌握下面四条，成品质感会上一个台阶。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 温热水和面<\/strong><\/p>\n<ol>\n<li>糯米粉用温热水（约 60℃）和面，部分淀粉先「糊化」，面团更黏糯、蒸出来更拉丝，也不易开裂（冷水也能成团，但糯性差一点）。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 选水磨糯米粉<\/strong><\/p>\n<ol start=\"2\">\n<li>超市买的时候看包装上「水磨」两个字，水磨糯米粉比普通糯米粉更细、糯性更好，蒸出来口感软糯细腻。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 蒸完焖一下<\/strong><\/p>\n<ol start=\"3\">\n<li>蒸好后别急着揭盖，关火焖 2~3 分钟再开盖（糯米不会突然遇冷回缩、枣皮也不容易塌）。<\/li>\n<li>摆盘时枣与枣之间留缝，避免粘连。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 桂花蜜 / 糖水<\/strong><\/p>\n<ol start=\"5\">\n<li>直接淋蜂蜜或糖桂花最省事；讲究一点用「1 小勺糖桂花 + 2 汤匙温水」调稀，或熬一小锅冰糖糖水淋上去，甜得更均匀。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.douguo.com/cookbook/2404033.html\">豆果美食 · 糯米红枣（心太软）<\/a> —— 含开水揉团技巧，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与口感）<\/h2>\n<p>追求「枣甜肉厚、糯米晶莹软糯、造型整齐、甜香回甘」。每一步都是细节。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 去核<\/strong><\/p>\n<ol>\n<li>挑大小均匀、肉厚饱满的红枣。<\/li>\n<li>用硬吸管或裱花嘴从枣的一端顶进去、把核推出来，保持枣身完整，只在一侧开口，造型更好看（也可直接用「无核红枣」+ 一侧开口，省去去核步骤）。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 控制糯米量<\/strong><\/p>\n<ol start=\"3\">\n<li>糯米条搓成枣核大小、塞进后比枣面略低一点，蒸熟后糯米膨胀刚好和枣面齐平，不会溢出来（塞太满蒸完会「爆」出来）。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 造型<\/strong><\/p>\n<ol start=\"4\">\n<li>摆盘时把枣开口朝上、糯米露白面朝外，蒸出来红白相间、晶莹好看。<\/li>\n<li>想更精致，可在糯米团里掺一点南瓜泥做成金黄色，或表面点一颗黑芝麻。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 桂花蜜勾芡<\/strong><\/p>\n<ol start=\"6\">\n<li>糖桂花加少量水和小半勺水淀粉煮成薄薄的桂花芡汁。<\/li>\n<li>趁热淋在蒸好的心太软上，甜香挂味、色泽更亮（吃不完别二次蒸，口感会变硬，现做现吃最好）。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/104269656/printable/\">下厨房 · 心太软<\/a> —— 糯米粉与面粉配比版，适合对照「大厨版」的造型<\/li>\n<\/ul>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "120", "name": "腰果虾仁", "title": "腰果虾仁", "category": "坚果干果", "ingredient": "腰果", "ings": [["虾仁"], ["腰果"], ["黄瓜"], ["胡萝卜"], ["盐"], ["料酒"], ["干淀粉"], ["葱"], ["姜"], ["蒜"], ["食用油"]], "opt": [false, false, false, false, false, false, false, false, false, false, false], "tags": [], "html": "<h1>腰果虾仁<\/h1>\n<blockquote>\n<p>归属食材：腰果 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>家常粤式炒菜，虾仁滑嫩、腰果酥脆，一嫩一脆对比鲜明，清淡鲜香、不油不腻，老小都爱。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、不难吃）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>虾仁<\/td>\n<td>200g<\/td>\n<td>鲜虾剥仁或冷冻虾仁均可<\/td>\n<\/tr>\n<tr>\n<td>腰果<\/td>\n<td>60g<\/td>\n<td>生腰果，自己炸更脆<\/td>\n<\/tr>\n<tr>\n<td>黄瓜<\/td>\n<td>1/2 根<\/td>\n<td>切丁配色<\/td>\n<\/tr>\n<tr>\n<td>胡萝卜<\/td>\n<td>1/2 根<\/td>\n<td>切丁配色<\/td>\n<\/tr>\n<tr>\n<td>盐<\/td>\n<td>约 1/2 小勺<\/td>\n<td>分两次放<\/td>\n<\/tr>\n<tr>\n<td>料酒<\/td>\n<td>1 小勺<\/td>\n<td>去腥<\/td>\n<\/tr>\n<tr>\n<td>干淀粉<\/td>\n<td>1 小勺<\/td>\n<td>上浆用<\/td>\n<\/tr>\n<tr>\n<td>葱、姜、蒜<\/td>\n<td>各少许<\/td>\n<td>爆香<\/td>\n<\/tr>\n<tr>\n<td>食用油<\/td>\n<td>2 汤匙<\/td>\n<td>分两次用<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 处理虾仁<\/strong><\/p>\n<ol>\n<li>虾仁挑去背上的虾线（腥味主要来源），洗净沥干。<\/li>\n<li>加 1/2 小勺盐、1 小勺料酒抓匀，再撒 1 小勺干淀粉抓匀上浆，腌 10 分钟。<\/li>\n<li>看到虾仁表面裹着一层薄薄的浆、摸起来黏手 → 腌好了。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 炸腰果<\/strong><\/p>\n<ol start=\"4\">\n<li>锅子不用太热，凉油下腰果，开小火慢慢炸，用铲子不停翻动，约 2~3 分钟。<\/li>\n<li>看到腰果颜色变成浅金黄 → 立刻捞出（余温还会继续上色），摊开放凉更脆（绝不能等到深黄再捞，会发苦）。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 炒虾仁<\/strong><\/p>\n<ol start=\"6\">\n<li>锅烧热倒 1 汤匙油，下虾仁快速翻炒，约 1~2 分钟。<\/li>\n<li>看到虾仁变红、卷曲成球、完全不透明 → 熟了，盛出备用。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 炒配菜<\/strong><\/p>\n<ol start=\"8\">\n<li>锅里补剩下的 1 汤匙油，下葱姜蒜爆香。<\/li>\n<li>倒入黄瓜丁、胡萝卜丁，中火翻炒约 1 分钟。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 合炒出锅<\/strong><\/p>\n<ol start=\"10\">\n<li>虾仁回锅，加剩下的盐调味，翻炒均匀。<\/li>\n<li>最后才下腰果，快速翻几下立刻出锅（腰果最后放，保持酥脆）。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>腰果炸糊<\/strong>：火太大或炸太久。记住「凉油下锅 + 小火 + 浅金黄就捞」。<\/li>\n<li><strong>虾仁炒老<\/strong>：炒太久。虾仁变红卷曲就要盛出，不要一直炒。<\/li>\n<li><strong>腰果回软<\/strong>：下锅太早、或汤汁太多。腰果一定最后下、下完快速翻匀就出锅。<\/li>\n<li><strong>虾仁腥<\/strong>：没去虾线、没腌。去虾线 + 料酒盐腌 10 分钟是去腥关键。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/102814269/printable/\">下厨房 · 腰果虾仁（做法）<\/a> —— 虾仁腌制与炸腰果步骤清楚，适合对照「初学版」<\/li>\n<li><a href=\"https://www.douguo.net/cookbook/187888.html\">豆果美食 · 腰果虾仁<\/a> —— 用量精确，适合对照「初学版」比例<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1Hd4y1b72C/\">虾仁炒腰果 家常海鲜简单做（哔哩哔哩）<\/a> —— 家常易学，适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：上浆 / 炸腰果 / 顺序 / 勾芡）<\/h2>\n<p>在初学版基础上，掌握下面四条，成品质感会上一个台阶。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 上浆<\/strong><\/p>\n<ol>\n<li>先用盐 + 料酒抓出虾仁的黏性（盐让蛋白质收缩、出水，再吸水）。<\/li>\n<li>再裹一层干淀粉，受热时形成保护膜锁住虾仁内部水分，炒出来才嫩滑、饱满。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 小火凉油炸腰果<\/strong><\/p>\n<ol start=\"3\">\n<li>凉油下锅、小火慢炸，让温度慢慢渗透，内部炸脆、表面不焦。<\/li>\n<li>炸到浅金黄就离火，余温会把颜色补到刚好，放凉后更脆。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 按顺序下锅<\/strong><\/p>\n<ol start=\"5\">\n<li>按「炸腰果 → 炒虾 → 炒配菜 → 调味 → 最后下腰果翻匀出锅」的顺序来。<\/li>\n<li>腰果要最后下，因为腰果一旦吸到汤汁就会回软。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 勾薄芡<\/strong><\/p>\n<ol start=\"7\">\n<li>虾仁回锅后淋入「1/2 小勺淀粉 + 2 汤匙水」调匀的水淀粉，勾一层薄芡。<\/li>\n<li>让咸鲜味均匀裹在虾仁和配菜上，再下腰果。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://www.xiachufang.com/recipe/107024927/printable/\">下厨房 · 腰果虾仁（做法）<\/a> —— 含勾芡与配菜，适合对照「进阶版」<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV14z421h7Ky/\">低卡腰果虾仁（哔哩哔哩）<\/a> —— 低油做法，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「虾仁爽脆弹牙、腰果酥香不糊、出锅利落有锅气」。每一步都是细节。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 腌制虾仁<\/strong><\/p>\n<ol>\n<li>虾仁去虾线后，用盐、白胡椒粉、料酒抓至出胶。<\/li>\n<li>再加 1/2 个蛋清 + 干淀粉抓匀，最后淋一点油「封浆」，冷藏腌 15~30 分钟（蛋清 + 淀粉上浆更厚、更滑，油封住不易出水）。<\/li>\n<li>滑油时油温四到五成热（锅边冒轻烟、筷子伸进去有小泡），虾仁下锅划散，刚变色就捞出，保持弹性。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 炸腰果到酥<\/strong><\/p>\n<ol start=\"4\">\n<li>腰果凉油下锅，小火炸到浅金黄。<\/li>\n<li>捞出后摊开、离火控油，别堆在一起（热气会把内部焖软）。<\/li>\n<li>放凉后用手一捏是「咔嚓」酥脆 → 炸到位。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 配菜刀工<\/strong><\/p>\n<ol start=\"7\">\n<li>黄瓜、胡萝卜切成和腰果差不多大小的菱形丁，口感统一、卖相整齐。<\/li>\n<li>胡萝卜可先焯水 30 秒，炒的时候熟度更均匀。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 大火快炒出锅<\/strong><\/p>\n<ol start=\"9\">\n<li>全程大火快炒，动作连贯：爆香 → 虾仁与配菜下锅颠炒 → 调味勾薄芡 → 腰果最后下 → 颠锅两下立刻出锅。<\/li>\n<li>芡汁要薄、汁要少，腰果才不会被泡软；趁热上桌，锅气最足。<\/li>\n<\/ol>\n<hr>\n<h2>🔒 已锁定最佳方案<\/h2>\n<p>（暂无，待实操反馈后锁定）<\/p>"}, {"id": "121", "name": "黑芝麻糊", "title": "黑芝麻糊", "category": "坚果干果", "ingredient": "芝麻", "ings": [["黑芝麻", "生"], ["糯米粉"], ["冰糖", "白糖"], ["清水"], ["猪油"]], "opt": [false, false, false, false, true], "tags": ["甜"], "html": "<h1>黑芝麻糊<\/h1>\n<blockquote>\n<p>归属食材：芝麻 ｜ 难度三档：初学 / 进阶 / 大厨<\/p>\n<\/blockquote>\n<p>传统中式甜品（热饮），黑芝麻炒香后磨粉、与糯米粉一起熬成浓稠糊状，香浓顺滑、微甜不腻，暖胃滋补。以下按「初学 / 进阶 / 大厨」三档给出做法，难度和讲究逐级递增。<\/p>\n<blockquote>\n<p>计量参考：小勺 ≈ 5ml（茶匙），汤匙 ≈ 15ml，1 小勺盐 ≈ 5g、1 小勺糖 ≈ 5g。<\/p>\n<\/blockquote>\n<hr>\n<h2>初学版（目标：能做熟、不难吃）<\/h2>\n<p><strong>食材（2 人份）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>食材<\/th>\n<th>用量<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>黑芝麻（生）<\/td>\n<td>60g（约 6 汤匙）<\/td>\n<td>买生的，自己炒香才够味<\/td>\n<\/tr>\n<tr>\n<td>糯米粉<\/td>\n<td>30g（约 3 汤匙）<\/td>\n<td>增稠用，炒熟更香<\/td>\n<\/tr>\n<tr>\n<td>冰糖（或白糖）<\/td>\n<td>30~40g<\/td>\n<td>按口味增减<\/td>\n<\/tr>\n<tr>\n<td>清水<\/td>\n<td>约 500ml<\/td>\n<td>分次加，调浓稠度<\/td>\n<\/tr>\n<tr>\n<td>猪油<\/td>\n<td>1 小勺（可选）<\/td>\n<td>提香，可省略<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 炒芝麻<\/strong><\/p>\n<ol>\n<li>生黑芝麻放进无水无油的不粘锅，开小火慢慢炒，全程不断翻动，约 3~4 分钟。<\/li>\n<li>听到轻微「噼啪」声、闻到明显芝麻香、取几粒用手指能轻松捏碎 → 关火（千万不要炒过头——芝麻一糊就会发苦）。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 炒糯米粉<\/strong><\/p>\n<ol start=\"3\">\n<li>另起一锅，小火干炒糯米粉 2~3 分钟，炒到颜色微微发黄、飘出米香。<\/li>\n<li>看到粉变成浅米黄色 → 关火（别炒成深黄）。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 磨粉<\/strong><\/p>\n<ol start=\"5\">\n<li>炒好的黑芝麻摊开放凉（不烫手），倒进料理机 / 破壁机打成粉。<\/li>\n<li>芝麻会出油、容易结块，可倒一点炒好的糯米粉进去一起打，帮助打细、防结块。<\/li>\n<li>打到无明显颗粒、能闻到浓郁芝麻香 → 磨好了。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 熬煮<\/strong><\/p>\n<ol start=\"8\">\n<li>把黑芝麻粉、糯米粉、冰糖放进锅里，先加约 400ml 清水搅成无颗粒的糊。<\/li>\n<li>开中小火加热，全程不停搅拌防止糊底，煮约 5~8 分钟，冒小泡、越来越浓稠。<\/li>\n<li>看到勺子划过锅底能留下痕迹、糊能挂在勺上 → 好了。<\/li>\n<\/ol>\n<p><strong>第 5 步 · 调浓稠度和味道<\/strong><\/p>\n<ol start=\"11\">\n<li>尝一口甜度，不够再加糖；太稠加一点热水搅匀，太稀再熬 1~2 分钟。<\/li>\n<li>想更香加 1 小勺猪油搅化，关火盛出，趁热吃最香。<\/li>\n<\/ol>\n<p><strong>新手翻车点<\/strong><\/p>\n<ul>\n<li><strong>芝麻炒糊发苦<\/strong>：火开太大、炒太久。记住「小火 + 不停翻 + 闻到香就关火」。<\/li>\n<li><strong>糊底<\/strong>：熬煮时图省事不搅拌。芝麻糊含淀粉和油，特别容易粘锅，一定要全程小火搅拌。<\/li>\n<li><strong>结块<\/strong>：磨粉不细，或者冷水一下子全倒进去搅不开。磨粉时掺点糯米粉一起打，加水先搅成糊再开火。<\/li>\n<li><strong>太稀 / 太稠<\/strong>：水量没控制。先少加，煮的时候再少量补水调整；凉了之后会比热时更稠，煮到「稍稀一点」的状态正好。<\/li>\n<\/ul>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://m.meishichina.com/recipe/60449/\">美食天下 · 一缕香浓暖心间——黑芝麻糊<\/a> —— 步骤详细，适合对照「初学版」的炒芝麻与熬煮<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1Ej9FY6EXE/\">下午茶系列丨浓香丝滑的黑芝麻糊，暖身滋补（哔哩哔哩）<\/a> —— 浓香丝滑，适合对照「初学版」<\/li>\n<\/ul>\n<hr>\n<h2>进阶版（关键技巧：炒香 / 增稠 / 去苦 / 浓稠度）<\/h2>\n<p>在初学版基础上，掌握下面四条，成品质感会上一个台阶。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 炒香<\/strong><\/p>\n<ol>\n<li>小火加热让芝麻里的油脂和香气物质释放，才有「糊香」。<\/li>\n<li>判断标准是「闻到香 + 能捏碎」，而不是看颜色，颜色到深棕就晚了。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 增稠<\/strong><\/p>\n<ol start=\"3\">\n<li>直接用炒熟的糯米粉最省事、顺滑度稳定。<\/li>\n<li>讲究的做法：糯米加大米提前泡 1~2 小时，和炒好的芝麻一起加水打成浆再熬，口感更细、更顺。<\/li>\n<li>芝麻和糯米的重量比约 2 : 1~3 : 1（芝麻 60g + 糯米粉 30g 就是 2 : 1），糯米越多越稠、越粘。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 去苦<\/strong><\/p>\n<ol start=\"6\">\n<li>芝麻炒到火候刚好、绝不炒糊，是最根本的。<\/li>\n<li>加糖能压住芝麻自带的一点点苦味，糖量别省太多。<\/li>\n<li>熬的时候丢几颗去核红枣一起打浆，红枣的甜香能中和苦涩、颜色也更暖。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 控浓稠度与丝滑<\/strong><\/p>\n<ol start=\"9\">\n<li>煮到「勺子划过留痕、能挂勺」就是标准浓度；凉后会变更稠，热的时候宁稀勿稠。<\/li>\n<li>想要更丝滑，打好的粉再过一遍细筛，或打成浆后用纱布过滤一遍再熬。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://m.douguo.com/recipe/amp/2999322.html\">豆果美食 · 秋冬必喝热饮 生发进补三黑芝麻糊<\/a> —— 三黑配方（黑芝麻 + 黑米 + 糯米），适合对照「进阶版」的增稠搭配<\/li>\n<li><a href=\"https://www.bilibili.com/video/BV1h5C2YwE6E/\">黑芝麻糊，一股浓香，一缕温暖，做法简单，想吃就做（哔哩哔哩）<\/a> —— 含炒香、过滤、熬煮全流程，适合对照「进阶版」<\/li>\n<\/ul>\n<hr>\n<h2>大厨版（专业细节与锅气）<\/h2>\n<p>追求「入口无渣、香气扑鼻、浓稠挂勺、回口微甜」。每一步都是细节。<\/p>\n<p><strong>做法（点对点）<\/strong><\/p>\n<p><strong>第 1 步 · 低温慢磨<\/strong><\/p>\n<ol>\n<li>芝麻炒好后一定要完全放凉再磨，热的磨容易出油结团、香气也散。<\/li>\n<li>破壁机用低速 / 点动打，别高速打太久，避免发热把油脂打「熟」。<\/li>\n<li>想要极细：打 1 分钟歇 10 秒再打，重复 2~3 次，中途刮一刮杯壁。<\/li>\n<\/ol>\n<p><strong>第 2 步 · 泡米打浆滤渣<\/strong><\/p>\n<ol start=\"4\">\n<li>糯米 + 大米按 2 : 1 提前冷水泡 2 小时。<\/li>\n<li>和炒芝麻一起加 2 倍水打成浆，用纱布挤出汁，渣回锅再打一遍挤汁（这样做出的糊口感细滑无颗粒，是「港式芝麻糊」的路子）。<\/li>\n<\/ol>\n<p><strong>第 3 步 · 熬煮火候<\/strong><\/p>\n<ol start=\"6\">\n<li>全程中小火 + 木勺贴底画圈搅拌，煮到冒「鱼眼泡」（小气泡缓慢上升），不能大火煮沸（否则香气跑掉、也容易糊底）。<\/li>\n<li>提起勺，糊在勺背能挂住、缓缓滴落 → 浓稠刚好。<\/li>\n<\/ol>\n<p><strong>第 4 步 · 增香与回甜<\/strong><\/p>\n<ol start=\"8\">\n<li>起锅前加 1 小勺猪油，或和 20g 核桃仁一起打浆，香度完全不同。<\/li>\n<li>冰糖用黄冰糖，甜得更圆润、有回甘；糖量控制在「微微甜」，突出芝麻本味，上桌前可另配一小碟糖让客人自己加。<\/li>\n<\/ol>\n<p><strong>参考链接（图文 / 视频，点开前请核对内容）<\/strong><\/p>\n<ul>\n<li><a href=\"https://m.meishichina.com/recipe/136233/\">美食天下 · 自制香浓黑芝麻糊<\/a> —— 强调炒
